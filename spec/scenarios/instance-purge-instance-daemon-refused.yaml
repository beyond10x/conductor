# docs/design/architecture-next.md § 3 (Actors): a command that needs a grant refuses every actor
# whose kind is not human. The daemon purging a stopped instance is refused by kind, so a guard
# narrowed to `actor.kind == Agent` fails here.
type: ess-scenario/1
domain: conductor.instance
scenario: instance-purge-instance-daemon-refused
summary: The daemon asking to purge a stopped instance is refused as no person, and the instance stays Stopped.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.instance.StartInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      placement: local
      roles: [Director]
      sources: [{kind: GitHub, value: {owner: example-org}}]
      box_id: 6f1c1d2e-0000-4000-8000-000000000001
      at: 2026-11-08T09:00:00Z
    outcome: created

  - at: 2026-11-08T10:00:00Z
    command: conductor.instance.StopInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      at: 2026-11-08T10:00:00Z
    outcome: stopped

  - at: 2026-11-08T10:05:00Z
    command: conductor.instance.PurgeInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Daemon}
      name: example-org
      at: 2026-11-08T10:05:00Z
    outcome: actor-not-human

assert:
  - view: conductor.instance.Instances
    contains:
      name: example-org
      state: Stopped
