# design § 5: the KPI targets are the operator's alone; docs/design/architecture-next.md § 3
# (Actors): the daemon holds no grant and is refused by kind, so a guard narrowed to
# `actor.kind == Agent` fails here.
type: ess-scenario/1
domain: conductor.improvement
scenario: improvement-set-metric-target-daemon-refused
summary: The daemon setting a KPI target is refused as ActorNotHuman, and the metric keeps no target.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.improvement.DefineMetric
    actor: conductor.improvement.ConductorDev
    input:
      actor: {kind: Agent, agent: {instance: example-org, role: maintainer, name: example-org-conductor-dev, kind: claude-code}}
      metric_id: K1
      name: operator touches per merged PR
      unit: ratio
      instrument: decision store + forge PRs
      definition: operator-decided decisions divided by PRs merged
    outcome: defined

  - at: 2026-11-08T09:05:00Z
    command: conductor.improvement.SetMetricTarget
    actor: conductor.improvement.Operator
    input:
      actor: {kind: Daemon}
      metric_id: K1
      target: 0.1
      direction: AtMost
      target_owner: operator
      target_set_at: 2026-11-08T09:05:00Z
    outcome: actor-not-human
    error:
      name: conductor.operator.ActorNotHuman

assert:
  - view: conductor.improvement.Metrics
    contains:
      metric_id: K1
      state: Untargeted
