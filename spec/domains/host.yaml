domain: conductor.host

summary: >
  The machine several conductor instances share (story:multi-instance-host), and the protocol its
  disk runs under (epic:disk-protocol, story:disk-protocol-spec). Each instance keeps its own
  records, state, cache and sessions; what they share is one disk, one CPU and memory budget, and
  one machine-wide namespace of harness session names. The host ledger holds every grant an
  instance's conductor or a `conductor build run` takes: a controller slot, a build slot, or a
  disk reservation for a run's expected peak, so two instances or two runs cannot each grant the
  same free space. A reclaim run frees what needs no decision (`conductor host reclaim`) and records
  each step with the bytes it freed, or what is left when it cannot reach the floor.

  The host directory (story:instance-isolation) is `host/` beside the config file, one for every
  instance the file names (`~/.b10x/conductor/host/` beside the default file), never under an
  instance's `state`. It holds the host ledger's store, its lock `host.lock`, the run locks
  `host-runs/<grant>.lock`, the reclaim lock `host.reclaim.lock` and record `host.reclaim`, and the
  open falls of free disk, one file per instance, `falls/<prefix>.json` (the instance's session
  prefix, its name without one), which names the item and its instance: only that instance reads,
  withdraws or removes its file, and the dashboard lists every instance's. A `host.fall` of 0.16.x
  is read once as the fall of the instance it names and moved to that instance's file
  (story:host-fall-per-instance). A `--state-dir` does not move it. The ledger an instance kept in
  its `state` before is moved there once, at its first host command: every grant of its store, its
  run locks, the reclaim record and the fall's marker; `host.migrated` in the state then records that
  it was moved, and nothing is moved again.

  The host registry (story:instance-names-unique) is one per host, whatever config file a command
  reads: `instances.json` in the host's own directory, `~/.b10x/conductor/host/`, beside the host
  file `host.yaml` that holds the per-host roles. It lists every config file that has run on the
  host (`InstanceRegistry`): `conductor config validate` writes the file's entry when the file is
  valid, and `conductor session start` writes it whenever a config file starts a session, each
  under the lock `instances.lock` beside it. No two instances on the host share a session prefix,
  a dashboard port, a state directory or a records directory, whether they are in one config file
  or in several: `config validate` refuses an instance that holds one another registered file's
  instance holds (`InstanceCollision`), naming both instances and both files, and writes nothing
  then. A registered file that is no longer there is dropped from the registry when it is next
  written, so a removed config file holds nothing.

naming:
  wire: host
  display: Host

types:
  # A session's name and its instance's prefix are `conductor.config.SessionName` and
  # `conductor.config.SessionPrefix` (story:instance-session-names).

  - name: conductor.host.GrantId
    kind: newtype
    of: String

  - name: conductor.host.ReclaimRunId
    kind: newtype
    of: String

  # A controller slot counts against the host's most working controllers across all instances; a
  # build slot and a disk reservation each hold bytes of the host's disk. A disk reservation is
  # what `conductor build run --reserve <size>` takes for one command's expected peak.
  - name: conductor.host.GrantKind
    kind: enum
    variants: [ControllerSlot, BuildSlot, Disk]

  # Why a grant was released: the command exited, it was killed, or the next command that read
  # the ledger found its process group gone. A slot handed back by conductor carries no reason.
  # `SessionStopped` is why a waiting request was withdrawn when the session that made it was no
  # longer running (story:build-run-session-bound); a request withdrawn on a signal carries none.
  - name: conductor.host.ReleaseReason
    kind: enum
    variants: [Exited, Killed, ProcessGroupGone, SessionStopped]

  # What one reclaim step freed, from the reclaimable rows of `conductor gc` that need no
  # decision: the build output of an idle managed tree (no live session, no running gate), build
  # output stripped from a worktree archive, a cache past its age, a snapshot past retention.
  - name: conductor.host.ReclaimKind
    kind: enum
    variants: [IdleTreeBuildOutput, ArchiveBuildOutput, Cache, Snapshot]

  # How a reclaim run ended: free disk back over the floor, or every reclaimable row applied and
  # the floor still not reached.
  - name: conductor.host.ReclaimResult
    kind: enum
    variants: [Reclaimed, FloorNotReached]

  # One step of a reclaim run: the path it removed (`what`), which kind of reclaimable row it
  # was, and the bytes it freed.
  - name: conductor.host.ReclaimStep
    kind: struct
    fields:
      - {name: what, type: String}
      - {name: kind, type: conductor.host.ReclaimKind}
      - {name: bytes, type: Integer}

  # One row of `conductor host slices` (story:slice-remove): a systemd user slice of the
  # `conductor` family (`conductor.slice`, `conductor_<prefix>.slice`) the user manager has
  # loaded, read when asked for and never stored. `units` counts the units loaded in it, running
  # or not. `instance` names the config file's instance whose `session_prefix` makes that slice's
  # name, and is absent for a slice no instance of the file names: the leftover of an instance
  # that is gone or renamed. `stopped` is true when `--gc` stopped the slice in this call.
  - name: conductor.host.SliceRow
    kind: struct
    fields:
      - {name: slice, type: String}
      - {name: instance, type: Optional<String>}
      - {name: units, type: Integer}
      - {name: stopped, type: Boolean}

  # The input of `conductor host slices`: it lists each slice of the `conductor` family with its
  # unit count and the instance it belongs to. With `gc` it stops, with `systemctl --user stop`,
  # each slice that holds no unit and that no instance of the config file names, and never one
  # that still holds a unit or belongs to an instance. `format` is text or json (a list of
  # `SliceRow`), read by the handler, which refuses another value. It reads the user manager
  # only, opens no store and writes no record.
  - name: conductor.host.ListSlices
    kind: struct
    fields:
      - {name: format, type: Optional<String>}
      - {name: gc, type: Optional<Boolean>}

  # What a reclaim run left on the disk that only a person may remove: its path and its size.
  - name: conductor.host.LeftOver
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: bytes, type: Integer}

  # The input of `conductor build run [--reserve <size>|auto] [--repository <repo>] [--measure
  # <dir>]… -- <command> [args…]` (story:build-run). The size is written in GiB with `G`, as the
  # config file writes one. `auto`, or no `--reserve`, reserves the largest peak recorded in the
  # ledger for the same repository and command (its first two words and its package flags) in the
  # last 14 days plus 50 %, at least 1G; with none recorded, the built-in default of 4G. A size
  # over twice that peak is run as written, with a warning naming the peak
  # (story:reserve-from-peak). Each `--measure` directory is measured with the run's own (`target/` or the working
  # directory, and `CARGO_TARGET_DIR` when the command's environment sets it), for a run that
  # writes elsewhere (story:reserve-from-peak).
  - name: conductor.host.BuildRun
    kind: struct
    fields:
      - {name: reserve, type: Optional<String>}
      - {name: repository, type: Optional<conductor.observation.RepositoryName>}
      - {name: measure, type: List<String>}
      - {name: command, type: List<String>}

  # `conductor build run` refused: the bytes asked for and the bytes the disk still lacks after
  # reclaim, with what reclaim left by path and size. The command never ran; the exit is 2.
  - name: conductor.host.BuildRunRefused
    kind: struct
    fields:
      - {name: bytes, type: Integer}
      - {name: shortfall_bytes, type: Integer}
      - {name: left, type: List<conductor.host.LeftOver>}

  # `conductor build run` withdrawn while its request waited, because the session that made it is
  # no longer running (story:build-run-session-bound): standard error says
  # `withdrawn: session <id> stopped`; the command never ran; the exit is 2.
  - name: conductor.host.BuildRunWithdrawn
    kind: struct
    fields:
      - {name: grant_id, type: conductor.host.GrantId}
      - {name: session_id, type: conductor.session.SessionId}

  # One instance of a registered config file (story:instance-names-unique): what no other
  # instance on the host may hold, its session prefix (absent for an instance that writes none,
  # which `config validate` refuses), its dashboard port, and its state and records directories,
  # each absolute; and its checkouts root and managed trees, which say whose a session working
  # there is.
  - name: conductor.host.RegisteredInstance
    kind: struct
    fields:
      - {name: name, type: conductor.config.InstanceName}
      - {name: session_prefix, type: Optional<conductor.config.SessionPrefix>}
      - {name: dashboard_port, type: Integer}
      - {name: state, type: String}
      - {name: records, type: String}
      - {name: checkouts, type: conductor.config.Checkouts}

  # One config file of the host registry: its absolute path, when an entry was last written for
  # it, and its instances as it wrote them then.
  - name: conductor.host.RegisteredFile
    kind: struct
    fields:
      - {name: config, type: String}
      - {name: registered_at, type: Timestamp}
      - {name: instances, type: List<conductor.host.RegisteredInstance>}
    invariants:
      - distinct: {in: instances, as: instance, by: instance.name}

  # The host registry, `<host>/instances.json` (story:instance-names-unique): every config file
  # that has run on the host, each once.
  - name: conductor.host.InstanceRegistry
    kind: struct
    fields:
      - {name: version, type: String}
      - {name: files, type: List<conductor.host.RegisteredFile>}
    invariants:
      - version == "conductor.host.instances/1"
      - distinct: {in: files, as: file, by: file.config}

  # What two instances on the host would share (story:instance-names-unique): the session prefix
  # (equal, or one followed by `-` begins the other, so one session name would carry both), the
  # dashboard port, the state directory or the records directory.
  - name: conductor.host.CollisionKey
    kind: enum
    variants: [SessionPrefix, DashboardPort, State, Records]

  # `config validate` refused an instance of the file because another registered file's instance
  # holds the same `key` (story:instance-names-unique): the value, both instances and both files.
  # It is reported as a problem of the instance's YAML path, `instances[<i>].<key>`, on one line.
  - name: conductor.host.InstanceCollision
    kind: struct
    fields:
      - {name: key, type: conductor.host.CollisionKey}
      - {name: value, type: String}
      - {name: instance, type: conductor.config.InstanceName}
      - {name: config, type: String}
      - {name: other_instance, type: conductor.config.InstanceName}
      - {name: other_config, type: String}

  # The input of `conductor host grants`.
  - name: conductor.host.ShowGrants
    kind: struct
    fields:
      - {name: format, type: Optional<String>}

  # The input of `conductor host reclaim` (story:disk-reclaim).
  - name: conductor.host.ReclaimDisk
    kind: struct
    fields:
      - {name: format, type: Optional<String>}

  # `conductor host reclaim` could not bring free disk back over the floor: the bytes still lacking
  # and what is left by path and size. The exit is 1.
  - name: conductor.host.ReclaimFellShort
    kind: struct
    fields:
      - {name: reclaimed_bytes, type: Integer}
      - {name: shortfall_bytes, type: Integer}
      - {name: left, type: List<conductor.host.LeftOver>}

entities:
  # One grant on the host ledger. A disk reservation is asked for with the bytes of its expected
  # peak and the command it covers, and is answered in arrival order (story:build-run-queue):
  # granted (after a reclaim run when it did not fit) or refused with the shortfall. A granted
  # reservation runs its command in its own process group, records the peak the run measured, and is
  # released when the command exits or is killed. Nothing expires by time: a live grant whose
  # process group is gone is released, with `ProcessGroupGone`, by the next command that reads the
  # ledger, before that command answers. A request whose `build run` is stopped by a signal while
  # it still waits in the queue is withdrawn (story:build-run-cancel-group). The ledger's state
  # names map onto the lifecycle as written (`Requested`, `Granted`, `Running`, `Released`,
  # `Refused`, `Withdrawn`).
  - name: conductor.host.HostGrant
    identity:
      name: grant_id
      type: conductor.host.GrantId
    fields:
      # The config file's instance the grant was taken for. It is not that instance's conductor
      # lease (`conductor.session.Lease`, keyed by the same type): a controller's
      # `conductor build run` reserves disk whether or not a conductor holds the lease, so no
      # relation is declared and `validate` warns `implied_relation` (ESS-ENTITY-019) here.
      - name: instance
        type: conductor.config.InstanceName
      # A controller slot names its repository; `conductor build run` names one only when
      # `--repository` is given.
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
      - name: kind
        type: conductor.host.GrantKind
      # Requested: the expected peak a disk reservation or a build slot holds.
      - name: bytes
        type: Optional<Integer>
      # Measured: the growth of the directories the run writes (the tree's `target/` or the working
      # directory, each `--measure` directory, `CARGO_TARGET_DIR`), as recorded while it ran.
      # Absent while a run has recorded none, and absent on a released grant whose size could not
      # be measured: the peak is unknown, never 0 (story:reserve-from-peak). A run whose size
      # was not measured records no peak.
      - name: peak_bytes
        type: Optional<Integer>
      # How often the disk watchdog paused the run, as recorded with its peak
      # (story:build-run-pause-visible).
      - name: pauses
        type: Optional<Integer>
      # The command a disk reservation covers: its argv joined into one string.
      - name: command
        type: Optional<String>
      # The process group the covered command runs in, once it started.
      - name: process_group
        type: Optional<Integer>
      - name: session_name
        type: Optional<conductor.config.SessionName>
      # The harness's id of the session whose `build run` made the request, from the environment
      # the harness sets for its commands (Claude Code's `CLAUDE_CODE_SESSION_ID`)
      # (story:build-run-session-bound). A request in `Requested` whose session the harness's
      # session list no longer shows running is withdrawn at the next ledger pass, with
      # `SessionStopped`. Absent when the caller is no harness session; such a request is bound
      # to its process only.
      - name: session_id
        type: Optional<conductor.session.SessionId>
      # What a reclaim run freed before the reservation was granted, or before it was refused.
      - name: reclaimed_bytes
        type: Optional<Integer>
      # What the disk still lacked when the reservation was refused.
      - name: shortfall_bytes
        type: Optional<Integer>
      - name: requested_at
        type: Timestamp
      - name: started_at
        type: Optional<Timestamp>
      - name: released_at
        type: Optional<Timestamp>
      - name: release_reason
        type: Optional<conductor.host.ReleaseReason>
    lifecycle:
      initial: Requested
      states: [Requested, Granted, Running, Released, Refused, Withdrawn]
      terminal: [Released, Refused, Withdrawn]
      transitions:
        - name: grant
          from: [Requested]
          to: Granted
        - name: refuse
          from: [Requested]
          to: Refused
        - name: withdraw
          from: [Requested]
          to: Withdrawn
        - name: start
          from: [Granted]
          to: Running
        - name: release
          from: [Granted, Running]
          to: Released

  # One run of `conductor host reclaim`, by the watch under `disk_admit`, by conductor's cycle, by
  # a reservation that did not fit, or by a paused run under `gate_stop`. It applies its steps in
  # order until free disk is back over the floor, and never touches a tree a live session works
  # in or a running gate's target.
  - name: conductor.host.ReclaimRun
    identity:
      name: reclaim_run_id
      type: conductor.host.ReclaimRunId
    fields:
      # The config file's instance whose reclaim this was; not its lease, as on HostGrant
      # (ESS-ENTITY-019 warns `implied_relation` here for the same reason).
      - name: instance
        type: conductor.config.InstanceName
      - name: result
        type: conductor.host.ReclaimResult
      - name: steps
        type: List<conductor.host.ReclaimStep>
      - name: reclaimed_bytes
        type: Integer
      - name: shortfall_bytes
        type: Optional<Integer>
      - name: left
        type: List<conductor.host.LeftOver>
      - name: ran_at
        type: Timestamp
    invariants:
      - reclaimed_bytes >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

errors:
  - name: conductor.host.HostGrantNotFound
    summary: No host grant has that id.
    fields:
      - name: grant_id
        type: conductor.host.GrantId

  - name: conductor.host.HostGrantStateConflict
    summary: The host grant is not in a state the command moves it from.
    fields:
      - name: grant_id
        type: conductor.host.GrantId

  - name: conductor.host.NotADiskGrant
    summary: The host grant is a slot, not a disk reservation; it runs no command.
    fields:
      - name: grant_id
        type: conductor.host.GrantId

  - name: conductor.host.DiskThroughReservation
    summary: Disk is taken through a disk reservation, not as a slot.
    fields:
      - name: kind
        type: conductor.host.GrantKind

  - name: conductor.host.InvalidSize
    summary: A size is negative, or a reservation asks for nothing.
    fields:
      - name: bytes
        type: Integer

events:
  - name: conductor.host.HostGrantTaken
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: instance
        type: conductor.config.InstanceName
      - name: kind
        type: conductor.host.GrantKind

  - name: conductor.host.DiskRequested
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: instance
        type: conductor.config.InstanceName
      - name: bytes
        type: Integer

  - name: conductor.host.DiskReserved
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: bytes
        type: Optional<Integer>
      - name: reclaimed_bytes
        type: Integer

  - name: conductor.host.DiskReservationRefused
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: bytes
        type: Optional<Integer>
      - name: shortfall_bytes
        type: Integer

  - name: conductor.host.RunStarted
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: process_group
        type: Integer

  - name: conductor.host.PeakRecorded
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: peak_bytes
        type: Integer

  - name: conductor.host.HostGrantReleased
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: reason
        type: Optional<conductor.host.ReleaseReason>

  - name: conductor.host.DiskRequestWithdrawn
    fields:
      - name: grant_id
        type: conductor.host.GrantId

  - name: conductor.host.DiskReclaimed
    fields:
      - name: reclaim_run_id
        type: conductor.host.ReclaimRunId
      - name: reclaimed_bytes
        type: Integer

  - name: conductor.host.ReclaimFloorNotReached
    fields:
      - name: reclaim_run_id
        type: conductor.host.ReclaimRunId
      - name: reclaimed_bytes
        type: Integer
      - name: shortfall_bytes
        type: Integer

commands:
  # Taken by an instance's conductor before it starts a controller. Disk is not taken here: it is
  # reserved through RequestDisk and ReserveDisk. The refusal at the host's most working
  # controllers across instances is story:multi-instance-host's rule, outside the disk protocol;
  # this command records the slot and refuses nothing else.
  - name: conductor.host.TakeHostGrant
    naming:
      wire: take-host-grant
      display: Take a host grant
    input:
      - name: instance
        type: conductor.config.InstanceName
      - name: repository
        type: conductor.observation.RepositoryName
      - name: kind
        type: conductor.host.GrantKind
      - name: bytes
        type: Optional<Integer>
      - name: session_name
        type: conductor.config.SessionName
      - name: requested_at
        type: Timestamp
    outcomes:
      - name: disk-through-reservation
        when: kind == Disk
        error: conductor.host.DiskThroughReservation
        payload:
          conductor.host.DiskThroughReservation:
            kind: input.kind
        summary: A disk grant is a reservation for a command; nothing was taken.
      - name: granted
        creates: conductor.host.HostGrant
        into: Granted
        instance: grant_id
        sets:
          instance: input.instance
          repository: input.repository
          kind: input.kind
          bytes: input.bytes
          session_name: input.session_name
          requested_at: input.requested_at
        emits:
          - conductor.host.HostGrantTaken
        payload:
          conductor.host.HostGrantTaken:
            grant_id: {generated: true}
            instance: input.instance
            kind: input.kind
        summary: The slot counts against the host until it is released.

  # `conductor build run --reserve <size>`, first step: the request is written to the ledger under
  # its lock, so a second run reserving at the same time counts it. The ledger answers it with
  # ReserveDisk; nobody is asked.
  #
  # The requests in `Requested` whose run still waits form the host's queue, in arrival order
  # (`requested_at`, then `grant_id`) (story:build-run-queue). The head is answered once it fits,
  # once what it lacks exceeds what the live reservations hold (refused: their release cannot
  # cover it), or once it has waited the run's bound for them (refused). A later request waits
  # behind it, even when it alone would fit, while any request ahead of it lacks no more than the
  # live reservations hold: that one waits for them, and since nothing behind it is granted
  # meanwhile, they only shrink while it waits. When every request ahead lacks more than the live
  # reservations hold together, so each can only be refused, a later request that fits beside the
  # floor and the live reservations is granted at once (story:build-run-backfill). A request that
  # has waited longer than `thresholds.watchdog_every` names its position in the queue on standard
  # error.
  - name: conductor.host.RequestDisk
    naming:
      wire: request-disk
      display: Request disk for a command
    input:
      - name: instance
        type: conductor.config.InstanceName
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
      - name: session_name
        type: Optional<conductor.config.SessionName>
      - name: session_id
        type: Optional<conductor.session.SessionId>
      - name: bytes
        type: Integer
        example: 8589934592
      - name: command
        type: String
      - name: requested_at
        type: Timestamp
    outcomes:
      - name: invalid-size
        when: bytes <= 0
        error: conductor.host.InvalidSize
        payload:
          conductor.host.InvalidSize:
            bytes: input.bytes
        summary: A reservation asks for a positive size; nothing was requested.
      - name: requested
        creates: conductor.host.HostGrant
        instance: grant_id
        sets:
          instance: input.instance
          repository: input.repository
          session_name: input.session_name
          session_id: input.session_id
          kind: Disk
          bytes: input.bytes
          command: input.command
          requested_at: input.requested_at
        emits:
          - conductor.host.DiskRequested
        payload:
          conductor.host.DiskRequested:
            grant_id: {generated: true}
            instance: input.instance
            bytes: input.bytes
        summary: The request counts against the host while the ledger answers it.

  # The ledger's answer to the head of the queue (RequestDisk). The binary computes, under the
  # ledger's lock, what the disk lacks for the requested bytes once free disk, the live reservations
  # of every instance and the floor are counted (`shortfall_bytes`, 0 when it fits). When it does
  # not fit it runs a reclaim run first (`Reclaim`), counts again, and passes what that run freed as
  # `reclaimed_bytes`. When a reclaim run that finished within the last five minutes freed nothing,
  # it runs none and answers at once with `reclaimed_bytes` 0, naming that run
  # (story:build-run-backfill).
  - name: conductor.host.ReserveDisk
    naming:
      wire: reserve-disk
      display: Answer a disk request
    input:
      - name: grant_id
        type: conductor.host.GrantId
      - name: shortfall_bytes
        type: Integer
        example: 0
      - name: reclaimed_bytes
        type: Integer
        example: 0
    outcomes:
      - name: invalid-size
        when:
          any:
            - shortfall_bytes < 0
            - reclaimed_bytes < 0
        error: conductor.host.InvalidSize
        payload:
          conductor.host.InvalidSize:
            bytes: input.shortfall_bytes
        summary: No count is negative; the request stays open.
      - name: refused
        when: shortfall_bytes > 0
        moves: conductor.host.HostGrant.refuse
        instance: grant_id
        sets:
          reclaimed_bytes: input.reclaimed_bytes
          shortfall_bytes: input.shortfall_bytes
        emits:
          - conductor.host.DiskReservationRefused
        payload:
          conductor.host.DiskReservationRefused:
            grant_id: input.grant_id
            bytes: {subject: bytes}
            shortfall_bytes: input.shortfall_bytes
        summary: >
          Reclaim could not reach the size; the refusal names the shortfall, the command never
          runs, and `conductor build run` exits 2.
      - name: granted-after-reclaim
        when: reclaimed_bytes > 0
        moves: conductor.host.HostGrant.grant
        instance: grant_id
        sets:
          reclaimed_bytes: input.reclaimed_bytes
        emits:
          - conductor.host.DiskReserved
        payload:
          conductor.host.DiskReserved:
            grant_id: input.grant_id
            bytes: {subject: bytes}
            reclaimed_bytes: input.reclaimed_bytes
        summary: It did not fit; a reclaim run freed the reclaimed bytes, and then it did.
      - name: granted
        moves: conductor.host.HostGrant.grant
        instance: grant_id
        sets:
          reclaimed_bytes: 0
        emits:
          - conductor.host.DiskReserved
        payload:
          conductor.host.DiskReserved:
            grant_id: input.grant_id
            bytes: {subject: bytes}
            reclaimed_bytes: 0
        summary: It fits; the bytes count against the host until the grant is released.
      - name: no-such-grant
        unknown_instance: true
        error: conductor.host.HostGrantNotFound
        payload:
          conductor.host.HostGrantNotFound:
            grant_id: input.grant_id
      - name: wrong-state
        wrong_state: true
        error: conductor.host.HostGrantStateConflict
        payload:
          conductor.host.HostGrantStateConflict:
            grant_id: input.grant_id
        summary: >
          The request was answered already. Only RequestDisk creates a grant in Requested, so a
          slot, created granted, is answered here too.

  # The covered command started in its own process group.
  - name: conductor.host.StartRun
    naming:
      wire: start-run
      display: Start the reserved run
    input:
      - name: grant_id
        type: conductor.host.GrantId
      - name: process_group
        type: Integer
        example: 4242
      - name: started_at
        type: Timestamp
    outcomes:
      - name: not-a-disk-grant
        when_subject:
          predicate: kind != Disk
        error: conductor.host.NotADiskGrant
        payload:
          conductor.host.NotADiskGrant:
            grant_id: input.grant_id
        summary: A slot runs no command; nothing changes.
      - name: started
        moves: conductor.host.HostGrant.start
        instance: grant_id
        sets:
          process_group: input.process_group
          started_at: input.started_at
        emits:
          - conductor.host.RunStarted
        payload:
          conductor.host.RunStarted:
            grant_id: input.grant_id
            process_group: input.process_group
        summary: The reservation holds while the process group lives.
      - name: no-such-grant
        unknown_instance: true
        error: conductor.host.HostGrantNotFound
        payload:
          conductor.host.HostGrantNotFound:
            grant_id: input.grant_id
      - name: wrong-state
        wrong_state: true
        error: conductor.host.HostGrantStateConflict
        payload:
          conductor.host.HostGrantStateConflict:
            grant_id: input.grant_id
        summary: Only a granted reservation starts its run, once.

  # The run's measured peak: the growth so far of the directories it writes, by the last complete
  # reading. Recorded while it runs, and once more as it exits, before the grant is released; a
  # run none of whose readings completed records none, and its peak stays absent: unknown.
  - name: conductor.host.RecordPeak
    naming:
      wire: record-peak
      display: Record a run's peak
    input:
      - name: grant_id
        type: conductor.host.GrantId
      - name: peak_bytes
        type: Integer
        example: 6442450944
      # How often the watchdog paused the run so far; absent, none is recorded.
      - name: pauses
        type: Optional<Integer>
    outcomes:
      - name: invalid-size
        when: peak_bytes < 0
        error: conductor.host.InvalidSize
        payload:
          conductor.host.InvalidSize:
            bytes: input.peak_bytes
        summary: A measured size is not negative; nothing was recorded.
      - name: recorded
        when_subject_state: Running
        updates: conductor.host.HostGrant
        instance: grant_id
        sets:
          peak_bytes: input.peak_bytes
          pauses: input.pauses
        emits:
          - conductor.host.PeakRecorded
        payload:
          conductor.host.PeakRecorded:
            grant_id: input.grant_id
            peak_bytes: input.peak_bytes
        summary: The grant carries the peak; the Grants view shows it beside the bytes reserved.
      - name: no-such-grant
        unknown_instance: true
        error: conductor.host.HostGrantNotFound
        payload:
          conductor.host.HostGrantNotFound:
            grant_id: input.grant_id
      - name: not-running
        error: conductor.host.HostGrantStateConflict
        payload:
          conductor.host.HostGrantStateConflict:
            grant_id: input.grant_id
        summary: Only a running grant records a peak.

  # Released when the command exits or is killed, or by the next command that reads the ledger
  # and finds the grant's process group gone; a slot is released by conductor with no reason.
  - name: conductor.host.ReleaseGrant
    naming:
      wire: release-grant
      display: Release a host grant
    input:
      - name: grant_id
        type: conductor.host.GrantId
      - name: reason
        type: Optional<conductor.host.ReleaseReason>
      - name: released_at
        type: Timestamp
    outcomes:
      - name: released
        moves: conductor.host.HostGrant.release
        instance: grant_id
        sets:
          release_reason: input.reason
          released_at: input.released_at
        emits:
          - conductor.host.HostGrantReleased
        payload:
          conductor.host.HostGrantReleased:
            grant_id: input.grant_id
            reason: input.reason
        summary: The slot or the space is free for any instance and any run again.
      - name: no-such-grant
        unknown_instance: true
        error: conductor.host.HostGrantNotFound
        payload:
          conductor.host.HostGrantNotFound:
            grant_id: input.grant_id
        summary: No grant with that id.
      - name: wrong-state
        wrong_state: true
        error: conductor.host.HostGrantStateConflict
        payload:
          conductor.host.HostGrantStateConflict:
            grant_id: input.grant_id
        summary: The grant was released before, or refused; nothing changes.

  # A request still waiting in the queue whose `build run` received SIGTERM, SIGINT or SIGHUP
  # (story:build-run-cancel-group): it leaves the queue, its command never runs, and `build run`
  # exits with 128 + the signal. `released_at` is when it was withdrawn. A request whose session
  # stopped (story:build-run-session-bound) is withdrawn by the next ledger pass with `reason`
  # `SessionStopped`, and its `build run` exits 2 (`BuildRunWithdrawn`).
  - name: conductor.host.WithdrawDiskRequest
    naming:
      wire: withdraw-disk-request
      display: Withdraw a waiting disk request
    input:
      - name: grant_id
        type: conductor.host.GrantId
      - name: withdrawn_at
        type: Timestamp
      - name: reason
        type: Optional<conductor.host.ReleaseReason>
    outcomes:
      - name: withdrawn
        moves: conductor.host.HostGrant.withdraw
        instance: grant_id
        sets:
          released_at: input.withdrawn_at
          release_reason: input.reason
        emits:
          - conductor.host.DiskRequestWithdrawn
        payload:
          conductor.host.DiskRequestWithdrawn:
            grant_id: input.grant_id
        summary: The request leaves the queue; the requests behind it move up.
      - name: no-such-grant
        unknown_instance: true
        error: conductor.host.HostGrantNotFound
        payload:
          conductor.host.HostGrantNotFound:
            grant_id: input.grant_id
        summary: No grant with that id.
      - name: wrong-state
        wrong_state: true
        error: conductor.host.HostGrantStateConflict
        payload:
          conductor.host.HostGrantStateConflict:
            grant_id: input.grant_id
        summary: Only a request still waiting is withdrawn; an answered one is released or was refused.

  # One reclaim run as `conductor host reclaim` records it: the steps it applied in order with the
  # bytes each freed, and, when free disk is still under the floor after the last reclaimable
  # row, the bytes it lacks (`shortfall_bytes`, 0 when it reached the floor) and what is left by
  # path and size. The story names the command `conductor gc reclaim`; `conductor gc` is a command
  # of its own, and `ess-cli/1` refuses a root command that is also a group, so it lives under
  # `host`.
  - name: conductor.host.Reclaim
    naming:
      wire: record-reclaim
      display: Record a reclaim run
    input:
      - name: instance
        type: conductor.config.InstanceName
      - name: steps
        type: List<conductor.host.ReclaimStep>
      - name: reclaimed_bytes
        type: Integer
        example: 21474836480
      - name: shortfall_bytes
        type: Integer
        example: 0
      - name: left
        type: List<conductor.host.LeftOver>
      - name: ran_at
        type: Timestamp
    outcomes:
      - name: invalid-size
        when:
          any:
            - reclaimed_bytes < 0
            - shortfall_bytes < 0
        error: conductor.host.InvalidSize
        payload:
          conductor.host.InvalidSize:
            bytes: input.reclaimed_bytes
        summary: No count is negative; nothing was recorded.
      - name: floor-not-reached
        when: shortfall_bytes > 0
        creates: conductor.host.ReclaimRun
        instance: reclaim_run_id
        sets:
          instance: input.instance
          result: FloorNotReached
          steps: input.steps
          reclaimed_bytes: input.reclaimed_bytes
          shortfall_bytes: input.shortfall_bytes
          left: input.left
          ran_at: input.ran_at
        emits:
          - conductor.host.ReclaimFloorNotReached
        payload:
          conductor.host.ReclaimFloorNotReached:
            reclaim_run_id: {generated: true}
            reclaimed_bytes: input.reclaimed_bytes
            shortfall_bytes: input.shortfall_bytes
        summary: >
          What needs no decision is freed and the floor is still not reached; what is left is
          listed by path and size, `conductor host reclaim` exits 1, and the watch reports
          `disk floor not reached: <n>G short`.
      - name: reclaimed
        creates: conductor.host.ReclaimRun
        instance: reclaim_run_id
        sets:
          instance: input.instance
          result: Reclaimed
          steps: input.steps
          reclaimed_bytes: input.reclaimed_bytes
          left: input.left
          ran_at: input.ran_at
        emits:
          - conductor.host.DiskReclaimed
        payload:
          conductor.host.DiskReclaimed:
            reclaim_run_id: {generated: true}
            reclaimed_bytes: input.reclaimed_bytes
        summary: Free disk is back over the floor; each step is printed with the bytes it freed.

views:
  # Live grants and recent ones, newest first, with each run's measured peak beside its
  # reservation (`conductor host grants`).
  - name: conductor.host.Grants
    source: conductor.host.HostGrant
    consistency: read_your_writes
    fields:
      - name: grant_id
        type: conductor.host.GrantId
      - name: state
        type: conductor.host.HostGrant.State
      - name: instance
        type: conductor.config.InstanceName
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
      - name: kind
        type: conductor.host.GrantKind
      - name: bytes
        type: Optional<Integer>
      - name: peak_bytes
        type: Optional<Integer>
      - name: pauses
        type: Optional<Integer>
      - name: command
        type: Optional<String>
      - name: process_group
        type: Optional<Integer>
      - name: session_name
        type: Optional<conductor.config.SessionName>
      - name: session_id
        type: Optional<conductor.session.SessionId>
      - name: reclaimed_bytes
        type: Optional<Integer>
      - name: shortfall_bytes
        type: Optional<Integer>
      - name: requested_at
        type: Timestamp
      - name: started_at
        type: Optional<Timestamp>
      - name: released_at
        type: Optional<Timestamp>
      - name: release_reason
        type: Optional<conductor.host.ReleaseReason>
    naming:
      wire: grants
      display: Host grants

  - name: conductor.host.ReclaimRuns
    source: conductor.host.ReclaimRun
    consistency: read_your_writes
    fields:
      - name: reclaim_run_id
        type: conductor.host.ReclaimRunId
      - name: state
        type: conductor.host.ReclaimRun.State
      - name: instance
        type: conductor.config.InstanceName
      - name: result
        type: conductor.host.ReclaimResult
      - name: steps
        type: List<conductor.host.ReclaimStep>
      - name: reclaimed_bytes
        type: Integer
      - name: shortfall_bytes
        type: Optional<Integer>
      - name: left
        type: List<conductor.host.LeftOver>
      - name: ran_at
        type: Timestamp
    naming:
      wire: reclaim-runs
      display: Reclaim runs
