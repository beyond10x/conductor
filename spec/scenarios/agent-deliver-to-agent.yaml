# docs/design/architecture-next.md § 5.1 and § 10: the `agents/{name}/deliver` route; a
# controller puts a text in front of a worker of an interactive kind, and the agent is unchanged.
# The runtime's own commands name the operator a single host implies (§ 5.3); the domain's
# UNMAPPED marker on `InstanceRuntime` records that the runtime has no actor of its own.
type: ess-scenario/1
domain: conductor.agent
scenario: agent-deliver-to-agent
summary: A controller delivers a text to a running claude-code agent; the agent stays running as it was.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.agent.DeclareAgentKind
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: claude-code
      capabilities: [Interactive]
      binary: claude
    outcome: declared

  - at: 2026-11-08T09:01:00Z
    command: conductor.agent.StartAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: example-org-planner
      instance: example-org
      role: Director
      kind: claude-code
      capabilities: [Interactive]
      profile: ~/.b10x/conductor/profiles/repo-controller.md
      limits: {tasks_max: 512}
      token_owner: example-operator
      started_at: 2026-11-08T09:01:00Z
    outcome: started

  - at: 2026-11-08T09:05:00Z
    command: conductor.agent.DeliverToAgent
    actor: conductor.agent.Controller
    input:
      actor: {kind: Agent, value: {instance: example-org, role: Lead, name: example-org-controller, kind: claude-code}}
      name: example-org-planner
      first_line: "[DISPATCH example-repo story-1] plan the story"
      body_path: mailbox/example-org-planner/01K7Q0000000000000000000A0.md
    outcome: delivered

assert:
  - view: conductor.agent.Agents
    contains:
      name: example-org-planner
      state: Running
      generation: 1
