      - name: active
        type: Boolean
      - name: health
        type: String
        example: "ready"
      - name: window
        type: String
        example: "seven_day"
      - name: used_percent
        type: Integer
        example: 40
      - name: resets_at
        type: Optional<Timestamp>
        example: "2026-10-16T11:00:00Z"
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: negative-percent
        when: used_percent < 0
        error: conductor.observation.InvalidCount
        payload:
          conductor.observation.InvalidCount:
            count: input.used_percent
        summary: A percent used is never negative; nothing was recorded.
      - name: recorded
        creates: conductor.observation.UsageObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          read_at: input.read_at
          account: input.account
          active: input.active
          health: input.health
          window: input.window
          used_percent: input.used_percent
          resets_at: input.resets_at
        emits:
          - conductor.observation.UsageRecorded
        payload:
          conductor.observation.UsageRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            account: input.account
            window: input.window
            used_percent: input.used_percent
        summary: The window of the account's usage, as the probe read it, is recorded.

  - name: conductor.observation.RecordMemberFailure
    naming:
      wire: record-member-failure
      display: Record a member a collector could not read
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: member
        type: conductor.observation.RepositoryName
      - name: collector
        type: String
        example: "blockers"
      - name: error_line
        type: String
        example: "`git fetch --quiet origin` exited 128: fatal: could not read from remote repository"
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.MemberFailureObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          member: input.member
          collector: input.collector
          error_line: input.error_line
        emits:
          - conductor.observation.MemberFailureRecorded
        payload:
          conductor.observation.MemberFailureRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            member: input.member
            collector: input.collector
        summary: The member the collector could not read, and why, is recorded; the snapshot goes on.

  - name: conductor.observation.RecordCollectorRun
    naming:
      wire: record-collector-run
      display: Record a collector's run
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: collector
        type: String
        example: "blockers"
      - name: started_at
        type: Timestamp
        example: "2026-10-13T10:03:00Z"
      - name: duration_ms
        type: Integer
        example: 41250
      - name: outcome
        type: conductor.observation.CollectorRunOutcome
      - name: read_bytes
        type: Optional<Integer>
        example: 52428800
      - name: written_bytes
        type: Optional<Integer>
        example: 1048576
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: negative-duration
        when: duration_ms < 0
        error: conductor.observation.InvalidCount
        payload:
          conductor.observation.InvalidCount:
            count: input.duration_ms
        summary: A duration is never negative; nothing was recorded.
      - name: recorded
        creates: conductor.observation.CollectorRunObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          collector: input.collector
          started_at: input.started_at
          duration_ms: input.duration_ms
          outcome: input.outcome
          read_bytes: input.read_bytes
          written_bytes: input.written_bytes
        emits:
          - conductor.observation.CollectorRunRecorded
        payload:
          conductor.observation.CollectorRunRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            collector: input.collector
            duration_ms: input.duration_ms
            outcome: input.outcome
        summary: The collector's run, its start, duration and outcome, is recorded.

  - name: conductor.observation.RecordSecretSync
    naming:
      wire: record-secret-sync
      display: Record a secret sync
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: sync
        type: String
        example: "ci-policy"
      - name: repository
        type: conductor.observation.RepositoryName
      - name: branch
        type: String
        example: "main"
      - name: path
        type: String
        example: "policy/ci.json"
      - name: source_committed_at
        type: Optional<Timestamp>
        example: "2026-10-13T10:03:00Z"
      - name: secrets_updated_at
        type: Optional<Timestamp>
        example: "2026-10-12T08:00:00Z"
      - name: error_line
        type: Optional<String>
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.SecretSyncObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          sync: input.sync
          repository: input.repository
          branch: input.branch
          path: input.path
          source_committed_at: input.source_committed_at
          secrets_updated_at: input.secrets_updated_at
          error_line: input.error_line
        emits:
          - conductor.observation.SecretSyncRecorded
        payload:
          conductor.observation.SecretSyncRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            sync: input.sync
            repository: input.repository
        summary: The sync's source commit and its secrets' oldest write are recorded.

  - name: conductor.observation.PublishBoard
    naming:
      wire: publish-board
      display: Publish the board
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: previous_snapshot_id
        type: Optional<conductor.observation.SnapshotId>
      - name: deviation_rows
        type: Integer
      - name: path
        type: String
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id; nothing was published.
      - name: not-complete
        when_related: {via: input.snapshot_id, predicate: state != Complete}
        error: conductor.observation.SnapshotNotComplete
        payload:
          conductor.observation.SnapshotNotComplete:
            snapshot_id: input.snapshot_id
        summary: Only a complete snapshot is published; a failed or collecting one never is.
      - name: negative-rows
        when: deviation_rows < 0
        error: conductor.observation.InvalidCount
        payload:
          conductor.observation.InvalidCount:
            count: input.deviation_rows
        summary: A row count is never negative; nothing was published.
      - name: published
        creates: conductor.observation.Board
        instance: board_id
        sets:
          snapshot_id: input.snapshot_id
          previous_snapshot_id: input.previous_snapshot_id
          deviation_rows: input.deviation_rows
          path: input.path
        emits:
          - conductor.observation.BoardPublished
        payload:
          conductor.observation.BoardPublished:
            board_id: {generated: true}
            snapshot_id: input.snapshot_id
            deviation_rows: input.deviation_rows
        summary: STATUS.md was written from the snapshot, with its delta against the previous one.

  # The first rollup of one series, day and group (story:dashboard-history), recorded by the rollup
  # a completed snapshot runs; never a command line's.
  - name: conductor.observation.RecordDailySeries
    naming:
      wire: record-daily-series
      display: Record a daily rollup
    input:
      - name: daily_series_id
        type: conductor.observation.DailySeriesId
      - name: series
        type: String
      - name: day
        type: String
      - name: by
        type: String
      - name: key
        type: String
      - name: value
        type: Decimal
      - name: items
        type: List<String>
      - name: snapshot_id
        type: conductor.observation.SnapshotId
    outcomes:
      - name: recorded
        creates: conductor.observation.DailySeries
        instance: daily_series_id
        sets:
          series: input.series
          day: input.day
          by: input.by
          key: input.key
          value: input.value
          items: input.items
          snapshot_id: input.snapshot_id
        emits:
          - conductor.observation.DailySeriesRecorded
        payload:
          conductor.observation.DailySeriesRecorded:
            daily_series_id: input.daily_series_id
            snapshot_id: input.snapshot_id
        summary: The day's rollup of the series for the group is kept.
      - name: already-recorded
        existing_instance: true
        error: conductor.observation.DailySeriesExists
        payload:
          conductor.observation.DailySeriesExists:
            daily_series_id: input.daily_series_id
        summary: The rollup is there already, and is unchanged.

  # A later snapshot's items added to a rollup (story:dashboard-history): its items and value are
  # replaced by the union of the kept items and the new ones, and its snapshot by the one whose
  # completion revised it.
  - name: conductor.observation.ReviseDailySeries
    naming:
      wire: revise-daily-series
      display: Revise a daily rollup
    input:
      - name: daily_series_id
        type: conductor.observation.DailySeriesId
      - name: value
        type: Decimal
      - name: items
        type: List<String>
      - name: snapshot_id
        type: conductor.observation.SnapshotId
    outcomes:
      - name: revised
        when_subject_state: Recorded
        updates: conductor.observation.DailySeries
        instance: daily_series_id
        sets:
          value: input.value
          items: input.items
          snapshot_id: input.snapshot_id
        emits:
          - conductor.observation.DailySeriesRevised
        payload:
          conductor.observation.DailySeriesRevised:
            daily_series_id: input.daily_series_id
            snapshot_id: input.snapshot_id
        summary: The rollup counts the items it kept and the new ones.
      - name: no-such-rollup
        unknown_instance: true
        error: conductor.observation.DailySeriesNotFound
        payload:
          conductor.observation.DailySeriesNotFound:
            daily_series_id: input.daily_series_id

  - name: conductor.observation.CompleteSnapshot
    naming:
      wire: complete-snapshot
      display: Complete a snapshot
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
    outcomes:
      - name: completed
        moves: conductor.observation.Snapshot.complete
        instance: snapshot_id
        emits:
          - conductor.observation.SnapshotCompleted
        payload:
          conductor.observation.SnapshotCompleted:
            snapshot_id: input.snapshot_id
        summary: Every source answered; the snapshot is the newest complete one.
      - name: no-such-snapshot
        unknown_instance: true
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
      - name: wrong-state
        wrong_state: true
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot was already complete or failed.

  - name: conductor.observation.FailSnapshot
    naming:
      wire: fail-snapshot
      display: Fail a snapshot
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: reason
        type: String
    outcomes:
      - name: failed
        moves: conductor.observation.Snapshot.fail
        instance: snapshot_id
        sets:
          failure_reason: input.reason
        emits:
          - conductor.observation.SnapshotFailed
        payload:
          conductor.observation.SnapshotFailed:
            snapshot_id: input.snapshot_id
            reason: input.reason
        summary: A source did not answer; the snapshot is kept but never read as the current state.
      - name: no-such-snapshot
        unknown_instance: true
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
      - name: wrong-state
        wrong_state: true
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot was already complete or failed.

