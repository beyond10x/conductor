type: ess-scenario/1
domain: conductor.direction
scenario: goal-id-bounds
summary: >
  A goal id of 1 to 170 UTF-8 bytes is proposed. An empty id and one of 171 bytes are refused as
  invalid-goal-id, and no goal holds them.

