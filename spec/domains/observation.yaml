        type: Optional<Timestamp>
    naming:
      wire: usage-readings
      display: Usage readings

  # The members a collector could not read, one row per failure recorded, each with its snapshot,
  # member, collector and the error's first line (story:snapshot-member-failures).
  - name: conductor.observation.MemberFailures
    source: conductor.observation.MemberFailureObservation
    consistency: read_your_writes
