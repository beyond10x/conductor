type: ess-scenario/1
domain: conductor.secret
scenario: secret-put-secret-unreachable
summary: A put while the OS keychain does not answer is refused with SourceUnreachable naming the keychain, and no secret is recorded.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-forge
      put_at: 2026-11-08T09:00:00Z
    outcome: unreachable
    error:
      name: conductor.secret.SourceUnreachable

assert:
  - view: conductor.secret.Secrets
    excludes:
      name: example-org-forge
