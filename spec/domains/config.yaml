domain: conductor.config

summary: >
  The one file conductord reconciles from, `conductor.config/2`, read from `--config`, else
  the `conductor-config` setting, else ~/.b10x/conductor/conductor.yaml (story:config-file;
  docs/design/architecture-next.md § 9). It holds the `daemon` section (its port, TLS listener,
  reconcile cadence, the one store URL, the secrets source, the dashboard's served path and its
  operators), `globals` (the defaults every instance starts from) and `instances[]`. An
  instance is one organization conductor runs: its placement, where its repositories come from,
  where their checkouts are, where conductor keeps its records, state and cache, which kind and
  model each role runs on, its cadence, thresholds, reports, and who decides each decision class;
  every key an instance or a role writes overrides the global one. Precedence is role over
  instance over global (`Level`), and `EffectiveSettings` shows every key with its effective value
  and the level it came from. These types hold the effective config, after defaults; the file may
  leave out every key of an instance but its name, its sources and its checkouts. No field takes a
  secret: the file names one as `secret:<name>` (`conductor.secret.SecretName`). The config is
  desired state and is not kept in the store (§ 8); every change through `PutConfig` is validated,
  written, committed with its actor and reason, recorded as `ConfigChanged` and reconciled. A
  `conductor.config/1` file is read once by `conductor config migrate`.

naming:
  wire: config
  display: Config

types:
  - name: conductor.config.InstanceName
    kind: newtype
    of: String

  # The file writes a harness in lower case: `claude` or `codex`.
  - name: conductor.config.Harness
    kind: enum
    variants: [Claude, Codex]

  # A count of tokens. The file writes a whole number, or thousands with `k`: `300k`.
  - name: conductor.config.Tokens
    kind: newtype
    of: Integer

  # A size in GiB (2^30 bytes). The file writes a whole number with `G`: `15G`.
  - name: conductor.config.Gibibytes
    kind: newtype
    of: Integer

  # A time of day, UTC, `HH:MM`.
  - name: conductor.config.TimeOfDay
    kind: newtype
    of: String

  # Where an instance's repositories come from. The file writes `{github: <owner>}`,
  # `{local: <path>}` or `{gitlab: <group or root>}`; a `local` or `gitlab` source may add
  # `exclude: [<path under the root>]` (story:grouped-instance), a `github` or `gitlab` source
  # `include: [<path under the owner or group>]` (story:source-include-list), and a `gitlab`
  # source `host: <host name>` (story:gitlab-source-host).
  #
  # A repository is the directory that holds `.git` at depth 1 or 2 under a root (`<root>/<repo>`
  # or `<root>/<group>/<repo>`), named by its path under the root (`<group>/<repo>`); the root is
  # a `local` source's path, and for the checkouts of the other sources `checkouts.root`. A
  # repository whose name is an `exclude` entry, or lies under one, is not listed and not placed.
  # Absent, `exclude` is empty. A `github` source takes no `exclude`: GitHub lists its owner's
  # repositories, and the collectors that read that list do not filter it.
  #
  # `include` is `exclude` inverted: a repository of the source that no `include` entry names or
  # holds is left out as an excluded one is, from every collected fact, the guard, spawn, the
  # sessions, doctor and the workspace file, and a project the group gains later is left out until
  # an entry covers it. An entry is a path under the owner or group as the forge names it: a GitHub
  # repository's name, one step, or a GitLab project's path with the group taken off (`alpha`,
  # `sub/gamma`), so an entry may name a subgroup; it is matched as an `exclude` entry is, by
  # leading steps, without a wildcard, and written as one is. A GitLab checkout is covered when
  # its project's path or its own path under `checkouts.root` is. Absent, the source stands for
  # every repository of its owner or group, as before. A source does not validate with both
  # `include` and `exclude`, with an empty `include`, or with a `github` entry of more than one
  # step; a `local` source takes none. Where the guard, spawn, the sessions and doctor read a
  # repository by its path under `checkouts.root` alone, `include` leaves it out only when every
  # source on that root names an `include`. An entry no repository of the forge's listing answers
  # to fails nothing: the `repositories` collector records it once a snapshot as a member failure
  # (`conductor.observation.RecordMemberFailure`), the entry as written as its member.
  - name: conductor.config.Source
    kind: union
    tag: kind
    variants:
      GitHub: conductor.config.GitHubSource
      Local: conductor.config.LocalSource
      GitLab: conductor.config.GitLabSource

  # An owner on GitHub, whose repositories are the instance's, or those of them `include` names.
  - name: conductor.config.GitHubSource
    kind: struct
    fields:
      - {name: owner, type: String}
      - {name: include, type: Optional<List<String>>}

  # A directory whose repositories are the instance's.
  - name: conductor.config.LocalSource
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: exclude, type: List<String>}

  # A group (or the root) on a GitLab forge, whose repositories are the instance's. `host` is the
  # forge's host name, without a scheme or a path, such as `gitlab.example.com` for a self-hosted
  # GitLab; absent, it is `gitlab.com` (story:gitlab-source-host). The collectors read that forge
  # with `glab api --hostname <host>` (story:gitlab-repositories): one repository row and one
  # specification row per checkout of a project of the group and its subgroups, and one per
  # project without a checkout, archived ones included. A project's checkout is each git checkout
  # under `checkouts.root` whose `origin` remote is on the host and names the project, read from
  # its git config with no network read. A checkout is the repository, named as every repository
  # is, by its path under `checkouts.root`, whatever its project is called
  # (story:checkout-name-differs-from-project): the workspace file, the snapshots, `repository
  # activity`, the charters and the dispatches name it so, and the project's id and path are used
  # only where the forge is called. Two checkouts of one project are two repositories. A project
  # without a checkout is named by its path under the group, the path its checkout would have
  # under the root; one whose name a checkout of another project holds fails the snapshot, which
  # names both. A project two `gitlab` sources list, as sources whose groups nest do, is one
  # repository, which the source written first records. A checkout under a directory that is no
  # repository name is not recorded and stops no snapshot; the collecting command names it on
  # standard error. An `exclude` entry names a checked-out project in either form: by its
  # checkout's path under the root, which leaves that checkout out, its project then not listed
  # under its own name either; or by the project's path under the group, which leaves the
  # project out with every checkout of it.
  - name: conductor.config.GitLabSource
    kind: struct
    fields:
      - {name: group, type: String}
      - {name: host, type: String}
      - {name: exclude, type: List<String>}
      - {name: include, type: Optional<List<String>>}

  # The directory holding the instance's checkouts, and the one holding their managed worktrees.
  - name: conductor.config.Checkouts
    kind: struct
    fields:
      - {name: root, type: String}
      - {name: trees, type: String}

  # How a catalog entry's file stem spells a repository's name. The file writes it in lower
  # case: `plain`, the name itself, or `hex`, the lower-case hex of the name's UTF-8 bytes.
  - name: conductor.config.CatalogNames
    kind: enum
    variants: [Plain, Hex]

  # The instance's catalog (story:catalog-source): `repository` names a repository whose checkout
  # lies under `checkouts.root`, written as its path under the root; `path` is a directory on
  # that repository's `origin/main`, written relative to its top, whose `.json` files name the
  # cataloged repositories, one file each, the name being the file's stem as `names` spells it.
  # Absent, `names` is `plain`. An instance without a catalog records no catalog membership.
  - name: conductor.config.Catalog
    kind: struct
    fields:
      - {name: repository, type: String}
      - {name: path, type: String}
      - {name: names, type: conductor.config.CatalogNames}

  # A value a start command passes to the harness as one shell word, unquoted: a role's model,
  # agent, settings file or profile file. Letters, digits and `.`, `_`, `:`, `/`, `-` only, so
  # that no shell reads it as more than that word.
  - name: conductor.config.CommandWord
    kind: newtype
    of: String
    alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._:/-"

  # The prefix every session one instance starts carries (story:instance-session-names): letters,
  # digits and `-`, starting and ending with a letter or digit. Session names are one namespace
  # for the whole machine, so no two instances of the file share a prefix, no prefix starts with
  # another followed by `-`, which would let one session name carry both, and no prefix followed
  # by `-` begins a name an instance without a prefix keeps, such as `conductor-dev`.
  - name: conductor.config.SessionPrefix
    kind: newtype
    of: String
    alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-"

  # A harness session name on this machine: `<session_prefix>-<role or repository>`, or without
  # a prefix the role or the repository itself. A repository nested as `<group>/<repo>` is
  # written `<group>-<repo>` in it, as in the workspace, since a session name is one path word
  # (story:nested-repository-session-names).
  - name: conductor.config.SessionName
    kind: newtype
    of: String

  # The name of a role (docs/design/architecture-next.md § 2, § 10): a built-in role or a custom
  # one the config names, so a newtype over text rather than an enum. The built-in roles of v1 are
  # `supervisor` and `teacher` (the host's, one each, started by the daemon from `globals.roles`),
  # `controller` (one per instance) and the workers `planner`, `implementer`, `reviewer` and
  # `releaser`; a custom role is any other name the config writes, run on a schedule. The
  # maintainer is retired. The file writes a role in lower case.
  # UNMAPPED: whether a custom role's name has an alphabet, and whether it may shadow a built-in
  # name, is not settled. Open question.
  #
  # Before v1 this was the enum `Director`, `Maintainer`, `Lead`; those spellings, and the notes
  # below on the old names, describe the shipping line (v0) and still read as role names.
  # (story:role-name-aliases, docs/design/roles-and-surfaces.md § 2):
  # The file writes it in lower case: `director`, the instance's own session, which runs the
  # instance from its records directory; `maintainer`, the session that develops conductor
  # itself; `lead`, a repository's session, one per repository. Each had an old name, which a file
  # may still write for one release and which reads as the new one:
  #
  #   | old name        | role         |
  #   |-----------------|--------------|
  #   | `conductor`     | `director`   |
  #   | `conductor-dev` | `maintainer` |
  #   | `controller`    | `lead`       |
  #
  # The new name owns the meaning. `config validate` notes each old name the file writes by its
  # `role` path, such as `instances[0].roles[2].role: controller is the old name of lead`, and
  # exits 0 for it. A role keeps the name the file writes: `config show` prints it as written, and
  # its session is named after it, so a running instance whose file writes `conductor` keeps the
  # session `<session_prefix>-conductor` for this release. `session start` and `session stop`
  # take either name of a role, an old one with a note on standard error; `rules show
  # --section` reads a heading under either name of a role (`conductor.direction.Rules`). The old
  # names are removed after this release (story:role-alias-removal).
  - name: conductor.config.RoleName
    kind: newtype
    of: String

  # The harness and model one session role runs on, such as `director` or `lead`
  # (`conductor.config.RoleName`, or its old name, as the file writes it); the
  # harness agent the role starts with, such as `repo-controller`; the settings file it starts
  # with; and the profile file its session starts with through `--append-system-prompt-file`, in
  # place of the agent and of the text the binary carries for the role (story:roles-in-the-binary,
  # `conductor.agent.ShowRole`), read at start. The settings and profile files are written absolute or under `~`. Absent,
  # a role names no agent, no settings file and no profile. `session_name` is derived, never
  # chosen: the name the role's session starts under, `<session_prefix>-<role>`, or `<role>` when
  # the instance has no prefix, `<role>` as the file writes it; absent for `lead` (`controller`),
  # whose sessions are named per repository,
  # `<session_prefix>-<repository>` or `<repository>`. The file may leave it out, and may write
  # only that value. An instance whose file writes no `roles` has the three roles `director`,
  # `maintainer` and `lead`, each on `claude` with the model `opus`, written for this release
  # under their old names `conductor`, `conductor-dev` and `controller`, which the start tasks and
  # the watch's context lines select them by; they move to the new names with the tasks
  # (story:role-names-in-files), so that no running instance's sessions are renamed. Without a
  # profile or an agent, a role the binary carries a profile for (`maintainer`, `supervisor`,
  # `teacher`, `controller`) starts from that text, which the `claude-code` kind writes into the
  # agent's state, and `director` with the agent `conductor`. In v1 the maintainer is retired and
  # the host's file `host.yaml` is gone: the host roles are `globals.roles` (`Globals`, design
  # architecture-next § 9, § 11). `read_only_tools` (story:guard-all-tools) names the tools, beyond the guard's
  # built-in read-only allowlist, that the guard allows the role's sessions without a rule of its
  # own, such as a read-only MCP tool; every other tool outside the guard's ruled set is denied.
  # A tool with a rule of its own (Edit, Write, NotebookEdit, SendMessage, Bash, Monitor) is
  # decided by that rule whatever this list says. Absent, it is empty.
  # A `lead` (`controller`) role the file writes that names an `agent` names a `profile` as well
  # (story:agent-needs-user-setting-source): a session the `systemd` provider starts passes
  # `--setting-sources project,local`, which loads no user-level agent (the `none` provider adds
  # `user` for `claude --bg`, story:bg-launch-reads-user-settings), so a controller starts
  # only from a profile, never from its agent; a controller role with an agent and no profile
  # is refused by its `profile` path. One with neither is valid, as the built-in role is.
  # `limits`, `writable` and `network` are the envelope each session of the role asks for
  # (story:session-envelope-model): the limits of one session, the places it may write, and its
  # network; a box that cannot be set up is a refusal with substrate's reason and nothing falls
  # back (`conductor.placement`, design architecture-next § 6). A
  # role's limit lies at or under the instance's limit of the same key, where the instance sets
  # one, since every session of the instance runs inside the instance's box. Absent, a role sets
  # no limit, writes its default places, and has the network open. The request leaves out three
  # things on purpose: the readable paths, since the box binds the root read-only and nothing
  # narrower is planned; the programs a session may run, since a program list belongs to the tool
  # server (story:substrate-tool-server); and a lifetime, since sessions are long-lived and
  # conductor ends them. `forge_token_env` (story:sandbox-spec) names the environment variables,
  # such as `GH_TOKEN` or `GITLAB_TOKEN`, that carry the forge tokens a session of the role may
  # use: each a name of capital letters, digits and `_`, not starting with a digit. It is carried
  # on the session request a provider receives (`conductor.session.SessionRequest`); the variables'
  # values are never part of the config. Absent, it is empty.
  # `grant` (story:tool-broker-read) is what each session of the role may call through `tool`
  # (`conductor.tool.RoleGrant`): its verbs, the repositories and paths they read, the most bytes
  # one answer carries and the grant's time to live. Absent, the role's default tools that exist as
  # verbs: `show`, `search` and `diff`, over the whole working directory, 65536 bytes per answer,
  # for the session's life.
  # A settings file pins its instance (story:instance-isolation): its `env.CONDUCTOR_INSTANCE` is
  # the instance's name, and each of its hook commands that runs `conductor` names the instance
  # first, `CONDUCTOR_INSTANCE=<name> conductor guard …`, since the harness does not pass the
  # environment its starter set on to a session it forks. A role's own settings file that pins
  # no instance (no `env.CONDUCTOR_INSTANCE`, or a hook command that runs `conductor` without the
  # prefix), as the binary's do, starts pinned: `session start` and `spawn` write its content
  # with the pin set to `<state>/sessions/<session name>.settings.json` and start the session with
  # that copy, and `config validate` reports it, by its `settings` path, as a note. A settings file
  # that pins another instance, or cannot be read as JSON, is a problem `config validate` names by
  # its `settings` path, and `session start` and `spawn` refuse it (`InstanceNotPinned`). A role
  # that names none starts with its default written pinned (`conductor.session.SessionStartRefusal`).
  #
  # `kind` (design architecture-next § 7, § 9: "roles with kind, model and profile") is the agent
  # kind that fills the role's slot; absent, `claude-code`, the only kind in v1. The same role
  # written under `globals.roles` is the default of every instance; one an instance writes under
  # its `roles` overrides it key by key (precedence role over instance over global, `Level`).
  # UNMAPPED: § 7 makes the kind the program that fills a role, which is what `harness` named
  # (`claude`, `codex`); whether `harness` is retired in favour of `kind` or stays as the
  # `claude-code` kind's own setting is not settled. Both are kept. Open question.
  #
  # `token_owner` (story:token-pool, design architecture-next § 17, decision 11) names the
  # operator whose Claude token from the instance's pool the role's agent leases, so a controller
  # started for Remote Control appears in that owner's Claude app. A controller's key only: on any
  # other role it is a problem. Absent, the pool's lease rule applies (the token with the most
  # headroom). A named owner with no Available token refuses the start (`NoTokenAvailable`); no
  # other owner's token is taken.
  - name: conductor.config.Role
    kind: struct
    fields:
      - {name: role, type: String}
      - {name: kind, type: conductor.agent.AgentKindName}
      - {name: harness, type: conductor.config.Harness}
      - {name: model, type: conductor.config.CommandWord}
      - {name: agent, type: Optional<conductor.config.CommandWord>}
      - {name: settings, type: Optional<conductor.config.CommandWord>}
      - {name: profile, type: Optional<conductor.config.CommandWord>}
      - {name: session_name, type: Optional<conductor.config.SessionName>}
      - {name: read_only_tools, type: List<String>}
      - {name: limits, type: conductor.config.Limits}
      - {name: writable, type: List<conductor.config.Writable>}
      - {name: network, type: conductor.config.Network}
      - {name: forge_token_env, type: List<String>}
      - {name: grant, type: conductor.tool.RoleGrant}
      - {name: token_owner, type: Optional<conductor.operator.OperatorName>}

  # The CPU, memory and process limits of a box (story:session-envelope-model), as systemd sets
  # them on a cgroup: `memory_max` its `MemoryMax`, in GiB, written as a size, `15G`;
  # `cpu_weight` its `CPUWeight`, from 1 to 10000; `tasks_max` its `TasksMax`, the most
  # processes and threads at once. Absent, a key sets no limit.
  - name: conductor.config.Limits
    kind: struct
    fields:
      - {name: memory_max, type: Optional<conductor.config.Gibibytes>}
      - {name: cpu_weight, type: Optional<Integer>}
      - {name: tasks_max, type: Optional<Integer>}
    invariants:
      - any:
          - not defined(cpu_weight)
          - cpu_weight >= 1
      - any:
          - not defined(cpu_weight)
          - cpu_weight <= 10000
      - any:
          - not defined(tasks_max)
          - tasks_max >= 1

  # One place a role's sessions may write (story:session-envelope-model): a path written absolute
  # or under `~`, made absolute, or one of the words for a place resolved per session when it
  # starts: `checkout`, the checkout the session starts in (a controller's repository's,
  # conductor-dev's this repository's); `trees`, the managed worktrees of that checkout under
  # `checkouts.trees`; `build-cache`, the build tools' caches under the home directory (cargo's
  # among them); `scratch`, the session's scratch, under `$TMPDIR` and, for a controller,
  # `<cache>/scratch/<repo>`, under the instance's own `cache` (`<repo>` its repository, `/` written
  # `-`); `harness-state`, the harness's own state directory, `~/.claude` or `~/.codex`; `records`, the instance's records directory. Absent, a role writes `checkout`,
  # `trees`, `build-cache`, `scratch` and `harness-state`, and the `conductor` role `records` as
  # well; a list the file writes takes their place.
  - name: conductor.config.Writable
    kind: newtype
    of: String

  # A session's network. The file writes it in lower case: `open`, the host's network, the only
  # one there is.
  - name: conductor.config.Network
    kind: enum
    variants: [Open]

  # Whether `conductor build run` gives a cargo-based command its repository's compile cache
  # (story:build-run-repo-cache). The file writes it in lower case: `on` or `off`.
  - name: conductor.config.RepoCache
    kind: enum
    variants: [On, Off]

  # The conductor a session of the instance messages (story:instance-session-names): its own,
  # `session_name` being its director role's, `<session_prefix>-<role>` or `<role>` with the role
  # as the file writes it (`<session_prefix>-conductor` for the old name), when the instance names
  # a `director` (`conductor`) role (story:role-name-aliases); else the conductor of the file's `default` instance, which serves it,
  # `served_by` naming that instance; neither when no conductor serves it. Derived, never chosen:
  # a file may leave it out, and may write only that value.
  - name: conductor.config.ConductorSession
    kind: struct
    fields:
      - {name: served_by, type: Optional<conductor.config.InstanceName>}
      - {name: session_name, type: Optional<conductor.config.SessionName>}

  # How many controllers of the instance work at once, at most, how many sub-agents one
  # controller runs at once, at most, and how many pull requests of one repository may wait for
  # review before conductor sends that repository no new dispatch (story:review-limit), `0`
  # meaning no limit. Absent, they are 5, 4 and 3.
  - name: conductor.config.Controllers
    kind: struct
    fields:
      - {name: max_working, type: Integer}
      - {name: max_subagents, type: Integer}
      - {name: max_open_reviews, type: Integer}
    invariants:
      - max_working >= 1
      - max_subagents >= 1
      - max_open_reviews >= 0

  # What the instance holds true of the repository whose name `match` names: its activity, and
  # whether it ships without releases. The file writes an activity in lower case: `active` or
  # `inactive`. `no_releases` is the reason the repository ships without releases (docs published
  # on merge, a specification consumed at `main`); a repository it marks is left out of every K5
  # reading of `metric compute`, which names it as skipped once
  # (story:k5-tags-and-no-release-repositories). A rule writes at least one of the two.
  - name: conductor.config.RepositoryRule
    kind: struct
    fields:
      - {name: match, type: String}
      - {name: activity, type: Optional<conductor.direction.Activity>}
      - {name: no_releases, type: Optional<String>}

  # How often conductor runs a cycle, when its daily cycle starts, and how often the watch reads
  # the sessions and main's CI. The file writes a duration as a whole number with `s`, `m`, `h` or
  # `d`: `2h`, `180s`.
  - name: conductor.config.Cadence
    kind: struct
    fields:
      - {name: cycle, type: Duration}
      - {name: daily, type: conductor.config.TimeOfDay}
      - {name: watch, type: Duration}
      - {name: ci, type: Duration}

  # Conductor's context above which it hands over; the filesystem whose free space the disk
  # thresholds read, written absolute or under `~`; free disk under which the watch reports it,
  # from which a further fall is reported again, under which no session starts, and under which a
  # full gate takes a build slot; the size above which a build is expected to write enough to ask
  # for a slot; free disk under which the full-gate watchdog stops the gate's process group and
  # from which it resumes it; how often the watchdog reads it; and how long a live controller
  # session, and every one of its sub-agents, may write nothing to its transcript before the watch
  # reports it silent (story:watch-silent-controller), a duration as `cadence` writes one; and how
  # many CPU cores `conductor build run` leaves to the desktop (story:build-run-spare-cores); and
  # how many `conductor build run` commands run at once on the host, every instance's together: a
  # request is granted only while fewer disk grants than this are `Granted` or `Running`, waits in
  # the queue's order while they are not, and is never refused for it, 0 for no bound
  # (story:build-queue-convoy). A command's job count, `CARGO_BUILD_JOBS` and `MAKEFLAGS=-j`, is
  # its share of the cores: the cores less the reserve, over the build slots (all of them at 0),
  # at least 1; a `CARGO_BUILD_JOBS` in the environment above that share is lowered to it, and one
  # line says so (story:build-jobs-per-slot). Then whether `build run` gives a cargo-based command
  # its repository's compile cache, one sccache server and directory per repository that all of
  # its worktrees share, and that cache's size (story:build-run-repo-cache); and the short lane
  # (story:build-run-short-lane): how many build slots besides `build_slots` admit only a command
  # the ledger knows to be short, 0 turning the lane off, and the longest p90 run time of such a
  # command, a duration as `cadence` writes one. A request is short when the ledger holds at least
  # 3 earlier runs of its repository and command in 14 days whose p90 run time is at most
  # `short_lane_max`, and no short-lane run of it outlived twice that in the last 24 hours; a
  # short-lane run's job count is its share, at most 4. Then how long a live driven session may
  # make no progress, neither a report conductor received nor a commit in its checkout or any of
  # its trees, before the watch reports it stalled, and how long a host grant may stay `Requested`
  # before the watch reports the build queued (story:watch-stalled-sessions), each a duration as
  # `cadence` writes one. Then how long a managed tree that is dirty or unmerged may be untouched
  # before reclaim removes its `target/` and lists it stale, kept (story:gc-finished-trees), a
  # duration as `cadence` writes one. Absent, the filesystem is `/`, the silence 30 minutes, the
  # reserve 2 cores, the build slots 3, the repository cache `on` and its size 2G, the short-lane
  # slots 1 and their longest p90 3 minutes, the stall 45 minutes, the queued build 30 minutes and
  # the staleness 48 hours. Whether `build run` gives a cargo-based command line-table-only debug
  # information, `lean_debuginfo` (story:build-run-lean-debuginfo): `CARGO_PROFILE_DEV_DEBUG` and
  # `CARGO_PROFILE_TEST_DEBUG` set to `line-tables-only`, each unless the environment sets it or
  # the workspace manifest sets that profile's `debug`; absent, true.
  - name: conductor.config.Thresholds
    kind: struct
    fields:
      - {name: context_handover, type: conductor.config.Tokens}
      - {name: disk_path, type: String}
      - {name: disk_low, type: conductor.config.Gibibytes}
      - {name: disk_clear, type: conductor.config.Gibibytes}
      - {name: disk_admit, type: conductor.config.Gibibytes}
      - {name: build_slot, type: conductor.config.Gibibytes}
      - {name: build_size, type: conductor.config.Gibibytes}
      - {name: gate_stop, type: conductor.config.Gibibytes}
      - {name: gate_resume, type: conductor.config.Gibibytes}
      - {name: watchdog_every, type: Duration}
      - {name: silent_session, type: Duration}
      - {name: cpu_reserve, type: Integer}
      - {name: build_slots, type: Integer}
      - {name: repo_cache, type: conductor.config.RepoCache}
      - {name: repo_cache_size, type: conductor.config.Gibibytes}
      - {name: lean_debuginfo, type: Boolean}
      - {name: short_lane_slots, type: Integer}
      - {name: short_lane_max, type: Duration}
      - {name: stalled_session, type: Duration}
      - {name: build_queued, type: Duration}
      - {name: tree_stale, type: Duration}
    invariants:
      - gate_resume > gate_stop
      - cpu_reserve >= 0
      - build_slots >= 0
      - short_lane_slots >= 0

  # How many snapshots' observations the instance keeps: those of the newest `snapshots` complete
  # ones (story:observation-retention). Absent, it is 12, a day at the 2-hour cadence.
  - name: conductor.config.Retention
    kind: struct
    fields:
      - {name: snapshots, type: Integer}
    invariants:
      - snapshots >= 1

  # Where a report goes, as whom it is posted, and on which occasions.
  - name: conductor.config.Report
    kind: struct
    fields:
      - {name: channel, type: String}
      - {name: as, type: String}
      - {name: when, type: List<String>}

  # Who decides a class-C and a class-O decision. The file writes `conductor` or `operator`.
  - name: conductor.config.Authority
    kind: struct
    fields:
      - {name: class_c, type: conductor.decision.Decider}
      - {name: class_o, type: conductor.decision.Decider}

  # One secret sync of the instance (story:policy-secret-drift): a file on a branch of one of its
  # repositories that the organization's own tool publishes into GitHub Actions secrets, which its
  # CI reads. `name` names the sync on the board; `source` is the file; `secrets` are the secrets
  # it feeds, one or more; `command` is the command line that publishes it, and `dry_run`, when
  # given, the one that shows what `command` would publish without publishing it. Conductor runs
  # neither: the snapshot reads the source's last commit and each secret's `updated_at`, and the
  # board flags `secret stale: <name>` when the source changed after a secret was written. The
  # conductor session runs `command` only where the instance's `rules.md` grants it. No two syncs
  # of an instance share a name.
  - name: conductor.config.SecretSync
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: source, type: conductor.config.SecretSource}
      - {name: secrets, type: List<conductor.config.ForgeSecret>}
      - {name: command, type: String}
      - {name: dry_run, type: Optional<String>}

  # The file a secret sync publishes: `repository` names a repository whose checkout lies under
  # `checkouts.root`, written as its path under the root; `path` is the file, written relative to
  # that repository's top; `branch` is the branch its last commit is read on, as
  # `origin/<branch>`, `main` when absent. Neither path takes `.` or `..` steps.
  - name: conductor.config.SecretSource
    kind: struct
    fields:
      - {name: repository, type: String}
      - {name: branch, type: String}
      - {name: path, type: String}

  # One GitHub Actions secret a sync feeds, by its `name`: the organization `owner`'s secret, or,
  # when `repository` is given, that repository's of the owner. It is read with `gh api` (`GET
  # /orgs/<owner>/actions/secrets/<name>`, `GET /repos/<owner>/<repository>/actions/secrets/
  # <name>`), which answers the secret's `updated_at` and never its value.
  - name: conductor.config.ForgeSecret
    kind: struct
    fields:
      - {name: owner, type: String}
      - {name: repository, type: Optional<String>}
      - {name: name, type: String}

  # How the instance reads its harness accounts' usage (story:usage-probe). `probe` is a command,
  # run with `sh -c` on each snapshot, that prints the accounts as one JSON object: `accounts`, a
  # list, each with `id` (the account; conductor keeps nothing else of it, never an e-mail
  # address or a name), `active` (whether it is the account in use), `health` (`exhausted` for one
  # with nothing left) and `usage.windows`, a list of `{name, used_percent, resets_at}`; every
  # other key is ignored. `watcher` is the systemd user unit that rotates the accounts, which
  # `conductor doctor` reports running or not. With `probe` set, the watch resumes a session whose
  # tmux pane stands on the `Usage limit reached · …` banner once the probe shows the active
  # account with headroom (story:auto-resume). `rotate` is a command, run with `sh -c`, that makes
  # an account with headroom the active one: with it set, the watch resumes such a pane once any
  # account has headroom, and runs `rotate` once first. `rotate` is valid only beside `probe`.
  # Conductor names no tool: all three are the operator's. Absent, none is set: no probe runs,
  # doctor reports no watcher and the watch resumes no pane.
  - name: conductor.config.Usage
    kind: struct
    fields:
      - {name: probe, type: Optional<String>}
      - {name: watcher, type: Optional<String>}
      - {name: rotate, type: Optional<String>}

  # The route the instance's forge writes take (story:forge-route). The file writes it in lower
  # case. `gates`: through the bot route `b10x-gates`; the guard leaves `gh` and `glab` reading
  # only, and `conductor run` commits and pushes the records with `b10x-gates bot`. `direct`: with
  # the forge's own CLI and git; the guard lets a session open, update, comment on and merge (auto-merge
  # included) the pull or merge requests of its own repository with `gh pr` or `glab mr`,
  # the repository named with `-R`/`--repo`, and `conductor run` commits and pushes the records
  # with plain git. Under either, every other forge write (another repository's, a credential's,
  # an API write) is denied as before.
  - name: conductor.config.ForgeRoute
    kind: enum
    variants: [Gates, Direct]

  # How the instance writes to its forge (story:forge-route): the `route`. Absent, it is `gates`.
  - name: conductor.config.Forge
    kind: struct
    fields:
      - {name: route, type: conductor.config.ForgeRoute}

  # The id of one accepted config change (`ConfigRevision`).
  - name: conductor.config.RevisionId
    kind: newtype
    of: Uuid

  # The key of one effective setting: `<instance>/<role>/<path>`, `-` for the role of an
  # instance-wide key.
  - name: conductor.config.SettingKey
    kind: newtype
    of: String

  # The level a key of the effective config came from (design architecture-next § 9). Precedence
  # is role over instance over global: a key a role writes wins over the same key its instance
  # writes, which wins over `globals`; a key none of them writes is conductor's built-in default,
  # `Default` (story:config-globals: `config show --effective` names a built-in value apart from
  # one `globals` writes). `Default` is a level a key comes from, never one a change is written
  # at: `PutConfig` refuses it.
  - name: conductor.config.Level
    kind: enum
    variants: [Default, Global, Instance, Role]

  # Stand-in for `conductor.placement.PlacementName`, which the placement unit declares (design
  # architecture-next § 6). Declared here only so that this branch validates on its own; the
  # coordinator replaces every use with `conductor.placement.PlacementName` and removes this type.
  - name: conductor.config.PlacementName
    kind: newtype
    of: String

  # Stand-in for `conductor.operator.Grant`, which the operator unit declares: what an operator may
  # do (design architecture-next § 3 row `conductor.operator`: answer decisions, change settings,
  # start, stop and upgrade instances, purge, join). Declared here only so that this branch
  # validates on its own; the coordinator replaces every use with `conductor.operator.Grant` and
  # removes this type. The file writes a grant in kebab case: `answer-decisions`.
  - name: conductor.config.OperatorGrant
    kind: enum
    variants: [AnswerDecisions, ChangeSettings, StartInstances, StopInstances, UpgradeInstances, Purge, Join]

  # An operator's role in the config (design architecture-next § 5.3: "the daemon records them as
  # an operator of that instance with the grants the config gives their role"), such as `owner` or
  # `reader`; the config names its own roles.
  # UNMAPPED: § 5.3 says the config gives grants to a role, and the brief asks for grants on each
  # operator entry; whether grants are written once per role (a `roles:` map of the daemon, each
  # operator naming a role) or on each operator is not settled. Both `role` and `grants` are on the
  # operator here. Open question.
  - name: conductor.config.OperatorRole
    kind: newtype
    of: String

  # One operator of the deployment, `daemon.operators[]` (design architecture-next § 5.3,
  # "Several operators"): the Identity principal's name (on a single host with no Identity, the
  # Unix user), their role and the grants they hold. A grant belongs to a human only; an agent
  # actor holds none (§ 3, Actors).
  # UNMAPPED: whether a grant is held for every instance or for named instances (the instances an
  # operator has joined, § 5.3) is not settled here; the operator unit decides how a grant binds to
  # an instance. Open question.
  - name: conductor.config.DaemonOperator
    kind: struct
    fields:
      - {name: name, type: conductor.operator.OperatorName}
      - {name: role, type: conductor.config.OperatorRole}
      - {name: grants, type: List<conductor.config.OperatorGrant>}
    invariants:
      - distinct: {in: grants, as: grant}

  # The daemon's TLS listener (design architecture-next § 4, § 5.2): the address and port it
  # listens on, written `<host>:<port>`, for a dashboard deployed elsewhere and for every client
  # of a daemon on a remote box; every request presents an Identity bearer.
  # UNMAPPED: where the listener's certificate and key come from (files, a `secret:<name>`, the
  # Identity service) and which Identity service issues and checks the bearers are not settled.
  # Open question.
  # story:instance-api: `cert` and `key` are the PEM files of the listener's certificate chain and
  # private key; `identity` the Identity service's origin, which resolves each bearer
  # (`GET <identity>/v1/access-authority`, audience `conductor`). The daemon refuses to open the
  # listener while any of the three is absent, naming its YAML path.
  - name: conductor.config.TlsListener
    kind: struct
    fields:
      - {name: listen, type: String}
      - {name: cert, type: Optional<String>}
      - {name: key, type: Optional<String>}
      - {name: identity, type: Optional<String>}

  # Where the daemon resolves the `secret:<name>` values the file names (design architecture-next
  # § 9, decision 6): `keychain`, the OS keychain on the control host (`secrets-keychain`), or
  # `remote`, the Secrets service where conductord runs in a deployment (`secrets-remote`).
  # `namespace` is the secrets namespace the names live in; `url` is the Secrets service's address,
  # for `remote` only.
  # UNMAPPED: `secrets-federation` routes each namespace to one backend, "so one config serves
  # both"; whether the daemon names one source or a list of namespaces each with its backend is
  # not settled. One source here. Open question.
  # `files` (story:container-start-without-prompt), a directory of mounted files read-only, one
  # per secret; `dir` is that directory, an absolute path or one under `~`, for `files` only and
  # required there.
  - name: conductor.config.SecretsSource
    kind: struct
    fields:
      - {name: source, type: conductor.secret.Source}
      - {name: namespace, type: Optional<String>}
      - {name: url, type: Optional<String>}
      - {name: dir, type: Optional<String>}

  # The daemon's cadence (design architecture-next § 4): how often it reconciles when nothing else
  # triggers a pass, a duration as `cadence` writes one. Absent, 60 s.
  - name: conductor.config.DaemonCadence
    kind: struct
    fields:
      - {name: reconcile, type: Duration}

  # A name Kubernetes takes as a DNS label (RFC 1123) and as a label value: lower-case letters,
  # digits and `-`, starting and ending with a letter or a digit, at most 63 characters. A
  # namespace and the owner of `daemon.kubernetes` are written so. So is the name of an instance
  # the daemon runs in a pod, since its pod and its Secret are named `conductor-instance-<name>`
  # and its volume claim `conductor-instance-<name>-data`: the longest affix is 24 characters, so
  # such an instance's name is at most 39 (the invariant of `Config`). `config validate` refuses
  # a name that breaks either rule, naming its YAML path.
  - name: conductor.config.KubernetesName
    kind: newtype
    of: String
    alphabet: "abcdefghijklmnopqrstuvwxyz0123456789-"

  # The volume claim of each instance pod (`conductor-instance-<name>-data`), which holds its
  # checkouts, worktrees, records, state, cache and its own sqlite store: `size`, its request, written as a
  # size, `20G`, and required; `storage_class`, the storage class it names, absent the
  # namespace's default class. A retired instance's claim is kept.
  - name: conductor.config.KubernetesVolume
    kind: struct
    fields:
      - {name: size, type: conductor.config.Gibibytes}
      - {name: storage_class, type: Optional<String>}
    invariants:
      - size >= 1

  # Quantities of one resource list of a pod's container, each written as Kubernetes writes a
  # quantity (`500m`, `2`, `512Mi`, `4Gi`) and passed through unchanged; absent, the list sets
  # none, and the namespace's LimitRange applies.
  - name: conductor.config.KubernetesQuantities
    kind: struct
    fields:
      - {name: cpu, type: Optional<String>}
      - {name: memory, type: Optional<String>}

  # The requests and the limits of each instance pod's container. Absent, both are empty. They
  # are not `limits` of the instance (`conductor.config.Limits`, a box's cgroup), which a pod-run
  # instance does not read.
  - name: conductor.config.KubernetesResources
    kind: struct
    fields:
      - {name: requests, type: conductor.config.KubernetesQuantities}
      - {name: limits, type: conductor.config.KubernetesQuantities}

  # One environment variable of each instance pod's container: `name`, capital letters, digits
  # and `_`, not starting with a digit; and either `value`, the text itself, or `secret`, written
  # `secret:<name>`, a secret the daemon resolves from its secrets source (`daemon.secrets`),
  # never from the file. Exactly one of the two is written. The daemon writes each value into the
  # instance's Secret (`conductor-instance-<name>`) and the container reads it by `secretKeyRef`,
  # so no value stands in the pod's spec. It carries what an instance pod needs from outside, such
  # as `GH_TOKEN` or `GITLAB_TOKEN` for the forge's CLI, the `GIT_AUTHOR_*` and `GIT_COMMITTER_*`
  # identity (an instance's `git_identity` takes the place of those four in its own pod), or
  # `GIT_CONFIG_COUNT`, `GIT_CONFIG_KEY_<n>` and `GIT_CONFIG_VALUE_<n>`; which forge
  # token a pod gets is the operator's decision, not conductor's. The daemon's forge token
  # variables are every variable a forge's command line reads a token from: `GH_TOKEN`,
  # `GITHUB_TOKEN`, `GH_ENTERPRISE_TOKEN` and `GITHUB_ENTERPRISE_TOKEN` for `gh`, `GITLAB_TOKEN`,
  # `GITLAB_ACCESS_TOKEN`, `OAUTH_TOKEN` and `CI_JOB_TOKEN` for `glab`. An instance's
  # `forge_token` takes the place of every entry of them in its own pod. The daemon's GitLab token
  # belongs to one host, the `value` of a `GITLAB_HOST` entry (a host as a `gitlab` source writes
  # one; written as a `secret` it is refused at the entry's path), `gitlab.com` where none names
  # it; an entry named `GL_HOST`, `GITLAB_URI` or `GITLAB_URL` is refused at its path, since a
  # host written there would leave the daemon's token on `gitlab.com`. A pod of an instance
  # without a `forge_token` gets the entries of the `gh` variables only where its instance has a
  # `github` source, and those of the `glab` variables only where it has a `gitlab` source and
  # every `gitlab` source is on that host, compared lowercased with the port as written; an
  # instance whose sources are all `local` gets both. No instance and no `globals` key names
  # the secret an entry of one of those variables names, refused at validate by the reference's
  # YAML path; the daemon gives that token to the pods it belongs to. Where the pod
  # carries the token of a forge its instance's sources name, the daemon gives git a credential
  # helper for that forge's HTTPS origin in `GIT_CONFIG_COUNT`, `GIT_CONFIG_KEY_<n>` and
  # `GIT_CONFIG_VALUE_<n>` (story:pod-git-reaches-forge), unless an entry names
  # `GIT_CONFIG_COUNT`: then git's configuration is the installer's. A name conductor sets for the
  # pod itself is refused at validate, naming its YAML path (`daemon.kubernetes.env[<i>].name`):
  # `HOME`, `PATH`, and every name that starts with `CONDUCTOR_` (among them `CONDUCTOR_CONFIG`,
  # `CONDUCTOR_INSTANCE`, `CONDUCTOR_STORE`, `CONDUCTOR_API_TOKEN`, `CONDUCTOR_API_LISTEN` and
  # `CONDUCTOR_CONFIG_SOURCE`); the invariants of `Kubernetes` say so.
  - name: conductor.config.KubernetesEnv
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: value, type: Optional<String>}
      - {name: secret, type: Optional<conductor.secret.SecretName>}
    invariants:
      - any:
          - defined(value)
          - defined(secret)
      - any:
          - not defined(value)
          - not defined(secret)

  # The daemon runs each instance's runtime as its own pod (design: instance pods, the direct
  # route), beside the systemd unit and the child process; it is a supervisor, not a placement
  # and not a sandbox, so `placement` stays what it is and a placement that opens a box is
  # refused at validate beside this key, naming its YAML path. The daemon reaches the Kubernetes
  # API with its mounted service account and creates, per instance, a Secret
  # `conductor-instance-<name>` (the instance's config file as the daemon renders it, the
  # runtime's API token, the model token and every `env` value), a volume claim
  # `conductor-instance-<name>-data`, and a pod `conductor-instance-<name>` that runs `image` with
  # `conductor --config <data>/conductor.yaml instance serve`, restart
  # policy `Never` (the daemon restarts it), the `restricted` pod security fields, and no service
  # account token. Each of the three carries the labels `app.kubernetes.io/managed-by=conductord`,
  # `app.kubernetes.io/component=instance-runtime`, `conductor/daemon=<owner>` and
  # `conductor/instance=<name>`; the daemon adopts and cleans up by the first three. The daemon
  # builds the pod, its Secret and its claim from this key, the instance's name and the rendered
  # file; what else of a mapping reaches the pod's env is the one variable its `forge_token` fills,
  # the values of the four git identity variables its `git_identity` gives (`Instance`), and,
  # through the kinds and the `gitlab` hosts of its sources, which of the daemon's forge token
  # entries the pod gets and which `credential.https://<host>.helper` keys git gets
  # (`KubernetesEnv`). Nothing an instance's mapping holds reaches the image, the command, a
  # volume, an env source, a service account, a host path, the namespace, a label, an annotation,
  # a variable's name or a helper's value, and a `secret:<name>` in a mapping resolves against the
  # daemon's secrets source only, never a Kubernetes Secret by name.
  # `namespace`: the namespace of the instance pods, the daemon's own or another one.
  # `image`: the image every instance pod runs, `<repository>:<tag>`; a changed image restarts
  # each instance pod on it. `owner`: the value of `conductor/daemon`, which tells one daemon's
  # pods from another's in one namespace. `api_port`: the TCP port the runtime serves its API on
  # in its pod, which the daemon proxies `/v1/instances/{name}/…` to, 1 to 65535. `volume`,
  # `resources` and `env` as their types say. Absent, the daemon runs no pod: every runtime is a
  # systemd unit or a child process, as before.
  # Where this key is set, the file may hold no instance (`instances: []`): every instance arrives
  # through `AddInstance`. Without it, a file with no instance is refused by its path
  # `instances`. `namespace`, `image`, `owner`, `api_port` and `volume.size` are required and have
  # no default.
  - name: conductor.config.Kubernetes
    kind: struct
    fields:
      - {name: namespace, type: conductor.config.KubernetesName}
      - {name: image, type: String}
      - {name: owner, type: conductor.config.KubernetesName}
      - {name: api_port, type: Integer}
      - {name: volume, type: conductor.config.KubernetesVolume}
      - {name: resources, type: conductor.config.KubernetesResources}
      - {name: env, type: List<conductor.config.KubernetesEnv>}
    invariants:
      - api_port >= 1
      - api_port <= 65535
      - distinct: {in: env, as: variable, by: variable.name}
      - forall: {in: env, as: variable, that: {not: {variable.name: {starts_with: "CONDUCTOR_"}}}}
      - forall: {in: env, as: variable, that: {variable.name: {not_in: [HOME, PATH]}}}

  # The `daemon` section (design architecture-next § 4, § 5.2, § 8, § 9): `port`, the loopback
  # port of the global API on 127.0.0.1, 1 to 65535, absent 7300; `tls`, the TLS listener, absent
  # when none is configured; `cadence.reconcile`; `store`, the one URL of the deployment's shared
  # database, which the daemon hands to every instance runtime it starts; `secrets`, the secrets
  # source; `dashboard`, the path the daemon serves the dashboard app at, absent `/`; `operators`,
  # the deployment's operators, at least the one the Unix user names on a single host;
  # `upgrade_timeout`, how long an upgraded instance runtime has to answer before the daemon rolls
  # it back to its previous binary (story:instance-upgrade, § 10), a duration, absent 120 s;
  # `timeout`, how long an instance has to answer one federated read of the global API before it is
  # a row with `state: unreachable` (story:federated-views, § 5.2), a duration, absent 5 s.
  # `loopback`, whether the daemon serves the loopback listener on `port`, absent true: a box with
  # no local operator writes false (story:daemon-remote, § 4), its API then the TLS listener alone,
  # so false with no `tls` is refused at validate by the key's YAML path, and `daemon serve
  # --install` writes a system unit for it rather than the user unit.
  # `substrate_slots`, the size of the local substrate daemon's model-token slot pool, absent 0
  # (substrate 0.20.0, design 11: a slot is daemon configuration, never a per-request value): the
  # operator declares `--secret-slot model_token_<i>=<daemon dir>/slots/model_token_<i>` for each
  # `i` below it; before a box opens the daemon writes the instance's `model_token` into a free
  # slot's file (mode 0600), names that slot in the start, and frees it when the box closes.
  # `unattended` (story:container-start-without-prompt), whether `daemon serve` at its start
  # does for each instance of the file what `conductor setup --apply` does, each only where it is
  # missing: writes and commits its records skeleton, trusts its checkouts and records directory,
  # and activates its checkouts root as a `worktree` workspace; a skeleton whose repository has no
  # commit yet is committed as it lies. The listeners answer while it seeds, `/readyz` `503`
  # meanwhile, and `503` for as long as the process runs once a step failed. Absent false, and
  # the start then creates none of them. `address`, the address the listener on `port` binds, an
  # IP address, absent `127.0.0.1`: on a loopback address the listener answers a `Host` naming
  # that address beside `127.0.0.1` and `localhost`; one that is not loopback lets a probe or a
  # published port of a container reach the daemon, and every `/v1/` request on it then carries
  # an Identity bearer, as on the TLS listener; the probes and the metrics answer without one.
  # `kubernetes`, the instance pods (`conductor.config.Kubernetes`), absent none.
  # `control_token`, written `secret:<name>`, names the control token: a request on either
  # listener whose bearer equals that secret's value, read from the secrets source and never from
  # the file, is admitted as the machine principal `control-plane`
  # (`conductor.operator.ActorKind` `ControlPlane`), with or without `tls`, for the reads of
  # `/v1/` a person may make and for `POST /v1/instances`, `PUT` and `DELETE
  # /v1/instances/{name}` and `POST /v1/instances/{name}/restart`, and nothing else. Absent, no
  # request is admitted so, and the daemon answers as it did before the key existed.
  # UNMAPPED: "the dashboard's served path" may be the URL path the app is served under (`/`, as
  # § 5.3 says) or the directory of the built app the daemon serves; read here as the URL path.
  # Open question.
  - name: conductor.config.Daemon
    kind: struct
    fields:
      - {name: port, type: Integer}
      - {name: loopback, type: Boolean}
      - {name: tls, type: Optional<conductor.config.TlsListener>}
      - {name: cadence, type: conductor.config.DaemonCadence}
      - {name: store, type: conductor.store.StoreUrl}
      - {name: secrets, type: conductor.config.SecretsSource}
      - {name: dashboard, type: String}
      - {name: operators, type: List<conductor.config.DaemonOperator>}
      - {name: upgrade_timeout, type: Duration}
      - {name: timeout, type: Duration}
      - {name: substrate_slots, type: Integer}
      - {name: unattended, type: Boolean}
      - {name: address, type: String}
      - {name: kubernetes, type: Optional<conductor.config.Kubernetes>}
      - {name: control_token, type: Optional<conductor.secret.SecretName>}
    invariants:
      - port >= 1
      - port <= 65535
      - substrate_slots >= 0
      - distinct: {in: operators, as: operator, by: operator.name}

  # The `globals` section (design architecture-next § 9, § 10): the defaults every instance starts
  # from, each overridden by an instance key of the same name and by a role's own key. `roles` are
  # the built-in and custom roles with their kind, model and profile; the host roles `supervisor`
  # and `teacher`, which the daemon starts, are written here only (a `conductor.config/1` file's
  # `host.roles` becomes `globals.roles` at `config migrate`). `tuning` is the tuning grant, empty
  # by default (`conductor.improvement.TuningGrant`, § 13 row 7).
  - name: conductor.config.Globals
    kind: struct
    fields:
      - {name: roles, type: List<conductor.config.Role>}
      - {name: cadence, type: conductor.config.Cadence}
      - {name: thresholds, type: conductor.config.Thresholds}
      - {name: limits, type: conductor.config.Limits}
      - {name: tuning, type: conductor.improvement.TuningGrant}
    invariants:
      - distinct: {in: roles, as: role, by: role.role}

  # The git identity an instance's pod commits with (`Instance.git_identity`,
  # story:instance-git-identity): `name` and `email`, both required. Each is 1 to 200 bytes on
  # one line, with no control character, no `<`, no `>` and no white space at its start or end;
  # `email` holds exactly one `@` with text on both sides. A value that breaks the rule is refused
  # at validate by its YAML path, and so by `AddInstance` and `PutInstance` (`ConfigInvalid`).
  - name: conductor.config.GitIdentity
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: email, type: String}

  # Which kind of credential an instance's `model_token` holds (`Instance.model_token_kind`). The
  # file writes it in lower case: `api_key`, a key the harness sends as an API key, or
  # `subscription_token`, the long-lived token of a subscription login, which the harness reads
  # from the variable `CLAUDE_CODE_OAUTH_TOKEN` of its process's environment only.
  - name: conductor.config.ModelTokenKind
    kind: enum
    variants: [ApiKey, SubscriptionToken]

  # One instance, `instances[]` of the file (design architecture-next § 9: name, `placement`,
  # sources, checkouts, records, roles, overrides of any global key). A path is written absolute or
  # under `~`, which is the home directory; the
  # effective path is absolute. `operator` is how sessions name the person who decides class O.
  # `placement` names the placement the instance's box is opened at (`conductor.placement`, § 6).
  # `session_prefix` is the prefix of every session the instance starts
  # (story:instance-names-unique). It is required: `config validate` refuses an
  # instance that writes none, naming the prefix `conductor config migrate` would write
  # (`SuggestedPrefix`). For one release a file without it still loads, so that a running instance
  # keeps working until the operator migrates it: its sessions keep the bare names `conductor`,
  # `conductor-dev` and `<repository>`.
  # `conductor` is derived: the conductor that serves the instance.
  #
  # The overrides: `roles`, `limits`, `controllers`, `cadence`, `thresholds`, `retention` and
  # `usage` are the keys `globals` holds for every instance (`Globals`); each one an instance
  # writes overrides the global value, key by key, and a role's own key overrides both
  # (precedence role over instance over global, `Level`). These keys are kept as they were before
  # v1; what is new is that an absent one takes the global value before conductor's built-in
  # default. `limits` are the instance's box as a whole, the cpu, memory and task limits every
  # role of the instance runs inside (they move here from `confinement.limits`).
  # UNMAPPED: § 9 says an instance may override "any global key"; whether the instance's own keys
  # that `globals` does not hold (`sources`, `checkouts`, `records`, `authority`, `forge`, …) may
  # also be written under `globals` as defaults is not settled. Open question.
  # Removed in v1 (§ 9, § 11): `dashboard_port` (the daemon serves the one dashboard), every
  # `confinement.*` key (substrate placements, § 6) and the per-instance `store:` key (the store
  # is the daemon's, `daemon.store`, § 8); `conductor config migrate` drops them from a
  # `conductor.config/1` file with a note.
  # Absent from the file, `records`, `state` and `cache` are ~/.b10x/conductor/<name>/records,
  # ~/.b10x/conductor/<name>/state and ~/.cache/b10x/conductor/<name>, `repositories` and `reports`
  # are empty, `operator`, `catalog` and `session_prefix` are absent, every override is the global
  # value, and every other absent key is conductor's built-in default.
  # UNMAPPED: whether `placement` may be absent (and then names a default placement, such as a
  # local substrate daemon with the `systemd` adapter) is not settled; it is required here.
  # Open question.
  # UNMAPPED: § 6 makes the placement "overridable per role"; where a role names its own placement
  # (a key of `Role`, or of the role's slot in `conductor.agent`) is not settled. Open question.
  - name: conductor.config.Instance
    kind: struct
    fields:
      - {name: name, type: conductor.config.InstanceName}
      - {name: placement, type: conductor.config.PlacementName}
      # The remote substrate daemon of the placement, absent for a local one
      # (story:placement-substrate-remote).
      - {name: remote, type: Optional<conductor.placement.RemoteDaemon>}
      - {name: session_prefix, type: Optional<conductor.config.SessionPrefix>}
      - {name: sources, type: List<conductor.config.Source>}
      - {name: checkouts, type: conductor.config.Checkouts}
      - {name: records, type: String}
      - {name: state, type: String}
      - {name: cache, type: String}
      - {name: roles, type: List<conductor.config.Role>}
      - {name: limits, type: conductor.config.Limits}
      - {name: controllers, type: conductor.config.Controllers}
      - {name: repositories, type: List<conductor.config.RepositoryRule>}
      - {name: cadence, type: conductor.config.Cadence}
      - {name: thresholds, type: conductor.config.Thresholds}
      - {name: retention, type: conductor.config.Retention}
      - {name: reports, type: List<conductor.config.Report>}
      - {name: authority, type: conductor.config.Authority}
      - {name: usage, type: conductor.config.Usage}
      - {name: operator, type: Optional<String>}
      - {name: catalog, type: Optional<conductor.config.Catalog>}
      # The secret syncs whose drift the snapshot reads (story:policy-secret-drift); absent, none.
      - {name: secret_syncs, type: List<conductor.config.SecretSync>}
      # The Gates policy file `conductor repository refresh-hooks --apply` installs each
      # checkout's hooks with (`b10x-gates install --policy`); absent, it installs none
      # (story:gates-hooks-fresh).
      - {name: gates_policy, type: Optional<String>}
      # The secret the instance's box receives as its model token, written `secret:<name>`, sealed
      # through a slot of the daemon's pool (`daemon.substrate_slots`); absent, the box receives
      # no slot. At a placement that opens no box, where the file says `daemon.unattended`
      # (story:container-start-without-prompt), an agent whose instance's pool leases it no token
      # runs on it instead, by its `model_token_kind`. Without that key an empty pool leaves the
      # launch as it is.
      - {name: model_token, type: Optional<conductor.secret.SecretName>}
      # The kind of the `model_token` (`ModelTokenKind`); absent, `api_key`. At a placement that
      # opens no box, an agent that runs on the model token gets it by its kind. `api_key`: the
      # session's settings copy names `conductor token reveal --model-token <instance>` as its
      # `apiKeyHelper`, which reads the value from the secrets source at each ask of the harness.
      # `subscription_token`: the runtime reads the value from the secrets source once at each
      # session's start and sets it as `CLAUDE_CODE_OAUTH_TOKEN` in the environment of the
      # harness's process, never in a unit, a command line, the settings copy or a log; the
      # settings copy names no `apiKeyHelper`, which would outrank the variable, and one the
      # role's settings named is left out of it, which the start says in one line. Nothing
      # refreshes such a token: an expired or changed one needs a new value in the secrets
      # source and a new session, which `POST /v1/instances/{name}/restart` starts for every
      # session of an instance pod. Set without a `model_token`, or as `subscription_token` at a
      # placement that opens a box (a box receives its model token as an API key through a
      # slot), it is refused at validate by its YAML path.
      - {name: model_token_kind, type: Optional<conductor.config.ModelTokenKind>}
      # The instance's own forge token, written `secret:<name>` (story:instance-forge-token), read
      # only by the pod supervisor: where `daemon.kubernetes` is set, the instance's pod reads the
      # secret's value from its own Secret in the variable of the forge its sources name,
      # `GH_TOKEN` for a `github` source and `GITLAB_TOKEN` for a `gitlab` one, in place of every
      # `daemon.kubernetes.env` entry of the daemon's forge token variables (`KubernetesEnv`
      # lists them), so that pod carries none of the daemon's forge token variables, and its
      # Secret holds their secrets only where another entry names them. It never names the
      # secret of such an entry, which the daemon gives to the pods it belongs to; no
      # other pod carries it, and the file the pod runs on does not write it. Set on an instance
      # whose sources name no forge or two, or in a file without `daemon.kubernetes`, it is
      # refused at validate by its YAML path, saying which. Absent, the pod carries the entries
      # of `daemon.kubernetes.env` of the forges its sources are on (`KubernetesEnv` says
      # which), and every other entry.
      - {name: forge_token, type: Optional<conductor.secret.SecretName>}
      # The git identity of the instance's pod (`GitIdentity`, story:instance-git-identity), read
      # only by the pod supervisor: where `daemon.kubernetes` is set, the pod carries
      # `GIT_AUTHOR_NAME` and `GIT_COMMITTER_NAME` from its `name` and `GIT_AUTHOR_EMAIL` and
      # `GIT_COMMITTER_EMAIL` from its `email`, each once, in place of a `daemon.kubernetes.env`
      # entry of that variable. They are the pod's environment, so every commit made in the pod
      # carries them, a session's in a checkout and conductor's in the instance's records. The
      # file the pod runs on does not write it. In a file without `daemon.kubernetes` it is
      # refused at validate by its YAML path, saying that it holds for an instance that runs as a
      # pod. Absent, each of the four is the `daemon.kubernetes.env` entry of its name, else
      # `conductor` for a name and `conductor@localhost` for an e-mail.
      - {name: git_identity, type: Optional<conductor.config.GitIdentity>}
      # The instance's standing rules (story:instance-rules-text): text of a control plane's or
      # an operator's choosing that every session the instance starts reads, whatever its role
      # (the controller, the director, the maintainer); the daemon's host roles do not. At most
      # 16384 bytes of UTF-8 and no NUL; a mapping that breaks either is refused at validate by
      # the member's YAML path, and so by `AddInstance` and `PutInstance` (`ConfigInvalid`). The
      # config file holds no secret, and its secret scan reads this text as every other value:
      # a text with a word that "looks like a token" or a URL that "writes a password in its
      # URL" is refused the same way, at the same path, and no problem quotes the text. A text
      # that is empty or only white space gives no rule and reads as absent, everywhere the
      # member is read. The control plane alone writes it: the instance's own settings write
      # (`WriteConfig`) takes it as `Fixed`. A
      # session's prompt file holds the text after one line that says it is the instance's
      # standing rules, verbatim in a fenced block whose fence is longer than any run of
      # backticks in it, so no line of it closes the block: after the role's profile where the
      # session starts from one (a role that names its own `profile` file starts from a copy in
      # the instance's state that holds the profile and the block; the named file is not
      # changed), and alone in a prompt file of its own beside the agent a role starts from where
      # it starts from an agent. Each session reads the text as it is at its start, and a session
      # that runs keeps the text it started with. Where `daemon.kubernetes` is set, the file the
      # pod runs on writes it, and it is no part of the pod's digest: a change of it alone
      # replaces no pod; the daemon writes the pod's Secret again in place, and the runtime reads
      # the text from the mounted file at each session's start; while the API refuses that write,
      # the instance's `detail` says so. A file that does not read or validate at a session's
      # start leaves the session the text the runtime last read, and one line of its log names
      # the file and why. Absent, every session starts as before.
      - {name: standing_rules, type: Optional<String>}
      # The route of the instance's forge writes (story:forge-route); absent, `gates`.
      - {name: forge, type: conductor.config.Forge}
      - {name: conductor, type: conductor.config.ConductorSession}

  # The file, `conductor.config/2` (design architecture-next § 9). A key it does not declare is an
  # error, and so is a value that looks like a token. A value under a secret-bearing key (one
  # whose name ends in `token`, `password`, `secret` or `bearer`, and the password of a
  # `daemon.store` URL) is `secret:<name>` and nothing else (story:config-globals; § 9: "Secrets
  # never enter the file"). `daemon` is conductord's own section,
  # `globals` the defaults every instance starts from, `instances` the instances it reconciles.
  # `default` is the instance a command runs when neither `--instance` nor the
  # `conductor-instance` setting names one (story:grouped-instance); it names an instance of the
  # file. No two instances share a `session_prefix`, and at most one has none
  # (story:instance-session-names); no two share a `state` or a `records`
  # directory (story:instance-names-unique). The host registry that checked this across config
  # files is gone (§ 11): one daemon reads one file. `instances` holds at least one instance,
  # unless `daemon.kubernetes` is set: a daemon that runs its instances as pods starts with none,
  # and a consumer control plane adds each (`AddInstance`). Where it is set, every instance's name
  # is a `KubernetesName` of at most 39 characters, so that `conductor-instance-<name>-data` is
  # at most 63.
  - name: conductor.config.Config
    kind: struct
    fields:
      - {name: version, type: String}
      - {name: daemon, type: conductor.config.Daemon}
      - {name: globals, type: conductor.config.Globals}
      - {name: default, type: Optional<conductor.config.InstanceName>}
      - {name: instances, type: List<conductor.config.Instance>}
    invariants:
      - version == "conductor.config/2"
      - any:
          - defined(daemon.kubernetes)
          - instances.count >= 1
      - any:
          - not defined(daemon.kubernetes)
          - forall: {in: instances, as: instance, that: "instance.name.count <= 39"}
      - distinct: {in: instances, as: instance, by: instance.name}
      - distinct: {in: instances, as: instance, by: instance.session_prefix}
      - distinct: {in: instances, as: instance, by: instance.state}
      - distinct: {in: instances, as: instance, by: instance.records}
      - any:
          - not defined(default)
          - exists: {in: instances, as: instance, that: instance.name == default}

  # The file `conductor daemon serve --daemon-config <file>` reads (`conductor.instance.ServeDaemon`),
  # such as a ConfigMap mounted read-only into the daemon's pod: a `conductor.config/2` file that
  # holds `version` and `daemon` and nothing else; a `globals`, `default` or `instances` key in it
  # is refused by its YAML path.
  - name: conductor.config.DaemonConfig
    kind: struct
    fields:
      - {name: version, type: String}
      - {name: daemon, type: conductor.config.Daemon}
    invariants:
      - version == "conductor.config/2"

  # The input of `conductor config validate`: the instance to resolve, else the
  # `conductor-instance` setting, else none. It writes nothing; the host registry it wrote before
  # v1 is gone (design architecture-next § 11).
  - name: conductor.config.ValidateConfig
    kind: struct
    fields:
      - {name: instance, type: Optional<String>}

  # The input of `conductor config migrate` (story:instance-names-unique), which writes a
  # `session_prefix` into every instance of the config file that writes none: the prefix
  # `SuggestedPrefix` names. It edits only those lines of the file, keeping every other line and
  # comment, and refuses, writing nothing, when the edited file would read back as anything but
  # the old one with those prefixes. `check` writes nothing and prints the prefixes it would
  # write. A prefix renames the instance's sessions: stop them before migrating and start them
  # again after.
  #
  # From `conductor.config/1` to `/2` (design architecture-next § 9), once (story:config-globals):
  # it writes `version: conductor.config/2`; drops `dashboard_port`, `confinement.mode`,
  # `confinement.provider` and the per-instance `store:` key with one note each naming its YAML
  # path; writes each instance's `placement` as the name a `/1` file's provider reads as
  # (`systemd`, `none`), and moves `confinement.limits` to the instance's `limits`; and moves the
  # host's roles (`host.roles`, read before v1 from `host.yaml` in the host's directory) to
  # `globals.roles`. The converted file is written whole, so its comments are not kept: the old
  # file is kept beside it as `<file>.config-1.bak`. It writes no `daemon` section, and notes
  # that the daemon starts only on a written `daemon.store`. A `/2` file it leaves unchanged.
  - name: conductor.config.MigrateConfig
    kind: struct
    fields:
      - {name: check, type: Optional<Boolean>}

  # The prefix `config migrate` writes, and `config validate` names, for an instance without one:
  # its name in letters, digits and `-` (any other character written `-`, runs of `-` as one,
  # none at either end; `i<index>` when nothing is left), with the first of 2, 3, … appended when
  # another instance of the file holds that prefix, or one of them
  # followed by `-` begins the other.
  - name: conductor.config.SuggestedPrefix
    kind: struct
    fields:
      - {name: instance, type: conductor.config.InstanceName}
      - {name: session_prefix, type: conductor.config.SessionPrefix}

  # The input of `conductor config show`. `format` is one of text, json, yaml, read by the
  # handler; `instance` is the instance shown, else the `conductor-instance` setting, else the
  # file's `default`, else its only instance. `effective` (design architecture-next § 9, `config
  # show --effective --instance <i>`) prints every key of the instance with its effective value
  # and the level it came from, the rows of `EffectiveSettings`; without it, the instance as the
  # file writes it after defaults.
  - name: conductor.config.ShowConfig
    kind: struct
    fields:
      - {name: format, type: Optional<String>}
      - {name: instance, type: Optional<String>}
      - {name: effective, type: Optional<Boolean>}

  # The input of `conductor config put` (story:config-globals), the CLI path of `PutConfig`, the
  # function `PUT /v1/config` calls: `level` is one of global, instance, role, read by the
  # handler; `instance` and `role` the scope the level needs; `path` the key under that level;
  # `value` the new value as YAML reads it, absent to remove the key at that level; `reason` why.
  # The actor is the process's (the calling session as an agent, else the operator) and the time
  # is now.
  - name: conductor.config.ChangeConfig
    kind: struct
    fields:
      - {name: level, type: String}
      - {name: instance, type: Optional<String>}
      - {name: role, type: Optional<String>}
      - {name: path, type: String}
      - {name: value, type: Optional<String>}
      - {name: reason, type: String}

  # The input of `conductor config workspace` (story:workspace-from-config), which writes the
  # instance's `<records>/.engineering/workspace.yaml` (`aep.workspace/1`) from its config,
  # replacing the file, and reads no network: one member per git checkout directly under
  # `checkouts.root` for a `github` source; one per git checkout directly under its `path`, but
  # its `exclude` entries, for a `local` source; one per git checkout under `checkouts.root`
  # whose `origin` remote, read from its git config, is on its host and under its group, but its
  # `exclude` entries, for a `gitlab` source, named by its path under the root and not by its
  # project (story:gitlab-workspace, story:checkout-name-differs-from-project); and the records
  # directory itself. `instance` is selected as for `config show`; a config file must name it.
  # `check` writes nothing and exits 1 naming each member that differs from the file.
  - name: conductor.config.WriteWorkspace
    kind: struct
    fields:
      - {name: instance, type: Optional<String>}
      - {name: check, type: Optional<Boolean>}

  # One member of the workspace `conductor config workspace` writes: its name, the directory name
  # of its checkout, and its `source`, that checkout relative to `<records>/.engineering/`.
  - name: conductor.config.WorkspaceMember
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: source, type: String}

  # The input of `conductor trust` (story:portable-trust), which marks every git checkout
  # directly under the instance's `checkouts.root`, and its `records` directory by its physical
  # path, as trusted Claude Code workspaces in `~/.claude.json`. `instance` is selected as for
  # `config show`; a config file must name it. The records path may hold no line break and must
  # be a directory.
  - name: conductor.config.TrustWorkspaces
    kind: struct
    fields:
      - {name: instance, type: Optional<String>}

  # The input of `conductor init` (story:first-run-seed), which writes the instance's records
  # directory skeleton — a git repository holding `NORTHSTAR.md`, `docs/handoff/<date>.md` with a
  # first task, `rules.md` with one section per role, headed by the role's name
  # (`conductor.config.RoleName`: `Director`, `Lead`, `Maintainer`), a `README.md`, the workspace file
  # `.engineering/workspace.yaml` as `config workspace` writes it, and `decisions/`,
  # `dispatches/` and `charters/` — and commits it, refusing to overwrite any file. `instance` is
  # selected as for `config show`; a config file must name it. It installs no agent adapter under
  # `~/.claude/agents/`: the daemon starts the host roles, the supervisor and the teacher, from
  # the profiles the binary carries (story:host-roles-by-daemon, story:roles-in-the-binary).
  - name: conductor.config.InitRecords
    kind: struct
    fields:
      - {name: instance, type: Optional<String>}

  # What `conductor doctor` found of one program conductor starts (story:install-prerequisites):
  # `Present`, on `PATH` and runnable, at or above its pin when the nearest `b10x.toml` pins it;
  # `Missing`; `OlderThanPin`, present and older than that pin; `VersionUnread`, present and
  # pinned, with no version read from what `--version` printed; `NotNeeded`, a forge's CLI the
  # instance does not start, `gh` without a `github` source or `glab` without a `gitlab` source
  # (story:gh-optional), whether it is on `PATH` or not.
  - name: conductor.config.PrerequisiteState
    kind: enum
    variants: [Present, Missing, OlderThanPin, VersionUnread, NotNeeded]

  # One program conductor starts, as `conductor doctor` reports it: the first line its
  # `--version` printed, the version read from that line, and its `b10x.toml` pin, `x.y.z` or
  # `x.y`, when one is written.
  - name: conductor.config.Prerequisite
    kind: struct
    fields:
      - {name: program, type: String}
      - {name: state, type: conductor.config.PrerequisiteState}
      - {name: version_line, type: Optional<String>}
      - {name: version, type: Optional<String>}
      - {name: pin, type: Optional<String>}

  # The machine `conductor doctor` runs on (story:doctor-identity), printed before the program
  # rows so that a posted report says where it came from: its host name, its operating system and
  # that system's release, and its architecture, as `uname -n`, `uname -s`, `uname -r` and
  # `uname -m` print them (`unknown` for one that cannot be read), and the version of the
  # `conductor` that ran.
  - name: conductor.config.Machine
    kind: struct
    fields:
      - {name: host, type: String}
      - {name: system, type: String}
      - {name: release, type: String}
      - {name: architecture, type: String}
      - {name: conductor, type: String}

  # Whether a forge's CLI is logged in to one host (story:doctor-identity), as its `auth status
  # --hostname <host>` answers: `LoggedIn` when it exits 0, `NotLoggedIn` otherwise.
  - name: conductor.config.ForgeLoginState
    kind: enum
    variants: [LoggedIn, NotLoggedIn]

  # One host `conductor doctor` checks a login on (story:doctor-identity): `github.com` with `gh`
  # for a `github` source, and the source's `host` with `glab` for a `gitlab` source, across every
  # instance of the config file, each host once; only for a CLI that is present. `account` is the
  # login name the CLI names for that host, and nothing else it prints: never a token or an
  # e-mail address. It is absent when the CLI is not logged in, or names no login that is a plain
  # name.
  - name: conductor.config.ForgeLogin
    kind: struct
    fields:
      - {name: program, type: String}
      - {name: host, type: String}
      - {name: state, type: conductor.config.ForgeLoginState}
      - {name: account, type: Optional<String>}

  # What `conductor doctor` reports (story:doctor-verdict, story:doctor-identity): the machine, one
  # row per program conductor starts, one login per host of the config file's sources, and the
  # verdict (the confinement providers' rows are gone with `confinement.*`, design
  # architecture-next § 11; substrate's pin is a program row), its last line: `ready`, or
  # `not ready: ` and each failure, comma-separated, in this
  # order: `config (unreadable)`; then each program, as `<program> (missing)`,
  # `<program> (too old)`, `<program> (pin unread)` or `<program> (version unread)`; then each
  # login, as `<program> (not logged in to <host>)`.
  - name: conductor.config.DoctorReport
    kind: struct
    fields:
      - {name: machine, type: conductor.config.Machine}
      - {name: prerequisites, type: List<conductor.config.Prerequisite>}
      - {name: logins, type: List<conductor.config.ForgeLogin>}
      - {name: verdict, type: String}

  # The input of `conductor setup` (story:setup-command), which checks one repository's
  # prerequisites: `repository` is its directory, by default the working directory; `apply`
  # applies the fixes that are safe to repeat, and only those: it writes a config file with an
  # instance naming the repository when there is no config file, runs `conductor init` and
  # `conductor trust` for the instance naming it when its records or its trust are missing, and
  # activates that instance's checkouts root as a `worktree` workspace when it is not activated,
  # with a profile template it writes beside the config file when there is none
  # (story:worktree-activation). It never logs a CLI in, installs a program or migrates a planning
  # store: it prints each of those as the command to run.
  - name: conductor.config.SetupRepository
    kind: struct
    fields:
      - {name: repository, type: Optional<String>}
      - {name: apply, type: Optional<Boolean>}

  # What one check of `conductor setup` found of the repository (story:setup-command). `check`
  # is one of `store` (the planning store's version in `.engineering/project.yaml`: current,
  # old, or none, which is no failure), `instance` (an instance of the config file whose
  # checkouts root, or `local` source, holds the repository), `records` (that instance's records
  # directory holds what `conductor init` writes) and `trust` (the repository is a trusted Claude
  # Code workspace in `~/.claude.json`); `ready` whether it passes; `detail` what was found; `fix`
  # the command that fixes it, when one does.
  - name: conductor.config.RepositoryCheck
    kind: struct
    fields:
      - {name: check, type: String}
      - {name: ready, type: Boolean}
      - {name: detail, type: String}
      - {name: fix, type: Optional<String>}

  # What `conductor setup` reports (story:setup-command): doctor's report, computed by doctor's
  # own checks; the repository; one row per check of the repository, in the order `store`,
  # `instance`, `records`, `trust`; and one verdict, doctor's verdict over doctor's failures and
  # then each failing check as `<check> (<what>)`: `store (old)`, `instance (none)`,
  # `records (missing)`, `trust (not trusted)`.
  - name: conductor.config.SetupReport
    kind: struct
    fields:
      - {name: doctor, type: conductor.config.DoctorReport}
      - {name: repository, type: String}
      - {name: checks, type: List<conductor.config.RepositoryCheck>}
      - {name: verdict, type: String}

  # The input of `conductor upgrade` (story:conductor-upgrade), which reads the releases of the
  # repository the binary was built from. `check` only compares the installed version with the
  # newest release and changes nothing; `release` names the release installed, `x.y.z`, by
  # default the newest, and may name an older one (a rollback). It is `--release`, not
  # `--version`, because `ess-cli/1` reserves `--version` for the binary's own. An upgrade downloads that
  # release's `conductor-<version>-<target>.tar.gz`, for the target the binary was built for, and
  # its `SHA256SUMS`, verifies the archive's sum, unpacks it, runs the unpacked binary's
  # `--version`, and replaces the running binary's file by a rename in its own directory, keeping
  # the old file as `conductor.previous` beside it.
  - name: conductor.config.UpgradeBinary
    kind: struct
    fields:
      - {name: check, type: Optional<Boolean>}
      - {name: release, type: Optional<String>}

  # Why a command refused to act for an instance (story:instance-isolation); a refusal reads and
  # writes nothing of any instance, names its refusal on one line of standard error, and exits 1.
  # The instance is `CONDUCTOR_INSTANCE`; without it, the instance whose records, state, checkouts
  # root or managed trees hold the working directory, the deepest when one lies inside another's;
  # under none of them, the file's `default`, else its only instance. A command run in another
  # instance's tree never falls back to the default.
  # `AmbiguousInstance`: without `CONDUCTOR_INSTANCE`, two instances' trees hold the working
  # directory at the same depth, so neither is chosen.
  # `StateDirNotInstance`: a command that writes the instance's records (`snapshot publish-board`
  # and the snapshot's rollups, the decision, dispatch and message logs, and every other command
  # that writes the store) was given a `--state-dir` other than the instance's `state`, whose
  # records it would not write beside it.
  # `ConfigUnloaded`: the config file does not load; the guard denies every call and names the
  # reason, rather than deciding by the built-in paths.
  - name: conductor.config.InstanceRefusal
    kind: enum
    variants:
      - AmbiguousInstance
      - StateDirNotInstance
      - ConfigUnloaded

  # A refusal to act for an instance: why, and what was found.
  - name: conductor.config.InstanceRefused
    kind: struct
    fields:
      - {name: refusal, type: conductor.config.InstanceRefusal}
      - {name: detail, type: String}

  # What `conductor upgrade` found or did (story:conductor-upgrade): `UpgradeAvailable`, with
  # `--check`, the release is newer than the installed version; `NoneAvailable`, with `--check`,
  # it is not; `Upgraded`, the release's binary replaced the installed one; `AlreadyCurrent`, the
  # installed version is the release's, and no file changed.
  - name: conductor.config.UpgradeOutcome
    kind: enum
    variants: [UpgradeAvailable, NoneAvailable, Upgraded, AlreadyCurrent]

  # What `conductor upgrade` reports (story:conductor-upgrade): the installed version, the
  # release's version, what it found or did, and the binary's file.
  - name: conductor.config.UpgradeReport
    kind: struct
    fields:
      - {name: installed, type: String}
      - {name: release, type: String}
      - {name: outcome, type: conductor.config.UpgradeOutcome}
      - {name: binary, type: String}

  # Why `conductor upgrade` refused (story:conductor-upgrade); a refusal changes no file.
  # `ReleaseUnread`, the release, its archive or its `SHA256SUMS` could not be downloaded or read,
  # or `--release` is no `x.y.z`; `NoArchiveForTarget`, the release has no archive for the target
  # the binary was built for; `ChecksumMismatch`, the archive's sum is not its `SHA256SUMS` line;
  # `NewBinaryDoesNotRun`, the unpacked binary's `--version` failed; `BinaryNotWritable`, the
  # binary's directory does not take the new file.
  - name: conductor.config.UpgradeRefusal
    kind: enum
    variants:
      - ReleaseUnread
      - NoArchiveForTarget
      - ChecksumMismatch
      - NewBinaryDoesNotRun
      - BinaryNotWritable

  # A refusal of `conductor upgrade`: the release it was asked to install, the target, why, and
  # what it found.
  - name: conductor.config.UpgradeRefused
    kind: struct
    fields:
      - {name: release, type: String}
      - {name: target, type: String}
      - {name: refusal, type: conductor.config.UpgradeRefusal}
      - {name: detail, type: String}

  # When a change of a config key takes effect (story:dashboard-config-page): `WatchTick`, the
  # loop's next watch tick reads it; `Cycle`, its next cycle; `LoopRestart`, only when the loop
  # starts again (`conductor run --uninstall`, then `--install`); `Fixed`, the dashboard does not
  # change it (the instance's name, prefix and paths: `conductor config migrate` moves them; its
  # `standing_rules`: the control plane writes them, story:instance-rules-text).
  - name: conductor.config.ConfigEffect
    kind: enum
    variants: [WatchTick, Cycle, LoopRestart, Fixed]

  # One key of the effective config as the dashboard's Configuration page shows it
  # (story:dashboard-config-page): its YAML path under the instance (`cadence.watch`,
  # `thresholds.disk_low`), its value as `config show` writes it, the value it takes when the file
  # writes none (`default`, absent when the file's value is the default or the key has none) and
  # when a change of it takes effect.
  - name: conductor.config.ConfigField
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: value, type: String}
      - {name: default, type: Optional<String>}
      - {name: takes_effect, type: conductor.config.ConfigEffect}

  # One instance of the config file as the Configuration page lists it: its name, its session
  # prefix, the forge of its first source (`github`, `gitlab` or `local`) and whether it is the
  # instance whose page answers. Before v1 the rows came from the host registry and carried each
  # instance's dashboard port; both are gone (design architecture-next § 11).
  - name: conductor.config.ConfigInstance
    kind: struct
    fields:
      - {name: name, type: conductor.config.InstanceName}
      - {name: session_prefix, type: Optional<conductor.config.SessionPrefix>}
      - {name: forge, type: String}
      - {name: current, type: Boolean}

  # The view the Configuration page reads, `GET /api/config` (story:dashboard-config-page): the
  # config file of the instance whose dashboard answers, the instance's name and its index in
  # the file, every key of its effective config (`config show`, the host's roles left out) as a
  # `ConfigField`, the config file's instances, its repositories with their activity
  # (`conductor.direction.RepositoryActivityRow`, read from the store) and the problems reading
  # any of them. A view: it reads the file and an existing store, and writes and
  # creates nothing.
  - name: conductor.config.ConfigPage
    kind: struct
    fields:
      - {name: file, type: String}
      - {name: instance, type: conductor.config.InstanceName}
      - {name: index, type: Integer}
      - {name: fields, type: List<conductor.config.ConfigField>}
      - {name: instances, type: List<conductor.config.ConfigInstance>}
      - {name: repositories, type: List<conductor.direction.RepositoryActivityRow>}
      - {name: errors, type: List<String>}
    invariants:
      - index >= 0

  # One staged change of the Configuration page: the YAML path of a key under the instance, as
  # `ConfigField.path` names it, and the YAML text of its new value; no `value` removes the key,
  # so its default applies again.
  - name: conductor.config.ConfigChange
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: value, type: Optional<String>}

  # One staged switch of a repository's activity, with the operator's reason, which is required.
  # It is written as the repository's mark (`conductor.direction.MarkRepository`, else
  # `ActivateRepository` or `DeactivateRepository`), marked by the operator.
  - name: conductor.config.ActivityChange
    kind: struct
    fields:
      - {name: repository, type: conductor.direction.MarkedRepository}
      - {name: activity, type: conductor.direction.Activity}
      - {name: reason, type: String}

  # One problem of the staged config, named by its YAML path as `config validate` names it.
  - name: conductor.config.ConfigProblem
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: message, type: String}

  # UNMAPPED: v1 renames the per-instance dashboard's `config` GET/POST to the instance API's
  # `settings` GET/PUT and routes every config change through `PutConfig` (design
  # architecture-next § 5.1, § 9). Whether `ConfigPage`, `WriteConfig` and their answers are
  # retired with the per-instance dashboard, or kept as the dashboard app's page over `PutConfig`
  # and `EffectiveSettings`, is not settled; they are kept unchanged. Open question.
  # The Configuration page's write, `POST /api/config` (story:dashboard-config-page), taken as
  # the Decisions page's answers are: from the page's own origin on 127.0.0.1, with the token it
  # was served with, as JSON of a bounded length. The staged `changes` are applied to the file's
  # instance and the result converted as `config validate` converts it; with `check` nothing is
  # written and the answer names each problem and the diff. Without it, and with no problem:
  # the old file is kept beside it as `conductor.yaml.<UTC time>.bak`, the new one written in
  # its place, each `activity` change written as its repository's mark, and one decision recorded
  # (`conductor.decision.RecordOperatorDecision`): class C, decided by the operator, recorded by
  # `dashboard`, the operator's `reason` as its reason and words, the diff as its evidence.
  - name: conductor.config.WriteConfig
    kind: struct
    fields:
      - {name: changes, type: List<conductor.config.ConfigChange>}
      - {name: activity, type: List<conductor.config.ActivityChange>}
      - {name: reason, type: Optional<String>}
      - {name: check, type: Optional<Boolean>}

  # What the write answers: the diff of the effective config (`- path: old`, `+ path: new`, one
  # line each, then one line per activity change), whether a changed key takes effect only at a
  # loop restart, the backup and the decision when it wrote, and the problems when it did not.
  - name: conductor.config.ConfigWritten
    kind: struct
    fields:
      - {name: diff, type: String}
      - {name: restart, type: Boolean}
      - {name: backup, type: Optional<String>}
      - {name: decision_id, type: Optional<conductor.decision.DecisionId>}
      - {name: problems, type: List<conductor.config.ConfigProblem>}

  # Why the write was refused; a refusal writes nothing. `NotThisPage`, the request is not from
  # this server's page on 127.0.0.1 (another host or origin): 403; `TokenMissing`, it carries no
  # token or not the page's: 403; `Invalid`, the staged result does not convert, or a key it
  # changes is `Fixed`: 422 with each problem; `ReasonMissing`, a write without the operator's
  # reason, or an activity change without its own: 422; `NothingStaged`, no change: 422;
  # `NoConfigFile`, the instance runs on the built-in defaults, so there is no file to write: 409.
  - name: conductor.config.ConfigWriteRefusal
    kind: enum
    variants: [NotThisPage, TokenMissing, Invalid, ReasonMissing, NothingStaged, NoConfigFile]

  # A refusal of the write: why, what was found, and the problems by YAML path.
  - name: conductor.config.ConfigWriteRefused
    kind: struct
    fields:
      - {name: refusal, type: conductor.config.ConfigWriteRefusal}
      - {name: detail, type: String}
      - {name: problems, type: List<conductor.config.ConfigProblem>}

errors:
  # A command that writes the records refused before it writes anything: the config file names an
  # instance, and `--state-dir` names another directory than that instance's `state`, so the records
  # beside that state would not hold what the store holds (`crates/conductor/src/state.rs`,
  # `refuse_other`). A view, and a command that writes only the store, may take another directory.
  - name: conductor.config.StateDirNotInstance
    summary: >
      `--state-dir` names a directory that is not the state of the instance the config file names,
      and the command writes that instance's records; nothing was written.
    fields:
      - name: state_dir
        type: String
      - name: instance
        type: conductor.config.InstanceName
      - name: state
        type: String

  # The config with the change does not validate, as `conductor config validate` would name it.
  - name: conductor.config.ConfigInvalid
    summary: >
      The config with this change does not validate; nothing was written, committed or
      reconciled, and the problem is named by its YAML path.
    fields:
      - name: path
        type: String

  # An instance is added under a name the config file already holds (`AddInstance`); the whole
  # instance is replaced with `PutInstance`.
  - name: conductor.config.InstanceExists
    summary: >
      The config already names an instance of this name; nothing was written.
    fields:
      - name: name
        type: conductor.config.InstanceName

  # The level and the instance or role a change names do not fit together.
  - name: conductor.config.LevelScopeMismatch
    summary: >
      A `Global` change names no instance and no role, an `Instance` change names an instance and
      no role, a `Role` change names both, and no change is written at `Default`; this one does
      not fit, and nothing was written.
    fields:
      - name: level
        type: conductor.config.Level

entities:
  # One accepted config change (design architecture-next § 4, § 8, § 9): the daemon's own record in
  # the shared store of who changed which key at which level, why, and the commit of the config
  # repository that holds it. `value` absent removes the key at that level, so the level below
  # applies again. `commit` is the config repository's commit, minted when the change is
  # committed. The record outlives the key it names.
  - name: conductor.config.ConfigRevision
    identity:
      name: revision_id
      type: conductor.config.RevisionId
    fields:
      - name: actor
        type: conductor.operator.Actor
      - name: level
        type: conductor.config.Level
      - name: instance
        type: Optional<conductor.config.InstanceName>
      - name: role
        type: Optional<conductor.config.RoleName>
      - name: path
        type: String
      - name: value
        type: Optional<String>
      - name: reason
        type: String
      - name: commit
        type: String
      - name: changed_at
        type: Timestamp
    lifecycle:
      initial: Committed
      states: [Committed]
      terminal: [Committed]

  # One key of an instance's effective config (design architecture-next § 9, § 5.1 `settings`):
  # the instance, the role it holds for (absent for an instance-wide key), its YAML path, its
  # effective value as `config show` writes it, and the level it came from. The daemon derives the
  # rows from the config file at every read; no command of the specification creates one, and a
  # `PutConfig` changes them by changing the file. From `ess/33` this entity may be declared
  # `provided: true`; it is not declared so yet.
  - name: conductor.config.EffectiveSetting
    identity:
      name: setting_key
      type: conductor.config.SettingKey
    fields:
      - name: instance
        type: conductor.config.InstanceName
      - name: role
        type: Optional<conductor.config.RoleName>
      - name: path
        type: String
      - name: value
        type: String
      - name: level
        type: conductor.config.Level
    lifecycle:
      initial: Effective
      states: [Effective]
      terminal: [Effective]

actors:
  # An operator, a person: changes the config at any level (design architecture-next § 9, § 5.3).
  # UNMAPPED: § 3 gives "change settings" as an operator's grant; whether `PutConfig` refuses a
  # human actor without it (and with which error) is the operator unit's grant model and not
  # settled here. Open question.
  - name: conductor.config.Operator
    may:
      - conductor.config.PutConfig
      - conductor.config.AddInstance
      - conductor.config.PutInstance
      - conductor.config.RemoveInstance
    naming:
      display: Operator

  # A consumer control plane, a program: the machine principal `control-plane`
  # (`conductor.operator.ActorKind` `ControlPlane`, `daemon.control_token`). It adds, replaces
  # and removes whole instances and changes no single key.
  - name: conductor.config.ControlPlane
    may:
      - conductor.config.AddInstance
      - conductor.config.PutInstance
      - conductor.config.RemoveInstance
    naming:
      display: Control plane

  # The tuner, an agent: proposes settings and applies one only inside the tuning grant (design
  # architecture-next § 9, § 13 row 7; `conductor.improvement.TuningGrant`).
  - name: conductor.config.Tuner
    may:
      - conductor.config.PutConfig
    naming:
      display: Tuner

commands:
  # `PUT /v1/config` (design architecture-next § 5.2, § 9), and the instance API's `settings` PUT
  # (§ 5.1): one key changed at one level, validated, written to the config file, committed to the
  # config repository with the actor and the reason, recorded as `ConfigChanged` and reconciled
  # (the daemon's next pass, `conductor.instance.Reconcile`). A human actor may change any key; an
  # agent actor only a key the tuning grant names, to a value inside its range
  # (`conductor.improvement.TuningGrant`).
  # UNMAPPED: § 5.2 writes `config` GET/PUT, which may carry the whole file; this command carries
  # one key. Whether a PUT of the whole file is one revision or one per changed key is not
  # settled. Open question.
  # UNMAPPED: what happens when the commit to the config repository fails (the file written and
  # not committed, or nothing written) is not settled. Open question.
  - name: conductor.config.PutConfig
    naming:
      wire: put-config
      display: Change the config
    input:
      - name: actor
        type: conductor.operator.Actor
      - name: level
        type: conductor.config.Level
      - name: instance
        type: Optional<conductor.config.InstanceName>
      - name: role
        type: Optional<conductor.config.RoleName>
      - name: path
        type: String
        example: "thresholds.silent_session"
      - name: value
        type: Optional<String>
      - name: reason
        type: String
        example: "silence alarms fire on long gates"
      - name: changed_at
        type: Timestamp
        example: "2026-11-08T09:00:00Z"
    outcomes:
      - name: level-scope-mismatch
        when:
          any:
            - level == Default
            - all: [level == Global, defined(instance)]
            - all: [level == Global, defined(role)]
            - all: [level == Instance, not defined(instance)]
            - all: [level == Instance, defined(role)]
            - all: [level == Role, not defined(instance)]
            - all: [level == Role, not defined(role)]
        error: conductor.config.LevelScopeMismatch
        payload:
          conductor.config.LevelScopeMismatch:
            level: input.level
        summary: The level and the instance or role named do not fit; nothing was written.
      - name: actor-not-human
        when: actor.kind != Human
        external: the change lies outside the tuning grant
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: >
          An agent's change of a key the tuning grant does not name, or to a value outside its
          range, is refused; nothing was written.
      - name: invalid
        external: the config with the change does not validate
        error: conductor.config.ConfigInvalid
        payload:
          conductor.config.ConfigInvalid:
            path: input.path
        summary: The changed config does not validate; nothing was written.
      - name: changed
        creates: conductor.config.ConfigRevision
        instance: revision_id
        sets:
          actor: input.actor
          level: input.level
          instance: input.instance
          role: input.role
          path: input.path
          value: input.value
          reason: input.reason
          commit: {generated: true}
          changed_at: input.changed_at
        emits:
          - conductor.config.ConfigChanged
        payload:
          conductor.config.ConfigChanged:
            revision_id: {generated: true}
            actor: input.actor
            level: input.level
            instance_name: input.instance
            role: input.role
            path: input.path
            value: input.value
            reason: input.reason
        summary: >
          The key is written at its level and committed with the actor and the reason; the daemon
          reconciles the instances the change touches.

  # `POST /v1/instances` (design: instance pods, the instance API): one whole instance added to
  # the config file's `instances`, after the last one. `mapping` is the instance as the file
  # writes it, YAML text (JSON is YAML too), every key an `instances[]` entry takes; it may leave
  # out `name`, which is `name`, and one that writes another name is invalid by its path `name`.
  # The config with the instance added is validated as `conductor config validate` validates it,
  # written by a rename beside the file, committed with the actor and the reason where the file
  # lies in a git checkout, recorded as one `ConfigRevision` at the level `Instance` with the path
  # `.` and the mapping as its value, and reconciled: the daemon starts the new instance's
  # runtime. A person or the machine principal `control-plane` adds one; every other actor is
  # refused by name. Adding, replacing and removing are three commands because each HTTP route
  # binds one operation (`ess-http/1`, ESS-HTTP-005).
  # Where `daemon.kubernetes` is set the instance runs as a pod, and a mapping cannot shape it
  # (`conductor.config.Kubernetes`). Then, besides every rule of `config validate`, these are
  # `invalid`, each naming its YAML path: a `name` that is no `KubernetesName` of at most 39
  # characters (`name`); a path (`checkouts.root`, `checkouts.trees`, `records`, `state`,
  # `cache`) that lies outside the instance's data mount, the volume claim's mount in the pod. A
  # path the mapping leaves out the daemon fills in under the data mount. A `secret:<name>` the
  # mapping writes resolves against the daemon's secrets source only.
  - name: conductor.config.AddInstance
    naming:
      wire: add-instance
      display: Add an instance
    input:
      - name: actor
        type: conductor.operator.Actor
      - name: name
        type: conductor.config.InstanceName
        example: "example-org-two"
      - name: mapping
        type: String
        example: "{sources: [{github: example-org}], checkouts: {root: /srv/example-org, trees: /srv/trees}}"
      - name: reason
        type: String
        example: "a new tenant"
      - name: changed_at
        type: Timestamp
        example: "2026-11-12T09:00:00Z"
    outcomes:
      - name: actor-not-human
        when:
          all:
            - actor.kind != Human
            - actor.kind != ControlPlane
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: Only a person or the control plane adds an instance; an agent or the daemon is refused by name and nothing was written.
      - name: exists
        external: the config already names an instance of this name
        error: conductor.config.InstanceExists
        payload:
          conductor.config.InstanceExists:
            name: input.name
        summary: The config holds an instance of this name; nothing was written.
      - name: invalid
        external: the config with the instance added does not validate
        error: conductor.config.ConfigInvalid
        payload:
          conductor.config.ConfigInvalid:
            path: {generated: true}
        summary: The config with the instance added does not validate, the problem named by its YAML path; nothing was written.
      - name: changed
        creates: conductor.config.ConfigRevision
        instance: revision_id
        sets:
          actor: input.actor
          level: Instance
          instance: input.name
          role: {cleared: true}
          path: "."
          value: input.mapping
          reason: input.reason
          commit: {generated: true}
          changed_at: input.changed_at
        emits:
          - conductor.config.InstanceAdded
        payload:
          conductor.config.InstanceAdded:
            revision_id: {generated: true}
            actor: input.actor
            name: input.name
            mapping: input.mapping
            reason: input.reason
        summary: >
          The instance is written into the config file and committed with the actor and the
          reason; the daemon starts its runtime.

  # `PUT /v1/instances/{name}`: one whole instance of the config file replaced by `mapping`, in
  # its place, as `AddInstance` writes one; the instance keeps its name. Recorded as one
  # `ConfigRevision` at the level `Instance` with the path `.` and the mapping as its value, and
  # reconciled: the daemon restarts the runtime where the change touches it. To change one key,
  # `PutConfig` at the level `Instance`. A person or the machine principal `control-plane`
  # replaces one; every other actor is refused by name. A mapping of a pod-run instance is
  # `invalid` by the same rules as in `AddInstance`, each naming its YAML path.
  - name: conductor.config.PutInstance
    naming:
      wire: put-instance
      display: Replace an instance
    input:
      - name: actor
        type: conductor.operator.Actor
      - name: name
        type: conductor.config.InstanceName
        example: "example-org"
      - name: mapping
        type: String
        example: "{sources: [{github: example-org}], checkouts: {root: /srv/example-org, trees: /srv/trees}}"
      - name: reason
        type: String
        example: "read the forge, not a directory"
      - name: changed_at
        type: Timestamp
        example: "2026-11-12T11:00:00Z"
    outcomes:
      - name: actor-not-human
        when:
          all:
            - actor.kind != Human
            - actor.kind != ControlPlane
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: Only a person or the control plane replaces an instance; an agent or the daemon is refused by name and nothing was written.
      - name: unknown
        external: the config names no instance of this name
        error: conductor.instance.UnknownInstance
        payload:
          conductor.instance.UnknownInstance:
            name: input.name
        summary: The config names no instance of this name; nothing was written.
      - name: invalid
        external: the config with the instance replaced does not validate
        error: conductor.config.ConfigInvalid
        payload:
          conductor.config.ConfigInvalid:
            path: {generated: true}
        summary: The config with the instance replaced does not validate, the problem named by its YAML path; nothing was written.
      - name: changed
        creates: conductor.config.ConfigRevision
        instance: revision_id
        sets:
          actor: input.actor
          level: Instance
          instance: input.name
          role: {cleared: true}
          path: "."
          value: input.mapping
          reason: input.reason
          commit: {generated: true}
          changed_at: input.changed_at
        emits:
          - conductor.config.InstanceReplaced
        payload:
          conductor.config.InstanceReplaced:
            revision_id: {generated: true}
            actor: input.actor
            name: input.name
            mapping: input.mapping
            reason: input.reason
        summary: >
          The instance's mapping is replaced in the config file and committed with the actor and
          the reason; the daemon reconciles it.

  # `DELETE /v1/instances/{name}`: one instance removed from the config file's `instances`, which
  # retires it: the daemon stops its runtime (for a pod-run instance, deletes its pod and its
  # Secret and keeps its volume claim) and keeps its records. Recorded as one `ConfigRevision` at
  # the level `Instance` with the path `.` and no value; the row leaves `GET /v1/instances` once
  # the daemon reconciled. The file may be left with no instance only where `daemon.kubernetes`
  # is set; elsewhere the removal of the last one, or of the one `default` names, is invalid by
  # that path. A person or the machine principal `control-plane` removes one; every other actor
  # is refused by name. The data is deleted only by `conductor.instance.PurgeInstance`.
  - name: conductor.config.RemoveInstance
    naming:
      wire: remove-instance
      display: Remove an instance
    input:
      - name: actor
        type: conductor.operator.Actor
      - name: name
        type: conductor.config.InstanceName
        example: "example-org"
      - name: reason
        type: String
        example: "the tenant left"
      - name: changed_at
        type: Timestamp
        example: "2026-11-12T13:00:00Z"
    outcomes:
      - name: actor-not-human
        when:
          all:
            - actor.kind != Human
            - actor.kind != ControlPlane
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: Only a person or the control plane removes an instance; an agent or the daemon is refused by name and nothing was written.
      - name: unknown
        external: the config names no instance of this name
        error: conductor.instance.UnknownInstance
        payload:
          conductor.instance.UnknownInstance:
            name: input.name
        summary: The config names no instance of this name; nothing was written.
      - name: invalid
        external: the config without the instance does not validate
        error: conductor.config.ConfigInvalid
        payload:
          conductor.config.ConfigInvalid:
            path: {generated: true}
        summary: The config without the instance does not validate, the problem named by its YAML path; nothing was written.
      - name: changed
        creates: conductor.config.ConfigRevision
        instance: revision_id
        sets:
          actor: input.actor
          level: Instance
          instance: input.name
          role: {cleared: true}
          path: "."
          value: {cleared: true}
          reason: input.reason
          commit: {generated: true}
          changed_at: input.changed_at
        emits:
          - conductor.config.InstanceRemoved
        payload:
          conductor.config.InstanceRemoved:
            revision_id: {generated: true}
            actor: input.actor
            name: input.name
            reason: input.reason
        summary: >
          The instance is removed from the config file and the removal committed with the actor
          and the reason; the daemon stops its runtime and keeps its data.

events:
  # The instance is `instance_name` here, not `instance`: ess 0.90.0's caller-swapped rerun
  # (`rename` in ess-conformance `synthesize/caller.rs`) suffixes every JSON string under a key
  # named `instance` in the steps it appends, an expected event payload's own field included,
  # while the command input's literal keeps its value, so the synthesized payload check fails.
  # UNMAPPED: no ess issue is filed for it yet; once ess fixes it the field is `instance` again.
  - name: conductor.config.ConfigChanged
    fields:
      - name: revision_id
        type: conductor.config.RevisionId
      - name: actor
        type: conductor.operator.Actor
      - name: level
        type: conductor.config.Level
      - name: instance_name
        type: Optional<conductor.config.InstanceName>
      - name: role
        type: Optional<conductor.config.RoleName>
      - name: path
        type: String
      - name: value
        type: Optional<String>
      - name: reason
        type: String

  # An instance added to the config file (`AddInstance`), with its mapping as the request wrote
  # it.
  - name: conductor.config.InstanceAdded
    fields:
      - {name: revision_id, type: conductor.config.RevisionId}
      - {name: actor, type: conductor.operator.Actor}
      - {name: name, type: conductor.config.InstanceName}
      - {name: mapping, type: String}
      - {name: reason, type: String}

  # An instance of the config file replaced whole (`PutInstance`), with its new mapping.
  - name: conductor.config.InstanceReplaced
    fields:
      - {name: revision_id, type: conductor.config.RevisionId}
      - {name: actor, type: conductor.operator.Actor}
      - {name: name, type: conductor.config.InstanceName}
      - {name: mapping, type: String}
      - {name: reason, type: String}

  # An instance removed from the config file (`RemoveInstance`), which retires it.
  - name: conductor.config.InstanceRemoved
    fields:
      - {name: revision_id, type: conductor.config.RevisionId}
      - {name: actor, type: conductor.operator.Actor}
      - {name: name, type: conductor.config.InstanceName}
      - {name: reason, type: String}

views:
  # Every accepted config change, with who made it and why (design architecture-next § 5.2, the
  # daemon's records).
  - name: conductor.config.ConfigRevisions
    source: conductor.config.ConfigRevision
    consistency: read_your_writes
    fields:
      - name: revision_id
        type: conductor.config.RevisionId
      - name: state
        type: conductor.config.ConfigRevision.State
      - name: actor
        type: conductor.operator.Actor
      - name: level
        type: conductor.config.Level
      - name: instance
        type: Optional<conductor.config.InstanceName>
      - name: role
        type: Optional<conductor.config.RoleName>
      - name: path
        type: String
      - name: value
        type: Optional<String>
      - name: reason
        type: String
      - name: commit
        type: String
      - name: changed_at
        type: Timestamp
    naming:
      wire: config-revisions
      display: Config changes

  # Every key of one instance's effective config with its value and the level it came from, for
  # the instance and for each of its roles (design architecture-next § 9, `config show --effective
  # --instance <i>`; § 5.1 `settings` GET).
  - name: conductor.config.EffectiveSettings
    source: conductor.config.EffectiveSetting
    consistency: eventual
    params:
      - name: instance
        type: conductor.config.InstanceName
    filter: instance == param.instance
    fields:
      - name: setting_key
        type: conductor.config.SettingKey
      - name: state
        type: conductor.config.EffectiveSetting.State
      - name: instance
        type: conductor.config.InstanceName
      - name: role
        type: Optional<conductor.config.RoleName>
      - name: path
        type: String
      - name: value
        type: String
      - name: level
        type: conductor.config.Level
    naming:
      wire: effective-settings
      display: Effective settings
