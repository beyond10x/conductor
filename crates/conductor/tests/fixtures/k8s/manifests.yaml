apiVersion: v1
kind: Namespace
metadata:
  name: conductor
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: conductor-instances
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conductor
  namespace: conductor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conductor-instances
  namespace: conductor-instances
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conductor-instances
  namespace: conductor-instances
subjects:
  - kind: ServiceAccount
    name: conductor
    namespace: conductor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: conductor-instances
---
apiVersion: v1
kind: Secret
metadata:
  name: conductor-secrets
  namespace: conductor
stringData:
  control-token: <a long random value>
  model-token: <the model token>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: conductor-daemon-config
  namespace: conductor
data:
  daemon.yaml: |
    version: conductor.config/2
    daemon:
      address: 0.0.0.0
      port: 7300
      store: sqlite:/var/lib/conductor/data/conductor.sqlite
      secrets: {source: files, dir: /run/secrets/conductor}
      control_token: secret:control-token
      kubernetes:
        namespace: conductor-instances
        image: registry.example.com/conductor:<tag>
        owner: example-org
        api_port: 7301
        volume: {size: 10G}
---
apiVersion: v1
kind: Service
metadata:
  name: conductor
  namespace: conductor
spec:
  selector:
    app.kubernetes.io/name: conductord
  ports:
    - {name: http, port: 7300, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conductor
  namespace: conductor
spec:
  serviceName: conductor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conductord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conductord
    spec:
      serviceAccountName: conductor
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: conductor
          image: registry.example.com/conductor:<tag>
          command: [conductor, daemon, serve, --daemon-config, /config/daemon.yaml]
          env:
            - {name: CONDUCTOR_CONFIG, value: /var/lib/conductor/data/config/conductor.yaml}
          ports:
            - {name: http, containerPort: 7300}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/conductor/data}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /run/secrets/conductor, readOnly: true}
      volumes:
        - name: config
          configMap: {name: conductor-daemon-config}
        - name: secrets
          secret: {secretName: conductor-secrets}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: conductor-instances
  namespace: conductor-instances
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: conductord
      app.kubernetes.io/component: instance-runtime
      conductor/daemon: example-org
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conductor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: conductord
      ports:
        - {port: 7301, protocol: TCP}
