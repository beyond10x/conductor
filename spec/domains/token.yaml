domain: conductor.token

summary: >
  The token pool of a host (design docs/design/architecture-next.md § 5.3, decisions 10 and 11;
  story:host-token-pool): conductord's store holds one pool per host, shared by every instance it
  runs. An engineer who joins contributes their Claude token to it; the pool is a set of secrets,
  each with its owner, its seat and its state (`ok`, or `limited until <time>`); values never
  leave the secrets source but for the one start that leases them. The `claude-code` kind of any
  instance on the host leases a token per agent start (a token serves any number of agents at
  once, one lease each), resumes an agent on another token after a usage-limit stop, and names
  the token's owner on every agent record. A controller started for Remote Control on a named
  owner's token appears in that owner's Claude app.

naming:
  wire: token
  display: Token

types:
  - name: conductor.token.TokenState
    kind: enum
    variants: [Ok, Limited]

  # A token's id in its pool, minted when the token is contributed.
  - name: conductor.token.TokenId
    kind: newtype
    of: Uuid

  # A lease's id, minted when an agent start leases a token (story:host-token-pool).
  - name: conductor.token.TokenLeaseId
    kind: newtype
    of: Uuid

  # The seat a token belongs to: the Claude login whose usage it draws on (§ 5.3, "usage is
  # attributable per seat").
  - name: conductor.token.Seat
    kind: newtype
    of: String

  # The input of `conductor join` (story:token-pool), the binding's `join` callable: `seat` the
  # Claude login the token draws on (absent, the operator's name). The token joins the host's pool
  # (story:host-token-pool); `instance`, when given, also records the caller as an operator of
  # that instance with the grants `daemon.operators` gives them (`JoinInstance`); absent, no
  # operator record is written. The token's value is read from standard input, never from a
  # flag, the environment or the config. The daemon is the one the global `--daemon` or
  # `CONDUCTOR_DAEMON` names (story:daemon-remote), as for every command with a route on its
  # global API; it is no field of the input. `kind` the kind of the token
  # (story:pool-token-kind-files-source): absent, `SubscriptionToken`, the long-lived token of a
  # subscription login; `ApiKey`, an API key.
  - name: conductor.token.JoinDaemon
    kind: struct
    fields:
      - {name: instance, type: Optional<conductor.config.InstanceName>}
      - {name: seat, type: Optional<conductor.token.Seat>}
      - {name: kind, type: Optional<conductor.config.ModelTokenKind>}

  # The input of `conductor leave`: every token the caller contributed to the host's pool is
  # withdrawn; `instance`, when given, also ends the caller's operator record of that instance
  # (`LeaveInstance`). On the daemon `--daemon` names.
  - name: conductor.token.LeaveDaemon
    kind: struct
    fields:
      - {name: instance, type: Optional<conductor.config.InstanceName>}

  # The input of `conductor token reveal`: the `model_token` of that instance of the config file,
  # the token an agent at a placement with no box runs on when the pool leases it none and the
  # config file says `daemon.unattended` (story:container-start-without-prompt); an instance whose
  # placement opens a box is refused and nothing of its token is printed. A pool token is never
  # revealed (story:host-token-pool): its value reaches the harness once, in its process's
  # environment at its start, and no command prints it.
  - name: conductor.token.RevealToken
    kind: struct
    fields:
      - {name: model_token, type: conductor.config.InstanceName}

entities:
  # One contributed token of the host's pool (§ 5.3, story:host-token-pool): its owner (the
  # operator who contributed it), its seat, the secret that holds its value (the name only; the
  # value never leaves the secrets source but for the start that leases it), its usage state
  # (`Ok`, or `Limited` until `limited_until`), and when it was contributed; and its kind
  # (story:pool-token-kind-files-source): `SubscriptionToken` reaches the harness as
  # `CLAUDE_CODE_OAUTH_TOKEN` of its process's environment and its settings name no
  # `apiKeyHelper`, `ApiKey` through the settings' `apiKeyHelper`. A token recorded before the kind
  # existed has none and is an `ApiKey`, the route every pool token took then. A token names no
  # instance: every instance on the host leases from the one pool, and each lease is a
  # `TokenLease` of its own, so a token serves several agents at once.
  #
  # Lifecycle: `Available` once contributed, whatever its leases; `Limited` once an agent on it
  # stopped at a usage limit, until `limited_until`; `Available` again once restored (a lease of
  # a Limited token whose time is past, or with the account's headroom back, restores it first);
  # `Withdrawn` once its owner withdrew it (`conductor leave`).
  #
  # UNMAPPED: `owner` names a `conductor.operator.Operator`, keyed by `OperatorKey {operator,
  # instance}`; a `references` relation via `owner` (an `OperatorName`) is refused by ess 0.90,
  # which wants the field typed `OperatorKey` (type_mismatch, ESS-ENTITY-002). Open question for
  # the owner: retype `owner` to the key, or keep the name unrelated.
  - name: conductor.token.PoolToken
    identity:
      name: token_id
      type: conductor.token.TokenId
    fields:
      - name: owner
        type: conductor.operator.OperatorName
      - name: seat
        type: conductor.token.Seat
      - name: secret
        type: conductor.secret.SecretName
      - name: token_state
        type: conductor.token.TokenState
      - name: limited_until
        type: Optional<Timestamp>
      - name: contributed_at
        type: Timestamp
      # Who created or last moved the record (architecture-next § 3 "Actors": every record
      # carries its actor).
      - name: actor
        type: conductor.operator.Actor
      - name: kind
        type: Optional<conductor.config.ModelTokenKind>
    relations:
      - name: secret
        kind: references
        target: conductor.secret.Secret
        cardinality: one
        via: secret
      - name: leases
        kind: owns
        target: conductor.token.TokenLease
        cardinality: many
        via: token_id
    lifecycle:
      initial: Available
      states: [Available, Limited, Withdrawn]
      terminal: [Withdrawn]
      transitions:
        - name: limit
          from: [Available, Limited]
          to: Limited
        - name: restore
          from: [Limited]
          to: Available
        - name: withdraw
          from: [Available, Limited]
          to: Withdrawn

  # One agent start's lease of a token of the host's pool (story:host-token-pool): the token, the
  # agent that runs on it, the instance that agent belongs to (an agent holds at most one held
  # lease per instance: `(instance, agent)` finds it, and a runtime acts only on its own
  # instance's leases, the instance conductord admitted it as, never one its request names), the token's owner (whom the agent's
  # record names), the owner the start asked for, if any, when it was leased and when released.
  # `Held` while the agent runs; `Released` once it stopped, at a usage limit or not, or once its
  # token was withdrawn.
  - name: conductor.token.TokenLease
    identity:
      name: lease_id
      type: conductor.token.TokenLeaseId
    fields:
      - name: token_id
        type: conductor.token.TokenId
      - name: agent
        type: conductor.agent.AgentName
      - name: instance
        type: conductor.config.InstanceName
      - name: owner
        type: conductor.operator.OperatorName
      - name: preferred_owner
        type: Optional<conductor.operator.OperatorName>
      - name: leased_at
        type: Timestamp
      - name: released_at
        type: Optional<Timestamp>
      - name: actor
        type: conductor.operator.Actor
      # The runtime start that leased it: a tag the daemon derives from the token it minted for
      # that start, so the leases of a start that ended are released (reaped) once the instance
      # runs on another start or not at all; absent for a start outside a runtime.
      - name: runtime
        type: Optional<String>
    relations:
      - name: agent
        kind: references
        target: conductor.agent.Agent
        cardinality: one
        via: agent
      - name: instance
        kind: references
        target: conductor.instance.Instance
        cardinality: one
        via: instance
    lifecycle:
      initial: Held
      states: [Held, Released]
      terminal: [Released]
      transitions:
        - name: release
          from: [Held]
          to: Released

actors:
  # An operator contributes a token when joining and withdraws it when leaving (`conductor
  # join`, `conductor leave`, § 5.3).
  - name: conductor.token.Operator
    may:
      - conductor.token.ContributeToken
      - conductor.token.WithdrawToken
    naming:
      display: Operator

  # The instance runtime starts the instance's agents; its `claude-code` kind leases a token per
  # agent start, releases the lease when the agent stops, marks the token limited on a usage-limit
  # stop and restores a Limited token it leases again (§ 5.3, § 7). A runtime in a box reaches
  # these commands through conductord, over the connection it dials in (story:host-token-pool).
  # UNMAPPED: the instance runtime, a program but no agent, issues these commands. Which
  # actor they carry (the agent the token serves, as the scenarios write it; `{kind: Daemon}`, the
  # runtime on its own account; or the person or agent that asked for the agent start) is said
  # nowhere. Open question for the owner.
  - name: conductor.token.InstanceRuntime
    may:
      - conductor.token.LeaseToken
      - conductor.token.ReleaseToken
      - conductor.token.MarkTokenLimited
      - conductor.token.RestoreToken
    naming:
      display: Instance runtime

errors:

  - name: conductor.token.TokenStateConflict
    summary: >
      The token is not in a state the command acts from (a lease of a token that is withdrawn or
      not in the pool, a limit of one that is withdrawn, a restore of one that is not Limited, a
      withdrawal of one already withdrawn); nothing changed.
    fields:
      - name: token_id
        type: conductor.token.TokenId

  # story:host-token-pool: a release of a lease already released.
  - name: conductor.token.LeaseStateConflict
    summary: >
      The lease was released already, so there is nothing to release; nothing changed.
    fields:
      - name: lease_id
        type: conductor.token.TokenLeaseId

  # story:host-token-pool: the pool is the host's, so the refusal names the host's pool; the
  # instance is the one whose agent start found no token.
  - name: conductor.token.NoTokenAvailable
    summary: >
      No token of the host's pool has headroom (every one is limited or withdrawn, or the owner
      the start asked for has none), so the agent of the instance does not start on one; nothing
      changed.
    fields:
      - name: instance
        type: conductor.config.InstanceName

  # story:token-pool, decision K5: only a token's owner withdraws it.
  - name: conductor.token.NotTokenOwner
    summary: >
      The person who asked is not the token's owner, and only the owner withdraws a token;
      nothing changed.
    fields:
      - name: token_id
        type: conductor.token.TokenId
commands:
  # `conductor join <daemon url>` contributes the joining engineer's Claude token to the host's
  # pool (§ 5.3, story:host-token-pool): the token's value is already in the daemon's secrets
  # source under `secret`; the pool records its owner, seat, kind and state, never the value.
  # Under the `files` source (story:pool-token-kind-files-source) the value is the file of that
  # name in `daemon.secrets.dir`, owner-only, which `conductor join` writes and `conductor leave`
  # removes: the one file conductor writes there.
  - name: conductor.token.ContributeToken
    naming:
      wire: contribute-token
      display: Contribute a token to the pool
    input:
      - {name: actor, type: conductor.operator.Actor}
      - {name: owner, type: conductor.operator.OperatorName}
      - {name: seat, type: conductor.token.Seat}
      - {name: secret, type: conductor.secret.SecretName}
      - {name: kind, type: conductor.config.ModelTokenKind}
      - {name: contributed_at, type: Timestamp}
    outcomes:
      - name: actor-not-human
        when: actor.kind != Human
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: An agent tried to contribute a token; only a person contributes one, and nothing was written.
      - name: contributed
        creates: conductor.token.PoolToken
        instance: token_id
        sets:
          owner: input.owner
          seat: input.seat
          secret: input.secret
          token_state: Ok
          limited_until: {cleared: true}
          contributed_at: input.contributed_at
          actor: input.actor
          kind: input.kind
        emits:
          - conductor.token.TokenContributed
        payload:
          conductor.token.TokenContributed:
            actor: input.actor
            token_id: {generated: true}
            owner: input.owner
            seat: input.seat
            secret: input.secret
            kind: input.kind
            contributed_at: input.contributed_at
        summary: The token is in the host's pool, Available and Ok, with its owner, seat and kind.

  # `conductor leave` withdraws the token (§ 5.3). Each lease held on it is released by the
  # implementation (`ReleaseToken`), and the agent on it resumed on another token; that
  # resumption is the agent domain's reaction, not an outcome here.
  # Only the token's owner withdraws it (story:token-pool, decision K5). The comparison of
  # `actor.operator` with the token's `owner` is the implementation's (`not-owner`, external):
  # a `when_subject` guard on an Optional member of the actor is not one ess 0.90 compares.
  - name: conductor.token.WithdrawToken
    naming:
      wire: withdraw-token
      display: Withdraw a token from the pool
    input:
      - {name: actor, type: conductor.operator.Actor}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: withdrawn_at, type: Timestamp}
    outcomes:
      - name: actor-not-human
        when: actor.kind != Human
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: An agent tried to withdraw a token; only a person withdraws one, and the token is unchanged.
      - name: not-owner
        external: the person who asked is not the token's owner
        error: conductor.token.NotTokenOwner
        payload:
          conductor.token.NotTokenOwner:
            token_id: input.token_id
        summary: Someone other than the token's owner asked to withdraw it; the token is unchanged.
      - name: withdrawn
        moves: conductor.token.PoolToken.withdraw
        instance: token_id
        sets:
          actor: input.actor
        emits:
          - conductor.token.TokenWithdrawn
        payload:
          conductor.token.TokenWithdrawn:
            actor: input.actor
            token_id: input.token_id
            owner: {subject: owner}
            withdrawn_at: input.withdrawn_at
        summary: The token is out of the pool; the agents on its leases are resumed on another token.
      - name: wrong-state
        wrong_state: true
        error: conductor.token.TokenStateConflict
        payload:
          conductor.token.TokenStateConflict:
            token_id: input.token_id
        summary: The token was withdrawn already, and nothing changed.

  # The `claude-code` kind of any instance on the host leases one token per agent start (§ 5.3,
  # § 7, story:host-token-pool): a lease of its own (`TokenLease`), so a token serves any number
  # of agents at once. Which token, is the implementation's choice: the runtime picks it and
  # names it in `token_id`, with its owner in `owner`; `preferred_owner` is the owner the agent
  # was asked for by (or the named owner of `roles.controller.token_owner`, § 17), absent
  # otherwise. When the pick finds no token with headroom in the host's pool the runtime answers
  # `none-available` before any token is read; a token named that is not in the pool, or is
  # withdrawn, is a state conflict.
  # The pick (class C decision of story:host-token-pool) takes a token with headroom (`Available`,
  # or `Limited` with `limited_until` past) with the fewest live (`Held`) leases, ties broken by
  # `token_id`. Decision (operator, 2026-11-18): a token never holds more live leases than its
  # kind's cap, `daemon.subscription_token_sessions` (absent 4) or `daemon.api_key_sessions`
  # (absent 0, no cap); with every token at its cap the start is refused `none-available`, as
  # with an empty pool; the ordering is the implementation's and no outcome checks it. With the account's
  # headroom back (today's `auto-resume`) a Limited token is taken last, the earliest
  # `limited_until` first. A Limited token is restored (`RestoreToken`) before it is leased.
  # A lease for a named owner (`preferred_owner`, or § 17's Remote Control controller on
  # `roles.controller.token_owner`) whose tokens have none with headroom is refused
  # `none-available` (decision K4): no other owner's token is taken.
  - name: conductor.token.LeaseToken
    naming:
      wire: lease-token
      display: Lease a token for an agent start
    input:
      - {name: actor, type: conductor.operator.Actor}
      - {name: instance, type: conductor.config.InstanceName}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: owner, type: conductor.operator.OperatorName}
      - {name: agent, type: conductor.agent.AgentName}
      - {name: preferred_owner, type: Optional<conductor.operator.OperatorName>}
      - {name: runtime, type: Optional<String>}
      - {name: leased_at, type: Timestamp}
    outcomes:
      - name: none-available
        external: the runtime's pick found no token with headroom in the host's pool
        before_row: true
        error: conductor.token.NoTokenAvailable
        payload:
          conductor.token.NoTokenAvailable:
            instance: input.instance
        summary: The host's pool holds no token with headroom, so the agent does not start on one; nothing changed.
      - name: unknown-token
        when_related: {via: input.token_id, exists: false}
        error: conductor.token.TokenStateConflict
        payload:
          conductor.token.TokenStateConflict:
            token_id: input.token_id
        summary: The token named is not in the pool; nothing changed.
      - name: token-withdrawn
        when_related: {via: input.token_id, predicate: {state: [Withdrawn]}}
        error: conductor.token.TokenStateConflict
        payload:
          conductor.token.TokenStateConflict:
            token_id: input.token_id
        summary: The token named is withdrawn; nothing changed.
      - name: leased
        creates: conductor.token.TokenLease
        instance: lease_id
        sets:
          token_id: input.token_id
          agent: input.agent
          instance: input.instance
          owner: input.owner
          preferred_owner: input.preferred_owner
          runtime: input.runtime
          leased_at: input.leased_at
          released_at: {cleared: true}
          actor: input.actor
        emits:
          - conductor.token.TokenLeased
        payload:
          conductor.token.TokenLeased:
            actor: input.actor
            lease_id: {generated: true}
            token_id: input.token_id
            instance: input.instance
            owner: input.owner
            agent: input.agent
            preferred_owner: input.preferred_owner
            leased_at: input.leased_at
        summary: The agent runs on the token under a lease of its own; the event names the token's owner, so the agent's record names them.

  # The agent on a lease stopped, at a usage limit or not, or its token was withdrawn: the lease
  # is released. The token's own state does not move.
  - name: conductor.token.ReleaseToken
    naming:
      wire: release-token
      display: Release a token's lease
    input:
      - {name: actor, type: conductor.operator.Actor}
      - {name: lease_id, type: conductor.token.TokenLeaseId}
      - {name: released_at, type: Timestamp}
    outcomes:
      - name: released
        moves: conductor.token.TokenLease.release
        instance: lease_id
        sets:
          released_at: input.released_at
          actor: input.actor
        emits:
          - conductor.token.TokenReleased
        payload:
          conductor.token.TokenReleased:
            actor: input.actor
            lease_id: input.lease_id
            token_id: {subject: token_id}
            agent: {subject: agent}
            released_at: input.released_at
        summary: The lease is released; its token serves its other leases and new ones as before.
      - name: wrong-state
        wrong_state: true
        error: conductor.token.LeaseStateConflict
        payload:
          conductor.token.LeaseStateConflict:
            lease_id: input.lease_id
        summary: The lease was released already, so there is nothing to release; nothing changed.

  # An agent on the token stopped at a usage limit (§ 5.3): the token is Limited until
  # `limited_until`, and the event names the agent, so it is resumed on another token (today's
  # `auto-resume`, over the pool); that resumption is the agent domain's reaction. The runtime
  # releases the agent's lease beside it (`ReleaseToken`). A token Limited already is limited
  # again, until the later time given.
  - name: conductor.token.MarkTokenLimited
    naming:
      wire: mark-token-limited
      display: Mark a token limited
    input:
      - {name: actor, type: conductor.operator.Actor}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: agent, type: Optional<conductor.agent.AgentName>}
      - {name: limited_until, type: Timestamp}
      - {name: limited_at, type: Timestamp}
    outcomes:
      - name: limited
        moves: conductor.token.PoolToken.limit
        instance: token_id
        sets:
          token_state: Limited
          limited_until: input.limited_until
          actor: input.actor
        emits:
          - conductor.token.TokenLimited
        payload:
          conductor.token.TokenLimited:
            actor: input.actor
            token_id: input.token_id
            owner: {subject: owner}
            agent: input.agent
            limited_until: input.limited_until
            limited_at: input.limited_at
        summary: The token is Limited until the time given; the agent that hit the limit is named to be resumed on another.
      - name: wrong-state
        wrong_state: true
        error: conductor.token.TokenStateConflict
        payload:
          conductor.token.TokenStateConflict:
            token_id: input.token_id
        summary: The token is withdrawn, so no agent on it hit a limit; nothing changed.

  # A Limited token is leased again (story:token-pool): once its `limited_until` is past, or,
  # with the account's headroom back (today's `auto-resume`). The runtime restores it before the
  # lease: `Ok` again, `limited_until` cleared.
  - name: conductor.token.RestoreToken
    naming:
      wire: restore-token
      display: Restore a limited token
    input:
      - {name: actor, type: conductor.operator.Actor}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: restored_at, type: Timestamp}
    outcomes:
      - name: restored
        moves: conductor.token.PoolToken.restore
        instance: token_id
        sets:
          token_state: Ok
          limited_until: {cleared: true}
          actor: input.actor
        emits:
          - conductor.token.TokenRestored
        payload:
          conductor.token.TokenRestored:
            actor: input.actor
            token_id: input.token_id
            restored_at: input.restored_at
        summary: The token is Available and Ok again.
      - name: wrong-state
        wrong_state: true
        error: conductor.token.TokenStateConflict
        payload:
          conductor.token.TokenStateConflict:
            token_id: input.token_id
        summary: The token is not Limited; nothing changed.

events:
  - name: conductor.token.TokenContributed
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: owner, type: conductor.operator.OperatorName}
      - {name: seat, type: conductor.token.Seat}
      - {name: secret, type: conductor.secret.SecretName}
      - {name: kind, type: conductor.config.ModelTokenKind}
      - {name: contributed_at, type: Timestamp}

  - name: conductor.token.TokenWithdrawn
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: owner, type: conductor.operator.OperatorName}
      - {name: withdrawn_at, type: Timestamp}

  - name: conductor.token.TokenLeased
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - {name: lease_id, type: conductor.token.TokenLeaseId}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: instance, type: conductor.config.InstanceName}
      - {name: owner, type: conductor.operator.OperatorName}
      - {name: agent, type: conductor.agent.AgentName}
      - {name: preferred_owner, type: Optional<conductor.operator.OperatorName>}
      - {name: leased_at, type: Timestamp}

  - name: conductor.token.TokenReleased
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - {name: lease_id, type: conductor.token.TokenLeaseId}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: agent, type: conductor.agent.AgentName}
      - {name: released_at, type: Timestamp}

  - name: conductor.token.TokenLimited
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: owner, type: conductor.operator.OperatorName}
      - {name: agent, type: Optional<conductor.agent.AgentName>}
      - {name: limited_until, type: Timestamp}
      - {name: limited_at, type: Timestamp}

  - name: conductor.token.TokenRestored
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - {name: token_id, type: conductor.token.TokenId}
      - {name: restored_at, type: Timestamp}

views:
  # `GET /v1/tokens` (§ 5.3, story:host-token-pool): owners, seats, states and kinds of the
  # host's pool; never a value, nor the name of the secret that holds it. The daemon also
  # answers it at `GET /v1/instances/{name}/tokens`, the pool every instance leases from.
  - name: conductor.token.Tokens
    source: conductor.token.PoolToken
    consistency: read_your_writes
    fields:
      - name: token_id
        type: conductor.token.TokenId
      - name: state
        type: conductor.token.PoolToken.State
      - name: owner
        type: conductor.operator.OperatorName
      - name: seat
        type: conductor.token.Seat
      - name: token_state
        type: conductor.token.TokenState
      - name: limited_until
        type: Optional<Timestamp>
      - name: contributed_at
        type: Timestamp
      - name: actor
        type: conductor.operator.Actor
      - name: kind
        type: Optional<conductor.config.ModelTokenKind>
    naming:
      wire: tokens
      display: Tokens of the pool

  # The leases of the host's pool (story:host-token-pool): which agent of which instance runs on
  # which token, held or released.
  - name: conductor.token.TokenLeases
    source: conductor.token.TokenLease
    consistency: read_your_writes
    fields:
      - name: lease_id
        type: conductor.token.TokenLeaseId
      - name: state
        type: conductor.token.TokenLease.State
      - name: token_id
        type: conductor.token.TokenId
      - name: agent
        type: conductor.agent.AgentName
      - name: instance
        type: conductor.config.InstanceName
      - name: owner
        type: conductor.operator.OperatorName
      - name: leased_at
        type: Timestamp
      - name: released_at
        type: Optional<Timestamp>
    naming:
      wire: token-leases
      display: Leases of the pool
