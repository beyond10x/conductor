# story:instance-upgrade: a runtime lost while upgrading is rolled back to the previous binary,
# not started again on the new one. The instance goes Unreachable from Upgrading, and the
# daemon's rollback moves it from there.
type: ess-scenario/1
domain: conductor.instance
scenario: instance-upgrade-instance-lost
summary: An upgraded runtime that stops running is rolled back from Unreachable and starts on the previous binary.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.instance.StartInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      placement: local
      roles: [Director]
      box_id: 6f1c1d2e-0000-4000-8000-000000000001
      at: 2026-11-08T09:00:00Z
    outcome: created

  - at: 2026-11-08T09:00:10Z
    command: conductor.instance.ObserveInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Daemon}
      name: example-org
      answering: true
      binary_version: 1.0.0
      at: 2026-11-08T09:00:10Z
    outcome: answering

  - at: 2026-11-08T12:00:00Z
    command: conductor.instance.UpgradeInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      binary_version: 1.1.0
      at: 2026-11-08T12:00:00Z
    outcome: upgrading

  - at: 2026-11-08T12:00:04Z
    command: conductor.instance.ObserveInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Daemon}
      name: example-org
      answering: false
      at: 2026-11-08T12:00:04Z
    outcome: not-answering

  - at: 2026-11-08T12:00:06Z
    command: conductor.instance.UpgradeInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Daemon}
      name: example-org
      binary_version: 1.1.0
      at: 2026-11-08T12:00:06Z
    outcome: rolled-back

assert:
  - view: conductor.instance.Instances
    contains:
      name: example-org
      state: Starting
      binary_version: 1.0.0
