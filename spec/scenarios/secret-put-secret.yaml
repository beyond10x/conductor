type: ess-scenario/1
domain: conductor.secret
scenario: secret-put-secret
summary: An operator puts a secret into the keychain, which records its name, source and who put it; a second put under the same name writes the value again and leaves the record as it was.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-forge
      put_at: 2026-11-08T09:00:00Z
    outcome: stored
    events:
      - event: conductor.secret.SecretPut
        payload:
          name: example-org-forge
          source: Keychain
          put_at: 2026-11-08T09:00:00Z

  - at: 2026-11-08T09:30:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-forge
      put_at: 2026-11-08T09:30:00Z
    outcome: replaced

assert:
  - view: conductor.secret.Secrets
    contains:
      name: example-org-forge
      state: Stored
      source: Keychain
      created_at: 2026-11-08T09:00:00Z
