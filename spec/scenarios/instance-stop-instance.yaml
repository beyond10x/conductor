# Design § 4: removing an instance from the config stops its runtime and keeps its records; a
# second stop changes nothing.
# UNMAPPED: the daemon's `Actor` is open (see `conductor.instance.Conductord`); placeholder below.
type: ess-scenario/1
domain: conductor.instance
scenario: instance-stop-instance
summary: The daemon stops a running instance gone from the config, its box closed and its record kept; a second stop changes nothing.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.instance.StartInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Agent, value: {instance: example-org, role: Director, name: conductord, kind: conductord}}
      name: example-org
      placement: local
      roles: [Director]
      box_id: 6f1c1d2e-0000-4000-8000-000000000001
      at: 2026-11-08T09:00:00Z
    outcome: created

  - at: 2026-11-08T09:00:10Z
    command: conductor.instance.ObserveInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Agent, value: {instance: example-org, role: Director, name: conductord, kind: conductord}}
      name: example-org
      answering: true
      binary_version: 1.0.0
      at: 2026-11-08T09:00:10Z
    outcome: answering

  - at: 2026-11-08T10:00:00Z
    command: conductor.instance.StopInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Agent, value: {instance: example-org, role: Director, name: conductord, kind: conductord}}
      name: example-org
      at: 2026-11-08T10:00:00Z
    outcome: stopped

  - at: 2026-11-08T10:01:00Z
    command: conductor.instance.StopInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Agent, value: {instance: example-org, role: Director, name: conductord, kind: conductord}}
      name: example-org
      at: 2026-11-08T10:01:00Z
    outcome: already-stopped

assert:
  - view: conductor.instance.Instances
    contains:
      name: example-org
      state: Stopped
      binary_version: 1.0.0
