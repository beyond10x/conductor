[package]
name = "conductor-cli"
description = "The conductor command line: the `cli:` block of spec/components.yaml, in clap derive form."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "conductor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
conductor-model = { package = "conductor", path = "../conductor-model" }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", tag = "0.8.1" }
eventlog-file = { git = "https://github.com/beyond10x/eventlog", tag = "0.8.1" }
eventlog-tree = { git = "https://github.com/beyond10x/eventlog", tag = "0.8.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
