# docs/design/architecture-next.md § 7 and § 5.3: the runtime fills a role slot on the
# `claude-code` kind, on a token leased from the pool, and the agent record names the actor that
# started it and the token's owner; a second start under the same name is refused, and a start
# on a kind the binary does not implement records nothing.
# The runtime's own commands name the operator a single host implies (§ 5.3); the domain's
# UNMAPPED marker on `InstanceRuntime` records that the runtime has no actor of its own.
type: ess-scenario/1
domain: conductor.agent
scenario: agent-start-agent
summary: An agent started on claude-code runs as generation 1 naming who started it and whose token it runs on; a second start of the name and a start on an unknown kind are refused.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.agent.DeclareAgentKind
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: claude-code
      capabilities: [Interactive]
      binary: claude
    outcome: declared

  - at: 2026-11-08T09:01:00Z
    command: conductor.agent.StartAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: example-org-director
      instance: example-org
      role: Director
      kind: claude-code
      capabilities: [Interactive]
      profile: ~/.b10x/conductor/profiles/repo-controller.md
      limits: {tasks_max: 512}
      token_owner: example-operator
      started_at: 2026-11-08T09:01:00Z
    outcome: started
    events:
      - event: conductor.agent.AgentStarted
        payload:
          name: example-org-director
          kind: claude-code
          token_owner: example-operator

  - at: 2026-11-08T09:02:00Z
    command: conductor.agent.StartAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: example-org-director
      instance: example-org
      role: Director
      kind: claude-code
      capabilities: [Interactive]
      profile: ~/.b10x/conductor/profiles/repo-controller.md
      limits: {tasks_max: 512}
      token_owner: example-operator
      started_at: 2026-11-08T09:02:00Z
    outcome: exists
    error:
      name: conductor.agent.AgentExists

  - at: 2026-11-08T09:03:00Z
    command: conductor.agent.StartAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: example-org-worker
      instance: example-org
      role: Director
      kind: example-unknown-kind
      capabilities: [RunToExit]
      profile: ~/.b10x/conductor/profiles/repo-controller.md
      limits: {tasks_max: 512}
      token_owner: example-operator
      started_at: 2026-11-08T09:03:00Z
    outcome: unknown-kind
    error:
      name: conductor.agent.UnknownAgentKind

assert:
  - view: conductor.agent.Agents
    contains:
      name: example-org-director
      state: Running
      instance: example-org
      role: Director
      kind: claude-code
      capabilities: [Interactive]
      token_owner: example-operator
      started_by: {kind: Human, value: {operator: example-operator}}
      generation: 1
