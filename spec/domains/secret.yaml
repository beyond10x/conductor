domain: conductor.secret

summary: >
  The config names secrets and never holds them (design docs/design/architecture-next.md § 9,
  decision 6): a `secret:<name>` is resolved by the daemon through the `secrets` crates, the OS
  keychain on a workstation and the Secrets service where conductord is deployed, and handed to a
  box as a sealed slot at box open (§ 6). The API lists names and sources, never values. The
  specification holds no secret value anywhere: no type, field, input, event, error or view below
  carries one.

naming:
  wire: secret
  display: Secret

types:
  # What the config names after `secret:` (`forge_token: secret:gitlab-bot` names `gitlab-bot`).
  - name: conductor.secret.SecretName
    kind: newtype
    of: String

  # Where a secret's value is kept: `Keychain`, the `secrets-keychain` backend (the OS keychain:
  # the Secret Service on Linux, the native keychain on macOS), on the control host; `Remote`, the
  # `secrets-remote` backend (the Secrets service: encrypted, tenant-scoped custody), where
  # conductord runs in a deployment. `secrets-federation` routes each namespace to one of them
  # (§ 9).
  - name: conductor.secret.Source
    kind: enum
    variants: [Keychain, Remote]

  # A namespace of the secrets source, the unit `secrets-federation` routes to one backend (§ 9);
  # the token pool's secrets are in "the instance's secrets namespace" (§ 5.3).
  # UNMAPPED: the design names namespaces and no spelling, alphabet or length for one, and does
  # not say how a namespace is derived from an instance's name. Open question for the owner.
  - name: conductor.secret.Namespace
    kind: newtype
    of: String

  # The name a slot carries inside the box, which the program in the box opens the sealed memfd
  # by (§ 6, substrate's sealed memfd slots).
  # UNMAPPED: the design does not say who names a slot (the config key, such as `forge_token`, the
  # secret's name, or substrate) nor its spelling. Open question for the owner.
  - name: conductor.secret.SlotName
    kind: newtype
    of: String

  # One sealed slot handed to a box at box open (§ 6): the secret it holds, the box it went into,
  # its name inside the box, and when it was sealed. The slot says where a value went; it never
  # holds the value. A struct, not an entity: one box open seals every slot at once, and a slot
  # lives exactly as long as its box (runtime state, § 8), so the store keeps it only inside the
  # `SecretsResolved` event.
  - name: conductor.secret.Slot
    kind: struct
    fields:
      - {name: secret, type: conductor.secret.SecretName}
      - {name: box, type: conductor.placement.BoxId}
      - {name: slot_name, type: conductor.secret.SlotName}
      - {name: sealed_at, type: Timestamp}

entities:
  # One secret the config names, by its name. The record holds where the value is kept and who
  # uses it, never the value: the specification holds no secret values, and a value never leaves
  # the secrets source except as a sealed slot (§ 5.3, § 9).
  # UNMAPPED: a slot's `box` names a `conductor.placement.Box`, and no relation says so: a slot
  # is a `struct` type, not an entity, and only an entity declares relations. Open question for
  # the owner: is a sealed slot a record of its own (an entity referencing its box), or a value
  # handed over at box open and kept nowhere?
  - name: conductor.secret.Secret
    identity:
      name: name
      type: conductor.secret.SecretName
    fields:
      - name: source
        type: conductor.secret.Source
      # UNMAPPED: the design gives a remote secret a namespace (§ 5.3, § 9) and no URL; the
      # Secrets service's address is the daemon's "secrets source" in the config (§ 9), not a
      # field of one secret. Whether a keychain secret has a namespace too is not said, so the
      # field is optional and no command sets it. Open question for the owner.
      - name: namespace
        type: Optional<conductor.secret.Namespace>
      # The instances whose effective config names `secret:<name>`.
      # UNMAPPED: no command in the design writes this list; it is read from the config (§ 9),
      # and whether the store keeps it or the `Secrets` view derives it from the effective config
      # at read time is not said. No command below sets it. Open question for the owner.
      - name: instances
        type: List<conductor.config.InstanceName>
      - name: created_by
        type: conductor.operator.Actor
      - name: created_at
        type: Timestamp
      # UNMAPPED: the last `ResolveSecrets` that named the secret should set this, one secret per
      # slot; writing one row per list element needs `affects: each:` (ess/23), which the
      # generated Rust model this repository builds from refuses. No command below sets it. Open
      # question for the owner: keep the field and write it outside the model, or drop it.
      - name: last_resolved_at
        type: Optional<Timestamp>
    relations:
      - name: instances
        kind: references
        target: conductor.instance.Instance
        cardinality: many
        via: instances
    lifecycle:
      initial: Stored
      states: [Stored]
      terminal: [Stored]

actors:
  # conductord resolves the instance's secrets when it opens the instance's box (§ 4, § 6, § 9).
  - name: conductor.secret.Conductord
    may:
      - conductor.secret.ResolveSecrets
    naming:
      display: conductord

  # A person puts a secret into the keychain; an agent holds no credential (§ 9, ADR 0110 as the
  # design quotes it) and is refused by type.
  - name: conductor.secret.Operator
    may:
      - conductor.secret.PutSecret
    naming:
      display: Operator

errors:
  - name: conductor.secret.SecretMissing
    summary: >
      The secrets source holds no value under one or more of the names the instance's effective
      config writes as `secret:<name>`, so no slot was sealed and the box is not opened; the
      refusal names every missing name.
    fields:
      - name: instance
        type: conductor.config.InstanceName
      - name: box
        type: conductor.placement.BoxId
      - name: names
        type: List<conductor.secret.SecretName>

  - name: conductor.secret.SourceUnreachable
    summary: >
      The secrets source (the OS keychain, or the Secrets service) did not answer, so nothing was
      read or written; the refusal names which source.
    fields:
      - name: source
        type: conductor.secret.Source

commands:
  # At box open (§ 6): every `secret:<name>` the instance's effective config names, resolved
  # from the daemon's secrets source and sealed into the box as one slot each. The values go from
  # the secrets crates into substrate's sealed memfd slots and pass through no input, event or
  # record.
  - name: conductor.secret.ResolveSecrets
    naming:
      wire: resolve-secrets
      display: Resolve an instance's secrets at box open
    input:
      # conductord resolves at box open on its own account: the actor is `{kind: Daemon}`.
      - {name: actor, type: conductor.operator.Actor}
      - name: instance
        type: conductor.config.InstanceName
      - name: box
        type: conductor.placement.BoxId
      # One entry per `secret:<name>` of the instance's effective config.
      # UNMAPPED: nothing says a slot's `box` must equal the command's `box`, nor whether the
      # list may be empty (an instance whose config names no secret). Open question for the owner.
      - name: slots
        type: List<conductor.secret.Slot>
      - name: resolved_at
        type: Timestamp
    outcomes:
      - name: unreachable
        external: the daemon's secrets source (the OS keychain or the Secrets service) does not answer
        error: conductor.secret.SourceUnreachable
        summary: Nothing was resolved and no slot sealed; the box is not opened, and the daemon records why.
      - name: missing
        external: the secrets source holds no value under one or more of the names the slots carry
        error: conductor.secret.SecretMissing
        payload:
          conductor.secret.SecretMissing:
            instance: input.instance
            box: input.box
        summary: No slot was sealed; the refusal names every missing secret, and the box is not opened.
      - name: resolved
        emits:
          - conductor.secret.SecretsResolved
        payload:
          conductor.secret.SecretsResolved:
            actor: input.actor
            instance: input.instance
            box: input.box
            slots: input.slots
            resolved_at: input.resolved_at
        summary: Every named secret is sealed into the box as a slot; the record names the slots and never a value.

  # `conductor secret put <name>`: writes a value into the OS keychain through the `secrets`
  # crates, and records the secret's name and source. The value is read by the CLI and handed to
  # the keychain; it is no field of this command.
  # UNMAPPED: the CLI is an API client of the daemon (§ 2); whether `secret put` writes the
  # keychain of the host it runs on, or sends the value to the daemon, which writes its own
  # source, is not said. Nor is a put to the Secrets service (`Remote`). Open question for the
  # owner.
  # UNMAPPED: a put over a name that already has a record keeps the record unchanged here; whether
  # it replaces the value, is refused, or is refused when the record's source is `Remote` is not
  # said. Open question for the owner.
  - name: conductor.secret.PutSecret
    naming:
      wire: put-secret
      display: Put a secret into the keychain
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: name
        type: conductor.secret.SecretName
      - name: put_at
        type: Timestamp
    outcomes:
      - name: not-human
        when: actor.kind != Human
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: An agent actor holds no credential and puts none; nothing was written.
      - name: unreachable
        external: the OS keychain does not answer
        error: conductor.secret.SourceUnreachable
        payload:
          conductor.secret.SourceUnreachable:
            source: Keychain
        summary: Nothing was written to the keychain and nothing recorded.
      - name: stored
        unknown_instance: true
        creates: conductor.secret.Secret
        instance: name
        sets:
          source: Keychain
          created_by: input.actor
          created_at: input.put_at
          last_resolved_at: {cleared: true}
        emits:
          - conductor.secret.SecretPut
        payload:
          conductor.secret.SecretPut:
            actor: input.actor
            name: input.name
            source: Keychain
            put_at: input.put_at
        summary: The value is in the keychain under the name, and the secret is on record with its source and who put it.
      - name: replaced
        updates: conductor.secret.Secret
        instance: name
        emits:
          - conductor.secret.SecretPut
        payload:
          conductor.secret.SecretPut:
            actor: input.actor
            name: input.name
            source: Keychain
            put_at: input.put_at
        summary: The value under the name is written again; the record is unchanged.

events:
  - name: conductor.secret.SecretsResolved
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - name: instance
        type: conductor.config.InstanceName
      - name: box
        type: conductor.placement.BoxId
      - name: slots
        type: List<conductor.secret.Slot>
      - name: resolved_at
        type: Timestamp

  - name: conductor.secret.SecretPut
    fields:
      - {name: actor, type: conductor.operator.Actor}
      - name: name
        type: conductor.secret.SecretName
      - name: source
        type: conductor.secret.Source
      - name: put_at
        type: Timestamp

views:
  # `GET /v1/secrets` (§ 5): names, sources and the instances that use them, never values.
  # The view shows only what a command sets: `namespace`, `instances` and `last_resolved_at` stay
  # on `Secret` with their UNMAPPED markers, and a view field no command sets leaves ess 0.90.0's
  # interpreted target unable to answer the view (ESS-CF-TARGET), so every secret scenario ran
  # unsupported.
  # UNMAPPED: § 5 has the view list "the instances that use them"; it does so once a command (or
  # a derivation from the effective config) sets `instances`. Open question for the owner, the
  # same as the field's.
  - name: conductor.secret.Secrets
    source: conductor.secret.Secret
    consistency: read_your_writes
    fields:
      - name: name
        type: conductor.secret.SecretName
      - name: state
        type: conductor.secret.Secret.State
      - name: source
        type: conductor.secret.Source
      - name: created_by
        type: conductor.operator.Actor
      - name: created_at
        type: Timestamp
    naming:
      wire: secrets
      display: Secrets
