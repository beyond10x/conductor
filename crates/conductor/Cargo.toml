[package]
name = "conductor-cli"
description = "The conductor command line: the `cli:` block of spec/components.yaml, in clap derive form."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "conductor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
conductor-broker = { path = "../conductor-broker" }
conductor-model = { package = "conductor", path = "../conductor-model" }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.2" }
eventlog-file = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.2" }
eventlog-postgres = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.2" }
eventlog-sqlite = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.2" }
eventlog-tree = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.2" }
include_dir = "0.7"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring-core = { version = "1", features = ["sample"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
nix = { version = "0.30", default-features = false, features = ["fs", "poll", "signal", "term"] }
secrets-core = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0" }
secrets-federation = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0" }
secrets-keychain = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0", features = ["native-keychain"] }
serde = { version = "1", features = ["derive"] }
substrate-sdk = { package = "b10x-substrate-sdk", git = "https://github.com/beyond10x/substrate", rev = "546693082bcc10590fd4509f1b31926b3e3d1ddb" }
signal-hook = { version = "0.4", default-features = false }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
