name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tool versions pinned in b10x.toml, as released.
  ESS_VERSION: "0.93.0"
  AEP_VERSION: "0.79.0"
  TASK_VERSION: "v3.53.1"
  NEXTEST_VERSION: "0.9.143"
  NEXTEST_SHA256: "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: task check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The Node version the dashboard app pins (crates/conductor/dashboard/.nvmrc): task check
      # runs its tests and rebuilds dist/ to compare it with the committed build.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: crates/conductor/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: crates/conductor/dashboard/package-lock.json
      # The dashboard's UX gate compares ux/baseline.json with main's, and fails here without it.
      - name: Fetch main for the UX gate's worse-than-main check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Install the Playwright Chromium the dashboard's UX gate drives
        run: |
          npm --prefix crates/conductor/dashboard ci
          crates/conductor/dashboard/node_modules/.bin/playwright install --with-deps chromium
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        id: toolchain
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install task, ess, aep and cargo-nextest from their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          gh release download "$TASK_VERSION" -R go-task/task -p task_linux_amd64.tar.gz -p task_checksums.txt
          grep ' task_linux_amd64.tar.gz$' task_checksums.txt | sha256sum --check --strict
          tar -xzf task_linux_amd64.tar.gz -C "$bin" task
          nextest="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "cargo-nextest-$NEXTEST_VERSION" -R nextest-rs/nextest -p "$nextest"
          echo "$NEXTEST_SHA256  $nextest" | sha256sum --check --strict
          tar -xzf "$nextest" -C "$bin" cargo-nextest
          for tool in ess:"$ESS_VERSION" aep:"$AEP_VERSION"; do
            name="${tool%%:*}"; version="${tool#*:}"
            archive="$name-$version-x86_64-unknown-linux-gnu.tar.gz"
            gh release download "$version" -R "beyond10x/$name" -p "$archive" -D "$name-dl"
            gh release download "$version" -R "beyond10x/$name" -p SHA256SUMS -D "$name-dl"
            (cd "$name-dl" && grep " $archive\$" SHA256SUMS | sha256sum --check --strict)
            tar -xzf "$name-dl/$archive" -C "$name-dl"
            find "$name-dl" -type f -name "$name" -perm -u+x -exec cp {} "$bin/" \;
          done
          echo "$bin" >> "$GITHUB_PATH"
      - name: Show the tools
        run: |
          task --version
          ess --version
          aep --version
          cargo nextest --version
      - name: task check
        run: task check
      # A failed gate whose cause is a generated page that was edited by hand shows what the
      # generator writes, so the page can be corrected without a local build.
      - name: Show what conductor-docs would generate
        if: failure()
        run: |
          cargo run --locked -p conductor-docs -- generate
          git --no-pager diff --stat
          git --no-pager diff -- website/docs/reference website/docs/status.md website/data

  # story:container-start-without-prompt: the image built from this tree's binary starts with no
  # terminal from a config file and a mounted secrets directory, and doctor in it ends ready.
  container:
    name: container start
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install task from its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          gh release download "$TASK_VERSION" -R go-task/task -p task_linux_amd64.tar.gz -p task_checksums.txt
          grep ' task_linux_amd64.tar.gz$' task_checksums.txt | sha256sum --check --strict
          tar -xzf task_linux_amd64.tar.gz -C "$bin" task
          echo "$bin" >> "$GITHUB_PATH"
      - name: Start the image with no terminal
        run: task container-test
