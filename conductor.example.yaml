version: conductor.config/1
default: personal
instances:
  - name: personal
    session_prefix: personal
    sources:
      - github: example-org
    checkouts:
      root: ~/example-org
      trees: ~/.local/state/worktree/trees/example-org
    records: ~/example-org/conductor
    controllers:
      max_working: 5
      max_subagents: 4
      max_open_reviews: 3       # pull requests waiting for review before no new dispatch; 0 = no limit
    roles:
      - {role: conductor, harness: claude, model: opus}
      - {role: conductor-dev, harness: claude, model: opus}
      - role: controller
        harness: claude
        model: opus
        agent: repo-controller
        settings: ~/example-org/conductor/.claude/controller-settings.json
        profile: ~/.b10x/conductor/profiles/repo-controller.md
        # The variables that carry the forge tokens a controller may use: names only.
        forge_token_env: [GH_TOKEN]
    catalog:
      repository: registry
      path: catalog/entries
      names: plain
    secret_syncs:
      - name: ci-policy
        source: {repository: policies, branch: main, path: ci/policy.json}
        secrets:
          - {owner: example-org, name: CI_POLICY}
        command: example-sync publish ci/policy.json
        dry_run: example-sync publish ci/policy.json --dry-run
    cadence:
      cycle: 2h
      daily: 08:07
    thresholds:
      disk_path: /
      disk_low: 100G
      disk_clear: 110G
      build_slot: 60G
      build_size: 10G
      gate_stop: 15G
      gate_resume: 17G
    authority:
      class_c: conductor
      class_o: operator
    # The command that prints the harness accounts' usage as JSON, and the systemd user unit that
    # rotates them (docs/config.md, Usage). Both are the operator's tools; conductor names none.
    usage:
      probe: usage-probe --json
      watcher: usage-rotator.service

  - name: work
    session_prefix: work
    sources:
      - local: ~/work
        exclude: [archive]
    checkouts:
      root: ~/work
      trees: ~/.local/state/worktree/trees/work
    controllers:
      max_working: 2
    roles:
      - {role: conductor, harness: claude, model: opus}
      - {role: conductor-dev, harness: claude, model: opus}
      - role: controller
        harness: claude
        model: sonnet
        agent: repo-controller
        settings: ~/example-org/conductor/.claude/controller-settings.json
        profile: ~/.b10x/conductor/profiles/repo-controller.md
    repositories:
      - {match: legacy-service, activity: inactive}
    retention:
      snapshots: 24
