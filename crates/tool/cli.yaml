format: ess-cli/2
binary: tool
about: The verbs of a session's grant, each answered by the instance's broker over the session's socket
globals:
  state: socket
callables:
  show:
    target: {kind: local, owner: conductor-broker, action: show}
    input: conductor.tool.ShowCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
  search:
    target: {kind: local, owner: conductor-broker, action: search}
    input: conductor.tool.SearchCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
  diff:
    target: {kind: local, owner: conductor-broker, action: diff}
    input: conductor.tool.DiffCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
  test:
    target: {kind: local, owner: conductor-broker, action: test}
    input: conductor.tool.TestCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
      build-failed: conductor.tool.CallAnswer
  check:
    target: {kind: local, owner: conductor-broker, action: check}
    input: conductor.tool.CheckCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
      build-failed: conductor.tool.CallAnswer
  fmt:
    target: {kind: local, owner: conductor-broker, action: fmt}
    input: conductor.tool.FmtCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
      build-failed: conductor.tool.CallAnswer
  commit:
    target: {kind: local, owner: conductor-broker, action: commit}
    input: conductor.tool.CommitCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
      commit-refused: conductor.tool.CallAnswer
  send:
    target: {kind: local, owner: conductor-broker, action: send}
    input: conductor.tool.SendCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
      outside-team: conductor.tool.CallRefused
  report:
    target: {kind: local, owner: conductor-broker, action: report}
    input: conductor.tool.ReportCall
    result: conductor.tool.CallAnswer
    errors:
      not-granted: conductor.tool.CallRefused
      grant-expired: conductor.tool.CallRefused
      foreign-instance: conductor.tool.CallRefused
      unknown-session: conductor.tool.CallRefused
      not-one-level-up: conductor.tool.CallRefused
  mcp:
    target: {kind: local, owner: conductor-broker, action: mcp}
    input: null
    result: String
    errors: {}
commands:
  - path: [show]
    callable: show
    about: Print a bounded range of one file of the grant, or that it is unchanged since this session last read it
    arguments:
      - field: path
        source: {kind: positional, index: 1}
      - field: lines
        source: {kind: option, long: lines}
      - field: symbol
        source: {kind: option, long: fn}
      - field: max
        source: {kind: option, long: max}
  - path: [search]
    callable: search
    about: Print the lines under the grant's paths that hold a text
    arguments:
      - field: pattern
        source: {kind: positional, index: 1}
      - field: path
        source: {kind: option, long: path}
  - path: [diff]
    callable: diff
    about: Print the uncommitted change of the session's checkout, as a stat (the default, or --stat), or with --patch the change itself
    arguments:
      - field: stat
        source: {kind: option, long: stat}
      - field: patch
        source: {kind: option, long: patch}
  - path: [test]
    callable: test
    about: Run the tests of the session's checkout through the host ledger at nice 19; print `ok test <n> passed`, or the failing tests and the log
    arguments:
      - field: package
        source: {kind: positional, index: 1}
      - field: filter
        source: {kind: option, long: filter}
  - path: [check]
    callable: check
    about: Lint the session's checkout (clippy over every target, warnings denied) through the host ledger at nice 19; print `ok check`, or the errors and the log
    arguments:
      - field: package
        source: {kind: positional, index: 1}
  - path: [fmt]
    callable: fmt
    about: Format the session's checkout through the host ledger at nice 19; print `ok fmt <n> files changed`
    arguments:
      - field: package
        source: {kind: positional, index: 1}
  - path: [commit]
    callable: commit
    about: Stage the named paths, new ones included, and commit them through the bot route; print `<sha> <n> files`
    arguments:
      - field: message
        source: {kind: option, long: message}
      - field: paths
        source: {kind: positional, index: 1}
  - path: [send]
    callable: send
    about: Send a message to a session of the caller's team, by its name or its role; the broker records it and answers whom to deliver it to
    arguments:
      - field: to
        source: {kind: positional, index: 1}
      - field: text
        source: {kind: positional, index: 2}
  - path: [report]
    callable: report
    about: Report the caller's status one level up, moving its open dispatch when it is a lead; the broker records it and answers whom to deliver it to
    arguments:
      - field: status
        source: {kind: positional, index: 1}
      - field: line
        source: {kind: positional, index: 2}
      - field: to
        source: {kind: option, long: to}
  - path: [mcp]
    callable: mcp
    about: Serve the granted verbs as MCP tools over stdio, each answered through the same socket
    arguments: []
