domain: conductor.observation

summary: >
  What conductor sees at one moment: one snapshot per sense run, holding one observation per
  repository, open pull request, latest main-branch workflow run and live agent session. Every
  observation is read from the tool that owns the fact (git, GitHub, aep, the session lists) and is
  never edited after it is recorded. Design: docs/design/conductor.md § 4.

naming:
  wire: observation
  display: Observation

types:
  - name: conductor.observation.SnapshotId
    kind: newtype
    of: Uuid

  - name: conductor.observation.ObservationId
    kind: newtype
    of: Uuid

  - name: conductor.observation.RepositoryName
    kind: newtype
    of: String

  - name: conductor.observation.CommitSha
    kind: newtype
    of: String

  - name: conductor.observation.Visibility
    kind: enum
    variants: [Public, Private]

  - name: conductor.observation.Mergeability
    kind: enum
    variants: [Mergeable, Conflicting, Unknown]

  - name: conductor.observation.RunConclusion
    kind: enum
    variants: [Success, Failure, Cancelled, Skipped, Neutral, Pending]

  - name: conductor.observation.Harness
    kind: enum
    variants: [Claude, Codex]

  - name: conductor.observation.SessionState
    kind: enum
    variants: [Busy, Idle, Waiting, Background, Unknown]

  # What set up the box a session was measured in (story:session-envelope-model): `Systemd`, a
  # `systemd-run --user` unit, the one provider conductor has.
  - name: conductor.observation.EnvelopeProvider
    kind: enum
    variants: [Systemd]

  - name: conductor.observation.SpecificationPresence
    kind: enum
    variants: [Present, OptedOut, Missing, NotInWorkspace]

  - name: conductor.observation.ValidationResult
    kind: enum
    variants: [Valid, Refused, NotRun]

  # How one collector's run in a snapshot ended (story:snapshot-duration): `Completed`, it
  # answered; `Failed`, it answered an error, which fails the snapshot; `OverBudget`, it ran past
  # the budget `start-snapshot --budget` gave it and was stopped there, which does not.
  - name: conductor.observation.CollectorRunOutcome
    kind: enum
    variants: [Completed, Failed, OverBudget]

  # What a member failure's first line says went wrong (story:dashboard-health), the key of the
  # fix the dashboard's health view shows beside it: `NeedsLogin`, a prompt for a credential or a
  # credential refused (`could not read Username`, `Permission denied (publickey)`);
  # `UnreachableHost`, a host name that does not resolve or a host that does not answer;
  # `TimedOut`, a command stopped at its bound (`gave no answer within`); `OldStore`, a first line
  # holding `[unsupported_protocol_version]`, the code `aep` refuses an `aep.project/1` store with;
  # `Other`, anything else. Computed when it is read, never stored.
  - name: conductor.observation.FailureClass
    kind: enum
    variants: [NeedsLogin, UnreachableHost, TimedOut, OldStore, Other]

  - name: conductor.observation.BoardId
    kind: newtype
    of: Uuid

  # The identity of one daily rollup (story:dashboard-history): `<series>|<by>|<key>|<day>`.
  - name: conductor.observation.DailySeriesId
    kind: newtype
    of: String

  - name: conductor.observation.DashboardServe
    kind: struct
    fields:
      - {name: port, type: Optional<Integer>}
      - {name: root, type: Optional<String>}

  # The `memory` part of the dashboard's health view (story:dashboard-memory-bound): what the
  # serving process holds. `rss_bytes` is its resident set (`VmRSS` of `/proc/self/status`) and
  # `swap_bytes` what of it the system swapped out (`VmSwap`), each absent where the system does
  # not report it. `store_handles` is the store handles it keeps, one per state directory;
  # `store_replays` the trees those handles hold replayed in memory now, and `store_bytes` the
  # bytes of the files those replays were built from. `store_replays_peak` is the most replays of
  # one tree alive at once since the server started: 1 while each reopen drops the old replay
  # before it builds the new one. `memo_entries` is the answers kept, `memo_entries_peak_endpoint`
  # the most kept for any one endpoint (each query string its own answer) and `memo_bytes` their
  # size.
  - name: conductor.observation.DashboardMemory
    kind: struct
    fields:
      - {name: rss_bytes, type: Optional<Integer>}
      - {name: swap_bytes, type: Optional<Integer>}
      - {name: store_handles, type: Integer}
      - {name: store_replays, type: Integer}
      - {name: store_replays_peak, type: Integer}
      - {name: store_bytes, type: Integer}
      - {name: memo_entries, type: Integer}
      - {name: memo_entries_peak_endpoint, type: Integer}
      - {name: memo_bytes, type: Integer}
    invariants:
      - store_handles >= 0
      - store_replays >= 0
      - store_replays_peak >= 0
      - store_bytes >= 0
      - memo_entries >= 0
      - memo_entries_peak_endpoint >= 0
      - memo_bytes >= 0

  - name: conductor.observation.WatchRun
    kind: struct
    fields:
      - {name: every, type: Optional<Integer>}
      - {name: ci_every, type: Optional<Integer>}
      - {name: follow, type: Optional<Boolean>}

  # The input of `conductor repository shipped` (story:release-digest). `since` is an RFC 3339
  # instant and `format` one of text, json, jsonl, markdown; both are read by the handler.
  - name: conductor.observation.RepositoryShipped
    kind: struct
    fields:
      - {name: since, type: String}
      - {name: format, type: Optional<String>}

  - name: conductor.observation.ResourceUsage
    kind: struct
    fields:
      - {name: since, type: Optional<String>}
      - {name: format, type: Optional<String>}

  # The input of `conductor store migrate` (story:store-on-eventlog-tree), which copies the
  # eventlog-file store under the state directory into a tree store. `format` is text or json, how
  # the counts it moved are printed, read by the handler.
  - name: conductor.observation.StoreMigrate
    kind: struct
    fields:
      - {name: format, type: Optional<String>}

  # The input of `conductor gc` (story:conductor-gc), which removes what the dashboard's disk panel
  # marks reclaimable, the finished managed trees and the `target/` of the stale ones
  # (story:gc-finished-trees), and nothing else. `dry_run` lists those rows and removes nothing;
  # `format` is text or json, read by the handler.
  - name: conductor.observation.CollectGarbage
    kind: struct
    fields:
      - {name: dry_run, type: Optional<Boolean>}
      - {name: format, type: Optional<String>}

  # What became of one reclaimable row: listed by a dry run, removed, or refused (its command
  # failed, a live session now works in it, or something it names is still there).
  - name: conductor.observation.GarbageOutcome
    kind: enum
    variants: [Reclaimable, Removed, Refused]

  # What `conductor gc` found a managed tree to be (story:gc-finished-trees): finished (merged
  # into its default branch on origin, clean apart from `target/` and `.check/`, in use by no
  # process, held by no lease), which it finishes and removes through `worktree`; or stale (dirty or
  # unmerged, untouched for longer than `thresholds.tree_stale`), whose `target/` it removes and
  # whose tree it keeps.
  - name: conductor.observation.TreeVerdict
    kind: enum
    variants: [Finished, Stale]

  # One row `conductor gc` reports: a row the disk panel marks reclaimable, as the panel measured
  # it (`what`, `repository`, the paths it sums, `count`, `bytes`), the bytes its removal freed,
  # measured on the disk before and after, and its outcome with the reason for a refusal. A row of
  # one managed tree also names the tree's registered id (`tree`) and its verdict.
  - name: conductor.observation.GarbageRow
    kind: struct
    fields:
      - {name: repository, type: Optional<String>}
      - {name: what, type: String}
      - {name: paths, type: List<String>}
      - {name: count, type: Optional<Integer>}
      - {name: bytes, type: Optional<Integer>}
      - {name: freed, type: Optional<Integer>}
      - {name: outcome, type: conductor.observation.GarbageOutcome}
      - {name: detail, type: Optional<String>}
      - {name: tree, type: Optional<String>}
      - {name: verdict, type: Optional<conductor.observation.TreeVerdict>}

  # The input of `conductor repository refresh-hooks` (story:gates-hooks-fresh), which lists each
  # checkout of the instance whose Gates hook (`.git/b10x-gates-hooks/b10x-gates`) lags the
  # `b10x-gates` on `PATH` or is absent. `apply` runs `b10x-gates install` in each of them with
  # the instance's `gates_policy`; `format` is text or json, read by the handler.
  - name: conductor.observation.RefreshHooks
    kind: struct
    fields:
      - {name: apply, type: Optional<Boolean>}
      - {name: format, type: Optional<String>}

  # What became of one checkout `refresh-hooks` names: listed, its hook lagging or absent;
  # refreshed by `b10x-gates install`; or refused, the install failed or left the hook lagging.
  - name: conductor.observation.HooksOutcome
    kind: enum
    variants: [Lagging, Absent, Refreshed, Refused]

  # One checkout `refresh-hooks` names: the repository as `<owner>/<name>`, read from its `origin`;
  # its directory; the hook's version before (absent when it had none) and after an install; the
  # outcome, and the reason for a refusal.
  - name: conductor.observation.HooksRow
    kind: struct
    fields:
      - {name: repository, type: String}
      - {name: checkout, type: String}
      - {name: before, type: Optional<String>}
      - {name: after, type: Optional<String>}
      - {name: outcome, type: conductor.observation.HooksOutcome}
      - {name: detail, type: Optional<String>}

  # One repository that is not archived, as the board compares it (story:dashboard-overview):
  # its deviations, in the order `STATUS.md` lists them, and the five counts its delta compares.
  # `conductor snapshot publish-board` and the dashboard's `/api/board` compute it in one place
  # (`figures` in crates/conductor/src/status.rs). It is a row a handler answers rather than a view:
  # every field is worked out over several observations of one snapshot, which no view's source
  # holds.
  - name: conductor.observation.RepositoryFigures
    kind: struct
    fields:
      - {name: repository, type: String}
      - {name: deviations, type: List<String>}
      - {name: open_prs, type: Integer}
      - {name: failing_prs, type: Integer}
      # One line per pull request with a failing check, by number: `#<n> <name>, <name>`, every
      # failing check named (story:pr-check-names); `#<n>` alone when the observation names none.
      - {name: failing_checks, type: List<String>}
      - {name: non_green_workflows, type: Integer}
      - {name: open_blockers, type: Integer}
      - {name: specifications_present, type: Integer}

  # The input of the `Status` view, `conductor status` (story:status-command): the answer to
  # "what is the status" in one call. It reads the store alone: it starts no snapshot, runs no
  # collector, and opens only an existing store, creating nothing. `format` is text or json, read
  # by the handler. As text it prints, without `full`, only what asks for attention, one line each
  # (story:conductor-context-budget): the snapshot's id and age, the unanswered operator items,
  # each repository's deviations with its failing checks, each `Blocked` dispatch, each wait, each
  # pending request and the usage line, then one line counting the open dispatches and sessions
  # left out; with `full`, every part of the `StatusReport` under its heading. json is the whole
  # report either way.
  - name: conductor.observation.Status
    kind: struct
    fields:
      - {name: format, type: Optional<String>}
      - {name: full, type: Optional<Boolean>}

  # One live session of the `Status` view: a session the newest complete snapshot observed, by
  # its repository (absent outside the checkouts), its name (else its reference), harness, role
  # and activity.
  - name: conductor.observation.StatusSession
    kind: struct
    fields:
      - {name: repository, type: Optional<String>}
      - {name: session, type: String}
      - {name: harness, type: String}
      - {name: role, type: Optional<String>}
      - {name: activity, type: String}

  # One open dispatch of the `Status` view: a dispatch that is `Sent`, `Started` or `Blocked`,
  # with the dispatch it waits on when it names one.
  - name: conductor.observation.StatusDispatch
    kind: struct
    fields:
      - {name: dispatch_id, type: String}
      - {name: repository, type: String}
      - {name: state, type: String}
      - {name: sent_at, type: String}
      - {name: waits_on, type: Optional<String>}
      - {name: brief, type: String}

  # One pending request of the `Status` view: a decision request that is `Open` or `Escalated`
  # (`kind` decision, `summary` its question), or a resource request still `Requested` (`kind`
  # resource, `summary` the resource and the amount).
  - name: conductor.observation.StatusRequest
    kind: struct
    fields:
      - {name: kind, type: String}
      - {name: request_id, type: String}
      - {name: repository, type: String}
      - {name: state, type: String}
      - {name: since, type: String}
      - {name: summary, type: String}

  # What `conductor status` answers, its six parts in order: the newest complete snapshot's id,
  # start and age in seconds (all absent when no snapshot is complete); that snapshot's
  # deviations, one `RepositoryFigures` per repository with at least one, worked out as the board
  # works them out; the sessions it observed; the open dispatches; the registered waits, one line
  # each; and the pending requests. The parts after the first are printed whether or not a
  # snapshot is complete; the deviations and sessions are empty when none is. Ids and times are
  # text (a snapshot id as its UUID, a time as RFC 3339), because a result the `ess-cli/1`
  # binding returns holds no `Uuid` or `Timestamp`. `usage` is the usage line the watch prints,
  # `usage: pool runs out ~<time>, next reset <time>`, from the newest usage readings of the
  # complete snapshots (story:usage-probe); absent when no complete snapshot holds one.
  # `unanswered_operator_items` counts the decision requests escalated as class O or H and not
  # answered or withdrawn yet (story:decisions-notify); `oldest_unanswered_request_id` and
  # `oldest_unanswered_age_seconds` name the one raised first and how long ago it was raised,
  # both absent when the count is 0.
  - name: conductor.observation.StatusReport
    kind: struct
    fields:
      - {name: snapshot_id, type: Optional<String>}
      - {name: snapshot_started_at, type: Optional<String>}
      - {name: snapshot_age_seconds, type: Optional<Integer>}
      - {name: deviations, type: List<conductor.observation.RepositoryFigures>}
      - {name: sessions, type: List<conductor.observation.StatusSession>}
      - {name: dispatches, type: List<conductor.observation.StatusDispatch>}
      - {name: waits, type: List<String>}
      - {name: requests, type: List<conductor.observation.StatusRequest>}
      - {name: usage, type: Optional<String>}
      - {name: unanswered_operator_items, type: Integer}
      - {name: oldest_unanswered_request_id, type: Optional<String>}
      - {name: oldest_unanswered_age_seconds, type: Optional<Integer>}

entities:
  - name: conductor.observation.Snapshot
    identity:
      name: snapshot_id
      type: conductor.observation.SnapshotId
    fields:
      - name: started_at
        type: Timestamp
      - name: disk_free_bytes
        type: Integer
      - name: failure_reason
        type: Optional<String>
    relations:
      - name: repositories
        kind: owns
        target: conductor.observation.RepositoryObservation
        cardinality: many
        via: snapshot_id
      - name: pull_requests
        kind: owns
        target: conductor.observation.PullRequestObservation
        cardinality: many
        via: snapshot_id
      - name: workflow_runs
        kind: owns
        target: conductor.observation.WorkflowRunObservation
        cardinality: many
        via: snapshot_id
      - name: sessions
        kind: owns
        target: conductor.observation.SessionObservation
        cardinality: many
        via: snapshot_id
      - name: releases
        kind: owns
        target: conductor.observation.ReleaseObservation
        cardinality: many
        via: snapshot_id
      - name: merged_pull_requests
        kind: owns
        target: conductor.observation.MergedPullRequestObservation
        cardinality: many
        via: snapshot_id
    invariants:
      - disk_free_bytes >= 0
    lifecycle:
      initial: Collecting
      states: [Collecting, Complete, Failed]
      terminal: [Complete, Failed]
      transitions:
        - name: complete
          from: [Collecting]
          to: Complete
        - name: fail
          from: [Collecting]
          to: Failed

  - name: conductor.observation.RepositoryObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: visibility
        type: conductor.observation.Visibility
      - name: archived
        type: Boolean
      - name: local_checkout
        type: Boolean
      - name: main_head
        type: conductor.observation.CommitSha
      - name: main_committed_at
        type: Timestamp
      - name: main_commits_7d
        type: Integer
      - name: real_commits_7d
        type: Integer
      - name: behind_main
        type: Integer
      - name: dirty_files
        type: Integer
      - name: worktrees
        type: Integer
      - name: open_issues
        type: Integer
      - name: oldest_open_issue_at
        type: Optional<Timestamp>
      - name: latest_release
        type: Optional<String>
      - name: latest_release_at
        type: Optional<Timestamp>
      - name: unreleased_commits
        type: Optional<Integer>
      - name: planning_store_version
        type: Optional<String>
      # Whether the instance's catalog (`catalog` of `conductor.config.Instance`) names the
      # repository; absent when the instance names no catalog, or its catalog repository has no
      # checkout under the checkouts root.
      - name: in_catalog
        type: Optional<Boolean>
      # The Gates hook installed in the repository's checkout (story:gates-hooks-fresh): the
      # version `<checkout>/.git/b10x-gates-hooks/b10x-gates --version` prints, `unread` when it
      # prints none; absent when the checkout has no such hook, or there is no checkout.
      - name: gates_hooks_version
        type: Optional<String>
      # The version `b10x-gates --version` on `PATH` printed when the repository was observed;
      # absent when none is on `PATH`. A hook whose version differs from it is stale.
      - name: gates_version
        type: Optional<String>
      # The width of the repository's newest wave (story:wave-width), read from its planning
      # store on `origin/main`: how many stories moved to `active` within 10 minutes before the
      # newest move to `active` of any story (the `to: active` entries of `transitions` in
      # `.engineering/planning/story/*.md`), each story once. Absent without a checkout, without
      # stories, or when no story ever moved to `active`.
      - name: wave_width
        type: Optional<Integer>
      # The ready units the store's waves offer when the repository is observed: the stories of
      # the first wave `aep plan artifact waves --kind story --status draft` derives over that
      # store (disjoint scope, no unmet `depends_on`), 0 when it derives none. It is read at the
      # snapshot, not at the newest wave's start. Absent where `wave_width` is, and when `aep`
      # does not answer.
      - name: wave_ready
        type: Optional<Integer>
      # The reason the repository's newest wave page (the highest-numbered `docs/waves/*.md` on
      # `origin/main`) gives for its width: the text after `Width:` on its first line that starts
      # with it. Absent when the page gives none, or there is no page.
      - name: wave_reason
        type: Optional<String>
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: conductor.observation.PullRequestObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: number
        type: Integer
      - name: title
        type: String
      - name: draft
        type: Boolean
      - name: mergeability
        type: conductor.observation.Mergeability
      - name: failing_checks
        type: Integer
      # The names of the checks `failing_checks` counts, in the order the forge answers them
      # (story:pr-check-names): on GitHub each counted rollup entry's `name`, on GitLab
      # `pipeline <id>` for a failed head pipeline. Empty in an observation recorded before the
      # collectors filled it.
      - name: failing_check_names
        type: List<String>
      - name: opened_at
        type: Timestamp
      - name: updated_at
        type: Timestamp
      # The pull or merge request's page on its forge (story:dashboard-overview); absent in an
      # observation recorded before the collectors filled it.
      - name: url
        type: Optional<String>
    invariants:
      - number > 0
      - failing_checks >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One published GitHub Release of a repository, in the 14 days before the snapshot started
  # (story:release-digest).
  - name: conductor.observation.ReleaseObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: tag
        type: String
      - name: published_at
        type: Timestamp
      - name: url
        type: String
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One pull request of a repository merged in the 14 days before the snapshot started
  # (story:release-digest).
  - name: conductor.observation.MergedPullRequestObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: number
        type: Integer
      - name: title
        type: String
      - name: merged_at
        type: Timestamp
      - name: url
        type: String
    invariants:
      - number > 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: conductor.observation.WorkflowRunObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: workflow
        type: String
      - name: conclusion
        type: conductor.observation.RunConclusion
      - name: run_at
        type: Timestamp
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: conductor.observation.SessionObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: harness
        type: conductor.observation.Harness
      - name: session_ref
        type: String
      - name: name
        type: Optional<String>
      - name: cwd
        type: String
      # The repository whose checkout or managed worktree the cwd lies in; absent for the
      # workspace root or anything outside it. That absence is how an unbound session shows (P6).
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
      # The instance role the session's place shows: `conductor` for a session whose cwd is the
      # instance's records directory or lies under it. Absent for every other session; a session
      # outside the checkouts root, their managed trees and the records directory is redacted by
      # design, not by a defect.
      - name: role
        type: Optional<String>
      - name: activity
        type: conductor.observation.SessionState
      # The envelope measured for the session at the box's boundary (story:session-envelope-model),
      # read back once its box was set up, never taken from what was asked for: the provider that
      # set it up; the cgroup the session runs in, its path under the cgroup root; the limits
      # read back from that cgroup, `memory.max` in bytes, `cpu.weight` and `pids.max`, each
      # absent where the file reads `max` or no limit is set; and the places the box lets it
      # write, absolute paths in the order applied, joined by `:` as `PATH` joins directories.
      # `envelope_unboxed` is the reason a session runs unboxed, such as a host without the
      # provider under `confinement.mode: report`; beside it every other envelope field is
      # absent. A partial box, under `report` only, has the provider, cgroup and limits and no
      # `envelope_writable`: no write fence was set up, and its measurement record names why
      # (`fence_missing` of `conductor.session.EnvelopeMeasurement`). The fields are read from
      # that record, `<state>/sessions/<name>.envelope.json`, for the session of that name
      # (story:session-envelope-seam). A session with no envelope field at all was not measured:
      # conductor did not start it, or started it before it measured.
      - name: envelope_provider
        type: Optional<conductor.observation.EnvelopeProvider>
      - name: envelope_cgroup
        type: Optional<String>
      - name: envelope_memory_max
        type: Optional<Integer>
      - name: envelope_cpu_weight
        type: Optional<Integer>
      - name: envelope_tasks_max
        type: Optional<Integer>
      - name: envelope_writable
        type: Optional<String>
      - name: envelope_unboxed
        type: Optional<String>
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One open blocker artifact in a repository's AEP store, read through `aep plan workspace list`
  # over the organization-wide workspace file. The open decision-blockers among them are the
  # decision queue (design § 6).
  - name: conductor.observation.BlockerObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: reference
        type: String
      - name: blocker_kind
        type: String
      - name: title
        type: String
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One repository's ESS specification status, for every repository the instance tracks from
  # any source: read at origin/main, or at HEAD for a local source's. Present means an
  # `ess-inputs.yaml` or `system.yaml` outside build output; OptedOut means the repository's
  # AGENTS.md records an ESS opt-out; Missing means neither; NotInWorkspace means the repository
  # is listed, not archived, and no member of the workspace file has it as its source, so nothing
  # was read (story:snapshot-unlisted-repository).
  - name: conductor.observation.SpecificationObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: presence
        type: conductor.observation.SpecificationPresence
      # The specification root, relative to the repository.
      - name: path
        type: Optional<String>
      # The `format:` of system.yaml, such as `ess/22`.
      - name: format
        type: Optional<String>
      # The `requires:` of ess-inputs.yaml, such as `ess 0.53`.
      - name: required_ess
        type: Optional<String>
      # `ess specify validate` with the newest ess release.
      - name: validation
        type: conductor.observation.ValidationResult
      - name: validation_refusals
        type: Integer
      # `ess verify conform synthesize`: scenarios the specification obliges, and refusals.
      - name: scenarios
        type: Optional<Integer>
      - name: synthesis_refusals
        type: Optional<Integer>
      # Status of the repository's `executable-system-specification` artifact in its AEP store
      # (draft, validated, conforming), absent when it has none.
      - name: conformance_status
        type: Optional<String>
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
    invariants:
      - validation_refusals >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One window of one account's usage, as the instance's usage probe (`usage.probe`) printed it
  # in one snapshot (story:usage-probe): when the probe was read, the account by its id and
  # nothing else (never an e-mail address or a name), whether it is the account in use, its
  # health as the probe names it (`exhausted` is an account with nothing left), the window's
  # name (such as `five_hour` or `seven_day`), the whole percent of it used, and when it resets,
  # absent when the probe names no time. An account the probe prints without a window is not
  # recorded.
  - name: conductor.observation.UsageObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: read_at
        type: Timestamp
      - name: account
        type: String
      - name: active
        type: Boolean
      - name: health
        type: String
      - name: window
        type: String
      - name: used_percent
        type: Integer
      - name: resets_at
        type: Optional<Timestamp>
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
    invariants:
      - used_percent >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One workspace member a collector could not read in one snapshot (story:snapshot-member-failures):
  # its fetch, its export or a command over its specification failed twice, or did not answer in
  # time. The collector records it here and goes on with the other members, so the snapshot
  # completes with their rows. `member` is the member's repository, as its other rows name it;
  # `collector` the collector's name (`blockers`, `specifications`); `error_line` the first line
  # of the error, the command and what it printed first.
  - name: conductor.observation.MemberFailureObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: member
        type: conductor.observation.RepositoryName
      - name: collector
        type: String
      - name: error_line
        type: String
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One collector's run in one snapshot (story:snapshot-duration): when it started, how long it
  # took in milliseconds, and how it ended. The driver records one per collector it ran, so the
  # collector a slow snapshot spends its time in can be named. `read_bytes` and `written_bytes`
  # are what the snapshot's process read and wrote while the collector ran, its records kept
  # included (story:snapshot-store-cost); absent where the system does not report them, and on a
  # run recorded before they were.
  - name: conductor.observation.CollectorRunObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: collector
        type: String
      - name: started_at
        type: Timestamp
      - name: duration_ms
        type: Integer
      - name: outcome
        type: conductor.observation.CollectorRunOutcome
      - name: read_bytes
        type: Optional<Integer>
      - name: written_bytes
        type: Optional<Integer>
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
    invariants:
      - duration_ms >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One secret sync of the instance in one snapshot (story:policy-secret-drift), as the config's
  # `secret_syncs` names it: `sync` is its name; `repository`, `branch` and `path` its source;
  # `source_committed_at` the committer time of the last commit on `origin/<branch>` that touched
  # the path, in the source's checkout under `checkouts.root`; `secrets_updated_at` the oldest
  # `updated_at` of the secrets it feeds, as GitHub answers it; `error_line` the first line of the
  # first read that failed, which leaves the time it would have read absent. The board names the
  # sync `secret stale: <sync>` on its repository's row when the source was committed after the
  # oldest secret was written, and `secret unread: <sync>` when a read failed.
  - name: conductor.observation.SecretSyncObservation
    identity:
      name: observation_id
      type: conductor.observation.ObservationId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: sync
        type: String
      - name: repository
        type: conductor.observation.RepositoryName
      - name: branch
        type: String
      - name: path
        type: String
      - name: source_committed_at
        type: Optional<Timestamp>
      - name: secrets_updated_at
        type: Optional<Timestamp>
      - name: error_line
        type: Optional<String>
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # STATUS.md as published from one complete snapshot, compared with the previous one.
  - name: conductor.observation.Board
    identity:
      name: board_id
      type: conductor.observation.BoardId
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: previous_snapshot_id
        type: Optional<conductor.observation.SnapshotId>
      - name: deviation_rows
        type: Integer
      - name: path
        type: String
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
      - name: previous_snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: previous_snapshot_id
    invariants:
      - deviation_rows >= 0
    lifecycle:
      initial: Published
      states: [Published]
      terminal: [Published]

  # One day of one chart series for one group (story:dashboard-history): what the dashboard's
  # `/api/series` reads. Each snapshot that completes updates the rollups of the days its data
  # covers, from the data the store holds (the snapshot's observations and the one before it, the
  # dispatch, decision and guard records and the host ledger). It is not an observation: it is
  # kept in `state/series/`, whatever `retention.snapshots` drops, so the series reach back past
  # the snapshots kept. `series` is the series' name (`prs_merged`); `day` the UTC date
  # (`YYYY-MM-DD`); `by` the dimension it is grouped by (`repository`, `workflow`, `rule`, or
  # `total` for a series without one) and `key` the group (a repository name, a workflow, a tool,
  # or `total`). `items` names what the rollup counts, one id each (`alpha#12`), with its measure
  # after `=` for a series of durations (`D-7=2.5`), and a run's recorded peak and reserved bytes
  # for `disk_peak_vs_reserved` (`G-3=512/1024`, story:dashboard-disk-series, from released
  # reservations of the host ledger): a later snapshot adds the items it sees to
  # those kept, so a rollup never forgets an item that left the snapshot's window. `value` is the
  # number of items. `snapshot_id` is the snapshot whose completion last changed it.
  - name: conductor.observation.DailySeries
    identity:
      name: daily_series_id
      type: conductor.observation.DailySeriesId
    fields:
      - name: series
        type: String
      - name: day
        type: String
      - name: by
        type: String
      - name: key
        type: String
      - name: value
        type: Decimal
      - name: items
        type: List<String>
      - name: snapshot_id
        type: conductor.observation.SnapshotId
    relations:
      - name: snapshot
        kind: references
        target: conductor.observation.Snapshot
        cardinality: one
        via: snapshot_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

actors:
  - name: conductor.observation.Collector
    may:
      - conductor.observation.StartSnapshot
      - conductor.observation.RecordRepository
      - conductor.observation.RecordPullRequest
      - conductor.observation.RecordRelease
      - conductor.observation.RecordMergedPullRequest
      - conductor.observation.RecordWorkflowRun
      - conductor.observation.RecordSession
      - conductor.observation.RecordBlocker
      - conductor.observation.RecordSpecification
      - conductor.observation.RecordMemberFailure
      - conductor.observation.RecordCollectorRun
      - conductor.observation.CompleteSnapshot
      - conductor.observation.FailSnapshot
      - conductor.observation.PublishBoard
      - conductor.observation.RecordDailySeries
      - conductor.observation.ReviseDailySeries
    naming:
      display: Collector

errors:
  - name: conductor.observation.SnapshotNotCollecting
    summary: The snapshot is complete or failed, so it takes no more observations and cannot change state.
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId

  - name: conductor.observation.SnapshotNotFound
    summary: No snapshot has this id.
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId

  - name: conductor.observation.SnapshotNotComplete
    summary: The snapshot is collecting or failed, so no board is published from it.
    fields:
      - name: snapshot_id
        type: conductor.observation.SnapshotId

  - name: conductor.observation.DailySeriesExists
    summary: A rollup already has this id; it is revised, not recorded again.
    fields:
      - name: daily_series_id
        type: conductor.observation.DailySeriesId

  - name: conductor.observation.DailySeriesNotFound
    summary: No rollup has this id.
    fields:
      - name: daily_series_id
        type: conductor.observation.DailySeriesId

  - name: conductor.observation.InvalidCount
    summary: A count was negative.
    fields:
      - name: count
        type: Integer

  - name: conductor.observation.InvalidPullRequestNumber
    summary: A pull request number was not positive.
    fields:
      - name: number
        type: Integer

commands:
  - name: conductor.observation.StartSnapshot
    naming:
      wire: start-snapshot
      display: Start a snapshot
    input:
      - name: started_at
        type: Timestamp
      - name: disk_free_bytes
        type: Integer
      # The seconds each collector may run (story:snapshot-duration): one that runs past them is
      # stopped, its run recorded `OverBudget`, and the snapshot goes on with the next. None when
      # absent. Read by the driver; the snapshot does not keep it.
      - name: budget
        type: Optional<Integer>
        example: 120
    outcomes:
      - name: negative-disk
        when: disk_free_bytes < 0
        error: conductor.observation.InvalidCount
        payload:
          conductor.observation.InvalidCount:
            count: input.disk_free_bytes
        summary: Free disk is never negative; no snapshot started.
      - name: started
        creates: conductor.observation.Snapshot
        instance: snapshot_id
        sets:
          started_at: input.started_at
          disk_free_bytes: input.disk_free_bytes
        emits:
          - conductor.observation.SnapshotStarted
        payload:
          conductor.observation.SnapshotStarted:
            snapshot_id: {generated: true}
            started_at: input.started_at
        summary: A snapshot is collecting.

  - name: conductor.observation.RecordRepository
    naming:
      wire: record-repository
      display: Record a repository
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: visibility
        type: conductor.observation.Visibility
      - name: archived
        type: Boolean
        example: false
      - name: local_checkout
        type: Boolean
        example: true
      - name: main_head
        type: conductor.observation.CommitSha
        example: "0a1b2c3"
      - name: main_committed_at
        type: Timestamp
        example: "2026-10-01T00:00:00Z"
      - name: main_commits_7d
        type: Integer
        example: 7
      - name: real_commits_7d
        type: Integer
        example: 3
      - name: behind_main
        type: Integer
        example: 2
      - name: dirty_files
        type: Integer
        example: 4
      - name: worktrees
        type: Integer
        example: 5
      - name: open_issues
        type: Integer
        example: 6
      - name: oldest_open_issue_at
        type: Optional<Timestamp>
        example: "2026-10-05T08:00:00Z"
      - name: latest_release
        type: Optional<String>
        example: "0.1.0"
      - name: latest_release_at
        type: Optional<Timestamp>
        example: "2026-10-01T12:00:00Z"
      - name: unreleased_commits
        type: Optional<Integer>
        example: 8
      - name: planning_store_version
        type: Optional<String>
        example: "aep.project/5"
      - name: in_catalog
        type: Optional<Boolean>
        example: true
      - name: gates_hooks_version
        type: Optional<String>
        example: "0.1.14"
      - name: gates_version
        type: Optional<String>
        example: "0.1.17"
      # The newest wave's width, the ready units and the wave page's reason (story:wave-width);
      # the board names `narrow wave` when the width is under both the ready units and
      # `controllers.max_subagents` and the page gives no reason.
      - name: wave_width
        type: Optional<Integer>
        example: 2
      - name: wave_ready
        type: Optional<Integer>
        example: 5
      - name: wave_reason
        type: Optional<String>
        example: "two units share the store crate"
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.RepositoryObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          repository: input.repository
          visibility: input.visibility
          archived: input.archived
          local_checkout: input.local_checkout
          main_head: input.main_head
          main_committed_at: input.main_committed_at
          main_commits_7d: input.main_commits_7d
          real_commits_7d: input.real_commits_7d
          behind_main: input.behind_main
          dirty_files: input.dirty_files
          worktrees: input.worktrees
          open_issues: input.open_issues
          oldest_open_issue_at: input.oldest_open_issue_at
          latest_release: input.latest_release
          latest_release_at: input.latest_release_at
          unreleased_commits: input.unreleased_commits
          planning_store_version: input.planning_store_version
          in_catalog: input.in_catalog
          gates_hooks_version: input.gates_hooks_version
          gates_version: input.gates_version
          wave_width: input.wave_width
          wave_ready: input.wave_ready
          wave_reason: input.wave_reason
        emits:
          - conductor.observation.RepositoryRecorded
        payload:
          conductor.observation.RepositoryRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            repository: input.repository
        summary: The repository's state at this snapshot is recorded.

  - name: conductor.observation.RecordPullRequest
    naming:
      wire: record-pull-request
      display: Record a pull request
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: number
        type: Integer
      - name: title
        type: String
        example: "title"
      - name: draft
        type: Boolean
      - name: mergeability
        type: conductor.observation.Mergeability
      - name: failing_checks
        type: Integer
        example: 3
      # The names of the failing checks, as on `PullRequestObservation` (story:pr-check-names).
      - name: failing_check_names
        type: List<String>
      - name: opened_at
        type: Timestamp
        example: "2026-09-01T00:00:00Z"
      - name: updated_at
        type: Timestamp
        example: "2026-10-01T00:00:00Z"
      - name: url
        type: Optional<String>
        example: "https://github.com/example-org/x/pull/7"
    outcomes:
      - name: invalid-number
        when: number <= 0
        error: conductor.observation.InvalidPullRequestNumber
        payload:
          conductor.observation.InvalidPullRequestNumber:
            number: input.number
        summary: A pull request number is positive; nothing was recorded.
      - name: negative-checks
        when: failing_checks < 0
        error: conductor.observation.InvalidCount
        payload:
          conductor.observation.InvalidCount:
            count: input.failing_checks
        summary: A failing-check count is never negative; nothing was recorded.
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.PullRequestObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          repository: input.repository
          number: input.number
          title: input.title
          draft: input.draft
          mergeability: input.mergeability
          failing_checks: input.failing_checks
          failing_check_names: input.failing_check_names
          opened_at: input.opened_at
          updated_at: input.updated_at
          url: input.url
        emits:
          - conductor.observation.PullRequestRecorded
        payload:
          conductor.observation.PullRequestRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            repository: input.repository
            number: input.number
        summary: The open pull request and its checks are recorded.

  - name: conductor.observation.RecordRelease
    naming:
      wire: record-release
      display: Record a release
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: tag
        type: String
        example: "v0.2.0"
      - name: published_at
        type: Timestamp
        example: "2026-10-05T10:00:00Z"
      - name: url
        type: String
        example: "https://github.com/example-org/x/releases/tag/v0.2.0"
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.ReleaseObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          repository: input.repository
          tag: input.tag
          published_at: input.published_at
          url: input.url
        emits:
          - conductor.observation.ReleaseRecorded
        payload:
          conductor.observation.ReleaseRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            repository: input.repository
            tag: input.tag
        summary: The published release, its date and its link are recorded.

  - name: conductor.observation.RecordMergedPullRequest
    naming:
      wire: record-merged-pull-request
      display: Record a merged pull request
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: number
        type: Integer
      - name: title
        type: String
        example: "title"
      - name: merged_at
        type: Timestamp
        example: "2026-10-04T09:00:00Z"
      - name: url
        type: String
        example: "https://github.com/example-org/x/pull/12"
    outcomes:
      - name: invalid-number
        when: number <= 0
        error: conductor.observation.InvalidPullRequestNumber
        payload:
          conductor.observation.InvalidPullRequestNumber:
            number: input.number
        summary: A pull request number is positive; nothing was recorded.
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.MergedPullRequestObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          repository: input.repository
          number: input.number
          title: input.title
          merged_at: input.merged_at
          url: input.url
        emits:
          - conductor.observation.MergedPullRequestRecorded
        payload:
          conductor.observation.MergedPullRequestRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            repository: input.repository
            number: input.number
        summary: The merged pull request, when it merged and its link are recorded.

  - name: conductor.observation.RecordWorkflowRun
    naming:
      wire: record-workflow-run
      display: Record a workflow run
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: workflow
        type: String
      - name: conclusion
        type: conductor.observation.RunConclusion
      - name: run_at
        type: Timestamp
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.WorkflowRunObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          repository: input.repository
          workflow: input.workflow
          conclusion: input.conclusion
          run_at: input.run_at
        emits:
          - conductor.observation.WorkflowRunRecorded
        payload:
          conductor.observation.WorkflowRunRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            repository: input.repository
            workflow: input.workflow
        summary: The latest main-branch run of one workflow is recorded.

  - name: conductor.observation.RecordSession
    naming:
      wire: record-session
      display: Record a session
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: harness
        type: conductor.observation.Harness
      - name: session_ref
        type: String
        example: "session-1"
      - name: name
        type: Optional<String>
        example: "name"
      - name: cwd
        type: String
        example: "~/example-org/x"
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
      - name: role
        type: Optional<String>
        example: "conductor"
      - name: activity
        type: conductor.observation.SessionState
      - name: envelope_provider
        type: Optional<conductor.observation.EnvelopeProvider>
      - name: envelope_cgroup
        type: Optional<String>
        example: "/example.slice/example-x.service"
      - name: envelope_memory_max
        type: Optional<Integer>
      - name: envelope_cpu_weight
        type: Optional<Integer>
      - name: envelope_tasks_max
        type: Optional<Integer>
      - name: envelope_writable
        type: Optional<String>
        example: "~/example-org/x:/tmp"
      - name: envelope_unboxed
        type: Optional<String>
        example: "no provider on this host"
    outcomes:
      - name: no-such-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: conductor.observation.SnapshotNotFound
        payload:
          conductor.observation.SnapshotNotFound:
            snapshot_id: input.snapshot_id
        summary: No snapshot has this id, and nothing was recorded.
      - name: closed
        when_related: {via: input.snapshot_id, predicate: state != Collecting}
        error: conductor.observation.SnapshotNotCollecting
        payload:
          conductor.observation.SnapshotNotCollecting:
            snapshot_id: input.snapshot_id
        summary: The snapshot is not collecting, and nothing was recorded.
      - name: recorded
        creates: conductor.observation.SessionObservation
        instance: observation_id
        sets:
          snapshot_id: input.snapshot_id
          harness: input.harness
          session_ref: input.session_ref
          name: input.name
          cwd: input.cwd
          repository: input.repository
          role: input.role
          activity: input.activity
          envelope_provider: input.envelope_provider
          envelope_cgroup: input.envelope_cgroup
          envelope_memory_max: input.envelope_memory_max
          envelope_cpu_weight: input.envelope_cpu_weight
          envelope_tasks_max: input.envelope_tasks_max
          envelope_writable: input.envelope_writable
          envelope_unboxed: input.envelope_unboxed
        emits:
          - conductor.observation.SessionRecorded
        payload:
          conductor.observation.SessionRecorded:
            observation_id: {generated: true}
            snapshot_id: input.snapshot_id
            harness: input.harness
            session_ref: input.session_ref
        summary: The live session, where it runs and which repository it is bound to are recorded.

  - name: conductor.observation.RecordBlocker
    naming:
      wire: record-blocker
      display: Record a blocker
    input:
      - name: snapshot_id
        type: conductor.observation.SnapshotId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: reference
        type: String
      - name: blocker_kind
