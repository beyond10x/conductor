# docs/design/architecture-next.md § 4 and § 6: conductord opens an instance's box at its
# placement through the placement's substrate daemon, and the box is on record as Opened.
# conductord acts on its own account, so the actor is `{kind: Daemon}`.
type: ess-scenario/1
domain: conductor.placement
scenario: placement-open-box
summary: conductord opens a box for an instance at its placement, and the box is on record as Opened with its placement, instance and time.

arrange:
  - instance: box
    entity: conductor.placement.Box

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.placement.OpenBox
    actor: conductor.placement.Conductord
    input:
      actor: {kind: Daemon}
      placement: example-org-local
      instance: example-org
      at: 2026-11-08T09:00:00Z
    outcome: opened
    capture: {instance: box, event: conductor.placement.BoxOpened, field: box_id}

assert:
  - view: conductor.placement.Boxes
    contains:
      box_id: {$instance: box}
      state: Opened
      placement: example-org-local
      instance: example-org
      opened_at: 2026-11-08T09:00:00Z
