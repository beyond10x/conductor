domain: conductor.direction

summary: >
  The goals conductor dispatches against, and which repositories it processes. A goal is proposed
  by conductor, confirmed or dropped by the operator, and marked met by conductor on the evidence it
  names; NORTHSTAR.md in conductor's records is the prose view. Each goal lists the repositories whose
  work serves it. A repository mark overrides computed activity (design § 10).

naming:
  wire: direction
  display: Direction

types:
  - name: conductor.direction.GoalId
    kind: newtype
    of: String

  - name: conductor.direction.Activity
    kind: enum
    variants: [Active, Inactive]

  # Who set a repository's mark: conductor, the operator, or a repository controller
  # (story:marked-by-session).
  - name: conductor.direction.MarkedBy
    kind: enum
    variants: [Conductor, Operator, Controller]

  - name: conductor.direction.ServingId
    kind: newtype
    of: Uuid

  - name: conductor.direction.MarkedRepository
    kind: newtype
    of: String

  # What decided a repository's activity: its `RepositoryMark`, or, without one, the newest
  # complete snapshot's observation of it.
  - name: conductor.direction.DecidedBy
    kind: enum
    variants: [Mark, Snapshot]

  # One row of `conductor repository activity`: a repository's effective activity, computed when it
  # is read and never stored. Each repository the newest complete snapshot observed and each
  # repository that holds a mark has one. A mark decides its repository's activity and gives
  # `marked_by` and `reason`; without one, activity is computed from the snapshot (Active when
  # `real_commits_7d` is at least 1 and the repository is not archived), and both are absent.
  - name: conductor.direction.RepositoryActivityRow
    kind: struct
    fields:
      - {name: repository, type: conductor.direction.MarkedRepository}
      - {name: activity, type: conductor.direction.Activity}
      - {name: decided_by, type: conductor.direction.DecidedBy}
      - {name: marked_by, type: Optional<conductor.direction.MarkedBy>}
      - {name: reason, type: Optional<String>}

  # The input of `conductor repository activity`. `format` is one of text, json, jsonl, markdown,
  # read by the handler.
  - name: conductor.direction.RepositoryActivity
    kind: struct
    fields:
      - {name: format, type: Optional<String>}

  # One row of the `Rules` view (`conductor rules show`): one numbered item of the instance's
  # `rules.md` in its records directory, read when it is asked for and never stored. An item is a
  # line that opens with its number and `. ` at the start of the line, and every line after it up
  # to the next such line, the next heading or the next line that starts at the margin; blank lines
  # at its end are not part of it. `text` is the item byte for byte as the file holds it, ending in
  # a newline. `title` is its bold lead without the asterisks, or else its first sentence, without
  # a final full stop. `section` is the path of headings above it, outermost first, joined by
  # ` / `; the file's title, its `#` heading, is no section. `source` is what follows its
  # `Source:` line, on one line, when it has one.
  - name: conductor.direction.RulesRow
    kind: struct
    fields:
      - {name: item, type: Integer}
      - {name: title, type: String}
      - {name: section, type: String}
      - {name: source, type: Optional<String>}
      - {name: text, type: String}

  # The input of the `Rules` view, `conductor rules show`. It reads `rules.md` only: it writes
  # nothing and opens no store. `item` is a comma-separated list of item numbers, printed in the
  # order given wherever they sit in the file; `section` is a heading, matched without regard to
  # case, and prints every item under each heading of that text, its subsections' included, in
  # file order. A role's name and its old name (`conductor.config.RoleName`) match each other's
  # heading for one release, `director` a heading `conductor`, `maintainer` one `conductor-dev`
  # and `lead` one `controller` or `repository controller`, and a heading matched by the other
  # name is noted on standard error (story:role-name-aliases); without either it prints every item, and both together are refused. `format` is
  # text (the items verbatim, one blank line between two) or json (a list of `RulesRow`). A number
  # no item holds, or a heading the file does not hold, is refused (`RulesRefused`) and nothing is
  # printed. `brief` prints, instead of each item verbatim, one line per item: its number, `. ` and
  # its `title` (`RulesRow`), so a session reads a section's titles and asks for an item whole with
  # `item` (story:conductor-context-budget); with `format` json it is refused, a row already
  # carrying its `title`. `changed_since` is a git revision of the records directory: of the items
  # selected, only those whose text differs from the item of that number in that revision's
  # `rules.md`, or that it does not hold, are printed, and the numbers it held that the file no
  # longer holds are named on one line of standard error; a revision that does not resolve is
  # refused (`RevisionNotFound`) and nothing is printed. `role` (story:rules-into-code) is a role's
  # name, `all`, `conductor`, `controller`, `worker` or `maintainer`: it reads that role's rule
  # file, `rules/<role>.md` in the records directory, instead of `rules.md`, and prints its rules
  # (the lines that open with `- ` or a number and `. `) one per line; with `changed_since` only
  # the rules that revision's file of the role does not hold. It is refused with `item`,
  # `section`, `brief` or `format` json, and for a name that is no role; a role whose file the
  # records do not hold is refused (`RuleRoleNotFound`).
  - name: conductor.direction.Rules
    kind: struct
    fields:
      - {name: item, type: Optional<String>}
      - {name: section, type: Optional<String>}
      - {name: format, type: Optional<String>}
      - {name: brief, type: Optional<Boolean>}
      - {name: changed_since, type: Optional<String>}
      - {name: role, type: Optional<String>}

  # Why `conductor rules show` printed nothing and exited 1: `RuleItemNotFound`, no item of
  # rules.md has a number it was given; `RuleSectionNotFound`, no heading has the text it was
  # given; `RevisionNotFound`, the records directory's git does not resolve the revision
  # `changed_since` names.
  - name: conductor.direction.RulesRefusal
    kind: enum
    variants: [RuleItemNotFound, RuleSectionNotFound, RevisionNotFound, RuleRoleNotFound]

  # The refusal of `conductor rules show`: its kind, and what it names (the item number or the
  # heading the file does not hold).
  - name: conductor.direction.RulesRefused
    kind: struct
    fields:
      - {name: refusal, type: conductor.direction.RulesRefusal}
      - {name: detail, type: String}

  # The input of `conductor need new` (story:need-id-unique). It prints the next id no earlier NEED
  # used, `N-<yyyymmdd>-<nn>` (at least two digits, counted from 01 for the day), and keeps it in
  # the state directory, so two calls never print the same id, a restart included. An id the
  # records' hand-overs, decisions or dispatches already cite for that day is skipped too. `day`
  # is the UTC date, `yyyy-mm-dd`, the id is minted for; without it, today. A `day` that is no
  # date is refused on one line of standard error naming it, and nothing is kept.
  - name: conductor.direction.NewNeed
    kind: struct
    fields:
      - {name: day, type: Optional<String>}

  # The columns of the dashboard's Plan page (story:dashboard-plan-board), each over the statuses
  # of the planning store's story lifecycle: `Draft`, `draft`; `Proposed`, `proposed`;
  # `Accepted`, `active` and not started; `InProgress`, `active` and started (tagged `started`,
  # or with evidence recorded about it); `Done`, `implemented`. A story at any other status
  # (`rejected`, `archived`) is on no column.
  - name: conductor.direction.PlanColumn
    kind: enum
    variants: [Draft, Proposed, Accepted, InProgress, Done]

  # One story of the Plan page: its id and title, its status in the store, its column, its lane
  # (the wave `aep plan artifact waves` derives for it among the stories of its status, `next`
  # for the first, `unplanned` for one with no scope), whether the operator made it important
  # (tagged `p1`: it is shown first, in the lane `next`) and whether it is started.
  - name: conductor.direction.PlanCard
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: title, type: String}
      - {name: status, type: String}
      - {name: column, type: conductor.direction.PlanColumn}
      - {name: lane, type: String}
      - {name: important, type: Boolean}
      - {name: started, type: Boolean}

  # The view the Plan page reads, `GET /api/plan?repository=<name>` (story:dashboard-plan-board):
  # the checkouts under the instance's checkouts root that hold a planning store
  # (`.engineering/planning`), the one shown (the one asked for, else the first), its stories as
  # cards, and the problems reading them. A view: it runs only `aep plan artifact` verbs that
  # read, and writes and creates nothing.
  - name: conductor.direction.PlanBoard
    kind: struct
    fields:
      - {name: repositories, type: List<String>}
      - {name: repository, type: String}
      - {name: cards, type: List<conductor.direction.PlanCard>}
      - {name: errors, type: List<String>}

  # One line of a story's Acceptance section, and whether evidence recorded about the story
  # names it: an evidence record's source holds one of the line's code spans.
  - name: conductor.direction.PlanAcceptanceLine
    kind: struct
    fields:
      - {name: text, type: String}
      - {name: evidence, type: Boolean}

  # One entry of a story's history (`aep plan artifact history`): when, by whom, and what.
  - name: conductor.direction.PlanEvent
    kind: struct
    fields:
      - {name: at, type: String}
      - {name: actor, type: String}
      - {name: what, type: String}

  # One story as the Plan page's drawer reads it, `GET /api/plan/story?repository=&id=`: its Why
  # and Acceptance sections, its scope (the store's scope entries, else its Scope section), its
  # history, the statuses its lifecycle lets it move to from where it is, and its comments.
  - name: conductor.direction.PlanStory
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: title, type: String}
      - {name: status, type: String}
      - {name: column, type: Optional<conductor.direction.PlanColumn>}
      - {name: why, type: String}
      - {name: acceptance, type: List<conductor.direction.PlanAcceptanceLine>}
      - {name: scope, type: List<String>}
      - {name: history, type: List<conductor.direction.PlanEvent>}
      - {name: moves, type: List<String>}
      - {name: comments, type: String}
      - {name: important, type: Boolean}
      - {name: started, type: Boolean}

  # What the operator does to a story from the Plan page: `Move` it to the status `to`
  # (`aep plan artifact move`: Approve is `active`, Reject `rejected`); `Start` an accepted one
  # (tagged `started`: the story lifecycle has no in-progress status to move it to);
  # `Important` and `Unimportant` (tagged `p1`, or the tag taken off); `Comment`, the operator's
  # `text` appended to the story's `Comments` section.
  - name: conductor.direction.PlanAction
    kind: enum
    variants: [Move, Start, Important, Unimportant, Comment]

  # The Plan page's write, `POST /api/plan` (story:dashboard-plan-board), taken as every write of
  # the dashboard is, through the one path the Configuration page's write takes: from the page's
  # own origin on 127.0.0.1, with the token it was served with, as JSON of a bounded length, one
  # write at a time. It runs the one `aep plan artifact` verb the action needs in the
  # repository's checkout; a verb the store refuses changes nothing and records nothing. One
  # that succeeds records one decision (`conductor.decision.RecordOperatorDecision`): class C,
  # decided by the operator, recorded by `dashboard`, the verb and the store's answer as its
  # evidence.
  - name: conductor.direction.WritePlan
    kind: struct
    fields:
      - {name: repository, type: String}
      - {name: id, type: String}
      - {name: action, type: conductor.direction.PlanAction}
      - {name: to, type: Optional<String>}
      - {name: text, type: Optional<String>}

  # What the write answers: the story, its status after it, the decision recorded, and the
  # store's answer.
  - name: conductor.direction.PlanWritten
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: status, type: String}
      - {name: decision_id, type: conductor.decision.DecisionId}
      - {name: detail, type: String}

  # Why the Plan page's write was refused; a refusal changes nothing. `NotThisPage`, not from
  # this server's page on 127.0.0.1: 403; `TokenMissing`, no token or not the page's: 403;
  # `UnknownRepository`, no checkout of that name holds a planning store: 404; `UnknownStory`,
  # the store holds no story of that id: 404; `MoveRefused`, the store's lifecycle refuses the
  # move, with the store's own reason: 409; `ActionInvalid`, a `Move` without `to`, a `Comment`
  # without text, or a `Start` of a story that is not accepted: 422; `StoreFailed`, `aep` did
  # not run or failed otherwise: 500.
  - name: conductor.direction.PlanWriteRefusal
    kind: enum
    variants:
      [NotThisPage, TokenMissing, UnknownRepository, UnknownStory, MoveRefused, ActionInvalid,
       StoreFailed]

  # A refusal of the Plan page's write: why, and the store's or the server's words.
  - name: conductor.direction.PlanWriteRefused
    kind: struct
    fields:
      - {name: refusal, type: conductor.direction.PlanWriteRefusal}
      - {name: detail, type: String}

entities:
  # An override of whether conductor processes a repository's GitHub issues and pull requests
  # (design § 10). Without a mark, activity is computed from the newest
  # complete snapshot: Active when `real_commits_7d` is at least 1 and the repository is not
  # archived. A mark, set by the operator, by conductor or by a controller with a reason, wins over
  # that computation and is never overwritten by it, for example for a repository superseded by
  # another. `session` is the name of the session that set the mark, when the command named one
  # (story:marked-by-session); each command that sets the mark sets it, so it never names the
  # session of an earlier one.
  - name: conductor.direction.RepositoryMark
    identity:
      name: repository
      type: conductor.direction.MarkedRepository
    fields:
      - name: marked_by
        type: conductor.direction.MarkedBy
      # `marked_by` is the role that set the mark, by name, as before; `actor` is the typed actor that
      # set it, rewritten wherever `marked_by` is (design architecture-next.md § 3, Actors).
      - name: actor
        type: conductor.operator.Actor
      - name: session
        type: Optional<String>
      - name: reason
        type: String
    lifecycle:
      initial: Inactive
      states: [Active, Inactive]
      terminal: []
      transitions:
        - name: activate
          from: [Inactive]
          to: Active
        - name: deactivate
          from: [Active]
          to: Inactive

  - name: conductor.direction.Goal
    identity:
      name: goal_id
      type: conductor.direction.GoalId
    fields:
      - name: actor
        type: conductor.operator.Actor
      - name: title
        type: String
      - name: exit_evidence
        type: String
      # The evidence MarkGoalMet was given; absent until the goal is met.
      - name: evidence
        type: Optional<String>
      # The reason DropGoal was given; absent unless the goal was dropped.
      - name: reason
        type: Optional<String>
    relations:
      - name: servings
        kind: owns
        target: conductor.direction.GoalServing
        cardinality: many
        via: goal_id
    lifecycle:
      initial: Draft
      states: [Draft, Confirmed, Met, Dropped]
      terminal: [Met, Dropped]
      transitions:
        - name: confirm
          from: [Draft]
          to: Confirmed
        - name: meet
          from: [Confirmed]
          to: Met
        - name: drop
          from: [Draft, Confirmed]
          to: Dropped

  # One repository whose work serves a goal: the "serving repositories" column of NORTHSTAR.md's
  # goal table. A goal with none is idle; active work in a repository serving no goal is a
  # deviation (design § 4, compare).
  - name: conductor.direction.GoalServing
    identity:
      name: serving_id
      type: conductor.direction.ServingId
    fields:
      - name: actor
        type: conductor.operator.Actor
      - name: goal_id
        type: conductor.direction.GoalId
      - name: repository
        type: conductor.observation.RepositoryName
    lifecycle:
      initial: Serving
      states: [Serving, Removed]
      terminal: [Removed]
      transitions:
        - name: remove
          from: [Serving]
          to: Removed

actors:
  - name: conductor.direction.Operator
    may:
      - conductor.direction.ConfirmGoal
      - conductor.direction.DropGoal
      - conductor.direction.MarkRepository
      - conductor.direction.ActivateRepository
      - conductor.direction.DeactivateRepository
    naming:
      display: Operator

  - name: conductor.direction.Conductor
    may:
      - conductor.direction.ProposeGoal
      - conductor.direction.MarkGoalMet
      - conductor.direction.AddServing
      - conductor.direction.RemoveServing
      - conductor.direction.MarkRepository
      - conductor.direction.ActivateRepository
      - conductor.direction.DeactivateRepository
    naming:
      display: Conductor

errors:
  - name: conductor.direction.RepositoryMarkNotFound
    summary: The repository has no mark yet; mark it first.
    fields:
      - name: repository
        type: conductor.direction.MarkedRepository

  - name: conductor.direction.RepositoryMarkConflict
    summary: The repository already holds that mark, so nothing moved.
    fields:
      - name: repository
        type: conductor.direction.MarkedRepository

  - name: conductor.direction.RepositoryAlreadyMarked
    summary: >
      The repository already holds a mark, so nothing was written; activate-repository or
      deactivate-repository changes it.
    fields:
      - name: repository
        type: conductor.direction.MarkedRepository

  - name: conductor.direction.GoalStateConflict
    summary: The goal is not in a state this command acts from, so nothing moved.
    fields:
      - name: goal_id
        type: conductor.direction.GoalId

  - name: conductor.direction.GoalNotFound
    summary: No goal has this id.
    fields:
      - name: goal_id
        type: conductor.direction.GoalId

  - name: conductor.direction.GoalExists
    summary: A goal already has this id, so nothing was proposed.
    fields:
      - name: goal_id
        type: conductor.direction.GoalId

  - name: conductor.direction.InvalidGoalId
    summary: >
      The goal id is empty or longer than 170 UTF-8 bytes. The store keeps a goal under its id with
      every byte escaped to at most 3, and keeps at most 512, so no goal can have this id and
      nothing moved.
    fields:
      - name: goal_id
        type: conductor.direction.GoalId

  - name: conductor.direction.ServingNotFound
    summary: No serving repository has this id.
    fields:
      - name: serving_id
        type: conductor.direction.ServingId

  - name: conductor.direction.ServingStateConflict
    summary: The repository was already removed from the goal.
    fields:
      - name: serving_id
        type: conductor.direction.ServingId

commands:
  - name: conductor.direction.MarkRepository
    naming:
      wire: mark-repository
      display: Mark a repository for the first time
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: repository
        type: conductor.direction.MarkedRepository
      - name: activity
        type: conductor.direction.Activity
      - name: marked_by
        type: conductor.direction.MarkedBy
      - name: session
        type: Optional<String>
      - name: reason
        type: String
    outcomes:
      - name: already-marked
        existing_instance: true
        error: conductor.direction.RepositoryAlreadyMarked
        payload:
          conductor.direction.RepositoryAlreadyMarked:
            repository: input.repository
        summary: >
          A repository is marked once; activate-repository or deactivate-repository changes its
          mark. Nothing was written.
      - name: marked-active
        when: activity == Active
        creates: conductor.direction.RepositoryMark
        into: Active
        instance: repository
        sets:
          actor: input.actor
          marked_by: input.marked_by
          session: input.session
          reason: input.reason
        emits:
          - conductor.direction.RepositoryMarked
        payload:
          conductor.direction.RepositoryMarked:
            actor: input.actor
            repository: input.repository
            activity: input.activity
            marked_by: input.marked_by
        summary: Conductor processes the repository's issues and pull requests.
      - name: marked-inactive
        creates: conductor.direction.RepositoryMark
        instance: repository
        sets:
          actor: input.actor
          marked_by: input.marked_by
          session: input.session
          reason: input.reason
        emits:
          - conductor.direction.RepositoryMarked
        payload:
          conductor.direction.RepositoryMarked:
            actor: input.actor
            repository: input.repository
            activity: input.activity
            marked_by: input.marked_by
        summary: Conductor leaves the repository's issues and pull requests alone.

  - name: conductor.direction.ActivateRepository
    naming:
      wire: activate-repository
      display: Mark a repository active
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: repository
        type: conductor.direction.MarkedRepository
      - name: marked_by
        type: conductor.direction.MarkedBy
      - name: session
        type: Optional<String>
      - name: reason
        type: String
    outcomes:
      - name: activated
        moves: conductor.direction.RepositoryMark.activate
        instance: repository
        sets:
          actor: input.actor
          marked_by: input.marked_by
          session: input.session
          reason: input.reason
        emits:
          - conductor.direction.RepositoryActivated
        payload:
          conductor.direction.RepositoryActivated:
            actor: input.actor
            repository: input.repository
            marked_by: input.marked_by
        summary: The repository's issues and pull requests are processed from the next cycle.
      - name: no-such-mark
        unknown_instance: true
        error: conductor.direction.RepositoryMarkNotFound
        payload:
          conductor.direction.RepositoryMarkNotFound:
            repository: input.repository
      - name: wrong-state
        wrong_state: true
        error: conductor.direction.RepositoryMarkConflict
        payload:
          conductor.direction.RepositoryMarkConflict:
            repository: input.repository
        summary: The repository is already active.

  - name: conductor.direction.DeactivateRepository
    naming:
      wire: deactivate-repository
      display: Mark a repository inactive
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: repository
        type: conductor.direction.MarkedRepository
      - name: marked_by
        type: conductor.direction.MarkedBy
      - name: session
        type: Optional<String>
      - name: reason
        type: String
    outcomes:
      - name: deactivated
        moves: conductor.direction.RepositoryMark.deactivate
        instance: repository
        sets:
          actor: input.actor
          marked_by: input.marked_by
          session: input.session
          reason: input.reason
        emits:
          - conductor.direction.RepositoryDeactivated
        payload:
          conductor.direction.RepositoryDeactivated:
            actor: input.actor
            repository: input.repository
            marked_by: input.marked_by
            reason: input.reason
        summary: The repository's issues and pull requests are left alone from the next cycle.
      - name: no-such-mark
        unknown_instance: true
        error: conductor.direction.RepositoryMarkNotFound
        payload:
          conductor.direction.RepositoryMarkNotFound:
            repository: input.repository
      - name: wrong-state
        wrong_state: true
        error: conductor.direction.RepositoryMarkConflict
        payload:
          conductor.direction.RepositoryMarkConflict:
            repository: input.repository
        summary: The repository is already inactive.

  - name: conductor.direction.ProposeGoal
    naming:
      wire: propose-goal
      display: Propose a goal
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: goal_id
        type: conductor.direction.GoalId
      - name: title
        type: String
      - name: exit_evidence
        type: String
    outcomes:
      - name: invalid-goal-id
        when:
          any:
            - goal_id == ""
            - goal_id.utf8_bytes > 170
        error: conductor.direction.InvalidGoalId
        payload:
          conductor.direction.InvalidGoalId:
            goal_id: input.goal_id
        summary: The store cannot keep a goal under this id, so nothing was proposed.
      - name: proposed
        creates: conductor.direction.Goal
        instance: goal_id
        sets:
          actor: input.actor
          title: input.title
          exit_evidence: input.exit_evidence
        emits:
          - conductor.direction.GoalProposed
        payload:
          conductor.direction.GoalProposed:
            actor: input.actor
            goal_id: input.goal_id
            title: input.title
        summary: The goal is a draft until the operator confirms or drops it.
      - name: already-proposed
        existing_instance: true
        error: conductor.direction.GoalExists
        payload:
          conductor.direction.GoalExists:
            goal_id: input.goal_id
        summary: A goal already has this id; the held goal is unchanged.

  - name: conductor.direction.ConfirmGoal
    naming:
      wire: confirm-goal
      display: Confirm a goal
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: goal_id
        type: conductor.direction.GoalId
    outcomes:
      - name: agent-actor
        when: actor.kind != Human
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: Only a person issues this command (design architecture-next.md § 3, Actors); an agent actor is refused by name and nothing changed.
      - name: invalid-goal-id
        when:
          any:
            - goal_id == ""
            - goal_id.utf8_bytes > 170
        error: conductor.direction.InvalidGoalId
        payload:
          conductor.direction.InvalidGoalId:
            goal_id: input.goal_id
        summary: No goal can have this id, so nothing moved.
      - name: confirmed
        moves: conductor.direction.Goal.confirm
        instance: goal_id
        emits:
          - conductor.direction.GoalConfirmed
        payload:
          conductor.direction.GoalConfirmed:
            actor: input.actor
            goal_id: input.goal_id
        summary: The operator confirmed the goal; dispatches may serve it.
      - name: no-such-goal
        unknown_instance: true
        error: conductor.direction.GoalNotFound
        payload:
          conductor.direction.GoalNotFound:
            goal_id: input.goal_id
      - name: wrong-state
        wrong_state: true
        error: conductor.direction.GoalStateConflict
        payload:
          conductor.direction.GoalStateConflict:
            goal_id: input.goal_id
        summary: The goal is not a draft, so nothing moved.

  - name: conductor.direction.MarkGoalMet
    naming:
      wire: mark-goal-met
      display: Mark a goal met
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: goal_id
        type: conductor.direction.GoalId
      - name: evidence
        type: String
    outcomes:
      - name: invalid-goal-id
        when:
          any:
            - goal_id == ""
            - goal_id.utf8_bytes > 170
        error: conductor.direction.InvalidGoalId
        payload:
          conductor.direction.InvalidGoalId:
            goal_id: input.goal_id
        summary: No goal can have this id, so nothing moved.
      - name: met
        moves: conductor.direction.Goal.meet
        instance: goal_id
        sets:
          evidence: input.evidence
        emits:
          - conductor.direction.GoalMet
        payload:
          conductor.direction.GoalMet:
            actor: input.actor
            goal_id: input.goal_id
            evidence: input.evidence
        summary: The goal's exit evidence holds.
      - name: no-such-goal
        unknown_instance: true
        error: conductor.direction.GoalNotFound
        payload:
          conductor.direction.GoalNotFound:
            goal_id: input.goal_id
      - name: wrong-state
        wrong_state: true
        error: conductor.direction.GoalStateConflict
        payload:
          conductor.direction.GoalStateConflict:
            goal_id: input.goal_id
        summary: Only a confirmed goal can be met.

  - name: conductor.direction.DropGoal
    naming:
      wire: drop-goal
      display: Drop a goal
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: goal_id
        type: conductor.direction.GoalId
      - name: reason
        type: String
    outcomes:
      - name: agent-actor
        when: actor.kind != Human
        error: conductor.operator.ActorNotHuman
        payload:
          conductor.operator.ActorNotHuman:
            actor: input.actor
        summary: Only a person issues this command (design architecture-next.md § 3, Actors); an agent actor is refused by name and nothing changed.
      - name: invalid-goal-id
        when:
          any:
            - goal_id == ""
            - goal_id.utf8_bytes > 170
        error: conductor.direction.InvalidGoalId
        payload:
          conductor.direction.InvalidGoalId:
            goal_id: input.goal_id
        summary: No goal can have this id, so nothing moved.
      - name: dropped
        moves: conductor.direction.Goal.drop
        instance: goal_id
        sets:
          reason: input.reason
        emits:
          - conductor.direction.GoalDropped
        payload:
          conductor.direction.GoalDropped:
            actor: input.actor
            goal_id: input.goal_id
            reason: input.reason
        summary: The goal no longer directs work.
      - name: no-such-goal
        unknown_instance: true
        error: conductor.direction.GoalNotFound
        payload:
          conductor.direction.GoalNotFound:
            goal_id: input.goal_id
      - name: wrong-state
        wrong_state: true
        error: conductor.direction.GoalStateConflict
        payload:
          conductor.direction.GoalStateConflict:
            goal_id: input.goal_id
        summary: The goal is already met or dropped.

  - name: conductor.direction.AddServing
    naming:
      wire: add-serving
      display: Add a serving repository to a goal
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: goal_id
        type: conductor.direction.GoalId
      - name: repository
        type: conductor.observation.RepositoryName
    outcomes:
      - name: no-such-goal
        when_related: {via: input.goal_id, exists: false}
        error: conductor.direction.GoalNotFound
        payload:
          conductor.direction.GoalNotFound:
            goal_id: input.goal_id
        summary: No goal has this id, and nothing was added.
      - name: goal-closed
        when_related: {via: input.goal_id, predicate: {state: [Met, Dropped]}}
        error: conductor.direction.GoalStateConflict
        payload:
          conductor.direction.GoalStateConflict:
            goal_id: input.goal_id
        summary: A met or dropped goal no longer directs work, so it gains no serving repository.
      - name: added
        creates: conductor.direction.GoalServing
        instance: serving_id
        sets:
          actor: input.actor
          goal_id: input.goal_id
          repository: input.repository
        emits:
          - conductor.direction.ServingAdded
        payload:
          conductor.direction.ServingAdded:
            actor: input.actor
            serving_id: {generated: true}
            goal_id: input.goal_id
            repository: input.repository
        summary: The repository's work serves the goal.

  - name: conductor.direction.RemoveServing
    naming:
      wire: remove-serving
      display: Remove a serving repository from a goal
    input:
      - {name: actor, type: conductor.operator.Actor}
      - name: serving_id
        type: conductor.direction.ServingId
      - name: reason
        type: String
    outcomes:
      - name: removed
        moves: conductor.direction.GoalServing.remove
        instance: serving_id
        emits:
          - conductor.direction.ServingRemoved
        payload:
          conductor.direction.ServingRemoved:
            actor: input.actor
            serving_id: input.serving_id
            reason: input.reason
        summary: The repository's work no longer serves the goal.
      - name: no-such-serving
        unknown_instance: true
        error: conductor.direction.ServingNotFound
        payload:
          conductor.direction.ServingNotFound:
            serving_id: input.serving_id
      - name: wrong-state
        wrong_state: true
        error: conductor.direction.ServingStateConflict
        payload:
          conductor.direction.ServingStateConflict:
            serving_id: input.serving_id
        summary: The repository was already removed from the goal.

