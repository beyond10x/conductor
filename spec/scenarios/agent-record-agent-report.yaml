# docs/design/architecture-next.md § 7: the runtime records a run-to-exit agent's report, the
# `[REPORT]` line its adapter wrote from the program's exit code and events file, with the agent
# as the actor.
# The runtime's own commands name the operator a single host implies (§ 5.3); the domain's
# UNMAPPED marker on `InstanceRuntime` records that the runtime has no actor of its own.
type: ess-scenario/1
domain: conductor.agent
scenario: agent-record-agent-report
summary: A run-to-exit agent's report is recorded with its exit code and events file, naming the agent as the actor.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.agent.DeclareAgentKind
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: example-run-to-exit
      capabilities: [RunToExit]
      binary: example-runner
    outcome: declared

  - at: 2026-11-08T09:01:00Z
    command: conductor.agent.StartAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, value: {operator: example-operator}}
      name: example-org-implementer
      instance: example-org
      role: Director
      kind: example-run-to-exit
      capabilities: [RunToExit]
      profile: ~/.b10x/conductor/profiles/repo-controller.md
      limits: {tasks_max: 512}
      token_owner: example-operator
      started_at: 2026-11-08T09:01:00Z
    outcome: started

  - at: 2026-11-08T09:30:00Z
    command: conductor.agent.RecordAgentReport
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Agent, value: {instance: example-org, role: Lead, name: example-org-implementer, kind: example-run-to-exit}}
      name: example-org-implementer
      line: "[REPORT example-repo story-1] done exit 0"
      exit_code: 0
      events_path: runs/example-org-implementer/events.jsonl
      reported_at: 2026-11-08T09:30:00Z
    outcome: reported
    events:
      - event: conductor.agent.AgentReported
        payload:
          name: example-org-implementer
          exit_code: 0
          events_path: runs/example-org-implementer/events.jsonl

assert:
  - view: conductor.agent.Agents
    contains:
      name: example-org-implementer
      state: Running
