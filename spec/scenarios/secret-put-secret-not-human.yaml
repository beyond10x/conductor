# UNMAPPED: `conductor.operator.Actor` is tagged `kind`, and its `Agent` variant has a field `kind`
# (`conductor.agent.AgentKindName`) too, so an agent actor cannot carry its kind: a second `kind`
# key is refused (ESS-AUTHOR-047, duplicate key). The actor below names no agent kind. For the
# operator domain's author and the coordinator (rename the tag or the field).
type: ess-scenario/1
domain: conductor.secret
scenario: secret-put-secret-not-human
summary: A put from an agent actor is refused by type with ActorNotHuman, and no secret is recorded.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Agent, instance: example-org, role: controller, name: example-controller}
      name: example-org-forge
      put_at: 2026-11-08T09:00:00Z
    outcome: not-human
    error:
      name: conductor.secret.ActorNotHuman

assert:
  - view: conductor.secret.Secrets
    excludes:
      name: example-org-forge
