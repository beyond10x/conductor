# docs/design/architecture-next.md § 5.1 and § 5.3: after a usage-limit stop the agent is
# resumed on another owner's token as its next generation, through the `agents/{name}/restart`
# route's command.
# The runtime's own commands (declaring its kinds, a stop it observed) carry `{kind: Daemon}`;
# a start names the operator a single host implies (§ 5.3), who asked for it.
type: ess-scenario/1
domain: conductor.agent
scenario: agent-restart-agent
summary: A stopped agent restarted on another owner's token runs again as generation 2, its stop cleared.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.agent.DeclareAgentKind
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Daemon}
      name: claude-code
      capabilities: [Interactive]
      binary: claude
    outcome: declared

  - at: 2026-11-08T09:01:00Z
    command: conductor.agent.StartAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-director
      instance: example-org
      role: Director
      kind: claude-code
      capabilities: [Interactive]
      profile: ~/example-org/roles/controller.md
      limits: {tasks_max: 512}
      token_owner: example-operator
      started_at: 2026-11-08T09:01:00Z
    outcome: started

  - at: 2026-11-08T09:01:01Z
    command: conductor.agent.MarkAgentRunning
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Daemon}
      name: example-org-director
      running_at: 2026-11-08T09:01:01Z
    outcome: running
    events:
      - event: conductor.agent.AgentRunning
        payload:
          name: example-org-director

  - at: 2026-11-08T12:00:00Z
    command: conductor.agent.StopAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Daemon}
      name: example-org-director
      exit_class: UsageLimit
      stopped_at: 2026-11-08T12:00:00Z
    outcome: stopped

  - at: 2026-11-08T12:00:05Z
    command: conductor.agent.RestartAgent
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-director
      token_owner: example-colleague
      started_at: 2026-11-08T12:00:05Z
    outcome: restarted
    events:
      - event: conductor.agent.AgentStarted
        payload:
          name: example-org-director
          token_owner: example-colleague

  - at: 2026-11-08T12:00:06Z
    command: conductor.agent.MarkAgentRunning
    actor: conductor.agent.InstanceRuntime
    input:
      actor: {kind: Daemon}
      name: example-org-director
      running_at: 2026-11-08T12:00:06Z
    outcome: running
    events:
      - event: conductor.agent.AgentRunning
        payload:
          name: example-org-director

assert:
  - view: conductor.agent.Agents
    contains:
      name: example-org-director
      state: Running
      token_owner: example-colleague
      generation: 2
      started_at: 2026-11-08T12:00:05Z
