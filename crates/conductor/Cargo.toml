[package]
name = "conductor-cli"
description = "The conductor command line: the `cli:` block of spec/components.yaml, in clap derive form."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "conductor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
conductor-broker = { path = "../conductor-broker" }
conductor-model = { package = "conductor", path = "../conductor-model" }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", tag = "0.8.4" }
eventlog-file = { git = "https://github.com/beyond10x/eventlog", tag = "0.8.4" }
eventlog-tree = { git = "https://github.com/beyond10x/eventlog", tag = "0.8.4" }
include_dir = "0.7"
nix = { version = "0.30", default-features = false, features = ["fs", "poll", "signal", "term"] }
serde = { version = "1", features = ["derive"] }
signal-hook = { version = "0.4", default-features = false }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
