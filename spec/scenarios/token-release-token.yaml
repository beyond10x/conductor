type: ess-scenario/1
domain: conductor.token
scenario: token-release-token
summary: The agent on a lease stops; the lease is Released and its token stays Available, and a second release is refused as a wrong state.

arrange:
  - instance: token
    entity: conductor.token.PoolToken
  - instance: lease
    entity: conductor.token.TokenLease

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.token.ContributeToken
    actor: conductor.token.Operator
    input:
      actor: {kind: Human, operator: alice}
      owner: alice
      seat: alice@example-org.example
      secret: example-org-claude-alice
      kind: SubscriptionToken
      contributed_at: 2026-11-08T09:00:00Z
    outcome: contributed
    capture: {instance: token, event: conductor.token.TokenContributed, field: token_id}

  - at: 2026-11-08T09:05:00Z
    command: conductor.token.LeaseToken
    actor: conductor.token.InstanceRuntime
    input:
      actor: {kind: Agent, agent: {instance: example-org, role: Lead, name: example-org-controller, kind: claude-code}}
      instance: example-org
      token_id: {$instance: token}
      owner: alice
      agent: example-org-controller
      leased_at: 2026-11-08T09:05:00Z
    outcome: leased
    capture: {instance: lease, event: conductor.token.TokenLeased, field: lease_id}

  - at: 2026-11-08T10:00:00Z
    command: conductor.token.ReleaseToken
    actor: conductor.token.InstanceRuntime
    input:
      actor: {kind: Agent, agent: {instance: example-org, role: Lead, name: example-org-controller, kind: claude-code}}
      lease_id: {$instance: lease}
      released_at: 2026-11-08T10:00:00Z
    outcome: released
    events:
      - event: conductor.token.TokenReleased
        payload:
          lease_id: {$instance: lease}
          token_id: {$instance: token}
          agent: example-org-controller

  - at: 2026-11-08T10:01:00Z
    command: conductor.token.ReleaseToken
    actor: conductor.token.InstanceRuntime
    input:
      actor: {kind: Agent, agent: {instance: example-org, role: Lead, name: example-org-controller, kind: claude-code}}
      lease_id: {$instance: lease}
      released_at: 2026-11-08T10:01:00Z
    outcome: wrong-state
    error:
      name: conductor.token.LeaseStateConflict

assert:
  - view: conductor.token.TokenLeases
    contains:
      lease_id: {$instance: lease}
      state: Released
      released_at: 2026-11-08T10:00:00Z
  - view: conductor.token.Tokens
    contains:
      token_id: {$instance: token}
      state: Available
      token_state: Ok
