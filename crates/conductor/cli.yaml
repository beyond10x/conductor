format: ess-cli/1
binary: conductor
about: The records conductor and the repository controllers keep
globals:
  config: config
  state: state-dir
  output: output
callables:
  goals:
    target: {kind: local, owner: conductor-cli, action: goals}
    input: null
    result: String
    errors: {}
  watch-run:
    target: {kind: local, owner: conductor-cli, action: watch_run}
    input: conductor.observation.WatchRun
    result: String
    errors: {}
  repository-shipped:
    target: {kind: local, owner: conductor-cli, action: repository_shipped}
    input: conductor.observation.RepositoryShipped
    result: String
    errors: {}
  repository-activity:
    target: {kind: local, owner: conductor-cli, action: repository_activity}
    input: conductor.direction.RepositoryActivity
    result: List<conductor.direction.RepositoryActivityRow>
    errors: {}
  repository-refresh-hooks:
    target: {kind: local, owner: conductor-cli, action: repository_refresh_hooks}
    input: conductor.observation.RefreshHooks
    result: List<conductor.observation.HooksRow>
    errors: {}
  resource-usage:
    target: {kind: local, owner: conductor-cli, action: resource_usage}
    input: conductor.observation.ResourceUsage
    result: String
    errors: {}
  decision-show:
    target: {kind: local, owner: conductor-cli, action: decision_show}
    input: conductor.decision.ShowDecision
    result: String
    errors: {}
  decision-handle:
    target: {kind: local, owner: conductor-cli, action: decision_handle}
    input: conductor.decision.HandleRequest
    result: String
    errors: {}
  need-new:
    target: {kind: local, owner: conductor-cli, action: need_new}
    input: conductor.direction.NewNeed
    result: String
    errors: {}
  config-validate:
    target: {kind: local, owner: conductor-cli, action: config_validate}
    input: conductor.config.ValidateConfig
    result: String
    errors: {}
  config-migrate:
    target: {kind: local, owner: conductor-cli, action: config_migrate}
    input: conductor.config.MigrateConfig
    result: String
    errors: {}
  config-put:
    target: {kind: local, owner: conductor-cli, action: config_put}
    input: conductor.config.ChangeConfig
    result: String
    errors: {}
  config-show:
    target: {kind: local, owner: conductor-cli, action: config_show}
    input: conductor.config.ShowConfig
    result: String
    errors: {}
  config-workspace:
    target: {kind: local, owner: conductor-cli, action: config_workspace}
    input: conductor.config.WriteWorkspace
    result: List<conductor.config.WorkspaceMember>
    errors: {}
  store-migrate:
    target: {kind: local, owner: conductor-cli, action: store_migrate}
    input: conductor.observation.StoreMigrate
    result: String
    errors: {}
  trust:
    target: {kind: local, owner: conductor-cli, action: trust}
    input: conductor.config.TrustWorkspaces
    result: List<String>
    errors: {}
  init:
    target: {kind: local, owner: conductor-cli, action: init}
    input: conductor.config.InitRecords
    result: List<String>
    errors: {}
  doctor:
    target: {kind: local, owner: conductor-cli, action: doctor}
    input: null
    result: conductor.config.DoctorReport
    errors: {}
  setup:
    target: {kind: local, owner: conductor-cli, action: setup}
    input: conductor.config.SetupRepository
    result: conductor.config.SetupReport
    errors: {}
  gc:
    target: {kind: local, owner: conductor-cli, action: gc}
    input: conductor.observation.CollectGarbage
    result: List<conductor.observation.GarbageRow>
    errors: {}
  spawn:
    target: {kind: local, owner: conductor-cli, action: spawn}
    input: conductor.dispatch.SpawnController
    result: String
    errors:
      already-running: conductor.dispatch.SpawnRefused
      session-running: conductor.dispatch.SpawnRefused
      sessions-unread: conductor.dispatch.SpawnRefused
      no-controller-role: conductor.dispatch.SpawnRefused
      not-claude: conductor.dispatch.SpawnRefused
      no-profile: conductor.dispatch.SpawnRefused
      no-settings: conductor.dispatch.SpawnRefused
      no-checkout: conductor.dispatch.SpawnRefused
      records-checkout: conductor.dispatch.SpawnRefused
      untrusted-checkout: conductor.dispatch.SpawnRefused
      no-charter: conductor.dispatch.SpawnRefused
      launch-failed: conductor.dispatch.SpawnRefused
      provider-unavailable: conductor.dispatch.SpawnRefused
      measurement-short: conductor.dispatch.SpawnRefused
  message-send:
    target: {kind: local, owner: conductor-cli, action: message_send}
    input: conductor.dispatch.SendToMailbox
    result: String
    errors:
      unparsed: conductor.dispatch.MailboxSendRefused
  session-deliver:
    target: {kind: local, owner: conductor-cli, action: session_deliver}
    input: conductor.session.DeliverToSession
    result: String
    errors: {}
  session-start:
    target: {kind: local, owner: conductor-cli, action: session_start}
    input: conductor.session.StartSession
    result: conductor.session.StartedSession
    errors:
      provider-unavailable: conductor.session.SessionStartRefused
      measurement-short: conductor.session.SessionStartRefused
      unknown-role: conductor.session.SessionStartRefused
      session-running: conductor.session.SessionStartRefused
      launch-failed: conductor.session.SessionStartRefused
  session-stop:
    target: {kind: local, owner: conductor-cli, action: session_stop}
    input: conductor.session.StopSession
    result: String
    errors:
      unknown-role: conductor.session.SessionStopRefused
      not-running: conductor.session.SessionStopRefused
  session-attach:
    target: {kind: local, owner: conductor-cli, action: session_attach}
    input: conductor.session.AttachSession
    result: String
    errors:
      inside-session: conductor.session.SessionAttachRefused
      unknown-session: conductor.session.SessionAttachRefused
      not-attachable: conductor.session.SessionAttachRefused
      ambiguous: conductor.session.SessionAttachRefused
  session-list:
    target: {kind: local, owner: conductor-cli, action: session_list}
    input: conductor.session.ListSessions
    result: List<conductor.session.AttachableSession>
    errors: {}
  records-check:
    target: {kind: local, owner: conductor-cli, action: records_check}
    input: conductor.dispatch.CheckRecords
    result: List<conductor.dispatch.RecordsFinding>
    errors: {}
  rules-show:
    target: {kind: local, owner: conductor-cli, action: rules_show}
    input: conductor.direction.Rules
    result: List<conductor.direction.RulesRow>
    errors:
      rule-item-not-found: conductor.direction.RulesRefused
      rule-section-not-found: conductor.direction.RulesRefused
      revision-not-found: conductor.direction.RulesRefused
  role-show:
    target: {kind: local, owner: conductor-cli, action: role_show}
    input: conductor.agent.ShowRole
    result: String
    errors: {}
  upgrade:
    target: {kind: local, owner: conductor-cli, action: upgrade}
    input: conductor.config.UpgradeBinary
    result: conductor.config.UpgradeReport
    errors:
      release-unread: conductor.config.UpgradeRefused
      no-archive-for-target: conductor.config.UpgradeRefused
      checksum-mismatch: conductor.config.UpgradeRefused
      new-binary-does-not-run: conductor.config.UpgradeRefused
      binary-not-writable: conductor.config.UpgradeRefused
  build-run:
    target: {kind: local, owner: conductor-cli, action: build_run}
    input: conductor.host.BuildRun
    result: Integer
    errors:
      refused: conductor.host.BuildRunRefused
  controller-controllers:
    target: {kind: local, owner: conductor-cli, action: controller_controllers}
    input: conductor.dispatch.ListControllers
    result: String
    errors: {}
  status:
    target: {kind: local, owner: conductor-cli, action: status}
    input: conductor.observation.Status
    result: conductor.observation.StatusReport
    errors: {}
  metric-compute:
    target: {kind: local, owner: conductor-cli, action: metric_compute}
    input: conductor.improvement.ComputeMetrics
    result: String
    errors: {}
  host-grants:
    target: {kind: local, owner: conductor-cli, action: host_grants}
    input: conductor.host.ShowGrants
    result: String
    errors: {}
  gc-reclaim:
    target: {kind: local, owner: conductor-cli, action: gc_reclaim}
    input: conductor.host.ReclaimDisk
    result: List<conductor.host.ReclaimStep>
    errors:
      floor-not-reached: conductor.host.ReclaimFellShort
  broker-serve:
    target: {kind: local, owner: conductor-cli, action: broker_serve}
    input: null
    result: String
    errors: {}
  run:
    target: {kind: local, owner: conductor-cli, action: run}
    input: conductor.session.RunDaemon
    result: String
    errors: {}
  daemon-serve:
    target: {kind: local, owner: conductor-cli, action: daemon_serve}
    input: conductor.instance.ServeDaemon
    result: String
    errors: {}
  daemon-start-role:
    target: {kind: local, owner: conductor-cli, action: daemon_start_role}
    input: conductor.instance.StartHostRole
    result: String
    errors: {}
  instance-serve:
    target: {kind: local, owner: conductor-cli, action: instance_serve}
    input: null
    result: String
    errors: {}
  instance-relay:
    target: {kind: local, owner: conductor-cli, action: instance_relay}
    input: null
    result: String
    errors: {}
  instance-upgrade:
    target: {kind: local, owner: conductor-cli, action: instance_upgrade}
    input: conductor.instance.UpgradeInstances
    result: String
    errors: {}
  agent-start:
    target: {kind: local, owner: conductor-cli, action: agent_start}
    input: conductor.agent.AgentSlotSelection
    result: String
    errors: {}
  agent-deliver:
    target: {kind: local, owner: conductor-cli, action: agent_deliver}
    input: conductor.agent.AgentTextDelivery
    result: String
    errors: {}
  agent-attach:
    target: {kind: local, owner: conductor-cli, action: agent_attach}
    input: conductor.agent.AgentTerminalAttach
    result: String
    errors: {}
  agent-stop:
    target: {kind: local, owner: conductor-cli, action: agent_stop}
    input: conductor.agent.AgentSlotSelection
    result: String
    errors: {}
  join:
    target: {kind: local, owner: conductor-cli, action: join}
    input: conductor.token.JoinDaemon
    result: String
    errors: {}
  leave:
    target: {kind: local, owner: conductor-cli, action: leave}
    input: conductor.token.LeaveDaemon
    result: String
    errors: {}
  token-reveal:
    target: {kind: local, owner: conductor-cli, action: token_reveal}
    input: conductor.token.RevealToken
    result: String
    errors: {}
  login:
    target: {kind: local, owner: conductor-cli, action: login}
    input: null
    result: String
    errors: {}
  secret-put:
    target: {kind: local, owner: conductor-cli, action: secret_put}
    input: conductor.secret.WriteSecret
    result: String
    errors: {}
  tui:
    target: {kind: local, owner: conductor-cli, action: tui}
    input: null
    result: String
    errors: {}
commands:
  - path: [goal, goals]
    callable: goals
    about: Goals
    arguments: []
  - path: [watch, run]
    callable: watch-run
    about: Watch sessions, usage limits, conductor's context, free disk and main's CI; exit after the first pass that finds a change
    arguments:
      - field: every
        source: {kind: option, long: every}
      - field: ci_every
        source: {kind: option, long: ci-every}
      - field: follow
        source: {kind: option, long: follow}
  - path: [repository, shipped]
    callable: repository-shipped
    about: What shipped since an instant, from the newest complete snapshot's GitHub observations
    arguments:
      - field: since
        source: {kind: option, long: since}
      - field: format
        source: {kind: option, long: format}
  - path: [repository, activity]
    callable: repository-activity
    about: Every repository's effective activity, decided by its mark or computed from the newest complete snapshot
    arguments:
      - field: format
        source: {kind: option, long: format}
  - path: [repository, refresh-hooks]
    callable: repository-refresh-hooks
    about: List each checkout of the instance whose Gates hooks lag the b10x-gates on PATH or are absent; --apply runs b10x-gates install in each with the instance's gates_policy and prints the hook's version before and after
    arguments:
      - field: apply
        source: {kind: option, long: apply}
      - field: format
        source: {kind: option, long: format}
  - path: [resource, usage]
    callable: resource-usage
    about: Token spend per repository and session, read from the session transcripts
    arguments:
      - field: since
        source: {kind: option, long: since}
      - field: format
        source: {kind: option, long: format}
  - path: [decision, show]
    callable: decision-show
    about: Show one decision
    arguments:
      - field: decision_id
        source: {kind: option, long: decision-id}
      - field: format
        source: {kind: option, long: format}
  - path: [decision, handle]
    callable: decision-handle
    about: Classify a decision request in code and raise it; answer class C through the Decider adapter (claude, or fake, which answers the recommendation) and record it, printing the [DECISION] line; escalate class O and H with the request's options, its recommendation as default and a 48 h deadline, printing the [ESCALATION] line
    arguments:
      - field: request
        source: {kind: option, long: request}
      - field: decider
        source: {kind: option, long: decider}
  - path: [need, new]
    callable: need-new
    about: Print the next NEED id no earlier NEED used, N-<yyyymmdd>-<nn>, and keep it in the state directory; skip an id the records' hand-overs, decisions and dispatches already cite
    arguments:
      - field: day
        source: {kind: option, long: day}
  - path: [config, validate]
    callable: config-validate
    about: Check the config file and the host file host.yaml; exit 1 naming each problem by its YAML path
    arguments:
      - field: instance
        source: {kind: option, long: instance}
  - path: [config, migrate]
    callable: config-migrate
    about: Convert a conductor.config/1 file to conductor.config/2 once, noting each key dropped or moved, and write a session_prefix into each instance that names none; --check prints what it would write and writes nothing
    arguments:
      - field: check
        source: {kind: option, long: check}
  - path: [config, put]
    callable: config-put
    about: Change one key of the config file at one level - global, instance or role - validated, written, committed to the config repository with the actor and the reason, and recorded in the daemon's store as a ConfigRevision; the daemon reconciles on the changed file
    arguments:
      - field: level
        source: {kind: option, long: level}
      - field: instance
        source: {kind: option, long: instance}
      - field: role
        source: {kind: option, long: role}
      - field: path
        source: {kind: option, long: path}
      - field: value
        source: {kind: option, long: value}
      - field: reason
        source: {kind: option, long: reason}
  - path: [config, show]
    callable: config-show
    about: Print one instance's effective config, after defaults, as a config file, and the host's roles from host.yaml under `host` (not in yaml)
    arguments:
      - field: format
        source: {kind: option, long: format}
      - field: instance
        source: {kind: option, long: instance}
      - field: effective
        source: {kind: option, long: effective}
  - path: [config, workspace]
    callable: config-workspace
    about: Write the instance's workspace file from its config; --check names each difference
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: check
        source: {kind: option, long: check}
  - path: [store, migrate]
    callable: store-migrate
    about: Read the eventlog tree under the state directory once into the store's database, record the migration there, and print the counts read; refuse a tree read before (AlreadyMigrated) or none there (SourceMissing)
    arguments:
      - field: format
        source: {kind: option, long: format}
  - path: [trust]
    callable: trust
    about: Mark every git checkout under the instance's checkouts root, and its records directory, as trusted Claude Code workspaces in ~/.claude.json
    arguments:
      - field: instance
        source: {kind: option, long: instance}
  - path: [init]
    callable: init
    about: Write and commit the instance's records directory skeleton; refuse to overwrite any file
    arguments:
      - field: instance
        source: {kind: option, long: instance}
  - path: [doctor]
    callable: doctor
    about: Report the machine, each program conductor starts as present, with its version, or missing, each one older than its pin in the nearest b10x.toml, or else in the pins conductor was built with, and the account each forge CLI is logged in as on each host of the config file's sources
    arguments: []
  - path: [setup]
    callable: setup
    about: Check a repository's prerequisites, doctor's and its planning store, instance, records and trust; --apply writes the instance config, runs init and trust, activates the worktree workspace, and prints what only a person may run
    arguments:
      - field: repository
        source: {kind: option, long: repository}
      - field: apply
        source: {kind: option, long: apply}
  - path: [gc]
    callable: gc
    about: Remove what the dashboard's disk panel marks reclaimable, and no tree a live session works in; print the bytes freed
    arguments:
      - field: dry_run
        source: {kind: option, long: dry-run}
      - field: format
        source: {kind: option, long: format}
  - path: [spawn]
    callable: spawn
    about: Start a repository's controller session in its checkout, with the controller role's profile, model and settings and its charter, and record it running; refuse while a session of that name runs
    arguments:
      - field: repository
        source: {kind: option, long: repository}
  - path: [message, send]
    callable: message-send
    about: "Send a message through the mailbox: read --text, a file or - for standard input, and its first line; leave the whole text as <state>/mailbox/<to>/<ulid>.md and record it received with transport Mailbox and that body path, then print its id; print the format, exit 1 and write nothing when the first line does not parse"
    arguments:
      - field: to
        source: {kind: option, long: to}
      - field: from
        source: {kind: option, long: from}
      - field: text
        source: {kind: option, long: text}
  - path: [session, deliver]
    callable: session-deliver
    about: "Type a text into a running session, then Enter, and record the delivery and its dispatch line: into its tmux launcher, or, for a session without one that the harness's session list names live, through the harness's attach in a tmux pane made for the one delivery; --text is a file, or - for standard input, which is kept as <state>/mailbox/delivered/<ulid>.md; refuse a session neither route reaches, naming it, without trying again"
    arguments:
      - field: name
        source: {kind: option, long: name}
      - field: text
        source: {kind: option, long: text}
  - path: [session, start]
    callable: session-start
    about: Start the session of the role director or maintainer (conductor or conductor-dev, their old names, for this release) in the box the instance's confinement asks for, measure the box at its boundary and write the measurement under the state directory; refuse an unknown role, a session of that name already running, and under strict a provider not available or a box short of the request
    arguments:
      - field: role
        source: {kind: option, long: role}
  - path: [session, stop]
    callable: session-stop
    about: Stop the live session of the role director or maintainer (conductor or conductor-dev, their old names, for this release) through the provider that started it; refuse an unknown role and a role with no live session
    arguments:
      - field: role
        source: {kind: option, long: role}
  - path: [session, attach]
    callable: session-attach
    about: "Attach this terminal to a live session's tmux, by --name or --role, or through a picker of every instance's sessions without either; detach with ctrl-] then d, the session runs on; --watch attaches read-only, and follows the terminal log of a session started before the tmux launcher; refuse inside a session, an unknown session, and a read-write attach to a session started before the tmux launcher"
    arguments:
      - field: name
        source: {kind: option, long: name}
      - field: role
        source: {kind: option, long: role}
      - field: instance
        source: {kind: option, long: instance}
      - field: watch
        source: {kind: option, long: watch}
  - path: [session, list]
    callable: session-list
    about: "Print one line per live session of every instance (or --instance) whose state holds a launcher's files for it: its instance, its name, and attach (read-write or --watch) or watch (--watch only, started before the tmux launcher)"
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: format
        source: {kind: option, long: format}
  - path: [records, check]
    callable: records-check
    about: Check the records' dispatch and decision logs; exit 1 naming each decision id a dispatch line cites that no decision line or store decision holds, each line whose keys its log does not declare, and each decision line in the dispatch log
    arguments:
      - field: format
        source: {kind: option, long: format}
  - path: [rules, show]
    callable: rules-show
    about: Print items of the instance's rules.md verbatim, by number in the order given or every item under a heading, without opening the store; exit 1 naming a number or heading the file does not hold
    arguments:
      - field: item
        source: {kind: option, long: item}
      - field: section
        source: {kind: option, long: section}
      - field: format
        source: {kind: option, long: format}
      - field: brief
        source: {kind: option, long: brief}
      - field: changed_since
        source: {kind: option, long: changed-since}
      - field: role
        source: {kind: option, long: role}
  - path: [role, show]
    callable: role-show
    about: Print the profile the binary carries for a role (maintainer, supervisor, teacher, controller, or an old name of one), byte for byte, reading no config and no store; exit 1 naming a role the binary carries none for
    arguments:
      - field: role
        source: {kind: option, long: role}
  - path: [upgrade]
    callable: upgrade
    about: Check for a newer release of the repository conductor was built from; without --check, download its archive for this target and SHA256SUMS, verify the sum, run the new binary's --version and replace this binary, keeping conductor.previous; --release installs a named release
    arguments:
      - field: check
        source: {kind: option, long: check}
      - field: release
        source: {kind: option, long: release}
  - path: [build, run]
    callable: build-run
    about: Reserve disk for a command's expected peak in the host ledger, reclaiming first when it does not fit; run it in its own process group under the disk watchdog, record its peak, release the reservation when it exits or is killed, and exit with its status; exit 2 naming the shortfall when reclaim cannot reach the size
    arguments:
      - field: reserve
        source: {kind: option, long: reserve}
      - field: repository
        source: {kind: option, long: repository}
      - field: measure
        source: {kind: option, long: measure}
      - field: command
        source: {kind: trailing}
  - path: [controller, controllers]
    callable: controller-controllers
    about: Print one line per Running or Paused controller, its repository, state, session name and id; --all prints the table of every controller, --format renders every one as text, json, jsonl or markdown; create nothing
    arguments:
      - field: all
        source: {kind: option, long: all}
      - field: format
        source: {kind: option, long: format}
  - path: [status]
    callable: status
    about: Print what asks for attention, one line each, from the store alone (the newest complete snapshot's id and age, its deviations, blocked dispatches, waits, pending requests and usage); --full prints its sessions and every open dispatch besides; start no snapshot and create nothing
    arguments:
      - field: format
        source: {kind: option, long: format}
      - field: full
        source: {kind: option, long: full}
  - path: [host, grants]
    callable: host-grants
    about: Host grants
    arguments:
      - field: format
        source: {kind: option, long: format}
  - path: [metric, compute]
    callable: metric-compute
    about: Compute one UTC day's readings of K1, K2, K4, K5, K6 and K12 from the records' decision and dispatch logs, the newest complete snapshot and the store's daily rollups, define each such metric that is absent, and record one reading per metric and scope, judged against the metric's target; print one line per reading, and name what had no value
    arguments:
      - field: day
        source: {kind: option, long: day}
  - path: [host, reclaim]
    callable: gc-reclaim
    about: Free what needs no decision until free disk is back over the floor, printing each step with the bytes it freed; exit 1 listing what is left by path and size when the floor is not reached
    arguments:
      - field: format
        source: {kind: option, long: format}
  - path: [broker, serve]
    callable: broker-serve
    about: Serve the instance's broker until stopped, on one socket per registered session under the state directory's broker/; check each call against the session's grant, run it and record it
    arguments: []
  - path: [run]
    callable: run
    about: Run the instance's loop with no model call, recording each tick - every cadence.watch the watch pass, its handlers and the mailbox; every cadence.cycle the snapshot, the board, records check and dispatch v1; at cadence.daily metric compute, REPORT.md and a commit of the records through the bot route. --once runs one watch tick and one cycle tick and exits; --once --commit-records commits the records alone
    arguments:
      - field: once
        source: {kind: option, long: once}
      - field: commit_records
        source: {kind: option, long: commit-records}
  - path: [daemon, serve]
    callable: daemon-serve
    about: Run conductord, the daemon of the control host, reconciling the instance runtimes from the config file - start what is absent, stop what is gone, restart what changed placement or binary - on a config change, a lost runtime and every daemon.cadence.reconcile, recording one Reconciliation per action, and serving GET 127.0.0.1:<daemon.port>/v1/instances. --install writes, enables and starts the user unit conductord.service, or the system unit when daemon.loopback is false (a box with no local operator, its config file in a git checkout, its secrets on the Secrets service); --uninstall stops and removes it
    arguments:
      - field: install
        source: {kind: option, long: install}
      - field: uninstall
        source: {kind: option, long: uninstall}
  - path: [daemon, start-role]
    callable: daemon-start-role
    about: Ask the daemon of the config file to start a host role now (POST /v1/roles/{role}/start) - supervisor or teacher, one globals.roles lists; the daemon starts it through conductor session start --role <role> at the host placement, its session in conductor_host.slice, and keeps it running; a role the file does not list is refused naming globals.roles
    arguments:
      - field: role
        source: {kind: option, long: role}
  - path: [instance, serve]
    callable: instance-serve
    about: Serve the instance API, the routes of the dashboard under /v1/, on the instance's <state>/api.sock until stopped, and run the instance's loop beside it under the lock conductor run takes (<state>/run/lock), so a conductor run started by hand is refused; while a conductor run holds the lock the runtime yields and takes the loop once it is let go; CONDUCTOR_RUNTIME_LOOP=off serves the API alone; a write takes the token the daemon minted for the instance, in CONDUCTOR_API_TOKEN
    arguments: []
  - path: [instance, relay]
    callable: instance-relay
    about: Bridge one instance API exchange from standard input to the instance's api.sock (CONDUCTOR_API_SOCKET, else <state>/api.sock) and its answer to standard output; conductord runs it as a substrate pipe session in a box on a remote substrate daemon
    arguments: []
  - path: [instance, upgrade]
    callable: instance-upgrade
    about: Ask the daemon to upgrade an instance to a released binary (POST /v1/instances/{name}/upgrade) - it fetches the release, installs its binary, runs its conductor doctor, restarts the runtime on it and rolls back to the previous binary unless it answers within daemon.upgrade_timeout; --all goes through every instance of the config file one at a time and stops at the first rollback
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: tag
        source: {kind: option, long: tag}
      - field: all
        source: {kind: option, long: all}
  - path: [agent, start]
    callable: agent-start
    about: "Start the agent of a role slot through its kind (roles[].kind, claude-code by default): for claude-code, conductor session start, which stays its alias for this release; refuse a kind this binary does not implement (UnknownAgentKind), and what session start refuses"
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: role
        source: {kind: option, long: role}
  - path: [agent, deliver]
    callable: agent-deliver
    about: "Deliver a text to the running agent of a role slot through its kind: for claude-code, conductor session deliver to the role's session name; --text is a file, or - for standard input; refuse a kind this binary does not implement and a kind that is not interactive (CapabilityMissing)"
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: role
        source: {kind: option, long: role}
      - field: text
        source: {kind: option, long: text}
  - path: [agent, attach]
    callable: agent-attach
    about: "Attach this terminal to the agent of a role slot through its kind: for claude-code, conductor session attach --role; --watch attaches read-only; refuse a kind this binary does not implement and a kind that is not interactive (CapabilityMissing)"
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: role
        source: {kind: option, long: role}
      - field: watch
        source: {kind: option, long: watch}
  - path: [agent, stop]
    callable: agent-stop
    about: "Stop the running agent of a role slot through its kind: for claude-code, conductor session stop, which stays its alias for this release; refuse a kind this binary does not implement, and what session stop refuses"
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: role
        source: {kind: option, long: role}
  - path: [join]
    callable: join
    about: "Join an instance of the daemon --daemon names as one of its operators (JoinInstance, with the grants daemon.operators gives you) and contribute your Claude token, read from standard input, to the instance's pool (ContributeToken): the value goes into the daemon's secrets source, the pool records its owner, seat (--seat, your operator name by default) and state, never the value"
    arguments:
      - field: instance
        source: {kind: option, long: instance}
      - field: seat
        source: {kind: option, long: seat}
  - path: [leave]
    callable: leave
    about: "Leave an instance of the daemon --daemon names (LeaveInstance) and withdraw every token you contributed to its pool (WithdrawToken); each agent on one is resumed on another token by the instance's loop"
    arguments:
      - field: instance
        source: {kind: option, long: instance}
  - path: [token, reveal]
    callable: token-reveal
    about: "Print the value of a leased token of the instance's pool from the daemon's secrets source, for the claude-code kind's harness, whose settings name this command as their apiKeyHelper; refuse a token that is not leased; nothing else prints a value"
    arguments:
      - field: token
        source: {kind: option, long: token}
  - path: [login]
    callable: login
    about: Log in to the daemon --daemon or CONDUCTOR_DAEMON names through its Identity service, in a browser, and keep the Identity session in this client's keychain; each command against that daemon then presents a bearer minted from it
    arguments: []
  - path: [secret, put]
    callable: secret-put
    about: Put a secret's value, read from standard input, into the daemon's secrets source (daemon.secrets) under --name through the secrets crates, and record its name and source in the daemon's store; a name already on record is refused (SecretExists) unless --replace
    arguments:
      - field: name
        source: {kind: option, long: name}
      - field: replace
        source: {kind: option, long: replace}
  - path: [tui]
    callable: tui
    about: "Open the terminal UI over the daemon's global API - the instances (state, open decisions, KPI flags), the sessions of the selected one (role, state, context, current work) and its settings, read-only; Enter attaches to the selected session, w watches it, l follows its terminal log, ctrl-] then d returns; the global --daemon names the daemon (default CONDUCTOR_DAEMON, else 127.0.0.1:daemon.port)"
    arguments: []
