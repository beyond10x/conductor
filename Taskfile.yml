version: '3'

vars:
  SESSION_ID: claude agents --json | jq -r '.[] | select(.kind=="background" and .name==$n and .pid != null) | .id'
  SESSION_COUNT: claude agents --json | jq '[.[] | select(.kind=="background" and .name==$n and .pid != null)] | length'
  # A live session of any kind: one started by the systemd provider lists as interactive with a pid
  # and no id (story:sessions-systemd-kind).
  LIVE_ID: claude agents --json | jq -r '.[] | select(.name==$n and .pid != null) | (.id // (.pid|tostring))'
  LIVE_COUNT: claude agents --json | jq '[.[] | select(.name==$n and .pid != null)] | length'
  # The ess binary; ESS=<path> runs a release other than the one on PATH (rules item 132).
  ESS: '{{.ESS | default "ess"}}'

tasks:
  sessions:
    desc: List the active instance's sessions, those named as its roles and the host's in conductor config show (<session_prefix>-conductor and <session_prefix>-conductor-dev, or conductor and conductor-dev without a prefix; maintainer and bridge from the host file), with their kind, id and state; exits 1 naming each of those names that more than one live background session holds, since no task can tell which of them is this instance's
    vars:
      NAMES:
        sh: conductor config show --format json | jq -c '[.instances[0].roles[], .host.roles[] | .session_name // empty] | unique'
    preconditions:
      - sh: test -n {{shellQuote .NAMES}} && test {{shellQuote .NAMES}} != '[]'
        msg: conductor config show names no session name for the instance's roles
    cmds:
      - claude agents --json | jq -r --argjson names {{shellQuote .NAMES}} '.[] | select(.name as $n | any($names[]; . == $n)) | [.name, .kind, (.id // (.pid|tostring)), (.state // .status)] | @tsv'
      - |
        ambiguous=$(claude agents --json | jq -r --argjson names {{shellQuote .NAMES}} '. as $all | $names[] as $n | select([$all[] | select(.name==$n and .pid != null)] | length > 1) | $n')
        for name in $ambiguous; do
          echo "more than one live session is named $name; stop the one that is not this instance's with claude stop <id>" >&2
        done
        [ -z "$ambiguous" ]

  conductor:attach:
    desc: Open the active instance's background conductor session, the live session named as the role conductor in conductor config show, in this terminal, in the instance's records directory; refuses when no live background session or more than one holds that name
    interactive: true
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .session_name // empty'
      RECORDS:
        sh: conductor config show --format json | jq -r '.instances[0].records'
    preconditions:
      - sh: test -d {{shellQuote .RECORDS}}
        msg: the records directory {{.RECORDS}} of conductor config show is not a directory
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the role conductor
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -ge 1
        msg: no background session named {{.NAME}}; see task sessions
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -le 1
        msg: more than one live background session is named {{.NAME}}, so this task cannot tell which is this instance's conductor; stop the one that is not with claude stop <id> (task sessions lists them), then run the task again
    cmds:
      - cd {{shellQuote .RECORDS}} && claude attach "$({{.SESSION_ID}} --arg n {{shellQuote .NAME}})"

  maintainer:start:
    desc: Start the maintainer (conductor-dev) with conductor session start --role maintainer, in the box the instance's confinement asks for, in the background in this checkout under the session name of the host's maintainer in conductor config show (host.roles; maintainer, from the host file ~/.b10x/conductor/host/host.yaml, or, while that names none, the role conductor-dev an instance still names, under its name there, such as <session_prefix>-conductor-dev), without the user's settings (--setting-sources project,local; the none provider's claude --bg adds user, where Claude Code keeps the bypass-permissions acceptance), on the harness, model, settings and profile of that role (no settings file by default; without a profile it starts from the maintainer profile the conductor binary carries, conductor role show --role maintainer, which session start writes into the state directory and appends to the system prompt); refuses while a live session of that name exists and when the profile is not a file. dev:start is its old name, for this release
    aliases: [dev:start]
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.host.roles[] | select(.role == "maintainer" or .role == "conductor-dev") | .session_name // empty'
      SETTINGS:
        sh: conductor config show --format json | jq -r '.host.roles[] | select(.role == "maintainer" or .role == "conductor-dev") | .settings // empty'
      PROFILE:
        sh: conductor config show --format json | jq -r '.host.roles[] | select(.role == "maintainer" or .role == "conductor-dev") | .profile // empty'
      HARNESS:
        sh: conductor config show --format json | jq -r '.host.roles[] | select(.role == "maintainer" or .role == "conductor-dev") | .harness'
      MODEL:
        sh: conductor config show --format json | jq -r '.host.roles[] | select(.role == "maintainer" or .role == "conductor-dev") | .model'
    preconditions:
      - sh: test -n {{shellQuote .MODEL}}
        msg: conductor config show names no maintainer under host.roles; add the role maintainer to the host file ~/.b10x/conductor/host/host.yaml
      - sh: test {{shellQuote .HARNESS}} = claude
        msg: the maintainer runs on {{.HARNESS}} (conductor config show); this task starts claude only
      - sh: test -z {{shellQuote .PROFILE}} || test -f {{shellQuote .PROFILE}}
        msg: the profile {{.PROFILE}} of the maintainer is not a file
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the maintainer
      - sh: claude agents --json | jq -e --arg n {{shellQuote .NAME}} 'all(.[]; .name != $n or .pid == null)' >/dev/null
        msg: a session named {{.NAME}} is already running; see task sessions
    cmds:
      - conductor session start --role maintainer

  supervisor:start:
    desc: Ask the daemon (conductord, of the config file CONDUCTOR_CONFIG or ~/.b10x/conductor/conductor.yaml) to start the host's supervisor now with conductor daemon start-role --role supervisor; the daemon starts it through conductor session start --role supervisor at the host placement, its session supervisor in conductor_host.slice, from the supervisor profile the conductor binary carries (conductor role show --role supervisor), and keeps it running while globals.roles lists supervisor; refused when globals.roles does not list it
    cmds:
      - conductor daemon start-role --role supervisor

  teacher:start:
    desc: Ask the daemon (conductord, of the config file CONDUCTOR_CONFIG or ~/.b10x/conductor/conductor.yaml) to start the host's teacher now with conductor daemon start-role --role teacher; the daemon starts it through conductor session start --role teacher at the host placement, its session teacher in conductor_host.slice, from the teacher profile the conductor binary carries (conductor role show --role teacher), and keeps it running while globals.roles lists teacher; refused when globals.roles does not list it
    cmds:
      - conductor daemon start-role --role teacher

  maintainer:attach:
    desc: Open the background maintainer (conductor-dev) session, the live session named as the host's maintainer in conductor config show (host.roles), in this terminal; refuses when no live background session or more than one holds that name. dev:attach is its old name, for this release
    aliases: [dev:attach]
    interactive: true
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.host.roles[] | select(.role == "maintainer" or .role == "conductor-dev") | .session_name // empty'
    preconditions:
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the maintainer
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -ge 1
        msg: no background session named {{.NAME}}; see task sessions
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -le 1
        msg: more than one live background session is named {{.NAME}}, so this task cannot tell which is the maintainer; stop the one that is not with claude stop <id> (task sessions lists them), then run the task again
    cmds:
      - claude attach "$({{.SESSION_ID}} --arg n {{shellQuote .NAME}})"

  trust:
    desc: Mark the instance's records directory (by its physical path) and every git checkout directly under its checkouts root (conductor config show) as trusted Claude Code workspaces in ~/.claude.json, so conductor and a controller can start there (conductor trust); refuses a records path that holds a line break or is not a directory, and writes nothing when ~/.claude.json changed during the run
    cmds:
      - conductor trust


  dashboard:
    desc: Print the URL of the active instance's dashboard; conductord serves the app and every instance's API on 127.0.0.1 at daemon.port in conductor config show (7300 unless the file writes it), and the page names the instance in ?instance=; start the daemon first, no per-instance dashboard process runs
    silent: true
    vars:
      INSTANCE:
        sh: conductor config show --format json | jq -r '.instances[0].name // empty'
      PORT:
        sh: conductor config show --format json | jq -r '.daemon.port // 7300'
    preconditions:
      - sh: test -n {{shellQuote .INSTANCE}}
        msg: conductor config show names no instance
    cmds:
      - echo Open http://127.0.0.1:{{shellQuote .PORT}}/?instance={{shellQuote .INSTANCE}}

  broker:
    desc: Start the active instance's broker (conductor broker serve), which serves each session of the instance on its own socket under broker/ of the instance's state directory, checks every tool call against the session's grant and records it; the broker serves that instance (CONDUCTOR_INSTANCE); where systemctl is on PATH as the instance's user service, <session_prefix>-conductor-broker or conductor-broker without a prefix, unless it is active, elsewhere in the background with nohup, its pid in broker.pid and its output in broker.log of the instance's state directory (conductor config show), refusing while that pid runs
    silent: true
    vars:
      STATE:
        sh: conductor config show --format json | jq -r '.instances[0].state'
      INSTANCE:
        sh: conductor config show --format json | jq -r '.instances[0].name'
      UNIT:
        sh: conductor config show --format json | jq -r '.instances[0] | if .session_prefix then .session_prefix + "-conductor-broker" else "conductor-broker" end'
    preconditions:
      - sh: test -n {{shellQuote .INSTANCE}}
        msg: conductor config show names no instance
    cmds:
      - |
        if command -v systemctl >/dev/null 2>&1; then
          set -- --setenv=PATH="$PATH" --setenv=CONDUCTOR_INSTANCE={{shellQuote .INSTANCE}}
          if [ -n "${CONDUCTOR_CONFIG:-}" ]; then set -- "$@" --setenv=CONDUCTOR_CONFIG="$CONDUCTOR_CONFIG"; fi
          systemctl --user is-active --quiet {{shellQuote .UNIT}} || systemd-run --user --unit {{shellQuote .UNIT}} --collect "$@" "$(command -v conductor)" broker serve
          exit
        fi
        state={{shellQuote .STATE}}
        pidfile="$state/broker.pid"
        if [ -f "$pidfile" ]; then
          pid=$(cat "$pidfile")
          if ps -p "$pid" -o args= 2>/dev/null | grep -q 'broker serve'; then
            echo "the broker runs already as pid $pid ($pidfile); see task broker:stop" >&2
            exit 1
          fi
        fi
        mkdir -p "$state"
        pid=$(CONDUCTOR_INSTANCE={{shellQuote .INSTANCE}} sh -c 'nohup "$0" broker serve </dev/null >>"$1" 2>&1 & echo $!' "$(command -v conductor)" "$state/broker.log")
        echo "$pid" > "$pidfile"
        echo "the broker runs as pid $pid; its output is in $state/broker.log"

  broker:stop:
    desc: Stop the active instance's broker; where systemctl is on PATH its user service, <session_prefix>-conductor-broker or conductor-broker without a prefix, elsewhere the pid in broker.pid of the instance's state directory (conductor config show), whose file it removes
    vars:
      STATE:
        sh: conductor config show --format json | jq -r '.instances[0].state'
      UNIT:
        sh: conductor config show --format json | jq -r '.instances[0] | if .session_prefix then .session_prefix + "-conductor-broker" else "conductor-broker" end'
    preconditions:
      - sh: test -n {{shellQuote .UNIT}}
        msg: conductor config show names no instance
    cmds:
      - |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl --user stop {{shellQuote .UNIT}}
          exit
        fi
        pidfile={{shellQuote .STATE}}/broker.pid
        if [ ! -f "$pidfile" ]; then
          echo "no broker pid file at $pidfile; nothing to stop"
          exit 0
        fi
        pid=$(cat "$pidfile")
        if ps -p "$pid" -o args= 2>/dev/null | grep -q 'broker serve'; then
          sh -c 'kill "$0"' "$pid"
        fi
        rm -f "$pidfile"

  status:
    desc: Take a snapshot of every repository the active instance tracks (conductor snapshot start-snapshot runs the collectors) and publish it as the board, STATUS.md in the instance's records directory (conductor snapshot publish-board); publishes nothing when the snapshot fails
    cmds:
      - id=$(conductor snapshot start-snapshot) && conductor snapshot publish-board --snapshot-id "$id"

  install:
    desc: Install the conductor binary from this checkout, which carries the role profiles (conductor role show --role <role>); conductor-dev runs it after a wave merges and check is green
    cmds:
      - cargo install --path crates/conductor --locked

  measure:
    desc: Run the wall-clock measurements alone, outside the gate (the append-cost ratio, the guard latency and the dashboard's warm answers); run it on a quiet host
    cmds:
      - cargo test --release --locked -p conductor-cli --test store_tree -- --ignored --nocapture appends_at_5000_events_cost_less_than_three_times_appends_at_500
      - cargo test --release --locked -p conductor-cli --test guard_latency -- --ignored --nocapture
      - cargo test --release --locked -p conductor-cli --test dashboard_fast -- --ignored --nocapture

  container-test:
    desc: Build the container image from this tree's binary and start it with no terminal from a config file and a mounted secrets directory, then read /readyz and doctor's last line; the image is tagged CONDUCTOR_CONTAINER_TAG (else conductor:check) and removed afterwards; needs docker and the network
    cmds:
      - cargo test --locked -p conductor-cli --test container_start -- --ignored --nocapture the_image_starts_with_no_terminal_and_doctor_ends_ready

  ui:
    desc: Build the dashboard app (crates/conductor/dashboard, Vue 3 and Vite on the Node version of its .nvmrc) into crates/conductor/dashboard/dist/, which is committed and which the conductor binary embeds; installs the locked packages first (npm ci)
    dir: crates/conductor/dashboard
    cmds:
      - npm ci
      - npm run build

  ui:dev:
    desc: Serve the dashboard app from source with hot reload on http://127.0.0.1:5173/ (Vite dev mode); its /v1/ requests go to the running daemon, CONDUCTOR_DAEMON (default http://127.0.0.1:7300), so start conductord first
    dir: crates/conductor/dashboard
    cmds:
      - npm run dev

  ui:ux-gate:
    desc: "The dashboard's UX gate (story:dashboard-ui-loop, part of task check): the layout contract's break-tests, then over every scenario state of crates/conductor/dashboard/ux/scenarios at 1440x900 and 1280x800 in both themes the layout contract (no horizontal page scroll, no element past its box, the header with the instance selector and the page navigation wholly in view, every element the state names shown, each theme on screen with a page background of its own), axe-core (no serious or critical violation of wcag2a to wcag22aa) and the screen-only and keyboard-only users, from the committed dist/ and the store fixtures, without keys or network; fails on a value worse than ux/baseline.json or an improvement not taken into it (task ui:ux-gate -- --update, a hard-gate value that enters above 0 or rises with --decision <id>) or a baseline worse than origin/main without a decision of its own, which in CI must be fetched; needs the locked packages (npm ci) and a Playwright Chromium (npx --prefix crates/conductor/dashboard playwright install chromium)"
    dir: crates/conductor/dashboard
    cmds:
      - node ux/gate.ts {{shellQuote .CLI_ARGS}}

  ui:ux-round:
    desc: "One UX round of the dashboard into crates/conductor/dashboard/ux/rounds/<round>, every viewport, with shots, and one row of its ux/trend.md: task ui:ux-round -- R-02"
    dir: crates/conductor/dashboard
    cmds:
      - node ux/round.ts {{shellQuote .CLI_ARGS}}

  check:
    desc: Scan every tracked file with Gates (when B10X_GATES_POLICY names a policy), validate and run the specification, hold crates/conductor-model to it, test the dashboard app, hold crates/conductor/dashboard/dist to a fresh build and run the dashboard's UX gate (task ui:ux-gate) on it, then format, lint and test
    cmds:
      - if [ -n "${B10X_GATES_POLICY:-}" ]; then git ls-files -z | xargs -0 b10x-gates scan-text; else echo "B10X_GATES_POLICY is not set; the Gates scan is skipped" >&2; fi
      - "{{shellQuote .ESS}} specify validate --path spec"
      - mkdir -p .check
      - echo '*' > .check/.gitignore
      - "{{shellQuote .ESS}} verify conform run --path spec --scenarios spec/scenarios --target interpreted --report-format 2 --report-out .check/conformance.json"
      - rm -rf .check/conductor-model
      - "{{shellQuote .ESS}} generate synthesize --path spec --target rust --layout crate --http crates/conductor/http.yaml --out .check/conductor-model"
      - diff -r --exclude=.ess-output crates/conductor-model .check/conductor-model
      - npm --prefix crates/conductor/dashboard ci
      - npm --prefix crates/conductor/dashboard test
      - task: ui
      - git diff --exit-code -- crates/conductor/dashboard/dist
      - test -z "$(git status --porcelain --untracked-files=all -- crates/conductor/dashboard/dist)" || { git status --short --untracked-files=all -- crates/conductor/dashboard/dist; echo "crates/conductor/dashboard/dist differs from a fresh build; run task ui and commit dist/" >&2; exit 1; }
      - task: ui:ux-gate
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - LC_ALL=C cargo nextest run --no-fail-fast
      - task: docs-check

  docs-generate:
    desc: Regenerate the derived documentation pages (website/docs/reference/, website/docs/status.md, website/data/status.json)
    cmds:
      - cargo run --locked -p conductor-docs -- generate

  docs-check:
    desc: Fail when a derived documentation page is missing, stale or edited, or a page under website/docs is not passive Markdown
    cmds:
      - cargo run --locked -p conductor-docs -- generate --check

  ux-build:
    desc: Build the documentation site the UX gate and rounds measure (website/build)
    cmds:
      - npm --prefix website run build

  ux-gate:
    desc: The UX ratchet on the built site, gating viewports, both themes, then the regression assets and the findings test (about 5 minutes; needs task ux-build and a Playwright Chromium)
    cmds:
      - node ux/gate.mjs
      - node --test ux/regression/*.test.mjs ux/findings.test.mjs

  ux-round:
    desc: "One UX round into ux/rounds/<round>: task ux-round -- R-02"
    cmds:
      - node ux/round.mjs {{shellQuote .CLI_ARGS}}

  regen:
    desc: Regenerate crates/conductor-model from spec/ and the HTTP binding crates/conductor/http.yaml; every byte of it is generated
    cmds:
      - rm -rf crates/conductor-model
      - "{{shellQuote .ESS}} generate synthesize --path spec --target rust --layout crate --http crates/conductor/http.yaml --out crates/conductor-model"
