# story:secrets-source, decision S5: a put over a name already on record refuses unless it asks
# to replace the value.
type: ess-scenario/1
domain: conductor.secret
scenario: secret-put-secret-exists
summary: A second put under a name already on record without replace is refused with SecretExists, and the record stays as the first put wrote it.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-forge
      put_at: 2026-11-08T09:00:00Z
      replace: false
    outcome: stored

  - at: 2026-11-08T09:30:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-forge
      put_at: 2026-11-08T09:30:00Z
      replace: false
    outcome: exists
    error:
      name: conductor.secret.SecretExists

assert:
  - view: conductor.secret.Secrets
    contains:
      name: example-org-forge
      state: Stored
      source: Keychain
      created_at: 2026-11-08T09:00:00Z
