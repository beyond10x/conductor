# Attaches pre-built `conductor` binaries to the GitHub Release of every version tag: one
# `conductor-<version>-<target>.tar.gz` per target and one `SHA256SUMS`, in the naming and layout
# of the `ess` and `aep` releases. Each archive holds one directory, `conductor-<version>-<target>/`,
# with the `conductor` binary, `LICENSE` and `README.md`.
#
# Then it pushes the release's container image for linux/amd64, built from the
# `x86_64-unknown-linux-gnu` binary of the same run, to `ghcr.io/<owner>/<repository>` under the
# bare version and, for the newest release, `latest` (the `image` job), and names it by tag and
# digest in the Release's notes (the `image-notes` job).
#
# Tags are `v<version>` (AGENTS.md § Releases); the archives and the image carry the bare version.
# A manual dispatch backfills the archives and the image of an existing tag; every checkout
# receives that tag's commit explicitly, so a newer workflow file never packages newer source.
#
# The tagged commit is `main`'s, already gated by `check.yml` before the tag is cut, so this
# workflow builds and verifies the binaries rather than running the gate again.
#
# Every action is pinned by commit: the publishing job holds write authority, so neither the
# action code nor the source revision it packages may float.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to backfill, for example v0.5.0.
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  provenance:
    name: Verify tag provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Tag, Cargo version and checkout agree
        id: release
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be v<major>.<minor>.<patch>; got $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          git cat-file -e "refs/tags/$TAG^{tag}"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::the checkout does not match tag $TAG at $commit" >&2
            exit 1
          fi
          cargo_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "conductor-cli") | .version')
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::tag $TAG names $version, but conductor-cli is $cargo_version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: provenance
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.provenance.outputs.commit }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Provide Rosetta for the Intel smoke run
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Build and smoke-test the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_COMMIT: ${{ needs.provenance.outputs.commit }}
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::packaging $EXPECTED_COMMIT, but the checkout is $head_commit" >&2
            exit 1
          fi
          cargo build --locked --release -p conductor-cli --bin conductor --target "$TARGET"
          bin="target/$TARGET/release/conductor"
          case "$TARGET" in
            x86_64-apple-darwin) expected=x86_64 ;;
            aarch64-apple-darwin) expected=arm64 ;;
            *) expected="" ;;
          esac
          if [ -n "$expected" ] && [ "$(lipo -archs "$bin")" != "$expected" ]; then
            echo "::error::$bin is $(lipo -archs "$bin"), not $expected" >&2
            exit 1
          fi
          "$bin" --help > /dev/null

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.provenance.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="conductor-$VERSION-$TARGET"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/conductor" "dist/$package/"
          cp LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -r "dist/$package"
          test -s "dist/$package.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the archives
    needs: [provenance, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify and combine checksums
        env:
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          archive_count=$(find . -maxdepth 1 -type f -name "*.tar.gz" | wc -l | tr -d ' ')
          if [ "$archive_count" != 4 ]; then
            echo "::error::expected four release archives; found $archive_count" >&2
            exit 1
          fi
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            test -f "conductor-$VERSION-$target.tar.gz" || {
              echo "::error::missing conductor-$VERSION-$target.tar.gz" >&2
              exit 1
            }
          done
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Smoke-run the Linux archive prepared for publication
        env:
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/conductor-$VERSION-x86_64-unknown-linux-gnu.tar.gz" -C "$smoke"
          "$smoke/conductor-$VERSION-x86_64-unknown-linux-gnu/conductor" --help > /dev/null

      # The Release is normally created by hand right after the tag is pushed (AGENTS.md
      # § Releases); the archives are then attached to it. When none exists yet, one is created
      # with the tag's message as its notes, to be edited afterwards.
      - name: Attach the archives to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.provenance.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            # This job has no checkout, so the tag's message is read through the API rather than
            # with --notes-from-tag, which needs the tag locally.
            object=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
            gh api "repos/$GH_REPO/git/tags/$object" --jq .message > notes.md
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --title "conductor $TAG" --notes-file notes.md --verify-tag
          fi

  # The container image of the release, `ghcr.io/<owner>/<repository>:<version>`, for linux/amd64:
  # the tag's own `Dockerfile` around the binary of the `x86_64-unknown-linux-gnu` archive the
  # `package` job of this run built, so the image holds the release's binary and nothing is
  # compiled a second time. It runs after `release`, so the Release it names the image in exists.
  #
  # This job alone may write packages, and it may write nothing of the repository: its build
  # downloads installers. What it pushed goes on to `image-notes` as its outputs.
  image:
    name: Publish the container image
    needs: [provenance, package, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      reference: ${{ steps.push.outputs.reference }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.provenance.outputs.tag }}
      VERSION: ${{ needs.provenance.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.provenance.outputs.commit }}
          path: source
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-x86_64-unknown-linux-gnu
          path: dist

      # The build context is the binary alone. A tag cut before the image existed holds no
      # `Dockerfile`: a dispatch that backfills its archives ends here, with a notice, every later
      # step is skipped, and so is `image-notes`.
      - name: Build the image from the packaged binary
        id: build
        env:
          COMMIT: ${{ needs.provenance.outputs.commit }}
        run: |
          set -euo pipefail
          if [ ! -f source/Dockerfile ]; then
            echo "::notice::$TAG holds no Dockerfile, so it gets no container image"
            echo "image=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          package="conductor-$VERSION-x86_64-unknown-linux-gnu"
          mkdir context
          tar -xzf "dist/$package.tar.gz" -C context --strip-components=1 "$package/conductor"
          docker build --platform linux/amd64 --file source/Dockerfile \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --tag "$IMAGE:$VERSION" context
          echo "image=built" >> "$GITHUB_OUTPUT"

      - name: Run the image
        if: ${{ steps.build.outputs.image == 'built' }}
        run: |
          set -euo pipefail
          printed=$(docker run --rm "$IMAGE:$VERSION" conductor --version)
          if [ "$printed" != "conductor $VERSION" ]; then
            echo "::error::the image's conductor --version prints '$printed', not 'conductor $VERSION'" >&2
            exit 1
          fi
          user=$(docker run --rm "$IMAGE:$VERSION" id -u)
          if [ "$user" = 0 ]; then
            echo "::error::the image runs as root" >&2
            exit 1
          fi
          for program in git gh glab claude jq aep worktree ess b10x-gates
          do
            docker run --rm "$IMAGE:$VERSION" "$program" --version
          done

      # `latest` names the newest release, so the backfill of an older tag leaves it alone.
      - name: Push the image
        id: push
        if: ${{ steps.build.outputs.image == 'built' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          if [ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$TAG" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          docker logout ghcr.io
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$VERSION" \
            | sed -n "s|^$IMAGE@||p" | head -n 1)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the registry answered no digest for $IMAGE:$VERSION; got '$digest'" >&2
            exit 1
          fi
          echo "reference=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The registry is public only when the package is: a package's first push leaves it
      # private until its visibility is set to public once, in the package's settings.
      - name: Pull the image without a login
        if: ${{ steps.build.outputs.image == 'built' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker image ls --quiet "$IMAGE" | sort -u | xargs docker image rm --force
          if ! docker pull "$IMAGE@$DIGEST"; then
            echo "::error::$IMAGE is not public: set the package's visibility to public, then re-run this job" >&2
            exit 1
          fi
          docker run --rm "$IMAGE@$DIGEST" conductor --version

  # One section, `## Container image`, at the end of the Release's notes: the body a human wrote
  # stays as it is, and a re-run replaces the section instead of adding a second.
  #
  # This job holds `contents: write` and nothing else. It checks nothing out, downloads nothing
  # and builds nothing: it only reads the Release's body, edits it and writes it back, with the
  # reference and the digest the `image` job pushed. It is skipped when that job built no image.
  image-notes:
    name: Name the image in the Release notes
    needs: [provenance, image]
    if: ${{ needs.image.outputs.image == 'built' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.provenance.outputs.tag }}
      REFERENCE: ${{ needs.image.outputs.reference }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Write the section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$REFERENCE" || ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image to name: reference '$REFERENCE', digest '$DIGEST'" >&2
            exit 1
          fi
          gh release view "$TAG" --json body --jq .body > body.md
          awk '
            /^## Container image[[:space:]]*$/ { own = 1; next }
            own && /^## / { own = 0 }
            !own { kept[++count] = $0 }
            END {
              while (count > 0 && kept[count] ~ /^[[:space:]]*$/) count--
              for (line = 1; line <= count; line++) print kept[line]
            }
          ' body.md > notes.md
          if [ -s notes.md ]; then
            echo >> notes.md
          fi
          {
            echo "## Container image"
            echo
            echo "\`$REFERENCE\` at digest \`$DIGEST\`"
            echo
            echo '```console'
            echo "docker run --rm $REFERENCE conductor --version"
            echo '```'
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
