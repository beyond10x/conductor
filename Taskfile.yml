version: '3'

vars:
  CONDUCTOR_PROMPT: 'Start of session. After the session-start reading and the lease check of your profile, arm what wakes you; the hand-over does not list it. Run CronList, then CronCreate each recurring job it does not show: one every cadence.cycle, one at cadence.daily (UTC) for the daily cycle, both values from conductor config show, with the prompts your profile gives. Start the watch once with the Monitor tool: conductor watch run --follow. Then read the hand-over committed last (git log -1 --name-only --format= -- docs/handoff/), act on its first task, then run one cycle.'
  DEV_PROMPT: Start of session. Read the newest docs/waves/handoff-conductor-dev-*.md, the plan it names, the hand-over committed last in docs/handoff/ of the instance's records directory (conductor config show) and docs/design/conductor.md section 12, then begin.
  SESSION_ID: claude agents --json | jq -r '.[] | select(.kind=="background" and .name==$n and .pid != null) | .id'
  SESSION_COUNT: claude agents --json | jq '[.[] | select(.kind=="background" and .name==$n and .pid != null)] | length'

tasks:
  sessions:
    desc: List the active instance's sessions, those named as its roles in conductor config show (<session_prefix>-conductor and <session_prefix>-conductor-dev, or conductor and conductor-dev without a prefix), with their kind, id and state; exits 1 naming each of those names that more than one live background session holds, since no task can tell which of them is this instance's
    vars:
      NAMES:
        sh: conductor config show --format json | jq -c '[.instances[0].roles[] | .session_name // empty]'
    preconditions:
      - sh: test -n {{shellQuote .NAMES}} && test {{shellQuote .NAMES}} != '[]'
        msg: conductor config show names no session name for the instance's roles
    cmds:
      - claude agents --json | jq -r --argjson names {{shellQuote .NAMES}} '.[] | select(.name as $n | any($names[]; . == $n)) | [.name, .kind, (.id // (.pid|tostring)), (.state // .status)] | @tsv'
      - |
        ambiguous=$(claude agents --json | jq -r --argjson names {{shellQuote .NAMES}} '. as $all | $names[] as $n | select([$all[] | select(.kind=="background" and .name==$n and .pid != null)] | length > 1) | $n')
        for name in $ambiguous; do
          echo "more than one live background session is named $name; stop the one that is not this instance's with claude stop <id>" >&2
        done
        [ -z "$ambiguous" ]

  conductor:start:
    desc: Start conductor in the background in the instance's records directory under the session name of the role conductor in conductor config show (<session_prefix>-conductor, or conductor without a prefix), without the user's settings (--setting-sources project,local), on the harness, model, settings and profile or agent of the role conductor (settings default this checkout's .claude/conductor-settings.json; a profile is appended to the system prompt in place of the agent, whose default is conductor); refuses while a live session of that name exists, when the profile is not a file, when the git checkout holding the profile has an upstream and is behind it after git fetch (a failing fetch compares with the upstream ref it has), and, without a profile, when the agent is not in the records' .claude/agents/ (--setting-sources project,local loads no agent from ~/.claude/agents/)
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .session_name // empty'
      RECORDS:
        sh: conductor config show --format json | jq -r '.instances[0].records'
      AGENT:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .agent // "conductor"'
      PROFILE:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .profile // empty'
      CHECKOUT:
        sh: test -n {{shellQuote .PROFILE}} && git -C "$(dirname {{shellQuote .PROFILE}})" rev-parse --show-toplevel 2>/dev/null || true
      HARNESS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .harness'
      MODEL:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .model'
      ROLE_SETTINGS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .settings // empty'
      SETTINGS: '{{.ROLE_SETTINGS | default (printf "%s/.claude/conductor-settings.json" .ROOT_DIR)}}'
    preconditions:
      - sh: test -n {{shellQuote .MODEL}}
        msg: conductor config show names no role conductor; add it to the instance's roles
      - sh: test {{shellQuote .HARNESS}} = claude
        msg: the role conductor runs on {{.HARNESS}} (conductor config show); this task starts claude only
      - sh: test -d {{shellQuote .RECORDS}}
        msg: the records directory {{.RECORDS}} of conductor config show is not a directory
      - sh: test -z {{shellQuote .PROFILE}} || test -f {{shellQuote .PROFILE}}
        msg: the profile {{.PROFILE}} of the role conductor is not a file
      - sh: test -z {{shellQuote .CHECKOUT}} || ! git -C {{shellQuote .CHECKOUT}} rev-parse --verify --quiet '@{upstream}' >/dev/null || { GIT_TERMINAL_PROMPT=0 git -C {{shellQuote .CHECKOUT}} fetch --quiet >/dev/null 2>&1 || true; test "$(git -C {{shellQuote .CHECKOUT}} rev-list --count 'HEAD..@{upstream}' 2>/dev/null || echo 0)" = 0; }
        msg: the checkout {{.CHECKOUT}} holding the profile {{.PROFILE}} of the role conductor is behind its upstream after git fetch, so conductor would start on an old profile; fast-forward it with git -C {{.CHECKOUT}} merge --ff-only, then run the task again
      - sh: test -n {{shellQuote .PROFILE}} || case {{shellQuote .AGENT}} in '' | */* | .*) exit 1 ;; esac
        msg: the agent {{.AGENT}} of the role conductor is not a plain agent name (no /, no leading .); the agent must be a file <agent>.md in {{.RECORDS}}/.claude/agents/
      - sh: test -n {{shellQuote .PROFILE}} || test -f {{shellQuote .RECORDS}}/.claude/agents/{{shellQuote .AGENT}}.md
        msg: the agent {{.AGENT}} is not in {{.RECORDS}}/.claude/agents/, and conductor starts with --setting-sources project,local, which loads no user-level agent from ~/.claude/agents/; name a profile for the role conductor (conductor config show), or put the adapter <agent>.md in {{.RECORDS}}/.claude/agents/
      - sh: jq -e '.skipDangerousModePermissionPrompt == true' {{shellQuote .SETTINGS}} >/dev/null 2>&1 || jq -e '.skipDangerousModePermissionPrompt == true' "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/settings.json" >/dev/null 2>&1 || jq -e '.bypassPermissionsModeAccepted == true' "${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json" >/dev/null 2>&1
        msg: >-
          Claude Code's bypass-permissions disclaimer is not accepted, and claude --bg refuses bypassPermissions without it:
          ~/.claude/settings.json (or $CLAUDE_CONFIG_DIR/settings.json) does not set skipDangerousModePermissionPrompt to true,
          ~/.claude.json does not set bypassPermissionsModeAccepted to true,
          and the role conductor's settings file {{.SETTINGS}} does not set skipDangerousModePermissionPrompt to true.
          Run claude --dangerously-skip-permissions once interactively in {{.RECORDS}} and accept the disclaimer,
          or set "skipDangerousModePermissionPrompt": true in {{.SETTINGS}}
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the role conductor
      - sh: claude agents --json | jq -e --arg n {{shellQuote .NAME}} 'all(.[]; .name != $n or .pid == null)' >/dev/null
        msg: a session named {{.NAME}} is already running; see task sessions
    cmds:
      - cd {{shellQuote .RECORDS}} && if [ -n {{shellQuote .PROFILE}} ]; then flag=--append-system-prompt-file; who={{shellQuote .PROFILE}}; else flag=--agent; who={{shellQuote .AGENT}}; fi && claude --bg -n {{shellQuote .NAME}} "$flag" "$who" --model {{shellQuote .MODEL}} --permission-mode bypassPermissions --setting-sources project,local --settings {{shellQuote .SETTINGS}} {{shellQuote .CONDUCTOR_PROMPT}}

  conductor:attach:
    desc: Open the active instance's background conductor session, the live session named as the role conductor in conductor config show, in this terminal, in the instance's records directory; refuses when no live background session or more than one holds that name
    interactive: true
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .session_name // empty'
      RECORDS:
        sh: conductor config show --format json | jq -r '.instances[0].records'
    preconditions:
      - sh: test -d {{shellQuote .RECORDS}}
        msg: the records directory {{.RECORDS}} of conductor config show is not a directory
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the role conductor
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -ge 1
        msg: no background session named {{.NAME}}; see task sessions
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -le 1
        msg: more than one live background session is named {{.NAME}}, so this task cannot tell which is this instance's conductor; stop the one that is not with claude stop <id> (task sessions lists them), then run the task again
    cmds:
      - cd {{shellQuote .RECORDS}} && claude attach "$({{.SESSION_ID}} --arg n {{shellQuote .NAME}})"

  conductor:restart:
    desc: Stop the active instance's background conductor, the live session named as the role conductor in conductor config show (a session of another name, another instance's conductor among them, is left running), remove it from the session list (its transcript stays; claude --resume reopens it) and start a new one in the instance's records directory that reads the newest handoff (conductor-dev runs this after [RESTART]); stops nothing when more than one live background session holds that name, or when conductor:start would refuse the new one (role, harness, records directory, profile, a profile checkout behind its upstream, or agent)
    preconditions:
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the role conductor
      - sh: test -n "$({{.SESSION_ID}} --arg n {{shellQuote .NAME}})"
        msg: no background session named {{.NAME}}
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -le 1
        msg: more than one live background session is named {{.NAME}}, so this task cannot tell which is this instance's conductor and stops none; stop the one that is not with claude stop <id> (task sessions lists them), then run the task again
      - sh: test -n {{shellQuote .MODEL}}
        msg: conductor config show names no role conductor; add it to the instance's roles
      - sh: test {{shellQuote .HARNESS}} = claude
        msg: the role conductor runs on {{.HARNESS}} (conductor config show); this task starts claude only
      - sh: test -d {{shellQuote .RECORDS}}
        msg: the records directory {{.RECORDS}} of conductor config show is not a directory
      - sh: test -z {{shellQuote .PROFILE}} || test -f {{shellQuote .PROFILE}}
        msg: the profile {{.PROFILE}} of the role conductor is not a file
      - sh: test -z {{shellQuote .CHECKOUT}} || ! git -C {{shellQuote .CHECKOUT}} rev-parse --verify --quiet '@{upstream}' >/dev/null || { GIT_TERMINAL_PROMPT=0 git -C {{shellQuote .CHECKOUT}} fetch --quiet >/dev/null 2>&1 || true; test "$(git -C {{shellQuote .CHECKOUT}} rev-list --count 'HEAD..@{upstream}' 2>/dev/null || echo 0)" = 0; }
        msg: the checkout {{.CHECKOUT}} holding the profile {{.PROFILE}} of the role conductor is behind its upstream after git fetch, so conductor would start on an old profile; fast-forward it with git -C {{.CHECKOUT}} merge --ff-only, then run the task again
      - sh: test -n {{shellQuote .PROFILE}} || case {{shellQuote .AGENT}} in '' | */* | .*) exit 1 ;; esac
        msg: the agent {{.AGENT}} of the role conductor is not a plain agent name (no /, no leading .); the agent must be a file <agent>.md in {{.RECORDS}}/.claude/agents/
      - sh: test -n {{shellQuote .PROFILE}} || test -f {{shellQuote .RECORDS}}/.claude/agents/{{shellQuote .AGENT}}.md
        msg: the agent {{.AGENT}} is not in {{.RECORDS}}/.claude/agents/, and conductor starts with --setting-sources project,local, which loads no user-level agent from ~/.claude/agents/; name a profile for the role conductor (conductor config show), or put the adapter <agent>.md in {{.RECORDS}}/.claude/agents/
      - sh: jq -e '.skipDangerousModePermissionPrompt == true' {{shellQuote .SETTINGS}} >/dev/null 2>&1 || jq -e '.skipDangerousModePermissionPrompt == true' "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/settings.json" >/dev/null 2>&1 || jq -e '.bypassPermissionsModeAccepted == true' "${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json" >/dev/null 2>&1
        msg: >-
          Claude Code's bypass-permissions disclaimer is not accepted, and claude --bg refuses bypassPermissions without it:
          ~/.claude/settings.json (or $CLAUDE_CONFIG_DIR/settings.json) does not set skipDangerousModePermissionPrompt to true,
          ~/.claude.json does not set bypassPermissionsModeAccepted to true,
          and the role conductor's settings file {{.SETTINGS}} does not set skipDangerousModePermissionPrompt to true.
          Run claude --dangerously-skip-permissions once interactively in {{.RECORDS}} and accept the disclaimer,
          or set "skipDangerousModePermissionPrompt": true in {{.SETTINGS}}
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .session_name // empty'
      ROLE_SETTINGS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .settings // empty'
      SETTINGS: '{{.ROLE_SETTINGS | default (printf "%s/.claude/conductor-settings.json" .ROOT_DIR)}}'
      RECORDS:
        sh: conductor config show --format json | jq -r '.instances[0].records'
      AGENT:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .agent // "conductor"'
      PROFILE:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .profile // empty'
      CHECKOUT:
        sh: test -n {{shellQuote .PROFILE}} && git -C "$(dirname {{shellQuote .PROFILE}})" rev-parse --show-toplevel 2>/dev/null || true
      HARNESS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .harness'
      MODEL:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .model'
      OLD:
        sh: claude agents --json | jq -r --arg n {{shellQuote .NAME}} '.[] | select(.kind=="background" and .name==$n and .pid != null) | .id'
    cmds:
      - cd {{shellQuote .RECORDS}} && claude stop {{shellQuote .OLD}}
      - cd {{shellQuote .RECORDS}} && { for i in $(seq 30); do claude agents --json | jq -e --arg n {{shellQuote .NAME}} 'all(.[]; .name != $n or .pid == null)' >/dev/null && exit 0; sleep 1; done; echo "the stopped conductor still has a pid after 30 s" >&2; exit 1; }
      - cd {{shellQuote .RECORDS}} && claude rm {{shellQuote .OLD}}
      - task: conductor:start

  dev:start:
    desc: Start conductor-dev in the background in this checkout under the session name of the role conductor-dev in conductor config show (<session_prefix>-conductor-dev, or conductor-dev without a prefix), without the user's settings (--setting-sources project,local), on the harness, model, settings and profile of the role conductor-dev (no settings file by default; a profile is appended to the system prompt in place of --agent conductor-dev, which --setting-sources project,local finds only in this checkout's .claude/agents/); refuses while a live session of that name exists, when the profile is not a file, and, without a profile, when this checkout has no .claude/agents/conductor-dev.md
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .session_name // empty'
      SETTINGS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .settings // empty'
      PROFILE:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .profile // empty'
      HARNESS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .harness'
      MODEL:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .model'
    preconditions:
      - sh: test -n {{shellQuote .MODEL}}
        msg: conductor config show names no role conductor-dev; add it to the instance's roles
      - sh: test {{shellQuote .HARNESS}} = claude
        msg: the role conductor-dev runs on {{.HARNESS}} (conductor config show); this task starts claude only
      - sh: test -z {{shellQuote .PROFILE}} || test -f {{shellQuote .PROFILE}}
        msg: the profile {{.PROFILE}} of the role conductor-dev is not a file
      - sh: test -n {{shellQuote .PROFILE}} || test -f {{shellQuote .ROOT_DIR}}/.claude/agents/conductor-dev.md
        msg: this checkout has no .claude/agents/conductor-dev.md, and conductor-dev starts here with --setting-sources project,local, which loads no user-level agent; name a profile for the role conductor-dev (conductor config show)
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the role conductor-dev
      - sh: claude agents --json | jq -e --arg n {{shellQuote .NAME}} 'all(.[]; .name != $n or .pid == null)' >/dev/null
        msg: a session named {{.NAME}} is already running; see task sessions
    cmds:
      - if [ -n {{shellQuote .PROFILE}} ]; then flag=--append-system-prompt-file; who={{shellQuote .PROFILE}}; else flag=--agent; who=conductor-dev; fi && set -- && if [ -n {{shellQuote .SETTINGS}} ]; then set -- --settings {{shellQuote .SETTINGS}}; fi && claude --bg -n {{shellQuote .NAME}} "$flag" "$who" --model {{shellQuote .MODEL}} --permission-mode bypassPermissions --setting-sources project,local "$@" {{shellQuote .DEV_PROMPT}}

  dev:attach:
    desc: Open the active instance's background conductor-dev session, the live session named as the role conductor-dev in conductor config show, in this terminal; refuses when no live background session or more than one holds that name
    interactive: true
    vars:
      NAME:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .session_name // empty'
    preconditions:
      - sh: test -n {{shellQuote .NAME}}
        msg: conductor config show names no session name for the role conductor-dev
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -ge 1
        msg: no background session named {{.NAME}}; see task sessions
      - sh: test "$({{.SESSION_COUNT}} --arg n {{shellQuote .NAME}})" -le 1
        msg: more than one live background session is named {{.NAME}}, so this task cannot tell which is this instance's conductor-dev; stop the one that is not with claude stop <id> (task sessions lists them), then run the task again
    cmds:
      - claude attach "$({{.SESSION_ID}} --arg n {{shellQuote .NAME}})"

  trust:
    desc: Mark the instance's records directory (by its physical path) and every git checkout directly under its checkouts root (conductor config show) as trusted Claude Code workspaces in ~/.claude.json, so conductor and a controller can start there (conductor trust); refuses a records path that holds a line break or is not a directory, and writes nothing when ~/.claude.json changed during the run
    cmds:
      - conductor trust

  agents:link:
    desc: Link this checkout's .claude/agents/conductor.md, repo-controller.md and conductor-dev.md into ~/.claude/agents/, for an interactive session started with the user's own settings; the sessions the tasks start pass --setting-sources project,local and read no user-level agent; a link to the same file is kept, and any other file there is refused, never overwritten
    cmds:
      - |
        src={{shellQuote .ROOT_DIR}}/.claude/agents
        dst="$HOME/.claude/agents"
        refused=0
        for name in conductor repo-controller conductor-dev; do
          from="$src/$name.md"; to="$dst/$name.md"
          if [ ! -f "$from" ]; then echo "agents:link: $from is not a file" >&2; refused=1; continue; fi
          if [ -L "$to" ] && [ "$to" -ef "$from" ]; then continue; fi
          if [ -e "$to" ] || [ -L "$to" ]; then echo "agents:link: $to is there and is not a link to $from; move it away and run task agents:link again" >&2; refused=1; fi
        done
        [ "$refused" = 0 ] || exit 1
        mkdir -p "$dst"
        for name in conductor repo-controller conductor-dev; do
          from="$src/$name.md"; to="$dst/$name.md"
          if [ -L "$to" ] && [ "$to" -ef "$from" ]; then echo "linked already: $to"; continue; fi
          ln -s "$from" "$to" || exit 1; echo "linked: $to -> $from"
        done

  dashboard:
    desc: Start the active instance's dashboard on 127.0.0.1 at its dashboard_port in conductor config show (7313 for the file's first instance and one more for each later one, unless the file writes it) and print its URL; the dashboard serves that instance (CONDUCTOR_INSTANCE); where systemctl is on PATH as the instance's user service, <session_prefix>-conductor-dashboard or conductor-dashboard without a prefix, unless it is active, elsewhere in the background with nohup, its pid in dashboard.pid and its output in dashboard.log of the instance's state directory (conductor config show), refusing while that pid runs
    silent: true
    vars:
      STATE:
        sh: conductor config show --format json | jq -r '.instances[0].state'
      INSTANCE:
        sh: conductor config show --format json | jq -r '.instances[0].name'
      PORT:
        sh: conductor config show --format json | jq -r '.instances[0].dashboard_port // empty'
      UNIT:
        sh: conductor config show --format json | jq -r '.instances[0] | if .session_prefix then .session_prefix + "-conductor-dashboard" else "conductor-dashboard" end'
    preconditions:
      - sh: test -n {{shellQuote .PORT}}
        msg: conductor config show names no dashboard_port for the instance
    cmds:
      - |
        if command -v systemctl >/dev/null 2>&1; then
          set -- --setenv=PATH="$PATH" --setenv=CONDUCTOR_INSTANCE={{shellQuote .INSTANCE}}
          if [ -n "${CONDUCTOR_CONFIG:-}" ]; then set -- "$@" --setenv=CONDUCTOR_CONFIG="$CONDUCTOR_CONFIG"; fi
          systemctl --user is-active --quiet {{shellQuote .UNIT}} || systemd-run --user --unit {{shellQuote .UNIT}} --collect "$@" "$(command -v conductor)" dashboard serve --port {{shellQuote .PORT}}
          exit
        fi
        state={{shellQuote .STATE}}
        pidfile="$state/dashboard.pid"
        if [ -f "$pidfile" ]; then
          pid=$(cat "$pidfile")
          if ps -p "$pid" -o args= 2>/dev/null | grep -q 'dashboard serve'; then
            echo "the dashboard runs already as pid $pid ($pidfile); see task dashboard:stop" >&2
            exit 1
          fi
        fi
        mkdir -p "$state"
        pid=$(CONDUCTOR_INSTANCE={{shellQuote .INSTANCE}} sh -c 'nohup "$0" dashboard serve --port "$2" </dev/null >>"$1" 2>&1 & echo $!' "$(command -v conductor)" "$state/dashboard.log" {{shellQuote .PORT}})
        echo "$pid" > "$pidfile"
        echo "the dashboard runs as pid $pid; its output is in $state/dashboard.log"
      - echo Open http://127.0.0.1:{{shellQuote .PORT}}/

  dashboard:stop:
    desc: Stop the active instance's dashboard; where systemctl is on PATH its user service, <session_prefix>-conductor-dashboard or conductor-dashboard without a prefix, elsewhere the pid in dashboard.pid of the instance's state directory (conductor config show), whose file it removes
    vars:
      STATE:
        sh: conductor config show --format json | jq -r '.instances[0].state'
      UNIT:
        sh: conductor config show --format json | jq -r '.instances[0] | if .session_prefix then .session_prefix + "-conductor-dashboard" else "conductor-dashboard" end'
    preconditions:
      - sh: test -n {{shellQuote .UNIT}}
        msg: conductor config show names no instance
    cmds:
      - |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl --user stop {{shellQuote .UNIT}}
          exit
        fi
        pidfile={{shellQuote .STATE}}/dashboard.pid
        if [ ! -f "$pidfile" ]; then
          echo "no dashboard pid file at $pidfile; nothing to stop"
          exit 0
        fi
        pid=$(cat "$pidfile")
        if ps -p "$pid" -o args= 2>/dev/null | grep -q 'dashboard serve'; then
          sh -c 'kill "$0"' "$pid"
        fi
        rm -f "$pidfile"

  status:
    desc: Take a snapshot of every repository the active instance tracks (conductor snapshot start-snapshot runs the collectors) and publish it as the board, STATUS.md in the instance's records directory (conductor snapshot publish-board); publishes nothing when the snapshot fails
    cmds:
      - id=$(conductor snapshot start-snapshot) && conductor snapshot publish-board --snapshot-id "$id"

  install:
    desc: Install the conductor binary from this checkout; conductor-dev runs it after a wave merges and check is green
    cmds:
      - cargo install --path crates/conductor --locked

  measure:
    desc: Run the wall-clock measurements alone, outside the gate (the append-cost ratio and the guard latency); run it on a quiet host
    cmds:
      - cargo test --release --locked -p conductor-cli --test store_tree -- --ignored --nocapture appends_at_5000_events_cost_less_than_three_times_appends_at_500
      - cargo test --release --locked -p conductor-cli --test guard_latency -- --ignored --nocapture

  ui:
    desc: Build the dashboard app (crates/conductor/dashboard, Vue 3 and Vite on the Node version of its .nvmrc) into crates/conductor/dashboard/dist/, which is committed and which the conductor binary embeds; installs the locked packages first (npm ci)
    dir: crates/conductor/dashboard
    cmds:
      - npm ci
      - npm run build

  check:
    desc: Scan every tracked file with Gates (when B10X_GATES_POLICY names a policy), validate and run the specification, hold crates/conductor-model to it, test the dashboard app and hold crates/conductor/dashboard/dist to a fresh build, then format, lint and test
    cmds:
      - if [ -n "${B10X_GATES_POLICY:-}" ]; then git ls-files -z | xargs -0 b10x-gates scan-text; else echo "B10X_GATES_POLICY is not set; the Gates scan is skipped" >&2; fi
      - ess specify validate --path spec
      - mkdir -p .check
      - echo '*' > .check/.gitignore
      - ess verify conform run --path spec --scenarios spec/scenarios --target interpreted --report-format 2 --report-out .check/conformance.json
      - rm -rf .check/conductor-model
      - ess generate synthesize --path spec --target rust --layout crate --out .check/conductor-model
      - diff -r --exclude=.ess-output crates/conductor-model .check/conductor-model
      - npm --prefix crates/conductor/dashboard ci
      - npm --prefix crates/conductor/dashboard test
      - task: ui
      - git diff --exit-code -- crates/conductor/dashboard/dist
      - test -z "$(git status --porcelain --untracked-files=all -- crates/conductor/dashboard/dist)" || { git status --short --untracked-files=all -- crates/conductor/dashboard/dist; echo "crates/conductor/dashboard/dist differs from a fresh build; run task ui and commit dist/" >&2; exit 1; }
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test --no-fail-fast
      - task: docs-check

  docs-generate:
    desc: Regenerate the derived documentation pages (website/docs/reference/, website/docs/status.md, website/data/status.json)
    cmds:
      - cargo run --locked -p conductor-docs -- generate

  docs-check:
    desc: Fail when a derived documentation page is missing, stale or edited, or a page under website/docs is not passive Markdown
    cmds:
      - cargo run --locked -p conductor-docs -- generate --check

  regen:
    desc: Regenerate crates/conductor-model from spec/; every byte of it is generated
    cmds:
      - rm -rf crates/conductor-model
      - ess generate synthesize --path spec --target rust --layout crate --out crates/conductor-model
