version: conductor.config/2
default: personal
daemon:
  store: sqlite:~/.b10x/conductor/conductor.sqlite
instances:
  - name: personal
    placement: systemd
    session_prefix: personal
    sources:
      - github: example-org
    checkouts:
      root: ~/example-org
      trees: ~/.local/state/worktree/trees/example-org
    records: ~/example-org/conductor
    controllers:
      max_working: 5
      max_subagents: 4
      max_open_reviews: 3
    roles:
      - {role: director, harness: claude, model: opus}
      - role: lead
        harness: claude
        model: opus
        forge_token_env: [GH_TOKEN]
    catalog:
      repository: registry
      path: catalog/entries
      names: plain
    secret_syncs:
      - name: ci-policy
        source: {repository: policies, branch: main, path: ci/policy.json}
        secrets:
          - {owner: example-org, name: CI_POLICY}
        command: example-sync publish ci/policy.json
        dry_run: example-sync publish ci/policy.json --dry-run
    cadence:
      cycle: 2h
      daily: 08:07
    thresholds:
      disk_path: /
      disk_low: 100G
      disk_clear: 110G
      build_slot: 60G
      build_size: 10G
      gate_stop: 15G
      gate_resume: 17G
    authority:
      class_c: conductor
      class_o: operator
    usage:
      probe: usage-probe --json
      watcher: usage-rotator.service

  - name: work
    placement: systemd
    session_prefix: work
    sources:
      - local: ~/work
        exclude: [archive]
    checkouts:
      root: ~/work
      trees: ~/.local/state/worktree/trees/work
    controllers:
      max_working: 2
    roles:
      - {role: director, harness: claude, model: opus}
      - role: lead
        harness: claude
        model: sonnet
    repositories:
      - {match: legacy-service, activity: inactive}
      - {match: docs-site, no_releases: "published on merge, no release"}
    retention:
      snapshots: 24
    forge:
      route: direct
