# Design § 10: `instances/{name}/upgrade` installs the binary at the placement, with rollback on a
# runtime that does not come up. One upgrade comes up on the new version; the next does not and
# is rolled back to the previous binary.
# UNMAPPED: the rollback trigger is open (see `conductor.instance.UpgradeInstance`).
type: ess-scenario/1
domain: conductor.instance
scenario: instance-upgrade-instance
summary: An upgrade comes up on the new binary; a second upgrade whose runtime does not come up is rolled back and starts on the previous one.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.instance.StartInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      placement: local
      roles: [Director]
      box_id: 6f1c1d2e-0000-4000-8000-000000000001
      at: 2026-11-08T09:00:00Z
    outcome: created

  - at: 2026-11-08T09:00:10Z
    command: conductor.instance.ObserveInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Daemon}
      name: example-org
      answering: true
      binary_version: 1.0.0
      at: 2026-11-08T09:00:10Z
    outcome: answering

  - at: 2026-11-08T12:00:00Z
    command: conductor.instance.UpgradeInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      binary_version: 1.1.0
      at: 2026-11-08T12:00:00Z
    outcome: upgrading

  - at: 2026-11-08T12:00:20Z
    command: conductor.instance.ObserveInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Daemon}
      name: example-org
      answering: true
      binary_version: 1.1.0
      at: 2026-11-08T12:00:20Z
    outcome: answering

  - at: 2026-11-08T13:00:00Z
    command: conductor.instance.UpgradeInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      binary_version: 1.2.0
      at: 2026-11-08T13:00:00Z
    outcome: upgrading

  - at: 2026-11-08T13:05:00Z
    command: conductor.instance.UpgradeInstance
    actor: conductor.instance.Conductord
    input:
      actor: {kind: Daemon}
      name: example-org
      binary_version: 1.2.0
      at: 2026-11-08T13:05:00Z
    outcome: rolled-back

assert:
  - view: conductor.instance.Instances
    contains:
      name: example-org
      state: Starting
      binary_version: 1.1.0
