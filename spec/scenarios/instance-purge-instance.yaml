# Design § 4: deleting data is `conductor instance purge <name>`, class H, the operator's yes; a
# running instance is stopped first.
type: ess-scenario/1
domain: conductor.instance
scenario: instance-purge-instance
summary: A purge of a running instance is refused; once stopped, the operator purges it.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.instance.StartInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      placement: local
      roles: [Director]
      box_id: 6f1c1d2e-0000-4000-8000-000000000001
      at: 2026-11-08T09:00:00Z
    outcome: created

  - at: 2026-11-08T09:30:00Z
    command: conductor.instance.PurgeInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      at: 2026-11-08T09:30:00Z
    outcome: not-stopped

  - at: 2026-11-08T10:00:00Z
    command: conductor.instance.StopInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      at: 2026-11-08T10:00:00Z
    outcome: stopped

  - at: 2026-11-08T10:05:00Z
    command: conductor.instance.PurgeInstance
    actor: conductor.instance.Operator
    input:
      actor: {kind: Human, operator: operator-one}
      name: example-org
      at: 2026-11-08T10:05:00Z
    outcome: purged

assert:
  - view: conductor.instance.Instances
    contains:
      name: example-org
      state: Purged
      changed_by: {kind: Human, operator: operator-one}
