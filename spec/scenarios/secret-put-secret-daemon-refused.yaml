# docs/design/architecture-next.md § 3 (Actors), § 9: a person puts a secret into the keychain;
# the daemon holds no grant and is refused by kind, so a guard narrowed to `actor.kind == Agent`
# fails here.
type: ess-scenario/1
domain: conductor.secret
scenario: secret-put-secret-daemon-refused
summary: The daemon trying to put a secret is refused with ActorNotHuman, and no secret is on record.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Daemon}
      name: example-org-forge
      put_at: 2026-11-08T09:00:00Z
      replace: false
    outcome: not-human
    error:
      name: conductor.operator.ActorNotHuman

assert:
  - view: conductor.secret.Secrets
    excludes:
      name: example-org-forge
