# conductord resolves at box open on its own account: `{kind: Daemon}`.
type: ess-scenario/1
domain: conductor.secret
scenario: secret-resolve-secrets
summary: At box open conductord resolves the instance's one named secret and seals it into the box as a slot; the event names the slot and no value.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-model
      put_at: 2026-11-08T09:00:00Z
      replace: false
    outcome: stored

  - at: 2026-11-08T10:00:00Z
    command: conductor.secret.ResolveSecrets
    actor: conductor.secret.Conductord
    input:
      actor: {kind: Daemon}
      instance: example-org
      box: 6f1c2a4e-0000-4000-8000-000000000001
      slots:
        - secret: example-org-model
          box: 6f1c2a4e-0000-4000-8000-000000000001
          slot_name: model_token
          sealed_at: 2026-11-08T10:00:00Z
      resolved_at: 2026-11-08T10:00:00Z
    outcome: resolved
    events:
      - event: conductor.secret.SecretsResolved
        payload:
          instance: example-org
          box: 6f1c2a4e-0000-4000-8000-000000000001
          resolved_at: 2026-11-08T10:00:00Z

assert:
  - view: conductor.secret.Secrets
    contains:
      name: example-org-model
      state: Stored
      source: Keychain
