version: '3'

vars:
  CONDUCTOR_PROMPT: Start of session. Read the hand-over committed last (git log -1 --name-only --format= -- docs/handoff/), act on its first task, then run one cycle.
  DEV_PROMPT: Start of session. Read the newest docs/waves/handoff-conductor-dev-*.md, the plan it names, the hand-over committed last in docs/handoff/ of the instance's records directory (conductor config show) and docs/design/conductor.md section 12, then begin.
  SESSION_ID: claude agents --json | jq -r '.[] | select(.kind=="background" and .name==$n and .pid != null) | .id'

tasks:
  sessions:
    desc: List the conductor and conductor-dev sessions with their kind, id and state
    cmds:
      - claude agents --json | jq -r '.[] | select(.name=="conductor" or .name=="conductor-dev") | [.name, .kind, (.id // (.pid|tostring)), (.state // .status)] | @tsv'

  conductor:start:
    desc: Start conductor in the background in the instance's records directory, without the user's settings (--setting-sources project,local), on the harness, model, settings and profile or agent of the role conductor in conductor config show (settings default this checkout's .claude/conductor-settings.json; a profile is appended to the system prompt in place of the agent, whose default is conductor); refuses while a live session named conductor exists, when the profile is not a file, and, without a profile, when the agent is in neither ~/.claude/agents/ nor the records' .claude/agents/ (task agents:link)
    vars:
      RECORDS:
        sh: conductor config show --format json | jq -r '.instances[0].records'
      AGENT:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .agent // "conductor"'
      PROFILE:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .profile // empty'
      HARNESS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .harness'
      MODEL:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .model'
      ROLE_SETTINGS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .settings // empty'
      SETTINGS: '{{.ROLE_SETTINGS | default (printf "%s/.claude/conductor-settings.json" .ROOT_DIR)}}'
    preconditions:
      - sh: test -n {{shellQuote .MODEL}}
        msg: conductor config show names no role conductor; add it to the instance's roles
      - sh: test {{shellQuote .HARNESS}} = claude
        msg: the role conductor runs on {{.HARNESS}} (conductor config show); this task starts claude only
      - sh: test -d {{shellQuote .RECORDS}}
        msg: the records directory {{.RECORDS}} of conductor config show is not a directory
      - sh: test -z {{shellQuote .PROFILE}} || test -f {{shellQuote .PROFILE}}
        msg: the profile {{.PROFILE}} of the role conductor is not a file
      - sh: test -n {{shellQuote .PROFILE}} || case {{shellQuote .AGENT}} in '' | */* | .*) exit 1 ;; esac
        msg: the agent {{.AGENT}} of the role conductor is not a plain agent name (no /, no leading .); the agent must be a file <agent>.md in ~/.claude/agents/ or {{.RECORDS}}/.claude/agents/
      - sh: test -n {{shellQuote .PROFILE}} || test -f "$HOME"/.claude/agents/{{shellQuote .AGENT}}.md || test -f {{shellQuote .RECORDS}}/.claude/agents/{{shellQuote .AGENT}}.md
        msg: the agent {{.AGENT}} is in neither ~/.claude/agents/ nor {{.RECORDS}}/.claude/agents/ (the agent must be a file <agent>.md in one of them); run task agents:link, or name a profile for the role conductor
      - sh: jq -e '.skipDangerousModePermissionPrompt == true' {{shellQuote .SETTINGS}} >/dev/null 2>&1 || jq -e '.skipDangerousModePermissionPrompt == true' "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/settings.json" >/dev/null 2>&1 || jq -e '.bypassPermissionsModeAccepted == true' "${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json" >/dev/null 2>&1
        msg: >-
          Claude Code's bypass-permissions disclaimer is not accepted, and claude --bg refuses bypassPermissions without it:
          ~/.claude/settings.json (or $CLAUDE_CONFIG_DIR/settings.json) does not set skipDangerousModePermissionPrompt to true,
          ~/.claude.json does not set bypassPermissionsModeAccepted to true,
          and the role conductor's settings file {{.SETTINGS}} does not set skipDangerousModePermissionPrompt to true.
          Run claude --dangerously-skip-permissions once interactively in {{.RECORDS}} and accept the disclaimer,
          or set "skipDangerousModePermissionPrompt": true in {{.SETTINGS}}
      - sh: claude agents --json | jq -e 'all(.[]; .name != "conductor" or .pid == null)' >/dev/null
        msg: a session named conductor is already running; see task sessions
    cmds:
      - cd {{shellQuote .RECORDS}} && if [ -n {{shellQuote .PROFILE}} ]; then flag=--append-system-prompt-file; who={{shellQuote .PROFILE}}; else flag=--agent; who={{shellQuote .AGENT}}; fi && claude --bg -n conductor "$flag" "$who" --model {{shellQuote .MODEL}} --permission-mode bypassPermissions --setting-sources project,local --settings {{shellQuote .SETTINGS}} {{shellQuote .CONDUCTOR_PROMPT}}

  conductor:attach:
    desc: Open the background conductor session in this terminal, in the instance's records directory
    interactive: true
    vars:
      RECORDS:
        sh: conductor config show --format json | jq -r '.instances[0].records'
    preconditions:
      - sh: test -d {{shellQuote .RECORDS}}
        msg: the records directory {{.RECORDS}} of conductor config show is not a directory
    cmds:
      - cd {{shellQuote .RECORDS}} && claude attach "$({{.SESSION_ID}} --arg n conductor)"

  conductor:restart:
    desc: Stop the background conductor, remove it from the session list (its transcript stays; claude --resume reopens it) and start a new one in the instance's records directory that reads the newest handoff (conductor-dev runs this after [RESTART]); stops nothing when conductor:start would refuse the new one (role, harness, records directory, profile or agent)
    preconditions:
      - sh: test -n "$({{.SESSION_ID}} --arg n conductor)"
        msg: no background session named conductor
      - sh: test -n {{shellQuote .MODEL}}
        msg: conductor config show names no role conductor; add it to the instance's roles
      - sh: test {{shellQuote .HARNESS}} = claude
        msg: the role conductor runs on {{.HARNESS}} (conductor config show); this task starts claude only
      - sh: test -d {{shellQuote .RECORDS}}
        msg: the records directory {{.RECORDS}} of conductor config show is not a directory
      - sh: test -z {{shellQuote .PROFILE}} || test -f {{shellQuote .PROFILE}}
        msg: the profile {{.PROFILE}} of the role conductor is not a file
      - sh: test -n {{shellQuote .PROFILE}} || case {{shellQuote .AGENT}} in '' | */* | .*) exit 1 ;; esac
        msg: the agent {{.AGENT}} of the role conductor is not a plain agent name (no /, no leading .); the agent must be a file <agent>.md in ~/.claude/agents/ or {{.RECORDS}}/.claude/agents/
      - sh: test -n {{shellQuote .PROFILE}} || test -f "$HOME"/.claude/agents/{{shellQuote .AGENT}}.md || test -f {{shellQuote .RECORDS}}/.claude/agents/{{shellQuote .AGENT}}.md
        msg: the agent {{.AGENT}} is in neither ~/.claude/agents/ nor {{.RECORDS}}/.claude/agents/ (the agent must be a file <agent>.md in one of them); run task agents:link, or name a profile for the role conductor
      - sh: jq -e '.skipDangerousModePermissionPrompt == true' {{shellQuote .SETTINGS}} >/dev/null 2>&1 || jq -e '.skipDangerousModePermissionPrompt == true' "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/settings.json" >/dev/null 2>&1 || jq -e '.bypassPermissionsModeAccepted == true' "${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json" >/dev/null 2>&1
        msg: >-
          Claude Code's bypass-permissions disclaimer is not accepted, and claude --bg refuses bypassPermissions without it:
          ~/.claude/settings.json (or $CLAUDE_CONFIG_DIR/settings.json) does not set skipDangerousModePermissionPrompt to true,
          ~/.claude.json does not set bypassPermissionsModeAccepted to true,
          and the role conductor's settings file {{.SETTINGS}} does not set skipDangerousModePermissionPrompt to true.
          Run claude --dangerously-skip-permissions once interactively in {{.RECORDS}} and accept the disclaimer,
          or set "skipDangerousModePermissionPrompt": true in {{.SETTINGS}}
    vars:
      ROLE_SETTINGS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .settings // empty'
      SETTINGS: '{{.ROLE_SETTINGS | default (printf "%s/.claude/conductor-settings.json" .ROOT_DIR)}}'
      RECORDS:
        sh: conductor config show --format json | jq -r '.instances[0].records'
      AGENT:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .agent // "conductor"'
      PROFILE:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .profile // empty'
      HARNESS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .harness'
      MODEL:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor") | .model'
      OLD:
        sh: claude agents --json | jq -r '.[] | select(.kind=="background" and .name=="conductor" and .pid != null) | .id'
    cmds:
      - cd {{shellQuote .RECORDS}} && claude stop {{shellQuote .OLD}}
      - cd {{shellQuote .RECORDS}} && { for i in $(seq 30); do claude agents --json | jq -e 'all(.[]; .name != "conductor" or .pid == null)' >/dev/null && exit 0; sleep 1; done; echo "the stopped conductor still has a pid after 30 s" >&2; exit 1; }
      - cd {{shellQuote .RECORDS}} && claude rm {{shellQuote .OLD}}
      - task: conductor:start

  dev:start:
    desc: Start conductor-dev in the background in this checkout, without the user's settings (--setting-sources project,local), on the harness, model, settings and profile of the role conductor-dev in conductor config show (no settings file by default; a profile is appended to the system prompt in place of --agent conductor-dev); refuses while any session named conductor-dev exists, and when the profile is not a file
    vars:
      SETTINGS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .settings // empty'
      PROFILE:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .profile // empty'
      HARNESS:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .harness'
      MODEL:
        sh: conductor config show --format json | jq -r '.instances[0].roles[] | select(.role == "conductor-dev") | .model'
    preconditions:
      - sh: test -n {{shellQuote .MODEL}}
        msg: conductor config show names no role conductor-dev; add it to the instance's roles
      - sh: test {{shellQuote .HARNESS}} = claude
        msg: the role conductor-dev runs on {{.HARNESS}} (conductor config show); this task starts claude only
      - sh: test -z {{shellQuote .PROFILE}} || test -f {{shellQuote .PROFILE}}
        msg: the profile {{.PROFILE}} of the role conductor-dev is not a file
      - sh: claude agents --json | jq -e 'all(.[]; .name != "conductor-dev" or .pid == null)' >/dev/null
        msg: a session named conductor-dev is already running; see task sessions
    cmds:
      - if [ -n {{shellQuote .PROFILE}} ]; then flag=--append-system-prompt-file; who={{shellQuote .PROFILE}}; else flag=--agent; who=conductor-dev; fi && set -- && if [ -n {{shellQuote .SETTINGS}} ]; then set -- --settings {{shellQuote .SETTINGS}}; fi && claude --bg -n conductor-dev "$flag" "$who" --model {{shellQuote .MODEL}} --permission-mode bypassPermissions --setting-sources project,local "$@" {{shellQuote .DEV_PROMPT}}

  dev:attach:
    desc: Open the background conductor-dev session in this terminal
    interactive: true
    cmds:
      - claude attach "$({{.SESSION_ID}} --arg n conductor-dev)"

  trust:
    desc: Mark the instance's records directory (by its physical path) and every git checkout directly under its checkouts root (conductor config show) as trusted Claude Code workspaces in ~/.claude.json, so conductor and a controller can start there (conductor trust); refuses a records path that holds a line break or is not a directory, and writes nothing when ~/.claude.json changed during the run
    cmds:
      - conductor trust

  agents:link:
    desc: Link this checkout's .claude/agents/conductor.md, repo-controller.md and conductor-dev.md into ~/.claude/agents/, so a session started in another directory finds them; a link to the same file is kept, and any other file there is refused, never overwritten
    cmds:
      - |
        src={{shellQuote .ROOT_DIR}}/.claude/agents
        dst="$HOME/.claude/agents"
        refused=0
        for name in conductor repo-controller conductor-dev; do
          from="$src/$name.md"; to="$dst/$name.md"
          if [ ! -f "$from" ]; then echo "agents:link: $from is not a file" >&2; refused=1; continue; fi
          if [ -L "$to" ] && [ "$to" -ef "$from" ]; then continue; fi
          if [ -e "$to" ] || [ -L "$to" ]; then echo "agents:link: $to is there and is not a link to $from; move it away and run task agents:link again" >&2; refused=1; fi
        done
        [ "$refused" = 0 ] || exit 1
        mkdir -p "$dst"
        for name in conductor repo-controller conductor-dev; do
          from="$src/$name.md"; to="$dst/$name.md"
          if [ -L "$to" ] && [ "$to" -ef "$from" ]; then echo "linked already: $to"; continue; fi
          ln -s "$from" "$to" || exit 1; echo "linked: $to -> $from"
        done

  dashboard:
    desc: Start the dashboard on 127.0.0.1:7313 and print its URL; where systemctl is on PATH as the user service conductor-dashboard unless it is active, elsewhere in the background with nohup, its pid in dashboard.pid and its output in dashboard.log of the instance's state directory (conductor config show), refusing while that pid runs
    silent: true
    vars:
      STATE:
        sh: conductor config show --format json | jq -r '.instances[0].state'
    cmds:
      - |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl --user is-active --quiet conductor-dashboard || systemd-run --user --unit conductor-dashboard --collect --setenv=PATH="$PATH" "$(command -v conductor)" dashboard serve --port 7313
          exit
        fi
        state={{shellQuote .STATE}}
        pidfile="$state/dashboard.pid"
        if [ -f "$pidfile" ]; then
          pid=$(cat "$pidfile")
          if ps -p "$pid" -o args= 2>/dev/null | grep -q 'dashboard serve'; then
            echo "the dashboard runs already as pid $pid ($pidfile); see task dashboard:stop" >&2
            exit 1
          fi
        fi
        mkdir -p "$state"
        pid=$(sh -c 'nohup "$0" dashboard serve --port 7313 </dev/null >>"$1" 2>&1 & echo $!' "$(command -v conductor)" "$state/dashboard.log")
        echo "$pid" > "$pidfile"
        echo "the dashboard runs as pid $pid; its output is in $state/dashboard.log"
      - echo "Open http://127.0.0.1:7313/"

  dashboard:stop:
    desc: Stop the dashboard; where systemctl is on PATH the user service conductor-dashboard, elsewhere the pid in dashboard.pid of the instance's state directory (conductor config show), whose file it removes
    vars:
      STATE:
        sh: conductor config show --format json | jq -r '.instances[0].state'
    cmds:
      - |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl --user stop conductor-dashboard
          exit
        fi
        pidfile={{shellQuote .STATE}}/dashboard.pid
        if [ ! -f "$pidfile" ]; then
          echo "no dashboard pid file at $pidfile; nothing to stop"
          exit 0
        fi
        pid=$(cat "$pidfile")
        if ps -p "$pid" -o args= 2>/dev/null | grep -q 'dashboard serve'; then
          sh -c 'kill "$0"' "$pid"
        fi
        rm -f "$pidfile"

  install:
    desc: Install the conductor binary from this checkout; conductor-dev runs it after a wave merges and check is green
    cmds:
      - cargo install --path crates/conductor --locked

  measure:
    desc: Run the wall-clock measurements alone, outside the gate (the append-cost ratio and the guard latency); run it on a quiet host
    cmds:
      - cargo test --release --locked -p conductor-cli --test store_tree -- --ignored --nocapture appends_at_5000_events_cost_less_than_three_times_appends_at_500
      - cargo test --release --locked -p conductor-cli --test guard_latency -- --ignored --nocapture

  check:
    desc: Scan every tracked file with Gates (when B10X_GATES_POLICY names a policy), validate and run the specification, hold crates/conductor-model to it, then format, lint and test
    cmds:
      - if [ -n "${B10X_GATES_POLICY:-}" ]; then git ls-files -z | xargs -0 b10x-gates scan-text; else echo "B10X_GATES_POLICY is not set; the Gates scan is skipped" >&2; fi
      - ess specify validate --path spec
      - mkdir -p .check
      - echo '*' > .check/.gitignore
      - ess verify conform run --path spec --scenarios spec/scenarios --target interpreted --report-format 2 --report-out .check/conformance.json
      - rm -rf .check/conductor-model
      - ess generate synthesize --path spec --target rust --layout crate --out .check/conductor-model
      - diff -r --exclude=.ess-output crates/conductor-model .check/conductor-model
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test
      - task: docs-check

  docs-generate:
    desc: Regenerate the derived documentation pages (website/docs/reference/, website/docs/status.md, website/data/status.json)
    cmds:
      - cargo run --locked -p conductor-docs -- generate

  docs-check:
    desc: Fail when a derived documentation page is missing, stale or edited, or a page under website/docs is not passive Markdown
    cmds:
      - cargo run --locked -p conductor-docs -- generate --check

  regen:
    desc: Regenerate crates/conductor-model from spec/; every byte of it is generated
    cmds:
      - rm -rf crates/conductor-model
      - ess generate synthesize --path spec --target rust --layout crate --out crates/conductor-model
