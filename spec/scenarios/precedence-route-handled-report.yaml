type: ess-scenario/1
domain: conductor.dispatch
scenario: precedence-route-handled-report
summary: Routing a report message already handled is refused as already handled.

arrange:
  - instance: report
    entity: conductor.dispatch.Message

timeline:
  - at: 2026-10-06T09:00:00Z
    command: conductor.dispatch.ReceiveMessage
    actor: conductor.dispatch.Conductor
    input:
      sender: cortex
      recipient: conductor
      kind: Report
      first_line: "[REPORT cortex DSP-1] started working"
      transport: SendMessage
      received_at: 2026-10-06T09:00:00Z
      parsed: true
    outcome: received
    capture: {instance: report, event: conductor.dispatch.MessageReceived, field: message_id}

  - at: 2026-10-06T09:00:01Z
    command: conductor.dispatch.HandleMessage
    actor: conductor.dispatch.Conductor
    input:
      message_id: {$instance: report}
    outcome: handled

  - at: 2026-10-06T09:00:02Z
    command: conductor.dispatch.RouteNeed
    actor: conductor.dispatch.Conductor
    input:
      message_id: {$instance: report}
      dispatch_id: DSP-1
    outcome: wrong-state
    error:
      name: conductor.dispatch.MessageStateConflict
