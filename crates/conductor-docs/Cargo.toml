[package]
name = "conductor-docs"
description = "Generates the derived pages of the conductor documentation site (CLI, config, crates, status) and checks them for drift."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "conductor-docs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
conductor-cli = { path = "../conductor" }
serde_json = "1"
serde_yaml = "0.9"
