type: ess-http/1
specification: {system: conductor, version: v1, source_digest: "sha256:463f5cce7ce15f391f5b547540a3c36acb2522b877a8e0f377e040541e904cbf"}
routes:
  - command: conductor.config.PutConfig
    method: put
    path: /v1/config
    outcomes:
      changed: {status: 200}
      actor-not-human: {status: 403}
      invalid: {status: 422}
  - view: conductor.instance.Instances
    method: get
    path: /v1/instances
    body: array
  - view: conductor.instance.InstanceByName
    method: get
    path: /v1/instances/{name}
    parameters: {name: param.name}
    body: single
    empty: {status: 404}
  - command: conductor.config.AddInstance
    method: post
    path: /v1/instances
    outcomes:
      changed: {status: 201}
      actor-not-human: {status: 403}
      exists: {status: 409}
      invalid: {status: 422}
  - command: conductor.config.PutInstance
    method: put
    path: /v1/instances/{name}
    parameters: {name: input.name}
    outcomes:
      changed: {status: 200}
      actor-not-human: {status: 403}
      unknown: {status: 404}
      invalid: {status: 422}
  - command: conductor.config.RemoveInstance
    method: delete
    path: /v1/instances/{name}
    parameters: {name: input.name}
    outcomes:
      changed: {status: 200}
      actor-not-human: {status: 403}
      unknown: {status: 404}
      invalid: {status: 422}
  - view: conductor.secret.Secrets
    method: get
    path: /v1/secrets
    body: array
  - command: conductor.instance.StartInstance
    method: post
    path: /v1/instances/{name}/start
    parameters: {name: input.name}
  - command: conductor.instance.StopInstance
    method: post
    path: /v1/instances/{name}/stop
    parameters: {name: input.name}
  - command: conductor.instance.RestartInstance
    method: post
    path: /v1/instances/{name}/restart
    parameters: {name: input.name}
  - command: conductor.instance.UpgradeInstance
    method: post
    path: /v1/instances/{name}/upgrade
    parameters: {name: input.name}
    outcomes:
      upgrading: {status: 202}
      rolled-back: {status: 200}
      unknown: {status: 404}
      not-running: {status: 409}
  - view: conductor.token.Tokens
    method: get
    path: /v1/instances/{instance}/tokens
    parameters: {instance: param.instance}
    body: array
  - view: conductor.secret.InstanceSecrets
    method: get
    path: /v1/instances/{instance}/secrets
    parameters: {instance: param.instance}
    body: array
  - view: conductor.config.EffectiveSettings
    method: get
    path: /v1/instances/{instance}/settings
    parameters: {instance: param.instance}
    body: array
  - command: conductor.agent.DeliverToAgent
    method: post
    path: /v1/agents/{name}/deliver
    parameters: {name: input.name}
  - command: conductor.agent.RestartAgent
    method: post
    path: /v1/agents/{name}/restart
    parameters: {name: input.name}
  - view: conductor.store.Readiness
    method: get
    path: /readyz
    body: array
  - view: conductor.store.Version
    method: get
    path: /v1/version
    body: array
