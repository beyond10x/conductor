type: ess-scenario/1
domain: conductor.operator
scenario: operator-join-instance-after-leave
summary: An operator who left joins the instance again and is active, with the grants given now and the leave cleared.

timeline:
  - at: 2026-11-08T09:00:00Z
    command: conductor.operator.JoinInstance
    actor: conductor.operator.Engineer
    input:
      actor: {kind: Human, value: {operator: operator-one}}
      key: {operator: operator-one, instance: example-org}
      grants: [AnswerDecisions]
      joined_at: 2026-11-08T09:00:00Z
    outcome: joined

  - at: 2026-11-08T17:00:00Z
    command: conductor.operator.LeaveInstance
    actor: conductor.operator.Engineer
    input:
      actor: {kind: Human, value: {operator: operator-one}}
      key: {operator: operator-one, instance: example-org}
      left_at: 2026-11-08T17:00:00Z
    outcome: left

  - at: 2026-11-09T09:00:00Z
    command: conductor.operator.JoinInstance
    actor: conductor.operator.Engineer
    input:
      actor: {kind: Human, value: {operator: operator-one}}
      key: {operator: operator-one, instance: example-org}
      grants: [AnswerDecisions, StartInstances, StopInstances]
      joined_at: 2026-11-09T09:00:00Z
    outcome: rejoined

assert:
  - view: conductor.operator.Operators
    contains:
      key: {operator: operator-one, instance: example-org}
      state: Active
      grants: [AnswerDecisions, StartInstances, StopInstances]
      joined_at: 2026-11-09T09:00:00Z
