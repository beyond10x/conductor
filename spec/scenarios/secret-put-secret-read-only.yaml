type: ess-scenario/1
domain: conductor.secret
scenario: secret-put-secret-read-only
summary: A put while the daemon's secrets source is a directory of mounted files is refused with SourceReadOnly naming that source, and no secret is recorded.

timeline:
  - at: 2026-11-11T09:00:00Z
    command: conductor.secret.PutSecret
    actor: conductor.secret.Operator
    input:
      actor: {kind: Human, operator: example-operator}
      name: example-org-model
      put_at: 2026-11-11T09:00:00Z
      replace: false
    outcome: read-only
    error:
      name: conductor.secret.SourceReadOnly

assert:
  - view: conductor.secret.Secrets
    excludes:
      name: example-org-model
