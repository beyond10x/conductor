domain: conductor.session

summary: >
  The one conductor of an instance (story:single-conductor-lease). The lease, kept in the store
  under the instance's state directory, names the session id and the process id of the conductor
  session that holds it. Every conductor session started with the instance's settings claims it
  at its start, through the settings' SessionStart hook; a claim while another live process holds
  it is refused and names that holder, and a claim over a holder whose process is gone takes the
  lease over and records whom it took it from. Design: docs/design/conductor.md § 7.

  It also holds how conductor starts and stops the sessions of an instance's roles in the box
  the instance's `confinement` asks for (story:sandbox-spec, story:session-envelope-seam): the
  request a provider is given, the identity of the session it started, and the measurement it
  takes at the box's boundary, kept per session under the instance's state directory.

  And it holds what the run daemon does to sessions (docs/design/conductor-run.md § 3,
  story:mailbox-send-and-deliver, story:run-daemon): `conductor run` is one process per instance
  that keeps no state outside the store; each of its ticks is recorded with the lines it handled
  and the actions it took, and each text it puts in front of a running session with
  `conductor session deliver` is recorded as a delivery.

naming:
  wire: session
  display: Session

types:
  # The harness's id of one session: Claude Code's `session_id`, as its hooks receive it.
  - name: conductor.session.SessionId
    kind: newtype
    of: String

  # The input of `conductor session start` (story:sandbox-spec): `role` is `conductor` or
  # `conductor-dev`, a role of the instance whose session is started under its `session_name`. A
  # controller is started by `conductor spawn` only. Conductor's session starts in the instance's
  # records directory, conductor-dev's in the working directory, the checkout `task dev:start`
  # runs in.
  - name: conductor.session.StartSession
    kind: struct
    fields:
      - {name: role, type: Optional<String>}

  # The input of `conductor session stop` (story:sandbox-spec): `role` as for `session start`. It
  # stops the role's live session through the provider that started it.
  - name: conductor.session.StopSession
    kind: struct
    fields:
      - {name: role, type: Optional<String>}

  # Why `conductor session start` started no session (story:sandbox-spec), each found before
  # anything is launched but the last two: `UnknownRole`, the role is not `conductor` or
  # `conductor-dev`, or the instance names no such role or a role on another harness than
  # `claude`; `SessionRunning`, a live session holds the role's session name in the session list
  # (`claude agents --json`); `ProviderUnavailable`, `confinement.mode` is `strict` and the
  # instance's provider is not available on this host, so nothing starts; `LaunchFailed`, the
  # provider's start, or the delivery of the first prompt, failed; `MeasurementShort`,
  # `confinement.mode` is `strict` and the box the provider measured at the session's boundary is
  # short of the request (`conductor.session.EnvelopeMeasurement`), so the session it started is
  # stopped again. `InstanceNotPinned` (story:instance-isolation), found before anything is
  # launched, under a config file: the role's own settings file is not there, is no JSON, or pins
  # another instance than the role's (its `env.CONDUCTOR_INSTANCE`, or a hook command prefixed
  # `CONDUCTOR_INSTANCE=<other>`), so its hooks would act for that instance. A settings file that
  # pins no instance (no `env.CONDUCTOR_INSTANCE`, or a hook command that runs `conductor` without
  # the prefix) is not refused: the session starts with its content pinned to the role's instance
  # (`env.CONDUCTOR_INSTANCE` the instance's name, and each hook command that runs `conductor`
  # prefixed `CONDUCTOR_INSTANCE=<name>`), written as `<state>/sessions/<session name>.settings.json`.
  # A role that names no settings file starts with its default (`.claude/conductor-settings.json`
  # of the working directory for `conductor`, an empty one for `conductor-dev`) written pinned the
  # same way.
  - name: conductor.session.SessionStartRefusal
    kind: enum
    variants:
      - InstanceNotPinned
      - ProviderUnavailable
      - MeasurementShort
      - UnknownRole
      - SessionRunning
      - LaunchFailed

  # A refusal of `conductor session start`: the role it was asked to start, why, and what it
  # found.
  - name: conductor.session.SessionStartRefused
    kind: struct
    fields:
      - {name: role, type: String}
      - {name: refusal, type: conductor.session.SessionStartRefusal}
      - {name: detail, type: String}

  # Why `conductor session stop` stopped nothing (story:sandbox-spec): `UnknownRole`, as for
  # `session start`; `NotRunning`, no live session holds the role's session name.
  - name: conductor.session.SessionStopRefusal
    kind: enum
    variants:
      - UnknownRole
      - NotRunning

  # A refusal of `conductor session stop`: the role, why, and what it found.
  - name: conductor.session.SessionStopRefused
    kind: struct
    fields:
      - {name: role, type: String}
      - {name: refusal, type: conductor.session.SessionStopRefusal}
      - {name: detail, type: String}

  # The input of `conductor session attach` (story:session-attach-command): the session by its
  # full `name`, or by the `role` whose session it is, as for `session start`, looked up in
  # every instance of the config file, or in `instance` alone when it is given; both `name` and
  # `role` given must name one session. Without either, attach opens a picker in the terminal:
  # the attachable sessions of every instance (of `instance` alone when given), grouped under
  # each instance's name, one row each (`conductor.session.AttachableSession`); the arrow keys or
  # `j` and `k` move, Enter attaches, `w` attaches read-only, `q` quits, and after a detach the
  # picker shows again. A session the systemd provider started runs its harness, whichever it
  # is, in a tmux server of its own, the unit's main process, on the socket
  # `<state>/sessions/<name>.tmux` of its instance's state; attach runs `tmux attach` on it in
  # the operator's terminal, and the operator detaches with `ctrl-]` then `d`, the session
  # running on. `watch` (story:session-attach-watch) attaches read-only, so nothing typed reaches
  # the harness and the window keeps its size; on a session started before the tmux launcher,
  # which has no socket, it follows the session's typescript instead, replaying its last 64 KiB,
  # until its unit ends or `ctrl-]` then `d`.
  - name: conductor.session.AttachSession
    kind: struct
    fields:
      - {name: name, type: Optional<String>}
      - {name: role, type: Optional<String>}
      - {name: instance, type: Optional<String>}
      - {name: watch, type: Optional<Boolean>}

  # Why `conductor session attach` attached nothing, each found before anything is opened:
  # `InsideSession` (story:session-attach-refuses-sessions), the client runs inside a session,
  # where the provider's `CONDUCTOR_SESSION` is set, whatever the harness, checked first;
  # `UnknownSession`, the role or the instance is unknown, or no live session holds the name (no
  # tmux server answers on its socket, and no unit of the name runs that keeps a typescript);
  # `NotAttachable`, the session runs but was started before the tmux launcher, so only `watch`
  # reads it until it restarts; `Ambiguous`, `name` and `role` name different sessions, or two
  # instances hold a session of the name.
  - name: conductor.session.SessionAttachRefusal
    kind: enum
    variants:
      - InsideSession
      - UnknownSession
      - NotAttachable
      - Ambiguous

  # A refusal of `conductor session attach`: the session name asked for, why, and what to run
  # instead.
  - name: conductor.session.SessionAttachRefused
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: refusal, type: conductor.session.SessionAttachRefusal}
      - {name: detail, type: String}

  # The input of `conductor session list` (story:session-list-attachable): the live sessions
  # every instance's state holds a launcher's files for, or `instance`'s alone; `format` is
  # `text`, one line each, the default, or `json`, the rows.
  - name: conductor.session.ListSessions
    kind: struct
    fields:
      - {name: instance, type: Optional<String>}
      - {name: format, type: Optional<String>}

  # How `conductor session attach` reaches a session: `Attach`, its tmux server answers, so it
  # attaches read-write or with `--watch`; `Watch`, its unit runs under the launcher before
  # tmux, so only `--watch` follows its typescript.
  - name: conductor.session.AttachMode
    kind: enum
    variants:
      - Attach
      - Watch

  # One row of `conductor session list` and of the attach picker: the instance, the session's
  # name and how attach reaches it; `directory`, where its harness runs (tmux's pane path), whose
  # last component is the repository; `busy`, the harness's own state of the session where the
  # harness reports one (Claude Code: the `status` of `claude agents --json`, `busy` or not, by
  # session name), else absent; `idle_seconds`, since its screen last changed (tmux's window
  # activity, or the typescript's modification time), which decides busy (under 10) or idle only
  # where `busy` is absent.
  - name: conductor.session.AttachableSession
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: name, type: String}
      - {name: mode, type: conductor.session.AttachMode}
      - {name: directory, type: Optional<String>}
      - {name: busy, type: Optional<Boolean>}
      - {name: idle_seconds, type: Optional<Integer>}

  # The input of `conductor session deliver` (story:mailbox-send-and-deliver,
  # docs/design/conductor-run.md § 3): `name`, the session by its full name; `text`, the file
  # holding the text to put in front of it, or `-` for standard input. Under the systemd provider
  # the text is typed into the session's tmux server on `<state>/sessions/<name>.tmux`
  # (`type_text`, the launcher's), then recorded with `DeliverMessage`; a session with no socket
  # is refused (`SessionNotReachable`), exit 1 naming it, and never retried in a loop. The guard
  # denies it to a controller.
  - name: conductor.session.DeliverToSession
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: text, type: String}

  - name: conductor.session.DeliveryId
    kind: newtype
    of: Uuid

  - name: conductor.session.TickId
    kind: newtype
    of: Uuid

  # Which tick of `conductor run` (story:run-daemon, docs/design/conductor-run.md § 3): `watch`,
  # a watch pass, its handlers and the mailbox, every `cadence.watch`; `cycle`, the snapshot, the
  # board, `records check` and dispatch v1, every `cadence.cycle`; `daily`, `metric compute` for
  # the previous UTC day and the brief, at `cadence.daily`.
  - name: conductor.session.TickKind
    kind: enum
    variants: [watch, cycle, daily]

  # One writable place of a session resolved for its start (story:sandbox-spec): the place as the
  # role's `writable` writes it, a place word (`checkout`, `trees`, `build-cache`, `scratch`,
  # `harness-state`, `records`) or a path, and the absolute paths it stands for, in order. A path
  # is resolved whether or not it exists; the provider checks existence.
  - name: conductor.session.PlaceResolved
    kind: struct
    fields:
      - {name: place, type: conductor.config.Writable}
      - {name: paths, type: List<String>}

  # What a provider is asked to start a session in (story:sandbox-spec): the role and its
  # session name; the absolute directory the session starts in; the role's `limits`; its
  # `writable` places, each resolved to absolute paths; its `network`; and its `forge_token_env`,
  # the names of the environment variables that carry the forge tokens the session may use. The
  # harness command itself (program, model, profile, settings) is not part of the box and is not
  # modelled here.
  - name: conductor.session.SessionRequest
    kind: struct
    fields:
      - {name: role, type: String}
      - {name: session_name, type: conductor.config.SessionName}
      - {name: cwd, type: String}
      - {name: limits, type: conductor.config.Limits}
      - {name: writable, type: List<conductor.session.PlaceResolved>}
      - {name: network, type: conductor.config.Network}
      - {name: forge_token_env, type: List<String>}

  # The session a provider started (story:sandbox-spec): its role and session name; `provider`,
  # the provider that started it as `confinement.provider` writes it (`systemd`, or `none` for a
  # session started with the harness's own commands, unboxed); `unit`, the systemd unit it runs
  # in, where there is one; and `session_id`, the harness's id of it, once the harness printed
  # one. It is what `conductor session start` prints.
  - name: conductor.session.StartedSession
    kind: struct
    fields:
      - {name: role, type: String}
      - {name: session_name, type: conductor.config.SessionName}
      - {name: provider, type: String}
      - {name: unit, type: Optional<String>}
      - {name: session_id, type: Optional<String>}

  # The box measured for one started session at its boundary (story:sandbox-spec), the record
  # written to `<state>/sessions/<session name>.envelope.json` and read by the sessions collector
  # into the session's `envelope_*` fields (`conductor.observation.SessionObservation`): the
  # session; when it was measured; the provider that set the box up; the cgroup the session runs
  # in; the limits read back from that cgroup, each absent where none is set; `places`, the
  # writable places the request resolved; and `writable`, the paths the box lets the session
  # write, absolute, joined by `:`, in the order applied. Three forms:
  # - a full box: `provider`, `cgroup`, the limits and `writable`;
  # - a partial box, under `confinement.mode: report` only: the limits applied, no write fence:
  #   `writable` absent and `fence_missing` the reason, such as a host without `bwrap`;
  # - unboxed, under `report` only: `unboxed` the reason, such as a provider not available on
  #   the host, and every other measured field absent.
  # The three forms exclude each other as written; they are not declared as invariants, since no
  # view publishes a measurement for a synthesized scenario to check them against.
  # A measurement is short of its request when a limit the request sets reads back absent or
  # different, when the box has no write fence, or when the fence lets the session write a path
  # the request's places do not name; under `strict` a short box is stopped
  # (`SessionStartRefusal.MeasurementShort`).
  - name: conductor.session.EnvelopeMeasurement
    kind: struct
    fields:
      - {name: session, type: conductor.session.StartedSession}
      - {name: measured_at, type: Timestamp}
      - {name: provider, type: Optional<conductor.observation.EnvelopeProvider>}
      - {name: cgroup, type: Optional<String>}
      - {name: memory_max, type: Optional<Integer>}
      - {name: cpu_weight, type: Optional<Integer>}
      - {name: tasks_max, type: Optional<Integer>}
      - {name: places, type: List<conductor.session.PlaceResolved>}
      - {name: writable, type: Optional<String>}
      - {name: fence_missing, type: Optional<String>}
      - {name: unboxed, type: Optional<String>}

entities:
  # One per instance, keyed by the instance's name. `pid` is the process of the session that holds
  # it: the harness's own process, which lives exactly as long as the session does. The last two
  # fields name the holder the lease was last taken over from because its process was gone: a
  # claim that finds no lease leaves them empty, and the holder's own claim keeps them.
  - name: conductor.session.Lease
    identity:
      name: instance
      type: conductor.config.InstanceName
    fields:
      - name: session_id
        type: conductor.session.SessionId
      - name: pid
        type: Integer
      - name: taken_at
        type: Timestamp
      - name: taken_over_session_id
        type: Optional<conductor.session.SessionId>
      - name: taken_over_pid
        type: Optional<Integer>
    invariants:
      - pid > 0
    lifecycle:
      initial: Held
      states: [Held]
      terminal: [Held]

  # One text put in front of a running session by `conductor session deliver`
  # (story:mailbox-send-and-deliver, docs/design/conductor-run.md § 3): the session it was typed
  # into, the first line of the text, the file the text was read from, and when. The run daemon
  # delivers this way and nothing else does: a `[HANDOVER]`, a relayed watch line as
  # `[REPORT <repo> -] watch: …`, a check-in, an answered request's `[DECISION]`.
  # UNMAPPED: `conductor session deliver --text <file|->` reads standard input as well as a file;
  # what `body_path` records for text that came on standard input is said nowhere, so the field
  # admits none. Open question for the owner.
  - name: conductor.session.Delivery
    identity:
      name: delivery_id
      type: conductor.session.DeliveryId
    fields:
      - name: session_name
        type: conductor.config.SessionName
      - name: first_line
        type: String
      - name: body_path
        type: Optional<String>
      - name: delivered_at
        type: Timestamp
    lifecycle:
      initial: Delivered
      states: [Delivered]
      terminal: [Delivered]

  # One tick of `conductor run` (story:run-daemon, docs/design/conductor-run.md § 3): its `kind`;
  # `started_at`, when it began; `lines_handled`, the watch lines and mailbox files it acted on;
  # `actions`, the dispatch log lines it wrote, one entry per line in the order written, each
  # named as that line's `event` (`conductor.dispatch.DispatchLogEvent`), so the log and the
  # ticks reconcile line for line. The daemon keeps nothing in memory that is not in the store
  # or the watch's cursor files; the tick is the record of one pass.
  - name: conductor.session.RunTick
    identity:
      name: tick_id
      type: conductor.session.TickId
    fields:
      - name: kind
        type: conductor.session.TickKind
      - name: started_at
        type: Timestamp
      - name: lines_handled
        type: Integer
      - name: actions
        type: List<conductor.dispatch.DispatchLogEvent>
    invariants:
      - lines_handled >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

actors:
  # Conductor's session runs the claim through its SessionStart hook; no controller runs it. The
  # run daemon, conductor as a process, delivers to sessions and records its ticks; the guard
  # denies `session deliver` to a controller (docs/design/conductor-run.md § 3).
  - name: conductor.session.Conductor
    may:
      - conductor.session.ClaimLease
      - conductor.session.DeliverMessage
      - conductor.session.RecordRunTick
    naming:
      display: Conductor

errors:
  - name: conductor.session.LeaseHeld
    summary: >
      Another session's live process holds the instance's lease: the claiming session is a second
      conductor and must stop. Nothing was written.
    fields:
      - name: instance
        type: conductor.config.InstanceName
      - name: session_id
        type: conductor.session.SessionId
      - name: pid
        type: Integer

  - name: conductor.session.SessionNotReachable
    summary: >
      No tmux server answers on the session's launcher socket, so nothing was typed into it and
      nothing recorded; the caller is told which session, and does not retry in a loop.
    fields:
      - name: session_name
        type: conductor.config.SessionName

  - name: conductor.session.InvalidLineCount
    summary: A count of lines handled is never negative, so no tick was recorded.
    fields:
      - name: lines_handled
        type: Integer

commands:
  # Which of `held` and `taken-over` answers a claim from another process is the process table's
  # fact, not the store's: `held` while the holder's `pid` names a live process, `taken-over` once
  # it names none. The lease is selected as a row set by its `instance`, its identity, rather than
  # through `via: input.instance`: over the identity-addressed guards, ess 0.56 synthesizes a
  # `taken` scenario that claims one instance three times and expects `taken` each time.
  - name: conductor.session.ClaimLease
    naming:
      wire: claim
      display: Claim the conductor lease
    input:
      - name: instance
        type: conductor.config.InstanceName
      - name: session_id
        type: conductor.session.SessionId
      - name: pid
        type: Integer
      - name: taken_at
        type: Timestamp
    outcomes:
      - name: taken
        when_related:
          entity: conductor.session.Lease
          where: instance == input.instance
          exists: false
        creates: conductor.session.Lease
        instance: instance
        sets:
          session_id: input.session_id
          pid: input.pid
          taken_at: input.taken_at
          taken_over_session_id: {cleared: true}
          taken_over_pid: {cleared: true}
        emits:
          - conductor.session.LeaseTaken
        payload:
          conductor.session.LeaseTaken:
            instance: input.instance
            session_id: input.session_id
            pid: input.pid
        summary: No session held the instance's lease; the claiming one holds it now.
      - name: renewed
        when_related:
          entity: conductor.session.Lease
          where:
            all:
              - instance == input.instance
              - pid == input.pid
          exists: true
        updates: conductor.session.Lease
        instance: instance
        sets:
          session_id: input.session_id
          taken_at: input.taken_at
        emits:
          - conductor.session.LeaseTaken
        payload:
          conductor.session.LeaseTaken:
            instance: input.instance
            session_id: input.session_id
            pid: input.pid
        summary: The holder's own process claims again (a resumed, cleared or compacted session); it keeps the lease under the session id it gives now.
      - name: held
        external: the process the lease names lives and is not the claiming one
        error: conductor.session.LeaseHeld
        summary: A second conductor is refused, told who holds the lease, and must stop; the lease is unchanged.
      - name: taken-over
        updates: conductor.session.Lease
        instance: instance
        sets:
          session_id: input.session_id
          pid: input.pid
          taken_at: input.taken_at
          taken_over_session_id: {subject: session_id}
          taken_over_pid: {subject: pid}
        emits:
          - conductor.session.LeaseTakenOver
        payload:
          conductor.session.LeaseTakenOver:
            instance: input.instance
            session_id: input.session_id
            pid: input.pid
            taken_over_session_id: {subject: session_id}
            taken_over_pid: {subject: pid}
        summary: The holder's process is gone, so the claiming session takes the lease and the lease records whom it was taken from.

  # `conductor session deliver --name <session> --text <file|->` (story:mailbox-send-and-deliver)
  # types the text into the session through its tmux launcher, then records the delivery here
  # and appends one `delivered` line to the records' dispatch log
  # (`conductor.dispatch.DispatchLogLine`: `to`, `first_line`, `body_path`).
  - name: conductor.session.DeliverMessage
    naming:
      wire: deliver-message
      display: Deliver a message to a session
    input:
      - name: session_name
        type: conductor.config.SessionName
      - name: first_line
        type: String
      - name: body_path
        type: Optional<String>
      - name: delivered_at
        type: Timestamp
    outcomes:
      - name: unreachable
        external: no tmux server answers on the session's launcher socket
        error: conductor.session.SessionNotReachable
        payload:
          conductor.session.SessionNotReachable:
            session_name: input.session_name
        summary: The session has no launcher socket; nothing was typed, nothing recorded, and the caller names the session and does not retry in a loop.
      - name: delivered
        creates: conductor.session.Delivery
        instance: delivery_id
        sets:
          session_name: input.session_name
          first_line: input.first_line
          body_path: input.body_path
          delivered_at: input.delivered_at
        emits:
          - conductor.session.MessageDelivered
        payload:
          conductor.session.MessageDelivered:
            delivery_id: {generated: true}
            session_name: input.session_name
            first_line: input.first_line
            body_path: input.body_path
            delivered_at: input.delivered_at
        summary: The text is in front of the session, and the delivery is on record with its time.

  # Written by `conductor run` at the end of each tick (story:run-daemon); `conductor run --once`
  # writes one `watch` tick and one `cycle` tick.
  - name: conductor.session.RecordRunTick
    naming:
      wire: record-run-tick
      display: Record a tick of the run daemon
    input:
      - name: kind
        type: conductor.session.TickKind
      - name: started_at
        type: Timestamp
      - name: lines_handled
        type: Integer
        example: 3
      - name: actions
        type: List<conductor.dispatch.DispatchLogEvent>
    outcomes:
      - name: negative-count
        when: lines_handled < 0
        error: conductor.session.InvalidLineCount
        payload:
          conductor.session.InvalidLineCount:
            lines_handled: input.lines_handled
        summary: A count of lines is never negative; nothing was recorded.
      - name: recorded
        creates: conductor.session.RunTick
        instance: tick_id
        sets:
          kind: input.kind
          started_at: input.started_at
          lines_handled: input.lines_handled
          actions: input.actions
        emits:
          - conductor.session.RunTickRecorded
        payload:
          conductor.session.RunTickRecorded:
            tick_id: {generated: true}
            kind: input.kind
            started_at: input.started_at
            lines_handled: input.lines_handled
        summary: The tick is on record with what it handled and the lines it wrote.

events:
  - name: conductor.session.LeaseTaken
    fields:
      - name: instance
        type: conductor.config.InstanceName
      - name: session_id
        type: conductor.session.SessionId
      - name: pid
        type: Integer

  - name: conductor.session.LeaseTakenOver
    fields:
      - name: instance
        type: conductor.config.InstanceName
      - name: session_id
        type: conductor.session.SessionId
      - name: pid
        type: Integer
      - name: taken_over_session_id
        type: conductor.session.SessionId
      - name: taken_over_pid
        type: Integer

  - name: conductor.session.MessageDelivered
    fields:
      - name: delivery_id
        type: conductor.session.DeliveryId
      - name: session_name
        type: conductor.config.SessionName
      - name: first_line
        type: String
      - name: body_path
        type: Optional<String>
      - name: delivered_at
        type: Timestamp

  - name: conductor.session.RunTickRecorded
    fields:
