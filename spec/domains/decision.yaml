domain: conductor.decision

summary: >
  Decisions moved one layer up. A repository controller raises a decision request; conductor
  answers it with a recorded decision when its class is C, and escalates it to the operator when
  its class is O (he decides: architecture, risk, spending) or H (he acts: a secret, a login, a
  permission; listed in the daily brief's numbered to-do, never asked one at a time). A decision
  carries its class, its options, its choice and its reason, and stays in force until it is
  reversed. Design: docs/design/conductor.md §§ 5–6.

naming:
  wire: decision
  display: Decision

types:
  - name: conductor.decision.RequestId
    kind: newtype
    of: String

  - name: conductor.decision.DecisionId
    kind: newtype
    of: String
    prefix: "DEC-"

  # How the operator answers an escalated request (story:decisions-page): `yes-no`, Yes or No;
  # `one-of`, exactly one of its lettered options; `several-of`, any number of them, at least one.
  - name: conductor.decision.RequestKind
    kind: enum
    variants: [yes-no, one-of, several-of]

  # One lettered option of an escalated request (story:decisions-page): its letter (`A`, `B`, …;
  # `Y` and `N` for a `yes-no` request), what it does, and what it costs, in words.
  - name: conductor.decision.RequestOption
    kind: struct
    fields:
      - {name: letter, type: String}
      - {name: label, type: String}
      - {name: cost, type: String}

  - name: conductor.decision.DecisionClass
    kind: enum
    variants: [C, O, H]

  - name: conductor.decision.Decider
    kind: enum
    variants: [Conductor, Operator]

  - name: conductor.decision.ShowDecision
    kind: struct
    fields:
      - {name: decision_id, type: String}
      - {name: format, type: Optional<String>}

  # What a line of the records' decision log says happened (story:records-from-commands). Every
  # command of this domain that records an outcome appends exactly one line to
  # `<records>/decisions/YYYY-MM.jsonl`, the month of the line's `at` in UTC, once the store has
  # kept the record; nobody writes such a line by hand. The line's `event` is the variant in lower
  # case: `decided` (`RecordConductorDecision`, `RecordOperatorDecision`), `requested`
  # (`RaiseDecisionRequest`), `answered` (`AnswerRequest`, `AnswerEscalatedRequest`), `escalated`
  # (`EscalateRequest`), `amended` (`AmendEscalatedRequest`), `withdrawn` (`WithdrawRequest`) and
  # `reversed` (`ReverseConductorDecision`, `ReverseOperatorDecision`).
  - name: conductor.decision.DecisionLogEvent
    kind: enum
    variants: [Decided, Requested, Answered, Escalated, Amended, Withdrawn, Reversed]

  # One line of `<records>/decisions/YYYY-MM.jsonl`: a JSON object holding `at` (when it was
  # written, RFC 3339 UTC), `event`, `repo` (the repository; the key is `repo`, never
  # `repository`, and its value is null for a decision about none) and the fields its event
  # declares; no key but `repo` is written when absent. `id` is the id of the record the event moved: the
  # decision, or the request. The fields of each event:
  # - `decided`: `id`, `class`, `decided_by`, `question`, `options`, `choice`, `reason`,
  #   `evidence`, and for the operator's `recorded_by` and `operator_words`;
  # - `requested`: `id`, `question`, `options`, `recommendation`, and `blocker` when given;
  # - `answered`: `id`, `decision_id`;
  # - `escalated`: `id`, `escalation_class`, `reason`; `amended`: `id`, `reason`; `withdrawn`: `id`, `reason`;
  # - `reversed`: `id`, `decided_by` (who reversed it), `reason`.
  - name: conductor.decision.DecisionLogLine
    kind: struct
    fields:
      - {name: at, type: Timestamp}
      - {name: event, type: conductor.decision.DecisionLogEvent}
      - {name: repo, type: Optional<String>}
      - {name: id, type: String}
      - {name: class, type: Optional<conductor.decision.DecisionClass>}
      - {name: decided_by, type: Optional<conductor.decision.Decider>}
      - {name: question, type: Optional<String>}
      - {name: options, type: Optional<String>}
      - {name: choice, type: Optional<String>}
      - {name: reason, type: Optional<String>}
      - {name: evidence, type: Optional<String>}
      - {name: recorded_by, type: Optional<String>}
      - {name: operator_words, type: Optional<String>}
      - {name: recommendation, type: Optional<String>}
      - {name: blocker, type: Optional<String>}
      - {name: decision_id, type: Optional<conductor.decision.DecisionId>}
      - {name: escalation_class, type: Optional<conductor.decision.DecisionClass>}

entities:
  - name: conductor.decision.DecisionRequest
    identity:
      name: request_id
      type: conductor.decision.RequestId
    fields:
      - name: repository
        type: conductor.observation.RepositoryName
      - name: question
        type: String
      - name: options
        type: String
      - name: recommendation
        type: String
      - name: raised_at
        type: Timestamp
      # The `decision-blocker` the controller filed in its own AEP store, cleared when the
      # request is answered (design § 6).
      - name: blocker
        type: Optional<String>
      - name: escalation_class
        type: Optional<conductor.decision.DecisionClass>
      - name: escalation_reason
        type: Optional<String>
      # A class-H item's dry run (story:hand-item-dry-run): the output of every step of the
      # operator's script that needs no credential, or why there is none. Absent on a class-O
      # escalation and on an item escalated before it.
      - name: dry_run
        type: Optional<String>
      - name: no_dry_run
        type: Optional<String>
      # What the Decisions page shows of an escalated request (story:decisions-page): its kind,
      # its lettered options with their cost, the letters conductor recommends and the ones that
      # stand when the operator does not answer by the deadline. Each is set by
      # `EscalateRequest`, required for class O and optional for class H; absent on a request
      # escalated before them, which the page shows as `one-of` with no options.
      - name: kind
        type: Optional<conductor.decision.RequestKind>
      - name: lettered_options
        type: Optional<List<conductor.decision.RequestOption>>
      - name: recommended_letters
        type: Optional<String>
      - name: default_letters
        type: Optional<String>
      - name: deadline
        type: Optional<Timestamp>
      - name: decision_id
        type: Optional<conductor.decision.DecisionId>
      # Delivery of the answer to the controller that asked (story:decision-relay-recorded-answers):
      # when conductor sent the `[DECISION]` line and the session that did. Unset on every request
      # until `MarkAnswerDelivered`; set once, whoever recorded the answer. The store's migration
      # marks a request answered before this release delivered, so nothing is sent twice.
      - name: delivered_at
        type: Optional<Timestamp>
      - name: delivered_by
        type: Optional<String>
    relations:
      - name: decision
        kind: references
        target: conductor.decision.Decision
        cardinality: one
        via: decision_id
    lifecycle:
      initial: Open
      states: [Open, Escalated, Answered, Withdrawn]
      terminal: [Answered, Withdrawn]
      transitions:
        - name: escalate
          from: [Open]
          to: Escalated
        # Conductor answers an open request; an escalated one is the operator's (design § 5).
        - name: answer
          from: [Open]
          to: Answered
        - name: answer_escalated
          from: [Escalated]
          to: Answered
        - name: withdraw
          from: [Open, Escalated]
          to: Withdrawn

  - name: conductor.decision.Decision
    identity:
      name: decision_id
      type: conductor.decision.DecisionId
    fields:
      - name: decision_class
        type: conductor.decision.DecisionClass
      - name: decided_by
        type: conductor.decision.Decider
      - name: question
        type: String
      - name: options
        type: String
      - name: choice
        type: String
      - name: reason
        type: String
      - name: evidence
        type: String
      - name: decided_at
        type: Timestamp
      # Who wrote an operator's decision down and on what words (story:operator-decision-guarded):
      # the session that ran `record-operator-decision`, and the operator's words it records,
      # quoted. Absent on conductor's decisions and on an operator's recorded before them.
      - name: recorded_by
        type: Optional<String>
      - name: operator_words
        type: Optional<String>
      # The repository the decision is about (story:dashboard-repo-view), so a repository's page
      # shows its decisions. Absent on a decision about none, and on one recorded before it.
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
    lifecycle:
      initial: InForce
      states: [InForce, Reversed]
      terminal: [Reversed]
      transitions:
        - name: reverse
          from: [InForce]
          to: Reversed

actors:
  - name: conductor.decision.RepositoryController
    may:
      - conductor.decision.RaiseDecisionRequest
      - conductor.decision.WithdrawRequest
    naming:
      display: Repository controller

  - name: conductor.decision.Conductor
    may:
      - conductor.decision.RecordConductorDecision
      - conductor.decision.AnswerRequest
      - conductor.decision.EscalateRequest
      - conductor.decision.AmendEscalatedRequest
      - conductor.decision.MarkAnswerDelivered
      - conductor.decision.ReverseConductorDecision
    naming:
      display: Conductor

  - name: conductor.decision.Operator
    may:
      - conductor.decision.RecordOperatorDecision
      - conductor.decision.AnswerEscalatedRequest
      - conductor.decision.RecordOperatorDecisionForRequest
      - conductor.decision.ReverseOperatorDecision
    naming:
      display: Operator

errors:
  - name: conductor.decision.DryRunMissing
    summary: >
      A class-H item carries its dry run (`--dry-run`) or why it has none (`--no-dry-run`), and
      this one carries neither.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.EscalationIncomplete
    summary: >
      A class-O escalation carries its kind, its lettered options with their cost, the
      recommended letters, the default letters and the deadline (story:decisions-page), and this
      one lacks at least one of them.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  # The command checks what the specification cannot before it opens the store: the letters are
  # unique and non-empty, a `yes-no` request's are `Y` and `N`, the recommended and default
  # letters are among them, one letter for `yes-no` and `one-of` and at least one for
  # `several-of`, and every option carries a label and a cost (story:decisions-page).
  - name: conductor.decision.OptionsInvalid
    summary: The escalation's options, recommended letters or default letters do not fit its kind.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  # `RecordOperatorDecisionForRequest` checks the choice against the request it answers before it
  # records (story:decisions-batch-answer): one letter for `yes-no` (`Y` or `N`) and `one-of`, one
  # or more distinct letters for `several-of`, each one of the request's lettered options; `done`
  # for a class-H item. A class-O request escalated without lettered options is answered in
  # conductor's session, not by letter.
  - name: conductor.decision.ChoiceInvalid
    summary: The choice does not fit the escalated request's kind and lettered options.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.NotEscalatable
    summary: The request is class C; conductor decides it.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.RequestStateConflict
    summary: The request is not in a state this command acts from, so nothing moved.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.RequestNotFound
    summary: No decision request has this id.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.AlreadyDelivered
    summary: The request's answer was already delivered, so the held delivery is unchanged.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.DecisionNotFound
    summary: No decision has this id.
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId

  - name: conductor.decision.DecisionReversed
    summary: The decision was reversed, so it cannot answer a request.
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId

  - name: conductor.decision.ReservedForOperator
    summary: >
      A class-O or class-H decision was submitted as decided by conductor. Those classes are the
      operator's (design § 5), and nothing was recorded.
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId

  - name: conductor.decision.DecisionStateConflict
    summary: The decision is already reversed.
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId

  - name: conductor.decision.ReversalReservedForOperator
    summary: >
      The decision was recorded by the operator, so only he reverses it (design § 5), and it
      stays in force.
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId

  - name: conductor.decision.DecisionExists
    summary: A decision already has this id, so nothing was recorded.
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId

  - name: conductor.decision.RequestExists
    summary: A decision request already has this id, so nothing was raised.
    fields:
      - name: request_id
        type: conductor.decision.RequestId

commands:
  # Records line (`DecisionLogLine`): `requested`, with `id`, `question`, `options`,
  # `recommendation`, and `blocker` when given.
  - name: conductor.decision.RaiseDecisionRequest
    naming:
      wire: raise-decision-request
      display: Raise a decision request
    input:
      - name: request_id
        type: conductor.decision.RequestId
      - name: repository
        type: conductor.observation.RepositoryName
      - name: question
        type: String
      - name: options
        type: String
      - name: recommendation
        type: String
      - name: raised_at
        type: Timestamp
      - name: blocker
        type: Optional<String>
    outcomes:
      - name: raised
        creates: conductor.decision.DecisionRequest
        instance: request_id
        sets:
          repository: input.repository
          question: input.question
          options: input.options
          recommendation: input.recommendation
          raised_at: input.raised_at
          blocker: input.blocker
        emits:
          - conductor.decision.DecisionRequested
        payload:
          conductor.decision.DecisionRequested:
            request_id: input.request_id
            repository: input.repository
        summary: The request is open and queued for the next cycle.
      - name: already-raised
        existing_instance: true
        error: conductor.decision.RequestExists
        payload:
          conductor.decision.RequestExists:
            request_id: input.request_id
        summary: A request already has this id; the held request is unchanged, answered or not.

  # Who decided is bound to the command and its actor's grant, never taken from the input
  # (hardening 2026-10-06: an input `decided_by` let any caller claim to be the operator).
  # Records line (`DecisionLogLine`): `decided`, with `id`, `class`, `decided_by`, `question`,
  # `options`, `choice`, `reason` and `evidence`.
  - name: conductor.decision.RecordConductorDecision
    naming:
      wire: record-conductor-decision
      display: Record a decision taken by conductor
    input:
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: decision_class
        type: conductor.decision.DecisionClass
      - name: question
        type: String
      - name: options
        type: String
      - name: choice
        type: String
      - name: reason
        type: String
      - name: evidence
        type: String
      - name: decided_at
        type: Timestamp
      # The repository the decision is about, when it is about one.
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
    outcomes:
      - name: reserved
        when:
          decision_class: [O, H]
        error: conductor.decision.ReservedForOperator
        payload:
          conductor.decision.ReservedForOperator:
            decision_id: input.decision_id
        summary: Conductor may not decide class O or H (design § 5), and nothing was recorded.
      - name: recorded
        creates: conductor.decision.Decision
        instance: decision_id
        sets:
          decision_class: input.decision_class
          decided_by: Conductor
          question: input.question
          options: input.options
          choice: input.choice
          reason: input.reason
          evidence: input.evidence
          decided_at: input.decided_at
          repository: input.repository
        emits:
          - conductor.decision.DecisionRecorded
        payload:
          conductor.decision.DecisionRecorded:
            decision_id: input.decision_id
            decision_class: input.decision_class
            decided_by: Conductor
        summary: The class-C decision is in force and counts as the operator's (standing exception 4).
      - name: already-recorded
        existing_instance: true
        error: conductor.decision.DecisionExists
        payload:
          conductor.decision.DecisionExists:
            decision_id: input.decision_id
        summary: A decision already has this id; the held decision is unchanged.

  # Records line (`DecisionLogLine`): `decided`, with the fields of `RecordConductorDecision`'s
  # and `recorded_by` and `operator_words`.
  - name: conductor.decision.RecordOperatorDecision
    naming:
      wire: record-operator-decision
      display: Record a decision taken by the operator
    input:
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: decision_class
        type: conductor.decision.DecisionClass
      - name: question
        type: String
      - name: options
        type: String
      - name: choice
        type: String
      - name: reason
        type: String
      - name: evidence
        type: String
      - name: decided_at
        type: Timestamp
      # The session that records the decision. The command reads no session from its
      # environment, so the recording session names itself; the store then tells the operator's
      # own session from conductor's relaying his answer.
      - name: recorded_by
        type: String
      # The operator's words the decision is recorded on, quoted: the evidence that he decided.
      - name: operator_words
        type: String
      # The repository the decision is about, when it is about one.
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
    outcomes:
      - name: recorded
        creates: conductor.decision.Decision
        instance: decision_id
        sets:
          decision_class: input.decision_class
          decided_by: Operator
          question: input.question
          options: input.options
          choice: input.choice
          reason: input.reason
          evidence: input.evidence
          decided_at: input.decided_at
          recorded_by: input.recorded_by
          operator_words: input.operator_words
          repository: input.repository
        emits:
          - conductor.decision.DecisionRecorded
        payload:
          conductor.decision.DecisionRecorded:
            decision_id: input.decision_id
            decision_class: input.decision_class
            decided_by: Operator
        summary: The operator's decision of any class is in force.
      - name: already-recorded
        existing_instance: true
        error: conductor.decision.DecisionExists
        payload:
          conductor.decision.DecisionExists:
            decision_id: input.decision_id
        summary: A decision already has this id; the held decision is unchanged.

  # Records line (`DecisionLogLine`): `answered`, with `id` and `decision_id`.
  - name: conductor.decision.AnswerRequest
    naming:
      wire: answer-request
      display: Answer a decision request
    input:
      - name: request_id
        type: conductor.decision.RequestId
      - name: decision_id
        type: conductor.decision.DecisionId
    outcomes:
      - name: no-such-decision
        when_related: {via: input.decision_id, exists: false}
        error: conductor.decision.DecisionNotFound
        payload:
          conductor.decision.DecisionNotFound:
            decision_id: input.decision_id
        summary: The cited decision does not exist, and the request stays where it was.
      - name: reversed
        when_related: {via: input.decision_id, predicate: state == Reversed}
        error: conductor.decision.DecisionReversed
        payload:
          conductor.decision.DecisionReversed:
            decision_id: input.decision_id
        summary: The cited decision was reversed, and the request stays where it was.
      - name: answered
        moves: conductor.decision.DecisionRequest.answer
        instance: request_id
        sets:
          decision_id: input.decision_id
        emits:
          - conductor.decision.RequestAnswered
        payload:
          conductor.decision.RequestAnswered:
            request_id: input.request_id
            decision_id: input.decision_id
        summary: The request is answered by a decision in force; the controller acts on it.
      - name: wrong-state
        wrong_state: true
        error: conductor.decision.RequestStateConflict
        payload:
          conductor.decision.RequestStateConflict:
            request_id: input.request_id
        summary: >
          Only an open request is answered here. An escalated one waits for the operator
          (`AnswerEscalatedRequest`); an answered or withdrawn one is closed.

  # An escalated request waits for the operator (design § 5): he decides class O and acts on
  # class H, and only his answer takes it off the queue and the hands to-do.
  # Records line (`DecisionLogLine`): `answered`, with `id` and `decision_id`.
  - name: conductor.decision.AnswerEscalatedRequest
    naming:
      wire: answer-escalated-request
      display: Answer an escalated decision request
    input:
      - name: request_id
        type: conductor.decision.RequestId
      - name: decision_id
        type: conductor.decision.DecisionId
    outcomes:
      - name: no-such-decision
        when_related: {via: input.decision_id, exists: false}
        error: conductor.decision.DecisionNotFound
        payload:
          conductor.decision.DecisionNotFound:
            decision_id: input.decision_id
        summary: The cited decision does not exist, and the request stays where it was.
      - name: reversed
        when_related: {via: input.decision_id, predicate: state == Reversed}
        error: conductor.decision.DecisionReversed
        payload:
          conductor.decision.DecisionReversed:
            decision_id: input.decision_id
        summary: The cited decision was reversed, and the request stays where it was.
      - name: answered
        moves: conductor.decision.DecisionRequest.answer_escalated
        instance: request_id
        sets:
          decision_id: input.decision_id
        emits:
          - conductor.decision.RequestAnswered
        payload:
          conductor.decision.RequestAnswered:
            request_id: input.request_id
            decision_id: input.decision_id
        summary: The operator answered the escalated request; the controller acts on it.
      - name: wrong-state
        wrong_state: true
        error: conductor.decision.RequestStateConflict
        payload:
          conductor.decision.RequestStateConflict:
            request_id: input.request_id
        summary: Only an escalated request is answered here.

  # The operator's answer to an escalated request, as one command (story:decisions-batch-answer):
  # the Decisions page sends it for each answer of a batch, and `conductor decision
  # answer-escalated-as-operator` relays one, so both take one path. It records the operator's
  # decision, as `RecordOperatorDecision` does, only while the request it answers is escalated,
  # and the handler then moves that request to Answered with `AnswerEscalatedRequest`, over the
  # same store handle; a request answered or withdrawn meanwhile is refused here and no decision
  # is recorded. The command reads the request's class, question, options and repository from
  # the store, and checks the choice against the request's kind and lettered options before it
  # records (`ChoiceInvalid`): one letter for `yes-no` (`Y` or `N`) and `one-of`, one or more
  # distinct letters for `several-of`, each an option's letter; `done` for class H, which the
  # operator acts on. Records lines (`DecisionLogLine`): `decided`, as `RecordOperatorDecision`'s,
  # then `answered`, as `AnswerEscalatedRequest`'s. The qualified name sorts after
  # `RecordOperatorDecision`: ess 0.59 builds the decision a synthesized case needs with the first
  # command by name that creates one, and this one, which needs an escalated request, would leave
  # twenty cases unbuilt.
  - name: conductor.decision.RecordOperatorDecisionForRequest
    naming:
      wire: answer-escalated-as-operator
      display: Answer an escalated request as the operator
    input:
      - name: request_id
        type: conductor.decision.RequestId
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: decision_class
        type: conductor.decision.DecisionClass
      - name: question
        type: String
      - name: options
        type: String
      # The letters chosen, joined by `,`; `done` for class H.
      - name: choice
        type: String
      - name: reason
        type: String
      - name: evidence
        type: String
      - name: decided_at
        type: Timestamp
      # The session that records the answer: `dashboard` for the Decisions page.
      - name: recorded_by
        type: String
      # The operator's words, or "chosen on the Decisions page" when he gave none.
      - name: operator_words
        type: String
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
    outcomes:
      - name: no-such-request
        when_related:
          entity: conductor.decision.DecisionRequest
          where: request_id == input.request_id
          exists: false
        error: conductor.decision.RequestNotFound
        payload:
          conductor.decision.RequestNotFound:
            request_id: input.request_id
        summary: No request has this id, and no decision was recorded.
      - name: not-escalated
        when_related:
          entity: conductor.decision.DecisionRequest
          where:
            all:
              - request_id == input.request_id
              - state != Escalated
          exists: true
        error: conductor.decision.RequestStateConflict
        payload:
          conductor.decision.RequestStateConflict:
            request_id: input.request_id
        summary: >
          The request is open, answered or withdrawn, so it is not the operator's to answer, and
          no decision was recorded.
      - name: recorded
        creates: conductor.decision.Decision
        instance: decision_id
        sets:
          decision_class: input.decision_class
          decided_by: Operator
          question: input.question
          options: input.options
          choice: input.choice
          reason: input.reason
          evidence: input.evidence
          decided_at: input.decided_at
          recorded_by: input.recorded_by
          operator_words: input.operator_words
          repository: input.repository
        emits:
          - conductor.decision.DecisionRecorded
        payload:
          conductor.decision.DecisionRecorded:
            decision_id: input.decision_id
            decision_class: input.decision_class
            decided_by: Operator
        summary: The operator's answer is in force; the request moves to Answered with it.
      - name: already-recorded
        existing_instance: true
        error: conductor.decision.DecisionExists
        payload:
          conductor.decision.DecisionExists:
            decision_id: input.decision_id
        summary: A decision already has this id; the held decision is unchanged.

  # Records line (`DecisionLogLine`): `escalated`, with `id`, `escalation_class` and `reason`.
  # A class-O escalation names what the operator chooses from (story:decisions-page); the
  # command also refuses options that do not fit their kind (`OptionsInvalid`) before it opens
  # the store.
  - name: conductor.decision.EscalateRequest
    naming:
      wire: escalate-request
      display: Escalate a decision request
    input:
      - name: request_id
        type: conductor.decision.RequestId
      # O: the operator decides. H: the operator acts. C is never escalated (design § 5).
      - name: escalation_class
        type: conductor.decision.DecisionClass
      # Why the class is O or H; for an unclear class, why it was treated as O (design § 5).
      - name: reason
        type: String
      # A class-H item is dry-run before it is handed over (story:hand-item-dry-run): `dry_run`
      # is the output of every step of the operator's script that needs no credential (the CLI
      # reads it from the file `--dry-run` names); `no_dry_run` is why there is none. A class-H
      # escalation carries one of them; a class-O one needs neither.
      - name: dry_run
        type: Optional<String>
      - name: no_dry_run
        type: Optional<String>
      # What the operator chooses from (story:decisions-page): the kind, the lettered options
      # with their cost (a JSON array of `{letter, label, cost}` on the command line), the
      # recommended letters and the default letters (one letter, or several joined by `,` for a
      # `several-of` request), and the deadline, after which the default stands. Required for
      # class O, optional for class H.
      - name: kind
        type: Optional<conductor.decision.RequestKind>
      - name: lettered_options
        type: Optional<List<conductor.decision.RequestOption>>
      - name: recommended_letters
        type: Optional<String>
      - name: default_letters
        type: Optional<String>
      - name: deadline
        type: Optional<Timestamp>
    outcomes:
      - name: class-c
        when: escalation_class == C
        error: conductor.decision.NotEscalatable
        payload:
          conductor.decision.NotEscalatable:
            request_id: input.request_id
        summary: A class-C request is decided by conductor, never escalated.
      - name: untested
        when:
          all:
            - escalation_class == H
            - missing(dry_run)
            - missing(no_dry_run)
        error: conductor.decision.DryRunMissing
        payload:
          conductor.decision.DryRunMissing:
            request_id: input.request_id
        summary: >
          A class-H item without its dry run or a reason for none is not handed over, and the
          request stays open.
      - name: incomplete
        when:
          all:
            - escalation_class == O
            - any:
                - missing(kind)
                - missing(lettered_options)
                - missing(recommended_letters)
                - missing(default_letters)
                - missing(deadline)
        error: conductor.decision.EscalationIncomplete
        payload:
          conductor.decision.EscalationIncomplete:
            request_id: input.request_id
        summary: >
          A class-O item without its kind, options, recommendation, default or deadline is not
          handed over, and the request stays open.
      - name: escalated
        moves: conductor.decision.DecisionRequest.escalate
        instance: request_id
        sets:
          escalation_class: input.escalation_class
          escalation_reason: input.reason
          dry_run: input.dry_run
          no_dry_run: input.no_dry_run
          kind: input.kind
          lettered_options: input.lettered_options
          recommended_letters: input.recommended_letters
          default_letters: input.default_letters
          deadline: input.deadline
        emits:
          - conductor.decision.RequestEscalated
        payload:
          conductor.decision.RequestEscalated:
            request_id: input.request_id
        summary: The request waits for the operator.
      - name: no-such-request
        unknown_instance: true
        error: conductor.decision.RequestNotFound
        payload:
          conductor.decision.RequestNotFound:
            request_id: input.request_id
      - name: wrong-state
        wrong_state: true
        error: conductor.decision.RequestStateConflict
        payload:
          conductor.decision.RequestStateConflict:
            request_id: input.request_id
        summary: Only an open request is escalated.

  # Records line (`DecisionLogLine`): `amended`, with `id` and `reason`. An escalated request is
  # completed in place (story:request-amend-escalated): each field given replaces the held one,
  # each absent field leaves it as held (the command reads the held request and fills them in, as
  # the specification cannot keep a field for an absent input). The command refuses options that
  # do not fit their kind (`OptionsInvalid`) before it opens the store.
  - name: conductor.decision.AmendEscalatedRequest
    naming:
      wire: amend-escalated-request
      display: Amend an escalated decision request
    input:
      - name: request_id
        type: conductor.decision.RequestId
      - name: reason
        type: String
      - name: kind
        type: Optional<conductor.decision.RequestKind>
      - name: lettered_options
        type: Optional<List<conductor.decision.RequestOption>>
      - name: recommended_letters
        type: Optional<String>
      - name: default_letters
        type: Optional<String>
      - name: deadline
        type: Optional<Timestamp>
      - name: dry_run
        type: Optional<String>
    outcomes:
      - name: amended
        when_subject_state: Escalated
        updates: conductor.decision.DecisionRequest
        instance: request_id
        sets:
          kind: input.kind
          lettered_options: input.lettered_options
          recommended_letters: input.recommended_letters
          default_letters: input.default_letters
          deadline: input.deadline
          dry_run: input.dry_run
        emits:
          - conductor.decision.RequestAmended
        payload:
          conductor.decision.RequestAmended:
            request_id: input.request_id
        summary: The escalated request carries the fields given and waits for the operator.
      - name: no-such-request
        unknown_instance: true
        error: conductor.decision.RequestNotFound
        payload:
          conductor.decision.RequestNotFound:
            request_id: input.request_id
      - name: not-escalated
        error: conductor.decision.RequestStateConflict
        payload:
          conductor.decision.RequestStateConflict:
            request_id: input.request_id
        summary: Only an escalated request is amended; an open, answered or withdrawn one is unchanged.

  # The delivery of an answer is a record on the request, not a test of who recorded the answer
  # (story:decision-relay-recorded-answers): conductor relays every answer, its own and one recorded
  # outside its chat, as `[DECISION <request-id>] <option> <reason> (<decision-id>)` and then marks
  # it delivered, so "once" is enforced by the record and not by conductor's memory. `delivered_by`
  # names the session that marks it, as `recorded_by` does for a decision; the CLI fills
  # `delivered_at` from its clock. The guard (a rule table, not this specification) lets conductor
  # run it and denies it to controllers and workers. Writes no line to the records' decision log:
  # delivery moves no decision and no request state, and `DecisionLogLine` declares no event for it.
  - name: conductor.decision.MarkAnswerDelivered
    naming:
      wire: mark-answer-delivered
      display: Mark an answer delivered
    input:
      - name: request_id
        type: conductor.decision.RequestId
      - name: delivered_at
        type: Timestamp
      - name: delivered_by
        type: String
    outcomes:
      - name: already-delivered
        when_subject:
          predicate:
            all:
              - state == Answered
              - defined(delivered_at)
        error: conductor.decision.AlreadyDelivered
        payload:
          conductor.decision.AlreadyDelivered:
            request_id: input.request_id
        summary: The answer was delivered before; the held delivery is unchanged and the command exits non-zero.
      - name: delivered
        when_subject:
          predicate:
            all:
              - state == Answered
              - not defined(delivered_at)
        updates: conductor.decision.DecisionRequest
        instance: request_id
        sets:
          delivered_at: input.delivered_at
          delivered_by: input.delivered_by
        emits:
          - conductor.decision.AnswerDelivered
        payload:
          conductor.decision.AnswerDelivered:
            request_id: input.request_id
        summary: The answer reached its controller and will not be sent again.
      - name: no-such-request
        unknown_instance: true
        error: conductor.decision.RequestNotFound
        payload:
          conductor.decision.RequestNotFound:
            request_id: input.request_id
      - name: not-answered
        error: conductor.decision.RequestStateConflict
        payload:
          conductor.decision.RequestStateConflict:
            request_id: input.request_id
        summary: Only an answered request has an answer to deliver; an open, escalated or withdrawn one is unchanged.

  # Records line (`DecisionLogLine`): `withdrawn`, with `id` and `reason`.
  - name: conductor.decision.WithdrawRequest
    naming:
      wire: withdraw-request
      display: Withdraw a decision request
    input:
      - name: request_id
        type: conductor.decision.RequestId
      - name: reason
        type: String
    outcomes:
      - name: withdrawn
        moves: conductor.decision.DecisionRequest.withdraw
        instance: request_id
        emits:
          - conductor.decision.RequestWithdrawn
        payload:
          conductor.decision.RequestWithdrawn:
            request_id: input.request_id
            reason: input.reason
        summary: The controller no longer needs the decision.
      - name: no-such-request
        unknown_instance: true
        error: conductor.decision.RequestNotFound
        payload:
          conductor.decision.RequestNotFound:
            request_id: input.request_id
      - name: wrong-state
        wrong_state: true
        error: conductor.decision.RequestStateConflict
        payload:
          conductor.decision.RequestStateConflict:
            request_id: input.request_id
        summary: The request is already answered or withdrawn.

  # Who reverses is bound to the command, as for recording and answering: conductor reverses only
  # its own decisions, and a decision the operator recorded is his to reverse (design § 5).
  # Records line (`DecisionLogLine`), for this command and `ReverseOperatorDecision`: `reversed`,
  # with `id`, `decided_by` (who reversed it) and `reason`.
  - name: conductor.decision.ReverseConductorDecision
    naming:
      wire: reverse-conductor-decision
      display: Reverse a decision taken by conductor
    input:
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: reason
        type: String
    outcomes:
      - name: operator-decided
        when_subject:
          predicate:
            all:
              - decided_by == Operator
              - state == InForce
        error: conductor.decision.ReversalReservedForOperator
        payload:
          conductor.decision.ReversalReservedForOperator:
            decision_id: input.decision_id
        summary: The operator recorded this decision, so only he reverses it; it stays in force.
      - name: reversed
        moves: conductor.decision.Decision.reverse
        instance: decision_id
        emits:
          - conductor.decision.DecisionReversedEvent
        payload:
          conductor.decision.DecisionReversedEvent:
            decision_id: input.decision_id
            reason: input.reason
        summary: Conductor's decision no longer holds; a reversed decision becomes a rule in a profile (design § 13).
      - name: no-such-decision
        unknown_instance: true
        error: conductor.decision.DecisionNotFound
        payload:
          conductor.decision.DecisionNotFound:
            decision_id: input.decision_id
      - name: wrong-state
        wrong_state: true
        error: conductor.decision.DecisionStateConflict
        payload:
          conductor.decision.DecisionStateConflict:
            decision_id: input.decision_id
        summary: The decision is already reversed.

  - name: conductor.decision.ReverseOperatorDecision
    naming:
      wire: reverse-operator-decision
      display: Reverse a decision as the operator
    input:
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: reason
        type: String
    outcomes:
      - name: reversed
        moves: conductor.decision.Decision.reverse
        instance: decision_id
        emits:
          - conductor.decision.DecisionReversedEvent
        payload:
          conductor.decision.DecisionReversedEvent:
            decision_id: input.decision_id
            reason: input.reason
        summary: The operator reversed the decision, whoever took it; a reversed decision becomes a rule in a profile (design § 13).
      - name: no-such-decision
        unknown_instance: true
        error: conductor.decision.DecisionNotFound
        payload:
          conductor.decision.DecisionNotFound:
            decision_id: input.decision_id
      - name: wrong-state
        wrong_state: true
        error: conductor.decision.DecisionStateConflict
        payload:
          conductor.decision.DecisionStateConflict:
            decision_id: input.decision_id
        summary: The decision is already reversed.

events:
  - name: conductor.decision.DecisionRequested
    fields:
      - name: request_id
        type: conductor.decision.RequestId
      - name: repository
        type: conductor.observation.RepositoryName

  - name: conductor.decision.DecisionRecorded
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: decision_class
        type: conductor.decision.DecisionClass
      - name: decided_by
        type: conductor.decision.Decider

  - name: conductor.decision.RequestAnswered
    fields:
      - name: request_id
        type: conductor.decision.RequestId
      - name: decision_id
        type: conductor.decision.DecisionId

  - name: conductor.decision.AnswerDelivered
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.RequestEscalated
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.RequestAmended
    fields:
      - name: request_id
        type: conductor.decision.RequestId

  - name: conductor.decision.RequestWithdrawn
    fields:
      - name: request_id
        type: conductor.decision.RequestId
      - name: reason
        type: String

  - name: conductor.decision.DecisionReversedEvent
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: reason
        type: String

views:
  - name: conductor.decision.Requests
    source: conductor.decision.DecisionRequest
    consistency: read_your_writes
    fields:
      - name: escalation_class
        type: Optional<conductor.decision.DecisionClass>
      - name: escalation_reason
        type: Optional<String>
      - name: request_id
        type: conductor.decision.RequestId
      - name: state
        type: conductor.decision.DecisionRequest.State
      - name: repository
        type: conductor.observation.RepositoryName
      - name: decision_id
        type: Optional<conductor.decision.DecisionId>
      - name: question
        type: String
      - name: options
        type: String
      - name: recommendation
        type: String
      - name: raised_at
        type: Timestamp
      - name: blocker
        type: Optional<String>
      # What the Decisions page shows of an escalated request (story:decisions-page); null on a
      # request escalated before them, or not escalated.
      - name: kind
        type: Optional<conductor.decision.RequestKind>
      - name: lettered_options
        type: Optional<List<conductor.decision.RequestOption>>
      - name: recommended_letters
        type: Optional<String>
      - name: default_letters
        type: Optional<String>
      - name: deadline
        type: Optional<Timestamp>
      # When the answer reached its controller and which session delivered it
      # (story:decision-relay-recorded-answers); null until delivered.
      - name: delivered_at
        type: Optional<Timestamp>
      - name: delivered_by
        type: Optional<String>
    naming:
      wire: requests
      display: Decision requests

  # The answered requests whose answer has not reached its controller
  # (story:decision-relay-recorded-answers): conductor reads it at the start of every turn, sends
  # each `[DECISION]` line and marks it delivered. A request lists here whoever recorded the answer.
  # UNMAPPED: the story lists, per row, the option, the reason and `recorded_by`. They are the
  # fields of the decision the request cites (`conductor.decision.Decisions`: `choice`, `reason`,
  # `recorded_by`), and a view publishes the fields of its one source entity, so this view cannot
  # carry them. The CLI joins `decision_id` to `Decisions` for them; copying them onto the request
  # would be a new stored field the story does not name. Open question for the owner.
  - name: conductor.decision.UndeliveredAnswers
    source: conductor.decision.DecisionRequest
    consistency: read_your_writes
    filter:
      all:
        - state == Answered
        - not defined(delivered_at)
    fields:
      - name: request_id
        type: conductor.decision.RequestId
      - name: state
        type: conductor.decision.DecisionRequest.State
      - name: repository
        type: conductor.observation.RepositoryName
      - name: decision_id
        type: Optional<conductor.decision.DecisionId>
      - name: delivered_at
        type: Optional<Timestamp>
      - name: delivered_by
        type: Optional<String>
    naming:
      wire: undelivered-answers
      display: Undelivered answers

  # The numbered to-do of the daily brief (design § 5): every request escalated as class H,
  # waiting for the operator's hands. The controller waiting on each is its `repository`.
  - name: conductor.decision.HandsTodo
    source: conductor.decision.DecisionRequest
    consistency: read_your_writes
    filter:
      all:
        - escalation_class == H
        - state == Escalated
    fields:
      - name: escalation_class
        type: Optional<conductor.decision.DecisionClass>
      - name: escalation_reason
        type: Optional<String>
      - name: request_id
        type: conductor.decision.RequestId
      - name: state
        type: conductor.decision.DecisionRequest.State
      - name: repository
        type: conductor.observation.RepositoryName
      - name: decision_id
        type: Optional<conductor.decision.DecisionId>
      - name: question
        type: String
      - name: options
        type: String
      - name: recommendation
        type: String
      - name: raised_at
        type: Timestamp
      - name: blocker
        type: Optional<String>
      # What the item's dry run printed, or why it has none (story:hand-item-dry-run).
      - name: dry_run
        type: Optional<String>
      - name: no_dry_run
        type: Optional<String>
    naming:
      wire: hands-todo
      display: Class-H to-do

  - name: conductor.decision.Decisions
    source: conductor.decision.Decision
    consistency: read_your_writes
    fields:
      - name: decision_id
        type: conductor.decision.DecisionId
      - name: state
        type: conductor.decision.Decision.State
      - name: decision_class
        type: conductor.decision.DecisionClass
      - name: decided_by
        type: conductor.decision.Decider
      - name: choice
        type: String
      - name: question
        type: String
      - name: options
        type: String
      - name: reason
        type: String
      - name: evidence
        type: String
      - name: decided_at
        type: Timestamp
      - name: recorded_by
        type: Optional<String>
      - name: operator_words
        type: Optional<String>
      - name: repository
        type: Optional<conductor.observation.RepositoryName>
    naming:
      wire: decisions
      display: Decisions
